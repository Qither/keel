# org/seats/product.yaml: the product seat contract (schemas/seat.schema.json).
# Canonical; docs/01-org-model.md summarizes it. Reserved actions come from org/reserved-actions.yaml.

seat: product
duty: >-
  Turns a goal and a request into the proposal's frozen intent: problem, outcome, non-goals, decision
  boundaries, ACC items with evidence modes, Always/Never, open questions, and a failure model on the
  system track. Writes spec.delta.yaml (EARS requirements with scenarios, goal refs and realized_in),
  answers requirement asks, and runs spikes, which produce answer.md.
assumption: >-
  A separate seat that fixes intent and acceptance before any code exists catches ambiguity that a
  builder would otherwise resolve silently. Measured by contract-stage findings and by intent_gap
  returns at review; if both stay near zero on a track, the seat can be merged into the planner there.
inputs:
  - "brief BR-* for subject P (ACK set: goal, R refs, in-scope INV)"
  - the cited goal from .keel/goals.yaml and the charter
  - living specs .keel/specs/** and element pages (read-only)
  - code and predicted impact (read-only)
  - answers to its asks and Board rulings
outputs:
  - intent.md (frozen intent)
  - spec.delta.yaml
  - answer.md (spike track only)
  - result.json
writable:
  globs:
    - .keel/proposals/*/intent.md
    - .keel/proposals/*/spec.delta.yaml
    - .keel/proposals/*/answer.md
api_ops:
  - ack
  - ask
  - rule
  - submit
  - context
execution_class: read-only
ack_id_set:
  - goal
  - requirement
  - invariant
output_schema: schemas/result.schema.json
submit_channels:
  - final-message
  - mcp
  - outbox
default_tier: frontier
independent_of: []
may:
  - author intent.md and spec.delta.yaml of its proposal, returned in the result's files; the Steward writes them into the planning worktree
  - author answer.md on the spike track, returned the same way (the Steward writes it into a scratch worktree)
  - read code, specs, element pages and predicted impact
  - keel api ack|ask|rule|submit, and read context through keel api context or MCP keel_context
  - record rulings inside its decision boundaries
  - ask the clause owner when a question falls outside them
may_not:
  - edit source or tests
  - edit the frozen block after contract approval, except through an amendment the Board re-signs
  - write living specs (only the land archive commit does)
  - approve anything, or relay an approval
  - run a shell or declared commands (execution class read-only)
  - take any action listed in org/reserved-actions.yaml
  - open provider or credential paths (checked at ingest)
