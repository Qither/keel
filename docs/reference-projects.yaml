# docs/reference-projects.yaml: the canonical registry of keel's reference projects for the refresh
# discipline (P4, docs/00-mandate.md section 4). Schema: schemas/reference-registry.schema.json.
#
# The construct map in docs/16-sources-credits.md says what keel took from each project; this file says
# what was examined and when. Local clones live next to the keel checkout (local_clone is relative to the
# repository root); keel never commits them and scripts/validate.mjs never opens them. named_by_owner marks
# the projects in the owner's statement (clauses 1, 2 and 7); the others entered through keel's own
# research. licence_class: oss | source-available | proprietary | unverified (treated as proprietary until the
# licence file is read and the class recorded, at a refresh review or when an npm package is first added to
# package.json). outcome: adopted | candidates | none | declined. A review entry
# records the clone HEAD that was read, never a claim about upstream, and the branch when it is not the
# upstream default.
version: 1

