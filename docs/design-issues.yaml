issues:
  - id: DI-01
    title: Clause 11 and P1 say keel never reads a provider value; invariant I2 reads env values in memory
    statement: >-
      Clause 11 of the owner's statement and the P1 row say that keel never reads a provider value or a
      credential file. The exact invariant of the providers document, its I2 clause, ADR-0006 and KP-13 say
      that keel reads env values in memory in exactly two modules, at spawn and at direct-lane call time, and
      the P1 mapping row restates that reading. The lower documents add qualifiers the clause does not have
      (in memory, in exactly two modules, never persists); the two texts cannot both hold.
    status: closed
    found_by: external-review
    found_on: 2026-09-26
    root_cause: silent-reconciliation
    anchors:
      - { file: docs/00-mandate.md, heading: "1. The owner's statement" }
      - { file: docs/00-mandate.md, heading: "2. Binding requirements" }
      - { file: docs/10-providers.md, heading: "1. The exact invariant" }
      - { file: docs/adr/ADR-0006-provider-values-by-reference.md, heading: "Decision" }
      - { file: docs/00-vision.md, heading: "KP-13 Provider values belong to the user" }
    class: mandate-conflict
    blocks: M0
    higher: { file: docs/00-mandate.md, heading: 1. The owner's statement }
    lower: { file: docs/10-providers.md, heading: 1. The exact invariant }
    walk:
      producers:
        - precondition: A names-only provider path set exists for every runtime, so that 'never opens a file or record
            that holds a provider value or a credential' is checkable by stat only (doctor PRESENT/ABSENT), by
            the name-only listing before staging (steward.run.provider-path-check) and by the never-open
            basenames of scripts/validate.mjs
          producer: { file: docs/09-runtimes.md, heading: 2. Descriptor fields and verification status }
          position: before
          sufficient: true
          reason: provider_path_set (schemas/runtime-descriptor.schema.json /$defs/providerPathSet; scripts/validate.mjs
            NEVER_OPEN). Descriptors are package data present before steward.run.provider-path-check (after
            steward.run.worktree, before steward.run.pre-spawn-base and steward.run.spawn). For keel's own
            process the set is passed only to stat, which is complete for the clause; for seats the deny-read
            rules are best effort per runtime (verify by probe), which is the separate exposure rule I5/T6,
            not clause 11.
        - precondition: Board-approved routing holds environment variable names only, so that spawn has names to
            dereference and no value ever reaches a committed file
          producer: { file: docs/10-providers.md, heading: 2. routing.yaml and declared families }
          position: before
          sufficient: true
          reason: board.approve.doc (routing) then routing-snapshot at steward.plan.route and board.approve.plan;
            schemas/routing.schema.json /$defs/envNames. The routing document approval and the routing
            snapshot precede steward.run.spawn in every sequence (spawn is after board.approve.plan and
            board.approve.contract). The schema forbids values and the audit check of scripts/validate.mjs
            rejects key-shaped tokens and real provider hosts, so 'names only' is proven, not heuristic.
        - precondition: The dereference happens in process memory only at spawn (src/providers/env-policy.ts builds the
            child allowlist) and at direct-lane call time (src/direct/client.ts unwraps the opaque handle);
            nowhere else in keel
          producer: { file: docs/10-providers.md, heading: 1. The exact invariant }
          position: absent
          sufficient: true
          reason: "I2 and the I4 CI lint, with '3. In-memory injection and the env allowlist'. M0 ships type-only code
            (D1), so there is nothing to lint yet; the I4 constants arrive in M2 and the direct-lane module is
            an M6 stub. When present the lint is a complete check (exactly two modules may reference provider
            env names or unwrap the handle). Absence in M0 is by D1, not a gap: the clause is restated now so
            that the M2 producer implements the mandate rather than a qualifier of it."
        - precondition: "No value is persisted, printed, logged or hashed: argv carries ${ENV:NAME} placeholders and
            persisted stream data passes the typed-field whitelist"
          producer: { file: docs/04-trace-and-state.md, heading: Redaction and field whitelist }
          position: before
          sufficient: true
          reason: argv-redacted is produced by steward.run.spawn and the typed-field whitelist is applied at
            steward.run.ingest, both before dashboard.build, steward.land.archive-commit and any clone or
            second machine can read a record; land.projection runs at gate.land. The whitelist is complete by
            construction (only typed fields of canonical events persist; a runtime-reported model id is parsed
            in memory and dropped unless policy.record_model_names is set); land.projection (URL-shaped and
            key-shaped tokens, M3) is a heuristic backstop and is not what the clause leans on.
        - precondition: "'Direct-lane call time' names a real point in the sequence: the direct lane is a tool-less
            child process spawned like any other runtime"
          producer: { file: docs/09-runtimes.md, heading: direct }
          position: before
          sufficient: true
          reason: runtimes/direct.yaml (M6); in the order map steward.run.spawn covers the direct child, no separate
            step. The direct child is spawned by steward.run.spawn (supervisor) and calls the provider from
            its own process; the order map needs no new step because the child is a runtime. Its request
            builder is an M6 stub (docs/13 'src/direct/client.ts stub (M6)'), which is a scope fact, not a
            missing producer.
      consumers:
        - anchor: { file: docs/00-mandate.md, heading: 1. The owner's statement }
          actor: board-at-terminal
          outcome: unchanged
          reason: Clause 11 already reads in the owner's restated words (never opens a file or record; never persists,
            prints, logs or hashes; dereferences a named environment variable in process memory only at spawn
            and at direct-lane call time). The closing commit verifies it byte for byte against the owner's
            wording and touches it only from the owner's words (section 3).
        - anchor: { file: docs/00-mandate.md, heading: 2. Binding requirements }
          actor: board-at-terminal
          outcome: unchanged
          reason: Row P1 is already the restated form with 'stores environment variable names only' added; it is the
            authoritative form every lower file cites.
        - anchor: { file: docs/00-mandate.zh-CN.md, heading: 1. 所有者声明 }
          actor: board-at-terminal
          outcome: unchanged
          reason: "第 11 条: the mirror already carries the restated clause; the i18n check keeps heading structure
            identical."
        - anchor: { file: docs/00-mandate.zh-CN.md, heading: 2. 约束性需求 }
          actor: board-at-terminal
          outcome: unchanged
          reason: "P1 行: the mirror already carries the restated P1 row."
        - anchor: { file: docs/00-mandate.md, heading: 4.5 Guardrails }
          actor: board-at-terminal
          outcome: unchanged
          reason: Bullet 'P1 holds during a review' speaks of reading the owner's provider or credential files, which is
            the 'never opens a file' half of the restated clause.
        - anchor: { file: docs/00-mandate.md, heading: 5.3 Procedure }
          actor: board-at-terminal
          outcome: unchanged
          reason: "Step 5, the parenthetical qualifiers ('only', 'in memory', 'never persists'): a general rule about a
            lower sentence adding a qualifier the clause lacks; DI-01 was the case it was written from, and
            now that the clause itself carries those qualifiers the rule still holds for the next clause."
        - anchor: { file: docs/00-mandate.md, heading: 5.5 Guardrails }
          actor: board-at-terminal
          outcome: changed
          reason: "Bullet 'P1 and D2 hold: no provider value is read to reproduce an issue': 'is read' is the
            pre-restatement verb the owner replaced; under the restated clause the guardrail is that no
            provider or credential file or record is opened to reproduce an issue. Section 5 is procedure text
            the maintainers own (standing instruction), not the statement."
        - anchor: { file: docs/00-mandate.zh-CN.md, heading: 5.5 护栏 }
          actor: board-at-terminal
          outcome: changed
          reason: "'不为重现问题而读取任何模型提供方的值': mirror of the 5.5 guardrail sentence."
        - anchor: { file: docs/00-vision.md, heading: Non-goals }
          actor: board-at-terminal
