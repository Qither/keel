            demands: the same; provided
          - anchor: { file: docs/00-vision.md, heading: "State, trace and VCS" }
            meaning: as 04
            demands: nothing further
        kept:
          meaning: "unchanged: refs/keel/ledger/head, a Steward-owned ref to a blob holding the chain hash, CAS-updated
