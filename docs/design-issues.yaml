          outcome: breaks
          reason: the contract binds the kill to the pid the spawning process holds; on Windows the tree relation dies
            with the parent, so after a supervisor crash there is no pid and no tree for a later process to
            end, and the seat keeps the user's file rights in the worktree
        - anchor: { file: docs/05-vcs.md, heading: Detection (the guarantee) }
          actor: supervisor
          waits_for: n/a
          released_by: n/a
          outcome: holds
