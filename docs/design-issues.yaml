  - id: DI-15
    title: Every submitted round has a commit, except the round that fails the provider path listing
    statement: The Steward commit at submit says every submitted round therefore has a commit, whether its submit
      gate passes or not, and in the next sentence that the name-only provider path listing runs before the
      commit and that a hit fails the round with submit.provider-path-events and nothing is staged or
      committed. A round that fails the listing is a submitted round with no commit; the fix round that builds
      on the failed round's commit, and the trace that expects a Keel-Round trailer per round, have nothing to
      build on, and the failing check carries a submit-gate id although the submit gate is said to run on the
      round commit.
    status: decided
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: cardinality
    anchors:
      - { file: docs/05-vcs.md, heading: The Steward commit at submit }
      - { file: docs/11-verification.md, heading: gate:submit }
    class: gap
    blocks: M2
    walk:
      producers:
        - precondition: Every submitted round has a commit (a submit was ingested and committed as <P>.T<n>.r<k>)
          producer: { file: docs/05-vcs.md, heading: The Steward commit at submit }
          position: before
          sufficient: false
          reason: steward.run.commit-round runs before gate.submit, the fix round and the trace on the clean path, but
            the same paragraph skips it on a listing hit, so the producer is too weak for the word every; on
            the hit path its position is absent
        - precondition: The name-only provider path listing runs before the commit
          producer: { file: docs/05-vcs.md, heading: The Steward commit at submit }
          position: before
          sufficient: true
          reason: "the at-ingest listing (gate.submit.provider-path-events in the order map: git status --porcelain -z,
            names only, keel's own glob matcher) precedes staging and opens no file, which is what clause 11 /
            P1 and the M2 negative control lean on"
        - precondition: The fix round builds on the failed round's commit (the base of the next submit is defined)
          producer: { file: docs/05-vcs.md, heading: The Steward commit at submit }
          position: absent
          sufficient: false
          reason: on the hit path no commit exists and no ref moves; no sentence names the base of the next submit (the
