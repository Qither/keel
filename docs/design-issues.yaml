            demands: that a holder can be dead, so that liveness of the holder is a property another process can decide
        kept:
          meaning: the file <git-common-dir>/keel/locks/supervisor.lock, taken with O_EXCL by the supervising keel run
            before its first spawn and holding a holder record (run id, pid and process start time, taken_at,
            lease_until refreshed on a timer by the supervisor process itself, and the pid and start time of
            every child it spawned), so that only that process appends during its run window; every other
            mutating verb waits for it while its holder is live and is refused with exit 3 naming keel audit
            when it is stale
          provides: "after the fix: holder identity, a lease independent of the seat's stream, and the child pids, so
            that a taker or keel audit can tell a live holder from a stale one and can end what the dead
            holder spawned; before the fix: a bare file with no holder identity, which is what the crash
            statement cannot use"
      - name: stale lock
        uses:
          - anchor: { file: docs/06-parallelism.md, heading: The lease }
            meaning: a claim ref that is still present although the ledger says the claim is released or expired; keel
              audit removes it by CAS delete and records that
            demands: a definition of stale that keel audit can decide from the ledger and the ref
          - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
            meaning: a lock file (writer or supervisor) left by a process that no longer exists; recovery undefined
            demands: a decidable staleness test for a file lock, which the bare O_EXCL file does not give and which a bare
              pid does not give either under pid reuse
        kept:
          meaning: "one generalized row: a lock (claim ref, supervisor lock, writer lock, or the per-trunk integration
            lock of DI-16 once it adopts the holder record) that stands although its holder no longer holds
            it: the ledger says released or expired, or the holder record names a pid and start time that no
            longer match a live process, or its lease expired; keel audit removes it and records the removal,
            and the next append still re-verifies the tail against the anchor"
          provides: one meaning for every keel lock once the file locks carry a holder record with pid plus start time
            and a lease; no rename needed
      - name: run window
        uses:
          - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
            meaning: the span between a run's spawn and its ingest, during which only its supervisor appends; verified
              when the supervisor's walk at ingest finds only its own appends
            demands: that every window is either verified at its ingest or lies outside 'a seat ran'; a window with no
              ingest has no state
          - anchor: { file: docs/11-verification.md, heading: gate:submit }
            meaning: the span whose appends the check walks
            demands: an ingest to run in
          - anchor: { file: docs/14-trust-security.md, heading: Known limits }
            meaning: the span a process may outlive; approvals count only from a keel approve process outside a run window
            demands: a definite end of the window
          - anchor: { file: docs/adr/ADR-0005-explicit-confirmation-approvals.md, heading: Decision }
            meaning: same
            demands: same
        kept:
          meaning: the span of one run from its run.started event to its run.finished event, during which only its
            supervising process appends; verified when that process walked it at ingest
          provides: a start and an end named by events; the crashed case gets its own identifier below
        renamed:
          - meaning: "the window of a run that keel audit closed because its supervisor died or hung: never walked by its
              supervisor, trusted by no gate, and every event in it whose actor or type is not the
              supervisor's own is reserved_op.detected"
            new_name: unverified window
      - name: lease
