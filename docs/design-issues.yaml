        - track: patch
          route: per-change-contract
          topology: solo
          confirmations: 2
          work_orders: 1
          bound: { file: docs/00a-owner-guide.md, heading: "Walkthrough: two confirmations for a feature change" }
        - track: patch
          route: policy-path
          topology: shared-trunk
          confirmations: 3
          work_orders: 1
          bound: { file: docs/03-lifecycle.md, heading: Standing policy limits }
        - track: patch
          route: policy-path
          topology: solo
          confirmations: 2
          work_orders: 1
          bound: { file: docs/03-lifecycle.md, heading: Standing policy limits }
        - track: feature
          route: per-change-contract
          topology: shared-trunk
          confirmations: 2
          work_orders: 1
          bound: { file: docs/15-roadmap.md, heading: Measures }
        - track: feature
          route: per-change-contract
          topology: solo
          confirmations: 2
          work_orders: 1
          bound: { file: docs/15-roadmap.md, heading: Measures }
        - track: system
          route: per-change-contract
          topology: shared-trunk
          confirmations: 3
          work_orders: 1
          bound: { file: docs/15-roadmap.md, heading: Measures }
