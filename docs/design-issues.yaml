          - anchor: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
            meaning: ambiguous between the rule and the file
            demands: a decidable land authority on the patch track
          - anchor: { file: docs/01-org-model.md, heading: Checkpoint stages }
            meaning: ambiguous between the rule and the file
            demands: the required_on value per-land-policy of org/checkpoints.yaml to be computable
          - anchor: { file: docs/11-verification.md, heading: gate:land }
