      readers:
        - field: the per-trunk lock file in <git-common-dir>/keel/locks/ (no artifact entry, no stated file name, no
            stated encoding of the trunk name)
          readers: []
        - field: the lock file's holder identity (pid and proposal id), which the fix's waiting keel land and keel
            audit's sweep would read
          readers: []
        - field: the arrival order of keel land requests (no land.requested or land.started event type in
            schemas/ledger-event.schema.json)
          readers: []
        - field: approval.schema.json landBinding.expected_trunk_tip / receipt.schema.json expected_trunk_tip
          readers:
            - board.approve.land (reading list of org/checkpoints.yaml stage land)
            - steward.land.advance-trunk (the CAS expected-old of case C)
            - receipt.md
        - field: approval.schema.json landBinding.integrated_commit / receipt.schema.json integrated_commit
          readers: [ gate.land.approval, gate.land.re-execution, steward.land.archive-commit, receipt.md ]
        - field: approval.schema.json landBinding.receipt_draft (sha256)
