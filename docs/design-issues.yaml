      - { track: feature, actor: seat, sequence: feature-happy }

  - id: DI-02
    title: The land approval record is committed only in the archive commit that the land gate must pass first
    statement: >-
      The recording rule places the land approval record in the archive commit itself, and the gate accepts an
      approval only when the record already exists in git at its expected place. The land verb checks the land
      approval on its second run and only then writes the archive commit. The record cannot exist in a commit
      that is written after the check that requires it.
    status: decided
    found_by: external-review
    found_on: 2026-09-26
    root_cause: rule-tightened
    anchors:
      - file: docs/02-alignment.md
        heading: "Board approvals (explicit confirmation, hash binding, invalidation)"
      - { file: docs/12-cli-api-mcp.md, heading: "1. 16 verbs and at most 40 modes" }
      - { file: docs/04-trace-and-state.md, heading: "Land projection and the projection gate" }
    class: cycle
    blocks: M1b
    walk:
      producers:
        - precondition: the land approval record exists in git at its expected place, which for the land kind is the
            archive commit (02 Checking at the gates, first bullet)
          producer: { file: docs/04-trace-and-state.md, heading: Land projection and the projection gate }
          position: after
          sufficient: false
          reason: "steward.land.archive-commit is written by the second keel land after steward.land.check-approval and
            gate.land.approval have read the record (12: checks the draft, then writes the archive commit); at
            check time the record is in no commit, so the property 'exists in git' cannot hold when it is
            required"
        - precondition: the record was written by keel approve after the explicit confirmation and committed as soon as
            it was written (02 The record; 02 Recording; 04 Declared plane write rules)
          producer:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
          position: before
          sufficient: false
          reason: "board.approve.land writes .keel/approvals/<sha>.land.json before the second land, but the recording
            sentence (repeated by the 04 Declared plane bullet) assigns the land kind no commit of its own:
            the keel approve process commits contract, plan and request records itself, while for land it
            names the archive commit that a different process (keel land) writes later, so 'as soon as it is
            written' has no producer for this kind and the file is a working-tree file until land"
        - precondition: the record's approval.recorded event is on the verified ledger chain
          producer: { file: docs/04-trace-and-state.md, heading: Single writer }
          position: before
          sufficient: true
          reason: ledger.append by the same keel approve process under the ledger writer lock, outside any run window,
