      - name: receipt draft
        uses:
          - anchor: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
            meaning: the draft written by the first land, naming the integrated commit and the expected trunk tip
            demands: stable and hashable between the first and second land
          - anchor:
              file: docs/02-alignment.md
              heading: Board approvals (explicit confirmation, hash binding, invalidation)
            meaning: the bound artifact of the land kind (land.receipt_draft)
            demands: a normalized hash the gate can recompute
          - anchor: { file: templates/proposal/receipt.md, heading: Land approval }
            meaning: everything above the Land approval section of receipt.md
            demands: that the archive commit's rendering below that line not change the bound bytes
        kept:
          meaning: receipt.md as the first keel land writes it in the git common dir, everything above the Land approval
