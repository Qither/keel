            - plan.test-independence (feature and system only; with a null test_route it 'needs fixed tests or
              a routing deviation')
            - board.approve.plan (the routing deviation that a null test_route falls back to; never on patch
              per 01 Checkpoint stages and org/checkpoints.yaml)
            - "the land approval reading list (org/checkpoints.yaml#/stages/2/read: build and test routes)"
            - "receipts and verify.review (11 section 5: declared engineer families, build and test routes)"
        - field: the patch work-order count ('exactly one work order', docs/03-lifecycle.md Patch track and policy path)
          readers: []
        - field: the patch session bound ('At most 1 session'; config tracks.patch.max_sessions; quick-patch
            predicates.max_sessions)
          readers: []
        - field: the red/green proof formula (a cited scenario, or a test fixed first by a different-family test task,
            fails at base and passes at the change commit)
