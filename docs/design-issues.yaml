      readers:
        - field: workorder kind enum value `test` (schemas/workorder.schema.json#/$defs/taskKind)
          readers:
            - verify.test-red (11 gate:verify)
            - verify.commands and verify.evidence (exclusion of kind test)
            - the test_task lens set (org/seats/reviewer.yaml#/lens_sets/test_task)
            - 03 Phase 4 Verify (a test task is verified differently)
            - plan.schema.json task kind ('Must equal the work order's kind'; feature and system only)
