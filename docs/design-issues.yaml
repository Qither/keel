# docs/design-issues.yaml: the canonical register of the design iteration discipline (P5,
# docs/00-mandate.md section 5). Schema: schemas/design-issues.schema.json.
#
# It holds every design issue found in keel's own documents, schemas, templates and tables, the standing
# order map of the design (steps, artifacts, locks), the walkthrough matrix (tracks, actors, sequences) and
# the append-only walkthrough history. scripts/validate.mjs --only issues checks ids, anchors, statuses,
# the blocks gate (while exit_review is set), cycles and reachability in the order map, and the glossary.
#
# Anchors are a file plus the exact heading text (Markdown) or a JSON pointer (JSON, YAML); never a line
# number. Classes in precedence order: mandate-conflict, cycle, term-collision, gap, cost. An entry with an
# anchor in section 1 or 2 of docs/00-mandate.md is mandate-conflict by construction. Statuses: open,
# analysed, proposed, decided, closed; deferred (owner only); dismissed (with a reason). Closed entries
# are never deleted. Current state only: no narrative and no history; git is the history.
version: 1
exit_review: null

matrix:
  tracks: [ spike, patch, feature, system ]
  actors:
    - { id: board-at-terminal, description: "A Board member at a terminal, no seat running" }
    - id: board-during-wave
      description: A Board member running a mutating verb while a wave is in flight
    - id: supervisor
      description: The supervising Steward process (keel run) that holds the supervisor lock
    - id: second-steward-process
      description: A second Steward process (approve, check, land, run --hold) while the supervisor lock is held
    - id: seat
      description: A seat in its sparse worktree, reaching keel through keel api or a submit channel
    - { id: hook, description: A runtime hook calling keel hook }
    - id: ci-fresh-clone
      description: A CI job on a fresh clone of the shared remote, with no git common dir state and no refs/keel
    - id: crashed-supervisor
      description: A supervisor that died or hung while holding a lock or a claim
    - id: second-machine
      description: Another machine that sees committed records and archive projections only
    - { id: dashboard, description: The read-only dashboard reading the ledger and the committed files }
  sequences:
    - id: spike-happy
      track: spike
      verbs: [ new, "run (product, scratch worktree)", status ]
    - id: patch-per-change
      track: patch
      verbs:
        - new
        - run (frame)
        - check --gate frame
        - approve --stage contract
        - run (build)
        - check --gate submit
        - check --gate verify
        - land
        - approve --stage land
        - land
    - id: patch-policy
      track: patch
      verbs:
        - new --policy
        - run (build)
        - check --gate submit
        - check --gate verify
        - land
        - approve --stage land
        - land
        - approve --stage receipt
    - id: feature-happy
      track: feature
      verbs:
        - new
        - run (frame)
        - check --gate frame
        - approve --stage contract
        - run (plan)
        - check --gate plan
        - run (build)
        - check --gate submit
        - run (review)
        - check --gate verify
        - land --preview
        - land
        - approve --stage land
        - land
    - id: system-happy
      track: system
      verbs:
        - new
        - run (frame)
        - check --gate frame
        - approve --stage contract
        - run (plan)
        - check --gate plan
        - approve --stage plan
        - run (build)
        - check --gate submit
        - run (review)
        - check --gate verify
        - land --preview
        - land
        - approve --stage land
        - land
    - id: hold
      track: any
      verbs: [ run (build), run --hold on, run --hold off ]
    - id: abandon
      track: any
      verbs: [ run (build), approve --rule abandon ]
    - id: override
      track: any
      verbs: [ run (build), approve --rule override ]
    - id: amendment
      track: any
      verbs: [ run (frame), approve --stage contract, run (frame), approve --stage contract ]
    - id: crash-resume
      track: any
      verbs: [ run (build), audit, run (build) ]
    - id: second-land
      track: any
      verbs: [ land, approve --stage land, land, land ]
    - id: ci-check-at-tip
      track: any
      verbs: [ push, check --gate land --check approval --at <sha> ]

order:
  steps:
    - id: board.approve.policy
      doc: { file: docs/03-lifecycle.md, heading: Standing policy limits }
      after: []
      runs_in: local
    - id: board.new
      doc: { file: docs/03-lifecycle.md, heading: Phase 0 Intake }
      after: []
      runs_in: local
    - id: gate.frame.intake
      doc: { file: docs/03-lifecycle.md, heading: Phase 0 Intake }
      after: [ board.new, board.new-policy ]
      runs_in: local
    - id: steward.derive-work-order
      doc: { file: docs/03-lifecycle.md, heading: Patch track and policy path }
      after: [ gate.frame.intake ]
      runs_in: local
    - id: steward.run.resolve-route
      doc: { file: docs/03-lifecycle.md, heading: Phase 3 Build }
      after: [ steward.run.compute-waves, board.new ]
      runs_in: supervisor
    - id: steward.run.claim
      doc: { file: docs/03-lifecycle.md, heading: Phase 3 Build }
      after: [ steward.run.resolve-route, board.new ]
      runs_in: supervisor
    - id: steward.run.worktree
      doc: { file: docs/03-lifecycle.md, heading: Phase 3 Build }
      after: [ steward.run.claim, board.init, board.new ]
      runs_in: supervisor
    - id: steward.run.compile-brief
      doc: { file: docs/03-lifecycle.md, heading: Phase 3 Build }
      after: [ steward.run.claim, steward.run.worktree, steward.run.snapshot-refs ]
      runs_in: supervisor
    - id: steward.run.snapshot-refs
      doc: { file: docs/03-lifecycle.md, heading: Phase 3 Build }
      after: [ steward.run.worktree ]
      runs_in: supervisor
    - id: steward.run.spawn
      doc: { file: docs/03-lifecycle.md, heading: Phase 3 Build }
      after:
        - steward.run.compile-brief
        - steward.run.snapshot-refs
        - steward.run.worktree
        - board.run.hold-off
        - ledger.verify-chain
        - steward.run.pre-spawn-base
        - steward.run.claim
        - board.approve.plan
        - board.approve.contract
        - gate.plan
        - gate.frame.approvals
        - doctor.exposure
      runs_in: supervisor
    - id: seat.ack
      doc: { file: docs/03-lifecycle.md, heading: Phase 3 Build }
      after: [ steward.run.spawn ]
      runs_in: agent-api
    - id: seat.work
      doc: { file: docs/03-lifecycle.md, heading: Phase 3 Build }
      after: [ seat.ack, steward.run.spawn, steward.run.compile-brief ]
      runs_in: seat
    - id: seat.submit
      doc: { file: docs/03-lifecycle.md, heading: Phase 3 Build }
      after: [ seat.work, steward.run.spawn ]
      runs_in: agent-api
    - id: steward.run.ingest
      doc: { file: docs/03-lifecycle.md, heading: Phase 3 Build }
      after:
        - seat.submit
        - seat.ack
        - steward.run.snapshot-refs
        - steward.run.spawn
        - seat.ask
        - seat.rule
        - hook.event
        - seat.work
      runs_in: supervisor
    - id: steward.run.commit-round
      doc: { file: docs/03-lifecycle.md, heading: Phase 3 Build }
      after: [ steward.run.ingest, steward.run.provider-path-check, gate.submit.provider-path-events ]
