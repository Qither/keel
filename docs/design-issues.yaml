            demands: a Board document approval, expiry and revocation; predicates checked by code on the actual diff
          - anchor: { file: templates/project/config.yaml, pointer: "#/land/policy" }
            meaning: the standing policy file (a name) or null (a land approval per change, 'recommended on shared
              trunks')
            demands: the one setting the gate actually reads
          - anchor: { file: docs/00a-owner-guide.md, heading: "Walkthrough: two confirmations for a feature change" }
            meaning: the standing policy file, applying to any patch
            demands: that a land policy stand in for the land approval of a per-change-contract patch too
        kept:
          meaning: a Board-approved standing policy of kind land in .keel/policies/<name>.yaml, named by land.policy in
            .keel/config.yaml, whose predicates are checked on the integrated diff at keel land; it stands in
            for the per-change land approval of any patch, whichever contract route the patch took
          provides: policy-approval-record on trunk (document approval, expiry, revocation), a slug for the
            land.completed event and the receipt list, a required_on value the land checkpoint reads, the
            approval record the receipt's Land approval section and the Keel-Approval trailer name on a
            policy-governed land
        renamed:
          - meaning: the rule that says when the land checkpoint is required on the patch track (a land approval per
              change unless land.policy names an approved land policy)
            new_name: land authority on the patch track (the bullet title in Standing policy limits and the row title in
              17)
      - name: receipt acknowledgement
        uses:
          - anchor: { file: docs/03-lifecycle.md, heading: Phase 6 Close }
            meaning: a non-blocking Board approval after a policy land (either meaning)
            demands: a due item after the land that no Board read has covered
          - anchor: { file: docs/02-alignment.md, heading: Alignment chain L0–L11 }
            meaning: an acknowledgement after a land under a land policy
            demands: the rung to name the land authority and its after-the-fact read
          - anchor: { file: docs/17-open-decisions.md, heading: "Adopted by recommendation (reversible, with ADR)" }
            meaning: an acknowledgement after every quick-patch (policy-path) land
            demands: an acknowledgement even when the Board approved the land per change on a shared trunk (the third
              touch)
          - anchor: { file: docs/17-open-decisions.md, heading: "Adopted by recommendation (reversible, with ADR)" }
            meaning: an acknowledgement after a land under a land policy
            demands: the acknowledgement to be the human read of a land no human approved
          - anchor: { file: docs/00-vision.md, heading: Glossary }
            meaning: after a policy land (either meaning)
            demands: a single decidable trigger
          - anchor: { file: org/checkpoints.yaml, pointer: "#/stages/3/required_on/patch" }
            meaning: "after-policy-land: 'due after every land made under a standing policy' (either kind); the stage
              binds 'receipt.md of a change that landed under a standing policy'"
            demands: a required_on value the status verb can compute from the ledger
          - anchor: { file: templates/proposal/receipt.md, heading: Land approval }
            meaning: "the content the acknowledgement binds on a land no Board confirmation approved: an archived
              receipt.md whose Land approval section says 'Not yet approved'"
            demands: a receipt that names the land authority it acknowledges
        kept:
          meaning: the Board's non-blocking keel approve <P> --stage receipt after a policy-governed land, binding the
            archived receipt.md whose Land approval section names the land policy and its approval record; the
            after-the-fact human read of a land that an approved land policy, not a Board confirmation, let
            onto trunk; while missing it blocks the next change touching the same elements or path globs (the
            close-check clash is DI-12)
          provides: receipt-ack-record on trunk, an approval.recorded event, the Board queue and doctor items; exactly
            one Board read of each receipt.md
      - name: landed under a standing policy
        uses:
          - anchor: { file: docs/01-org-model.md, heading: Checkpoint stages }
            meaning: a land under a land policy, or a policy-path change's land
            demands: one trigger for the receipt checkpoint
          - anchor: { file: docs/00a-owner-guide.md, heading: "Walkthrough: two confirmations for a feature change" }
            meaning: a policy-path change (the contract policy)
            demands: a land approval on a shared trunk for that change, with no acknowledgement mentioned there
          - anchor: { file: docs/11-verification.md, heading: 3. Test independence and red/green proof }
            meaning: a policy-path change (the gloss of 'policy land' at verify)
            demands: the red/green proof
        kept:
          meaning: used only for the receipt checkpoint and only as 'a policy-governed land'; a change on the policy
            path is 'a policy-path change'
          provides: the receipt stage binds receipt.md of a policy-governed land; the 00a row is titled 'patch on the
            policy path'
        renamed:
          - meaning: a change whose contract is the policy path (approved request plus contract policy)
            new_name: policy-path change
      - name: shared trunk / solo repository
        uses:
          - anchor: { file: docs/03-lifecycle.md, heading: Standing policy limits }
            meaning: a repository topology the rule leans on
            demands: a producer the gate can read; none exists (no config field, record or step sets it)
          - anchor: { file: docs/17-open-decisions.md, heading: "Adopted by recommendation (reversible, with ADR)" }
            meaning: the same topology as the adopted option's condition; if read as a second ceremony axis that decides a
              Board checkpoint it collides with KP-11 'One ceremony axis', which the split-out entry must
              weigh before taking class gap
            demands: the same
          - anchor: { file: templates/project/config.yaml, pointer: "#/land/policy" }
            meaning: guidance for choosing the land.policy setting ('recommended on shared trunks')
            demands: nothing checkable; the Board chooses
        kept:
          meaning: "guidance only: a trunk that other people push to or pull from; the rule is stated over land.policy
            (null: a land approval per change; a name: that land policy), and the guidance says which setting
            suits a shared trunk; the track stays the one ceremony axis (KP-11)"
          provides: nothing the gate reads; the gate reads land.policy and the policy approval
      - name: Board confirmation
        uses:
          - anchor: { file: docs/01-org-model.md, heading: Staffing per track }
            meaning: the stage checkpoints and the request approval of one proposal, rulings excluded
            demands: a count of at most 2 on the patch track, and a count of 1 that no route reaches under the kept
              definition (every patch route costs 2)
          - anchor: { file: docs/15-roadmap.md, heading: Measures }
            meaning: every approval.recorded event whose subject is the proposal (stage, request and rule kinds), computed
              from the ledger
            demands: a formula; the receipt acknowledgement is an approval event and counts, so the shared-trunk
              policy-path patch measures 3
          - anchor: { file: docs/17-open-decisions.md, heading: "Adopted by recommendation (reversible, with ADR)" }
            meaning: the same count under a second name
            demands: the same
        kept:
          meaning: "one explicit confirmation recorded by keel approve (any kind) with the proposal as its subject; the
            measure counts approval.recorded events per proposal and the typical counts list the checkpoints
            and the request, rulings excluded and stated as such. Tally note for the owner: the claim that
            'typically 1' is unreachable holds under this definition, which counts the non-blocking
            acknowledgement as a confirmation (the 15 measure formula, approval events, supports it); under
            the other reading, that non-blocking acknowledgements are not confirmations, a policy-path patch
            under a land policy costs 1 (the request) and the row's lower bound is reachable; the
            recommendation adopts the measure's definition, which is why the staffing row is rewritten to 2
            with the acknowledgement counted"
          provides: a formula with a denominator and one name; 'Board touches' is replaced by 'Board confirmations'
    options:
      - "Option 1: split the term and attach the acknowledgement to the land policy alone: a 'policy-path
        change' keeps the request approval, the red/green proof and the policy lens set; a 'policy-governed
        land' (an approved land policy named by land.policy stood in for the land approval, on any patch) is
        the only land a receipt acknowledgement follows, so no change gets both a land approval and an
        acknowledgement, land.approval checks the land authority only, the archived receipt.md's Land approval
        section and the Keel-Approval trailer name the land policy's approval record on such a land, and every
        patch route costs two confirmations."
      - "Option 2: keep the acknowledgement after every policy-path land, including one the Board approved at
        land, and only split the terms and correct the bounds (staffing row '2 to 3', measure row naming the
        third touch), leaving the double read of one receipt.md on shared trunks."
      - "Option 3: drop standing land policies (kind land, land.policy) and the receipt acknowledgement, and
        require a land approval per change on every patch, which flips adopted row 3 to the option not taken
        'Always' and adds a Board confirmation to every solo-repository patch."
      - "Option 4: let a policy-path change land without a per-change land approval everywhere (request plus
        acknowledgement, two confirmations), keeping the land approval for per-change-contract patches only,
        which flips adopted row 3 ('Land approval on shared trunks') and lets a policy-path patch reach trunk
        with no human read before the Board's own push."
    recommendation: "Option 1. It keeps every mechanism the owner adopted (the request approval, the land approval
      where the Board wants one, the land policy where it does not, the acknowledgement as the after-the-fact
      read of a land no human approved) and removes the defect at its root: one wording, two meanings. After
      the fix each of the four patch cells costs exactly two confirmations (request plus land approval;
      request plus acknowledgement; contract plus land approval; contract plus acknowledgement), the staffing
      row states 2 with the acknowledgement counted under the measure's definition (approval events per
      proposal), and the measure agrees with it. It creates no cycle (the land policy's approval is on trunk
      before any land; the acknowledgement follows the archive commit as it does now), no deadlock (the land
      wait is released by board.approve.land or by the land.policy alternative, both stated), no unreachable
      place (no artifact moves), no dead field (land.completed.policy gains its readers: status --next, the
      close check, audit.sweep, board.doctor and dashboard.build raise the acknowledgement item from it;
      land.completed.approval is the land approval record id, null on a policy-governed land, exactly one of
      the two non-null) and no mandate conflict (D6 is met at every node that still needs a human decision,
      and one node fewer needs one; the track stays the one ceremony axis of KP-11 because the topology
      becomes guidance for land.policy). Options 3 and 4 flip row 3; option 2 keeps the cost the 5.1 trigger
      names. The closing commit must change every consumer on the walk, including those the first analysis
      missed: templates/proposal/receipt.md gains a Land approval branch naming the land policy and its policy
      approval record on a policy-governed land (the inverted 'Not yet approved' branch is then reserved for
      the draft); docs/13-artifacts-schemas.md's Templates and Examples rows for receipt.md and
      schemas/receipt.schema.json #/properties/approvals say the section is filled from the land approval
      record or, on a policy-governed land, from the land policy's approval record; docs/04 'Steward commits
      and trailers' and src/vcs/git.ts make Keel-Approval the land approval record or the land policy's
      approval record, plus the request record on the policy path; docs/04 'RTM and drift classes' reads 'a
      policy-governed land whose receipt the Board has not acknowledged'; 'policy land' becomes 'policy-path
      change' or 'policy-path land' in docs/00-vision.md KP-07 and the goal-consistency item 5 (a KP sentence,
      so the glossary entry for 'policy-path change' records that KP-07's bullet was reworded, never
      silently), docs/02 'Test independence and red/green proof', docs/03 'Phase 4 Verify', docs/11 sections
      3, 4, 8, gate:verify and gate:land, docs/14 T7, docs/15 M3 exit criterion 'A policy-path change without
      red/green proof is refused' (an exit criterion changes, so 15-roadmap is in the closing commit),
      schemas/evidence.schema.json #/$defs/redGreen/description, schemas/seat.schema.json lensSets patch and
      policy descriptions, src/core/evidence.ts and org/seats/reviewer.yaml; docs/11 '8. Negative controls'
      gains a land.approval row for a per-change-contract patch landing under an approved land policy whose
      predicates hold (pinned outcome: land completes with a null approval and the land policy's id in
      land.completed, the receipt names the policy's approval record, and an acknowledgement item is raised);
      org/checkpoints.yaml's receipt stage value becomes after-policy-governed-land and its binds read
      'receipt.md of a policy-governed land', mirrored in src/core/lifecycle.ts; board.doctor is unchanged.
      The matrix sequence patch-policy is replaced by patch-policy-approved and patch-policy-governed, and
      patch-per-change gains patch-per-change-governed; the four patch x board-at-terminal cells are the
      regression cells. On the register's red edges: DI-10 tags none, so nothing turns green for it; the fix
      must not touch DI-02's tagged land-approval-record edge, which stays red until DI-02 closes; the missing
      intake edge for 'an unacknowledged receipt blocks the next change' is DI-12's and is reproduced red
      there, in the shared commit, before it is removed. Owner message (5.4): DI-10 blocks M0 and the M0 exit
      criterion needs it closed, deferred or dismissed, while its correction is ordered behind DI-02 and DI-03
      (both blocking M1b) and shares a commit with DI-12, which is still unclassified and on which 5.2 fails
      the exit check; the owner must therefore either have DI-02, DI-03 and DI-12's class settled before the
      M0 exit, or defer DI-10 to a named milestone; the analysis recommends the first, because rows 2 and 3 of
      17 are confirmed at that exit and the fix rewords both (row 2 loses 'followed by a receipt
      acknowledgement'; row 3, retitled 'Land authority on the patch track', is restated over land.policy with
      'shared trunk' as guidance), with none of ADR-0001 to ADR-0009 flipping and ADR-0005's Consequences
      corrected in place."
  - id: DI-11
    title: The register's place and machine vocabulary lacks the workspace root and keel's own agent-side processes
    statement: The order map's vocabulary placed every run input, outbox drop and worktree in the git common dir
      and let a seat reach only its worktree and the proposal branch, so every brief a seat ACKs, every outbox
      drop and every read by keel api, keel hook or the MCP server was flagged as a place the seat cannot
      reach. The design puts run inputs, outboxes and worktrees under the workspace root outside the
      repository, round commits on the task branch, and keel's own api, hook and MCP processes in the seat's
      process tree with the control plane readable; the vocabulary of section 5.2, not the design, was what
      could not hold.
    status: closed
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: other
    anchors:
      - { file: docs/00-mandate.md, heading: 5.2 The design-issue register }
      - { file: docs/04-trace-and-state.md, heading: Local control plane }
      - { file: docs/05-vcs.md, heading: Creating worktrees }
      - { file: docs/12-cli-api-mcp.md, heading: "5. MCP (two read tools, one write tool)" }
      - { file: schemas/design-issues.schema.json, pointer: "#/$defs/place" }
    class: gap
    blocks: M0
    walk:
      producers:
        - precondition: a seat reads its brief and writes its outbox drops
          producer: { file: docs/04-trace-and-state.md, heading: Local control plane }
          position: before
          sufficient: true
          reason: run inputs and outboxes live under the workspace root, which the runtime is started in; the compiled
            brief itself stays in the git common dir and reaches the seat through the run inputs
      consumers:
        - anchor: { file: docs/00-mandate.md, heading: 5.2 The design-issue register }
          actor: seat
          outcome: changed
          reason: the reachability sentence gains the workspace root, the task branch and the agent-api machine
        - anchor: { file: docs/13-artifacts-schemas.md, heading: 6. validate coverage and the D1 tooling exception }
          actor: board-at-terminal
          outcome: unchanged
          reason: the issues row names the reachability check, not the place list
        - anchor: { file: docs/04-trace-and-state.md, heading: Local control plane }
          actor: seat
          outcome: unchanged
          reason: the design already states that the control plane is readable by keel's own processes and, on exposed
            runtimes, by seats
      places:
        - artifact: run-dir
          where: workspace-root
          reachable_from: [ local, supervisor, seat, agent-api ]
        - artifact: brief
          where: git-common-dir
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: round-commit
          where: task-branch
          reachable_from: [ local, supervisor, seat, agent-api ]
      readers:
        - field: "place: workspace-root, task-branch"
          readers: [ "order.artifacts[].where", the reachability table of the issues check ]
        - field: "runs_in: agent-api"
          readers: [ "order.steps[].runs_in", the reachability table of the issues check ]
      tally: []
    options:
      - "Extend the vocabulary: places workspace-root and task-branch, machine agent-api (keel's own api, hook
        and MCP processes in the seat's process tree), with the reachability table stated in section 5.2 and
        enforced by the issues check."
      - Keep the vocabulary and exempt supervisor-handed inputs from the reachability check by tagging every
        affected edge with an open issue.
    recommendation: "Option 1: the places exist in the design (workspace root, task branch) and the exemption
      would hide real unreachable places behind tags."
    decision:
      by: recommendation
      date: 2026-09-27
      option: Option 1
      recorded_in: [ docs/00-mandate.md, schemas/design-issues.schema.json, scripts/validate.mjs ]
    closure:
      date: 2026-09-27
      checks: [ schemas, examples, issues, i18n ]
      tests: []
      anchors:
        - { file: docs/00-mandate.md, heading: 5.2 The design-issue register }
        - { file: schemas/design-issues.schema.json, pointer: "#/$defs/place" }
        - { file: schemas/design-issues.schema.json, pointer: "#/$defs/runsIn" }
    regression:
      - { track: feature, actor: seat, sequence: feature-happy }
      - { track: feature, actor: hook, sequence: feature-happy }
  - id: DI-12
    title: The close check blocks on the receipt acknowledgement that the same phase calls non-blocking
    statement: Phase 6 produces a receipt acknowledgement item when the change landed under a policy, and its
      gate, the close check, requires no unacknowledged receipt on the touched elements or paths. The same
      phase and the standing policy limits say the acknowledgement does not block and only blocks the next
      change that touches the same elements. At close, a proposal that landed under a policy has exactly one
      unacknowledged receipt on exactly the elements it touched, its own; as written the close check blocks on
      it unless the check excludes the proposal's own receipt, which no sentence says.
    status: proposed
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: other
    anchors:
      - { file: docs/03-lifecycle.md, heading: Phase 6 Close }
      - { file: docs/03-lifecycle.md, heading: Standing policy limits }
    class: gap
    blocks: M1b
    walk:
      producers:
        - precondition: liveness clean (no orphan task of the landed proposal)
          producer: { file: docs/03-lifecycle.md, heading: Liveness invariant }
          position: before
          sufficient: true
          reason: after land.completed every task of the proposal is `landed` (terminal), so the invariant holds
            vacuously; the close check is itself the liveness pass of `keel audit` (11 section 1), run in the
            local machine from ledger events
        - precondition: overrides expired
          producer: { file: docs/03-lifecycle.md, heading: Blocked reasons }
          position: before
          sufficient: true
          reason: "`--rule override --until land|commit-touching:<path>` expires at land and the override-record is on
            the proposal branch and in the archive; a dated `--until <date>` can outlive the land, which is
            outside DI-12's rule and is a separate candidate finding"
        - precondition: a receipt exists for the landed proposal and says which standing policies it used
          producer: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
          position: before
          sufficient: true
          reason: "steward.land.archive-commit writes receipt.json and receipt.md into the archive commit;
            receipt.json#policies (schemas/receipt.schema.json #/properties/policies) lists the policies used,
            so 'landed under a policy' is decidable from the receipt alone, and Phase 6 derives its receipt
            acknowledgement item from that field (receipt therefore stays required_by steward.close)"
        - precondition: "the receipt is acknowledged: a receipt-ack-record (stage receipt, binding the archived
            receipt.md) with its approval.recorded event on the verified chain"
          producer: { file: docs/03-lifecycle.md, heading: Standing policy limits }
          position: after
          sufficient: false
          reason: board.approve.receipt is ordered only 'after a policy land' (03), 'after every policy land' (01
            Checkpoint stages) and as 'a later receipt acknowledgement' (02 L11); every home calls it
            non-blocking, so no step orders it before the close check and nothing waits for it; for the
            proposal's own receipt it is absent at the moment the close check first runs, and a Board act that
            nothing waits for is too weak to be the precondition of a Steward check
        - precondition: "the touched elements of the landed change, or its path globs when the paths are unmapped: the
            actual impact recomputed from the diff at submit"
          producer:
            file: docs/03-lifecycle.md
            heading: Track signals and the upward-only ratchet (including the no-index fallback)
          position: before
          sufficient: false
          reason: "the computation exists: at submit the cartographer recomputes impact from the actual diff (03
            Ratchet; 07 Impact and the ratchet), gate.submit.ratchet runs it in the supervisor and Phase 4
            lists 'actual impact and drift reports' among its products, and steward.land.archive-commit
            projects them into reports/ of the archive commit (04 Land projection and the projection gate);
            the no-index fallback gives the changed paths before M4 or with backend none. Not sufficient as
            mapped: the order map's only impact artifact, impact-record (03 Phase 2 Plan), is produced_by
            steward.plan.route, a step the patch track never runs ('Phase 2 is always skipped'), and patch is
            the only track that owes an acknowledgement; the actual impact at submit and its reports/
            projection have no artifact id in the map, so no reader of the touched set can be wired to a
            producer that runs on the track that matters"
        - precondition: a map artifact for the actual-impact projection of a landed change, produced on every track
          producer: { file: docs/04-trace-and-state.md, heading: Land projection and the projection gate }
          position: absent
          sufficient: false
          reason: 04 names reports/ (impact, drift and trace reports) among the archive projections and the projection
            gate scans it, but order.artifacts carries no id for it; the receipt does not carry the set either
            (receipt.schema.json has no elements or paths property), so the hold's reader has nothing in the
            map to require until the fix adds the artifact (produced_by gate.submit.ratchet for the record in
            the git common dir and steward.land.archive-commit for its projection)
        - precondition: the proposal's own receipt is excluded from the close check, or the clause is scoped to receipts
            of earlier changes
          producer: { file: docs/03-lifecycle.md, heading: Phase 6 Close }
          position: absent
          sufficient: false
          reason: no sentence in 03 Phase 6, 03 Standing policy limits, 11 section 1 or 04 RTM and drift classes scopes
            'no unacknowledged receipt on the touched elements or paths'; read as written the proposal's own
            receipt satisfies the condition and blocks its own close
        - precondition: a step of the next change reads unacknowledged receipts and refuses or holds it ('blocks the
            next change that touches the same elements')
          producer: { file: docs/11-verification.md, heading: gate:frame }
          position: absent
          sufficient: false
          reason: the intake part of gate:frame holds frame.goal-active, frame.charter-current and frame.approvals;
            `keel new` checks anchors and classifies the track; `keel run` resolves route and claims;
            land.approval's policy branch reads the policy, the request and the red/green proof; no check id
            names an unacknowledged receipt, 04's drift row states a consequence without a check,
            org/checkpoints.yaml `blocks_next` has no reader, and a policy-path change intaked before the
            policy land goes straight to executing and lands with gate:frame never re-run; the only readers
            are `keel audit` and the dashboard Board queue, which report and never refuse
      consumers:
        - anchor: { file: docs/11-verification.md, heading: 1. Five phase gates and the check catalogue }
          actor: board-at-terminal
          waits_for: "`keel approve <P> --stage receipt` on the proposal's own receipt"
          released_by: board.approve.receipt (a Board act with no deadline)
          outcome: breaks
          reason: "`keel audit` (default pass) runs the close check as its liveness part; after a policy land the
            proposal's own receipt is unacknowledged and on exactly its touched elements, so the check reports
            it and the proposal cannot pass the close it is running, which is what 'not blocking' denies"
        - anchor: { file: docs/03-lifecycle.md, heading: Proposal states }
          actor: board-at-terminal
          waits_for: the same acknowledgement
          released_by: board.approve.receipt
          outcome: breaks
          reason: "`keel status` computes `landed --> closed: close check passes`; under the rule as written the state
            stays `landed` until the Board acknowledges; every task is terminal, so no liveness item covers
            the wait and nothing flags it before the M8 quiescence audit"
        - anchor: { file: docs/03-lifecycle.md, heading: Standing policy limits }
          actor: board-at-terminal
          waits_for: nothing while no seat runs
          released_by: n/a
          outcome: holds
          reason: "`keel approve <P> --stage receipt` binds the archived receipt.md, which exists from the archive
            commit, so the mode can run before or after the close; its release is not the outcome it exists to
            cause, so this row is not a deadlock"
        - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
          actor: board-during-wave
          waits_for: lock.supervisor
          released_by: steward.run.end
          outcome: pending
          reason: "`keel approve` waits for the supervisor lock while a seat runs (DI-04, open); under the rule as
            written the close of the landed proposal waits behind that lock through the acknowledgement; the
            coupling disappears once the close stops waiting for the acknowledgement, and the row is re-walked
            when DI-04 closes"
        - anchor: { file: docs/03-lifecycle.md, heading: Phase 0 Intake }
          actor: board-at-terminal
          waits_for: the acknowledgement of any earlier policy-landed change whose touched elements or path globs
            intersect the new proposal's anchors and predicted impact
          released_by: board.approve.receipt on that earlier proposal
          outcome: breaks
          reason: "`keel new` is where 'the next change' begins and where its anchors and predicted impact are recorded,
            yet no intake step reads unacknowledged receipts; the promise of 01, 04, 00a and
            org/checkpoints.yaml `blocks_next` has no enforcer"
        - anchor: { file: docs/11-verification.md, heading: gate:frame }
          actor: board-at-terminal
          waits_for: a check id that does not exist
          released_by: none
          outcome: breaks
          reason: "`keel check --gate frame` cannot report the hold: the catalogue holds no check whose fail condition
            is an unacknowledged receipt, and 04's `unacknowledged-receipt` drift class is not among the
            classes any gate reads"
        - anchor:
            file: docs/03-lifecycle.md
            heading: Track signals and the upward-only ratchet (including the no-index fallback)
          actor: board-at-terminal
          outcome: changed
          reason: "`keel new --track spike`: a spike is 'a question, not a change', answered read-only with no land and
            no checkpoints, so the rule text ('blocks the next change') exempts it, while a hold keyed on
            anchors alone would refuse a spike whose cited element is under an unacknowledged receipt; the fix
            states that frame.receipt-hold does not apply on the spike track (its intake still records anchors
            and predicted impact for classification)"
        - anchor: { file: docs/03-lifecycle.md, heading: Patch track and policy path }
          actor: board-at-terminal
          waits_for: "the acknowledgement of P1 (today: nothing before P2's close; under the fix: at P2's intake, or at
            P2's policy-path land when P2 was intaked earlier)"
          released_by: board.approve.receipt on P1
          outcome: breaks
          reason: "a policy-path patch P2 intaked before P1's policy land goes straight from intake to executing,
            gate:frame never re-runs on the policy path, and P2 builds and lands under the same policy while
            P1's receipt is unacknowledged: 'blocks the next change that touches the same elements' is not
            enforced at any step before P2's own close, and an intake-only hold would drop even that; the fix
            re-runs frame.receipt-hold at the second `keel land` of a policy-path proposal, inside
            land.approval's policy branch, so an in-flight change with no human reading it is held where it
            would otherwise land unread"
        - anchor: { file: docs/11-verification.md, heading: 1. Five phase gates and the check catalogue }
          actor: board-at-terminal
          waits_for: "today: nothing can waive the clause; under the fix: an override-record on the held proposal or the
            acknowledgement"
          released_by: board.approve.rule.override or board.approve.receipt
          outcome: changed
          reason: "`keel approve <subject> --rule override --until ...` waives a named check on a subject; today the
            receipt clause of the close check has no check id and is not a gate, so the Board cannot name it
            and the self-wait has no waiver; only frame.approvals, land.approval and land.projection are
            unwaivable, so under the fix frame.receipt-hold is a named, waivable check: the Board may lift the
            hold on a specific later proposal with an override (recorded as OV-, listed in that proposal's
            receipt), which is itself a Board act that reads the item, and the fix says so explicitly instead
            of leaving waivability implied"
        - anchor: { file: docs/03-lifecycle.md, heading: Proposal states }
          actor: board-at-terminal
          outcome: changed
          reason: "`keel approve <P> --rule abandon` applies 'from any non-terminal state'; under the rule as written
            `landed` stays non-terminal while the close waits for the acknowledgement, so abandon is an
            unnamed release of the wait that marks a change already on trunk as abandoned; the fix removes the
            Board-act wait, so a policy-landed proposal computes `closed` as soon as liveness is clean and its
            overrides expired, and the abandon window on a landed change shrinks to those two conditions;
            whether abandon should be refused from `landed` at all is a separate candidate finding"
        - anchor: { file: docs/03-lifecycle.md, heading: Phase 3 Build }
          actor: supervisor
          outcome: unchanged
          reason: "`keel run` (dispatch) checks approvals through gate.frame.approvals and never reads receipts; the
            hold belongs at intake, where the anchors and predicted impact already exist, and for changes
            intaked earlier at the policy-path land, so the fix adds no dispatch wait"
        - anchor: { file: docs/11-verification.md, heading: gate:submit }
          actor: supervisor
          outcome: unchanged
          reason: submit.ratchet recomputes the actual impact from the diff in the supervisor; that record, projected
            into reports/ by the archive commit, is the set a later change's receipt hold compares against;
            nothing about the acknowledgement is read at submit, and the fix only names the record as a map
            artifact
        - anchor: { file: docs/11-verification.md, heading: gate:land }
          actor: board-at-terminal
          outcome: changed
          reason: land.approval accepts a land approval over the draft, or an approved land policy plus an approved
            request plus the red/green proof; 02 L11 calls the acknowledgement 'later', so the second `keel
            land` never reads a receipt today; under the fix the policy branch of land.approval also requires
            that frame.receipt-hold passes for this proposal at land, so a policy-path change intaked before
            an earlier policy land is held; the land-approval branch is unchanged because the Board is reading
            receipt.md at that moment
        - anchor: { file: docs/08-dashboard.md, heading: Overview }
          actor: dashboard
          outcome: unchanged
          reason: the Board queue lists unacknowledged receipts with the copyable `keel approve <P> --stage receipt`; it
            reports and never blocks, and the item stays until the record and its approval.recorded event
            exist
        - anchor: { file: docs/14-trust-security.md, heading: Approvals and the single writer }
          actor: board-at-terminal
          outcome: unchanged
          reason: "`keel doctor --section approvals` reports approval state (records without an event, changed bound
            content, expiring documents and policies); receipt-ack-record is required_by board.doctor in the
            map for that report only"
        - anchor:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
          actor: ci-fresh-clone
          outcome: unchanged
          reason: "`keel check --gate land --check approval --at <sha>` on a fresh clone reads the land record (or
            request plus policy) at the trunk tip; receipt records are governance commits on trunk but the
            approval check does not read them, and their approval.recorded event is the DI-03 shape, not
            DI-12's"
        - anchor: { file: docs/04-trace-and-state.md, heading: Declared plane }
          actor: second-machine
          outcome: unchanged
          reason: another machine sees the receipt record through its governance commit on trunk, the archived receipt
            and the reports/ projection of the actual impact; it can compute whether a receipt is acknowledged
            and what it touched from committed files, subject to the ledger-event condition that DI-03 already
            files
        - anchor: { file: docs/03-lifecycle.md, heading: Phase 6 Close }
          actor: crashed-supervisor
          waits_for: a Board act with no deadline
          released_by: nothing in the design before M8
          outcome: breaks
          reason: "the fixed row 'the holder crashes or never releases': the holder of the wait is the Board, not a
            process; if it never acknowledges, the landed proposal never computes `closed`, no expiry or
            `--until` bounds the wait, its tasks are terminal so the liveness audit sees no orphan, and the
            quiescence audit exists only from M8"
      places:
        - artifact: receipt
          where: archive-commit
          reachable_from: [ local, supervisor, clone ]
        - artifact: receipt-ack-record
          where: trunk-commit
          reachable_from: [ local, supervisor, clone ]
        - artifact: approval-recorded-event
          where: git-common-dir
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: impact-record
          where: git-common-dir
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: archive-commit
          where: trunk-commit
          reachable_from: [ local, supervisor, clone ]
        - artifact: override-record
          where: proposal-branch
          reachable_from: [ local, supervisor, seat, agent-api ]
        - artifact: ledger-event
          where: git-common-dir
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: proposal-dir
          where: proposal-branch
          reachable_from: [ local, supervisor, seat, agent-api ]
      readers:
        - field: "approvalStage enum value `receipt` (schemas/common.schema.json #/$defs/approvalStage;
            approval.schema.json stage)"
          readers:
            - keel approve --stage receipt (writer)
            - keel audit liveness pass (unacknowledged receipts)
            - keel doctor --section approvals
            - dashboard Board queue (08 Overview)
            - "org/checkpoints.yaml #/stages/3"
        - field: "org/checkpoints.yaml #/stages/3/blocks_next and src/core/lifecycle.ts Checkpoint.blocks_next"
          readers: []
        - field: "org/checkpoints.yaml #/stages/3/blocking (false) and required_on.patch = after-policy-land
            (CheckpointRequirement in src/core/lifecycle.ts)"
          readers:
            - keel approve --stage receipt (whether the stage applies)
            - keel status --next (the item is listed as due, never as a blocker)
        - field: trace drift class `unacknowledged-receipt` (04 RTM and drift classes; src/core/trace-graph.ts
            TraceDriftKind; src/dashboard/model.ts)
          readers: [ keel audit (report only), dashboard Board queue (report only) ]
        - field: "receipt.json `policies` (schemas/receipt.schema.json #/properties/policies)"
          readers:
            - keel audit (decides 'landed under a policy')
            - keel approve --stage receipt
            - steward.close (the receipt acknowledgement item of Phase 6 Produces)
            - dashboard Evidence and receipts view
        - field: plan-time impact-record IM-<sha12> (order.artifacts impact-record, produced_by steward.plan.route; 03
            Phase 2 Plan)
          readers:
            - gate.plan
            - gate.submit (predicted versus actual)
            - gate.verify
            - steward.land.archive-commit (projection)
        - field: actual impact at submit (03 Ratchet; 03 Phase 4 Produces 'actual impact and drift reports'; 07 Impact
            and the ratchet) and its projection under reports/ of the archive commit (04 Land projection and
            the projection gate); no order.artifacts id
          readers:
            - submit.ratchet (the track ratchet and its path fallback)
            - keel check --gate submit (predicted vs actual impact, 00a)
            - dashboard Architecture view (predicted versus actual)
        - field: "formula: touched elements or paths = elements reached by the actual impact of the landed diff, or the
            changed path globs when unmapped (03 Phase 6; 04 unacknowledged-receipt row)"
          readers: [ the close check (03 Phase 6), the `unacknowledged-receipt` drift row (04) ]
        - field: checkStatus `waived` and the unwaivable list (frame.approvals, land.approval, land.projection) of 11
            section 1
          readers:
            - keel approve --rule override --until (writer of the override-record)
            - keel check (every gate; the close check is not a gate and has no check id to name)
        - field: proposal state `landed` as a non-terminal state (03 Proposal states) and `--rule abandon` 'from any
            non-terminal state'
          readers: [ keel status --next (legal next actions), keel approve --rule abandon ]
        - field: proposal state `closed` (03 Proposal states) and the `cleanup.completed` ledger event
          readers: [ keel status, dashboard Proposals by computed state ]
      tally:
        - track: spike
          route: none
          topology: shared-trunk
          confirmations: 0
          work_orders: 0
          bound: { file: docs/01-org-model.md, heading: Staffing per track }
        - track: spike
          route: none
          topology: solo
          confirmations: 0
          work_orders: 0
          bound: { file: docs/01-org-model.md, heading: Staffing per track }
        - track: patch
          route: per-change-contract
          topology: shared-trunk
          confirmations: 2
          work_orders: 1
          bound: { file: docs/01-org-model.md, heading: Staffing per track }
        - track: patch
          route: per-change-contract
          topology: solo
          confirmations: 2
          work_orders: 1
          bound: { file: docs/01-org-model.md, heading: Staffing per track }
        - track: patch
          route: policy-path
          topology: shared-trunk
          confirmations: 3
          work_orders: 1
          bound: { file: docs/01-org-model.md, heading: Staffing per track }
        - track: patch
          route: policy-path
          topology: solo
          confirmations: 2
          work_orders: 1
          bound: { file: docs/01-org-model.md, heading: Staffing per track }
        - track: feature
          route: per-change-contract
          topology: shared-trunk
          confirmations: 2
          work_orders: 2
          bound: { file: docs/15-roadmap.md, heading: Measures }
        - track: feature
          route: per-change-contract
          topology: solo
          confirmations: 2
          work_orders: 2
          bound: { file: docs/15-roadmap.md, heading: Measures }
        - track: system
          route: per-change-contract
          topology: shared-trunk
          confirmations: 3
          work_orders: 2
          bound: { file: docs/15-roadmap.md, heading: Measures }
        - track: system
          route: per-change-contract
          topology: solo
          confirmations: 3
          work_orders: 2
          bound: { file: docs/15-roadmap.md, heading: Measures }
    terms:
      - name: receipt acknowledgement
        uses:
          - anchor: { file: docs/00-vision.md, heading: Lifecycle }
            meaning: A non-blocking Board approval after a policy land; while missing, it blocks the next change touching
              the same elements or paths
            demands: nothing of the acknowledged proposal waits; a later change is held
          - anchor: { file: docs/03-lifecycle.md, heading: Phase 6 Close }
            meaning: "Produces: a receipt acknowledgement item when the change landed under a policy; Gate: no
              unacknowledged receipt on the touched elements or paths; Board: receipt acknowledgement after a
              policy land, not blocking"
            demands: the acknowledgement exists before the proposal's own close, and at the same time nothing waits for it
          - anchor: { file: docs/03-lifecycle.md, heading: Standing policy limits }
            meaning: After a policy land the Board acknowledges the receipt with keel approve <P> --stage receipt; the
              acknowledgement does not block, but an unacknowledged receipt blocks the next change that
              touches the same elements, or the same path globs when the paths are unmapped
            demands: a hold on a later change with a named place, which no sentence gives
          - anchor: { file: docs/03-lifecycle.md, heading: Patch track and policy path }
            meaning: "a policy land's third extra requirement: land follows the land policy, and a receipt acknowledgement
              follows the land; the flowchart ends in 'Receipt acknowledgement (not blocking)'"
            demands: a sequence after the land, not a wait of the landed change
          - anchor: { file: docs/01-org-model.md, heading: Checkpoint stages }
            meaning: "receipt: acknowledgement of the receipt of a change that landed under a standing policy; required
              after every policy land; blocking: no, but an unacknowledged receipt blocks the next change"
            demands: non-blocking for the proposal itself
          - anchor: { file: docs/02-alignment.md, heading: Alignment chain L0–L11 }
            meaning: land needs a valid land approval over the receipt draft, or an approved land policy plus a later
              receipt acknowledgement
            demands: the acknowledgement is later than the land and ordered against nothing else
          - anchor: { file: docs/17-open-decisions.md, heading: "Adopted by recommendation (reversible, with ADR)" }
            meaning: "rows 2 and 3: revocable, listed in receipts, followed by a receipt acknowledgement; an approved land
              policy plus a receipt acknowledgement on solo repositories"
            demands: a sequence (followed by), not a wait
          - anchor: { file: org/checkpoints.yaml, pointer: "#/stages/3" }
            meaning: "stage receipt: binds receipt.md of a change that landed under a standing policy; required_on.patch
              after-policy-land; blocking false; blocks_next: an unacknowledged receipt blocks the next change
              that touches the same elements, or the same path globs when the paths are unmapped"
            demands: a non-blocking checkpoint plus a next-change hold that some step enforces
          - anchor: { file: templates/project/policies/quick-patch.yaml, pointer: "#/id" }
            meaning: "the header comment above id: after a land under a land policy, the Board acknowledges the receipt
              with keel approve <P> --stage receipt"
            demands: the acknowledgement is owed after a land-policy land (DI-10's second reading)
        kept:
          meaning: A Board approval of stage `receipt`, binding the archived receipt.md of a change that landed under a
            standing policy, due after that land; no step of the acknowledged proposal waits for it
          provides: a receipt-ack-record committed on trunk with its approval.recorded event, listed in the Board queue
            and by keel audit until it exists; which lands owe it is DI-10's decision; the same wording is
            mirrored in the backlink homes src/core/governance.ts (StandingPolicy comment, 'followed by a
            receipt acknowledgement') and src/core/lifecycle.ts (Checkpoint.blocks_next), which the fix
            changes together with the documents
        renamed:
          - meaning: "the effect on later changes: a proposal on the patch, feature or system track whose anchors or
              predicted impact intersect the touched elements (or path globs when unmapped) of an earlier
              change whose receipt is unacknowledged is refused at intake, and a policy-path proposal is
              refused again at its second keel land, until keel approve <earlier P> --stage receipt is
              recorded or the Board waives the check on that proposal with --rule override; spikes are exempt"
            new_name: receipt hold (check id frame.receipt-hold)
      - name: close check
        uses:
          - anchor: { file: docs/03-lifecycle.md, heading: Phase 6 Close }
            meaning: "Gate: the close check: liveness clean, overrides expired, no unacknowledged receipt on the touched
              elements or paths; liveness-only until M8 adds the quiescence audit"
            demands: a pass condition that includes a receipt clause, while in the same bullet calling itself
              liveness-only
          - anchor: { file: docs/03-lifecycle.md, heading: Proposal states }
            meaning: "landed --> closed: close check passes; closed: close check passed; terminal"
            demands: a predicate decidable from the ledger and committed records, since state is computed and never stored
          - anchor: { file: docs/03-lifecycle.md, heading: Liveness invariant }
            meaning: Until M8 the close check tests liveness only
            demands: liveness only; the receipt clause of Phase 6 is not liveness
          - anchor: { file: docs/11-verification.md, heading: 1. Five phase gates and the check catalogue }
            meaning: "The close check of phase 6 is not a gate: it is the liveness part of keel audit (orphans, expired
              overrides, unacknowledged receipts on touched elements or paths) and becomes the full quiescence
              audit in M8; only checks with an id can be waived, and the close check has none"
            demands: a report by keel audit, not a gate with a checkStatus; no override can name it
          - anchor: { file: docs/15-roadmap.md, heading: M0–M8 scope and exit criteria }
            meaning: the close gate stays liveness-only until M8 adds the quiescence audit; M8 turns the close gate from
              liveness-only into its full form
            demands: a sixth gate, which the surface budget (5 phase gates) and 11 section 1 deny
        kept:
          meaning: "The liveness pass of keel audit applied to a landed proposal: no orphan task and no unexpired
            override; passing it computes `closed`; it is not a gate and reads no receipt-ack-record (it still
            reads receipt.json#policies to emit the receipt acknowledgement item)"
          provides: a predicate decidable from ledger events and committed records without any Board act, consistent
            with 03 Liveness invariant, 11 section 1 and the five-gate budget; 15's 'close gate' wording is
            corrected to 'close check' (a stray wording, not a second meaning)
      - name: policy land / landed under a policy
        uses:
          - anchor: { file: docs/03-lifecycle.md, heading: Patch track and policy path }
            meaning: "a policy land: a land on the policy path, with red/green proof, the policy lens set, the land policy
              and a receipt acknowledgement"
            demands: the acknowledgement follows every land on the policy path
          - anchor: { file: docs/03-lifecycle.md, heading: Standing policy limits }
            meaning: "Land policy for patches: a land approval on shared trunks; an approved land policy plus a receipt
              acknowledgement on solo repositories"
            demands: the acknowledgement follows a land made under a land policy
          - anchor: { file: docs/03-lifecycle.md, heading: Phase 6 Close }
            meaning: a receipt acknowledgement item when the change landed under a policy
            demands: either reading
        kept:
          meaning: As DI-10 decides; DI-12 leans on the term only to decide whether a receipt is acknowledgeable, and
            its own defect (the unscoped close clause, the missing hold and the missing producer of the
            touched set on the patch track) is the same under both readings
          provides: receipt.json#policies names the policies a land used, so whichever reading DI-10 fixes is decidable
            from the receipt
      - name: blocking / blocks
        uses:
          - anchor: { file: org/checkpoints.yaml, pointer: "#/stages/3/blocking" }
            meaning: "blocking: false — no step of the same proposal waits for this checkpoint"
            demands: the proposal's own close does not wait
          - anchor: { file: docs/03-lifecycle.md, heading: Standing policy limits }
            meaning: an unacknowledged receipt blocks the next change
            demands: a refusal or hold on a different proposal at a named step
          - anchor: { file: docs/00a-owner-guide.md, heading: What to read at each checkpoint }
            meaning: Never blocking, but an unacknowledged receipt blocks the next change that touches the same elements
              or paths
            demands: the same two objects under one verb
        kept:
          meaning: "`blocking` (checkpoint attribute): a step of the same proposal waits for the approval; the receipt
            stage is `false`"
          provides: the attribute stays true once the close reads no receipt-ack-record; the second object gets its own
            identifier, receipt hold (see receipt acknowledgement), with a named check id that an override can
            waive
      - name: touched elements or paths
        uses:
          - anchor: { file: docs/03-lifecycle.md, heading: Phase 6 Close }
            meaning: the elements or paths the landed change touched, against which unacknowledged receipts are matched
            demands: a recorded set per landed change, comparable with a later change's set
          - anchor: { file: docs/04-trace-and-state.md, heading: RTM and drift classes }
            meaning: "unacknowledged-receipt: blocks the next change touching the same elements, or the same path globs
              when unmapped"
            demands: the same set, readable from committed files
          - anchor:
              file: docs/03-lifecycle.md
              heading: Track signals and the upward-only ratchet (including the no-index fallback)
            meaning: "Ratchet: at submit the cartographer recomputes impact from the actual diff (elements reached,
              boundaries crossed, rules and public API touched), records predicted versus actual; without an
              index the path rule uses the changed paths"
            demands: nothing; this is the submit-time computation on every track, patch included
          - anchor: { file: docs/03-lifecycle.md, heading: Phase 4 Verify }
            meaning: "Produces: evidence, verdicts, triage records, actual impact and drift reports, the red/green proof
              on policy lands"
            demands: a home for the actual-impact report that the archive commit projects
          - anchor: { file: docs/03-lifecycle.md, heading: Phase 2 Plan }
            meaning: "Produces: impact records IM-* (in .git/keel/records, projected at land); patch always skips this
              phase"
            demands: the map's only impact-record, which does not exist for a patch
          - anchor: { file: docs/04-trace-and-state.md, heading: Land projection and the projection gate }
            meaning: the archive commit writes projections next to the archived proposal folder, among them reports/
              (impact, drift and trace reports), scanned by the projection gate
            demands: a committed, clone-reachable copy of the actual impact per landed change, which the order map does
              not name as an artifact
          - anchor: { file: docs/07-architecture-intelligence.md, heading: Impact and the ratchet }
            meaning: predicted impact at intake and per task at plan time as IM records; actual impact from the diff at
              submit; the ratchet uses the path fallback without an index
            demands: nothing; this is the definition
        kept:
          meaning: The elements reached by the actual impact of the landed diff, or its changed path globs when the
            paths are unmapped or no index exists, as recomputed by submit.ratchet in the supervisor (git
            common dir) and projected under reports/ of the archive commit; not the plan-time IM record, which
            a patch never has
          provides: the set exists for every landed change on every track, but the receipt does not carry it
            (receipt.schema.json has no elements or paths property) and the order map has no artifact for it,
            so the fix adds an artifact for the actual-impact record and its projection (produced_by
            gate.submit.ratchet, projected by steward.land.archive-commit) and the receipt hold reads that
            projection and compares it with the new proposal's anchors and predicted impact, both already
            recorded at intake
      - name: the next change
        uses:
          - anchor: { file: docs/01-org-model.md, heading: Checkpoint stages }
            meaning: the next change that touches the same elements
            demands: a step at which 'next' is judged and the hold applied
          - anchor: { file: docs/03-lifecycle.md, heading: Standing policy limits }
            meaning: an unacknowledged receipt blocks the next change that touches the same elements, or the same path
              globs when the paths are unmapped
            demands: a hold on any later-landing change, including one intaked before the policy land, not only on the
              next intake
          - anchor:
              file: docs/03-lifecycle.md
              heading: Track signals and the upward-only ratchet (including the no-index fallback)
            meaning: "spike: the request is a question, not a change; the product seat answers read-only, no land and no
              checkpoints"
            demands: a spike is not a change, so the hold never applies to it
          - anchor: { file: docs/03-lifecycle.md, heading: Patch track and policy path }
            meaning: "on the policy path intake goes straight to executing (Proposal states: intake --> executing);
              gate:frame never re-runs before the policy land"
            demands: a second place, at the policy-path land, where a change intaked before the earlier land can be held
          - anchor: { file: docs/03-lifecycle.md, heading: Phase 0 Intake }
            meaning: keel new records anchors, predicted impact and the track; the intake part of gate:frame runs
            demands: nothing; it is the step that has the inputs the hold needs
        kept:
          meaning: A proposal on the patch, feature or system track whose intake (keel new, and the intake part of
            gate:frame) runs after the land of a change whose receipt is unacknowledged, and a policy-path
            proposal whose second keel land runs after that land; never a spike
          provides: intake owns both the new proposal's anchors and predicted impact and read access to trunk and the
            archive, so the hold is decidable there and the proposal's own receipt can never be in the set;
            the policy-path land is the one later step where a change nobody read can still land, so the same
            check runs there inside land.approval's policy branch, and the narrowing of 'the next change' to
            those two steps is stated in 03, 01, 00-vision and org/checkpoints.yaml
    options:
      - "Option 1 (corrected): scope the close check to liveness (no orphan, no unexpired override; it keeps
        reading receipt.json#policies to emit the receipt acknowledgement item) and move the receipt clause to
        a named check `frame.receipt-hold` in the intake part of gate:frame, run at `keel new` and `keel check
        --gate frame` on the patch, feature and system tracks (never on spike, which is a question and not a
        change), failing when an earlier change landed under a standing policy has an unacknowledged receipt
        whose touched elements (or path globs when unmapped) intersect the new proposal's anchors and
        predicted impact; the touched set is read from a new order-map artifact for the actual impact
        recomputed at submit (produced_by gate.submit.ratchet in the git common dir, projected under reports/
        of the archive commit by steward.land.archive-commit), never from the plan-time impact-record that a
        patch never has; the same check runs again at the second `keel land` of a policy-path proposal inside
        land.approval's policy branch, so a change intaked before the earlier policy land is held where it
        would otherwise land unread; the hold is released by `keel approve <earlier P> --stage receipt` and is
        waivable on a specific held proposal by `--rule override --until <date>` (an override-record listed in
        that proposal's receipt), since only frame.approvals, land.approval and land.projection are
        unwaivable; `keel audit` and the dashboard keep reporting unacknowledged receipts."
      - 'Option 2: keep the receipt clause in the close check but scope it to receipts of other proposals ("no
        unacknowledged receipt of an earlier change on the touched elements or paths"), so a proposal never
        waits for its own acknowledgement; the next change is then stopped at its close, after it has already
        been built and landed, `blocks_next` still has no intake reader, and the touched set still has no
        producer on the patch track in the map.'
      - 'Option 3: make the acknowledgement blocking: the close check waits for `keel approve <P> --stage
        receipt`, "not blocking" is removed from 03, 01, 00a, 00-vision, org/checkpoints.yaml,
        quick-patch.yaml and src/core/governance.ts, and the acknowledgement counts as a third confirmation on
        the policy path on shared trunks; this changes the meaning of adopted rows 2 and 3 and goes to the
        owner.'
      - "Option 4: drop the receipt stage: a policy land's receipt is read at the Board's next land approval
        or at `keel approve --policy` renewal, removing a checkpoint stage from the approvalStage enum; this
        flips adopted rows 2 and 3 and goes to the owner."
    recommendation: "Option 1 as corrected. It removes the defect at its root: a proposal's own receipt cannot
      exist at its own intake, so the self-block disappears without an exclusion sentence; the acknowledgement
      stays non-blocking exactly as 03, 01, 00a, the glossary, org/checkpoints.yaml, ADR-0005, adopted rows 2
      and 3 and the StandingPolicy comment in src/core/governance.ts say; the hold lands where \"the next
      change\" begins and where its anchors and predicted impact are already recorded, giving `blocks_next`
      and the `unacknowledged-receipt` drift class a reader (a check id with a negative control); the close
      check becomes what 03 Liveness invariant and 11 section 1 already call it, liveness-only, and 15's
      \"close gate\" wording is corrected without adding a sixth gate. Four corrections make the option close
      DI-12 rather than move it: (1) the touched set is the actual impact recomputed at submit (03 Ratchet,
      07) and projected into reports/ of the archive commit (04 Land projection and the projection gate), so
      the order map gains an artifact for it (produced_by gate.submit.ratchet, where git-common-dir; its
      projection produced_by steward.land.archive-commit, where archive-commit; required_by
      gate.frame.receipt-hold) and the hold never reads the plan-time impact-record, whose producer
      steward.plan.route does not run on the patch track, the only track that owes an acknowledgement; (2) the
      check exempts the spike track, because 03 Track signals defines a spike as a question, not a change, and
      the rule holds \"the next change\"; (3) the check runs again at the second `keel land` of a policy-path
      proposal inside land.approval's policy branch, so a policy-path change intaked before the earlier policy
      land, which goes straight to executing with gate:frame never re-run, is held instead of landing unread,
      and 03, 01, 00-vision and org/checkpoints.yaml state that the hold applies at intake and at a
      policy-path land; (4) frame.receipt-hold is a named check outside the unwaivable list of 11 section 1,
      so the fix states that the Board may waive it on a specific held proposal with `--rule override --until
      <date>`, the override-record being listed in that proposal's receipt. No new cycle:
      gate.frame.receipt-hold runs after board.new and requires receipt, receipt-ack-record and the
      actual-impact projection of an earlier proposal, all produced by that proposal's submit, archive commit
      and Board act, never by the proposal being intaked; the land-time re-run requires the same
      earlier-proposal artifacts and nothing the landing proposal produces. No deadlock: the hold is a refusal
      whose release (`keel approve <earlier P> --stage receipt`, or an override on the held proposal) depends
      on nothing the refused proposal does. No unreachable place: the check runs in the local machine and
      reads the trunk commit, the archive commit and the git common dir. No dead field: `blocking: false`
      stays true and `blocks_next` is now read. No mandate conflict: no clause of section 1 or 2 is touched.
      Red edge: the register carries no edge tagged DI-12 and none turns red under the recorded text, because
      the defect is a missing scope, a missing consumer and a missing producer on one track, which the map
      cannot show as a cycle; the correction commit therefore records the defect in this walk and changes the
      map additively: steward.close keeps `receipt` in its requirements (Phase 6 still produces the receipt
      acknowledgement item from receipt.json#policies) and drops only `receipt-ack-record`; the new step
      gate.frame.receipt-hold (doc docs/11-verification.md gate:frame, after board.new, runs_in local) takes
      over receipt-ack-record together with receipt and the new actual-impact artifact, gate.frame.intake and
      gate.frame list it, and gate.land.approval also lists it as an `after` for the policy branch;
      board.approve.receipt stays after steward.land.advance-trunk and steward.land.archive-commit; locks
      unchanged; the `issues` check must stay green before and after. Dependencies: the wording of which lands
      owe an acknowledgement follows DI-10's decision, so the commit lands after DI-10; consumer row \"Single
      writer / board-during-wave\" stays pending on DI-04. From M1a the negative controls are (a) a
      policy-landed proposal whose receipt is unacknowledged computes `closed`, (b) a second patch anchored on
      that change's element is refused at `keel new` with the receipt hold naming the earlier proposal, (c) a
      spike anchored on the same element is not refused, and (d) a policy-path patch intaked before the
      earlier policy land is refused at its second `keel land` until the acknowledgement or an override is
      recorded."
  - id: DI-13
    title: A proposal ADR is accepted by the contract approval but not bound by its hashes
    statement: The L3 row says an ADR is accepted by the contract approval on the system track and that anchor or
      body drift voids the acceptance. The bound-artifacts table binds the contract kind to exactly the frozen
      block, the spec delta and the arch delta, summarized as contract_hash, and the hash rules say the hashes
      cover exactly the listed artifacts. contract_hash never covers the ADR, so the gate check that compares
      every bound artifact's hash cannot see ADR drift, and the acceptance the row promises has no producer.
    status: decided
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: other
    anchors:
      - { file: docs/02-alignment.md, heading: Alignment chain L0–L11 }
      - file: docs/02-alignment.md
        heading: Board approvals (explicit confirmation, hash binding, invalidation)
    class: gap
    blocks: M1b
    walk:
      producers:
        - precondition: 'L3 row: an ADR is "accepted by contract approval (system)"'
          producer:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
          position: before
          sufficient: false
          reason: "board.approve.contract runs after run.frame (which writes decisions/ADR-*.md) and before dispatch and
            land, so the order holds; but the record's artifacts list is intent.md, spec.delta.yaml and
            arch.delta.yaml summarized as contract_hash plus the keel/<P>/main commit, and \"a change to any
            other file ... leaves it valid\". The ADR blob is not listed, the commit field is a location not a
            binding (14: \"the hashes are the whole of the binding\"), so the approval proves nothing about
            the ADR's bytes and a rewritten ADR keeps the approval valid."
        - precondition: 'L3 row: "Anchor or body drift voids acceptance" (decision.schema status and citation
            descriptions say the same)'
          producer: { file: docs/04-trace-and-state.md, heading: RTM and drift classes }
          position: after
          sufficient: false
          reason: 'citation-drift is computed by the trace check, which runs at land.trace, after dispatch has already
            delivered the obligations; it covers symbol citations and anchors only, never the body; and it is
            the eighth row while "the first seven are the classes the trace check fails on", so no gate fails
            on it. Body drift has one partial producer: submit-time recompilation (02 Submit-time
            recompilation; gate submit.freshness) recompiles the brief at submit and at each gate and reports
            stale_contract when a must or must_not obligation changed; it is insufficient for the claim
            because it compares against the brief the seat ACKed, not against the approval, covers the
            obligations section only, not the ADR body, and its consequence is a re-ACK, not invalidation of
            the acceptance. No hash of the ADR body exists outside a --doc record on trunk, which an in-flight
            proposal ADR cannot have (approval.commit is trunk for documents, keel/<P>/main for stages).'
        - precondition: decision.status = accepted ("Accepted only through a contract approval or keel approve --doc"),
            which the archive commit, the adrs projection and the precedence order read
          producer: { file: schemas/decision.schema.json, pointer: "#/properties/status" }
          position: absent
          sufficient: false
          reason: "No step writes the flip. keel approve writes only .keel/approvals/<sha>.<kind>.json and the ledger
            event; the Board never edits an ADR (single-writer table: proposal decisions/ADR-*.md are
            architect content written by the Steward from its result; .keel/decisions/** is written only by
            the land archive commit). Nothing states which process sets status: accepted and date before or at
            promotion. frame.schema validates the enum value present but writes nothing."
        - precondition: 'Phase 5: "accepted ADRs promoted to .keel/decisions/" (04 Land projection: "promotes accepted
            proposal ADRs")'
          producer: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
          position: after
          sufficient: false
          reason: "steward.land.archive-commit comes after board.approve.contract and after the land approval, so the
            order holds, but it needs the set of accepted ADRs and no record or field it can read yields that
            set: the contract record lists no ADR and the frontmatter status is never flipped. It also
            promotes whatever bytes are on keel/<P>/main at land, which may differ from what the Board read at
            contract time."
        - precondition: "L3 row alternative route: accepted by --doc"
          producer:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
          position: before
          sufficient: false
          reason: "The doc kind binds \"the document's normalized blob at the trunk commit\", so an ADR already on trunk
            (the example ADR-7KQ2B, proposal: null) would be hash-bound and body drift would be
            artifact-changed. But the route exists only in the L3 row, the decision schema and the example: 01
            Board powers lists --doc for \"charter, goals and routing\", org/checkpoints.yaml other_approvals
            doc reads \"the diff of the charter, goals or routing\", schemas/approval.schema.json approvalKind
            describes doc as \"charter, goals, routing\", and the single-writer table names the land archive
            commit as the sole writer of .keel/decisions/**, so a governance commit that accepts a decision on
            trunk has no verb-table entry and no writer row. Insufficient today; it also cannot reach an
            in-flight ADR on keel/<P>/main, so it does not repair the contract route."
      consumers:
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          outcome: breaks
          reason: org/checkpoints.yaml prints "on the system track, arch.delta.yaml and the new ADRs with their
            obligations" as reading, but the record that follows the confirmation lists no ADR path, so the
            Board confirms content the record does not bind and the recheck (changed-during-confirmation)
            cannot notice an ADR moved between display and keystroke.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          outcome: changed
          reason: The doc kind binds the document's normalized blob at the trunk commit, which would hash-bind an ADR on
            trunk (the acme-notes example); but 01 Board powers, org/checkpoints.yaml other_approvals and
            approvalKind admit only charter, goals and routing, so a decision has no verb-table entry today.
            The fix extends those three entries and the single-writer row to a decision on trunk, so this
            route gains its entry and its writer.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-during-wave
          waits_for: lock.supervisor
          released_by: steward.run.end
          outcome: unchanged
          reason: The verb waits for the supervisor lock (DI-04's mechanism); the binding gap is identical to the
            terminal case and is not affected by the lock.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: supervisor
          outcome: breaks
          reason: Before dispatch the Steward checks the current content against the record (02 flow step 4); the ADR is
            not bound, so an ADR rewritten after the contract approval passes, and steward.run.compile-brief
            delivers its revised must and must_not obligations into the brief and the ACK id set at precedence
            rank 3 ("accepted ADR obligation") without any Board view.
        - anchor: { file: docs/11-verification.md, heading: gate:submit }
          actor: supervisor
          outcome: unchanged
          reason: "Recompiles the brief at submit and at each gate and fails on stale_contract when a must or must_not
            obligation changed since the ACK; it is keyed on the brief's section input hashes, not on
            acceptance, so it neither reads nor needs the ADR's approval state and reads the same before and
            after the fix. It cannot substitute for the binding: it compares against the ACKed brief, covers
            the obligations section only, and its consequence is a re-ACK."
        - anchor: { file: docs/11-verification.md, heading: gate:submit }
          actor: supervisor
          outcome: breaks
          reason: Runs the cheap check commands of ADR obligations whose acceptance no record proves; a proposed,
            revised or drifted ADR is checked exactly like an accepted one because no status filter and no
            hash comparison exists.
        - anchor: { file: docs/11-verification.md, heading: gate:verify }
          actor: board-at-terminal
          outcome: breaks
          reason: Same as submit.obligations-cheap for the full check commands; keel check --gate verify runs locally
            and reads the ADR from keel/<P>/main as it is now, not as approved.
        - anchor: { file: docs/11-verification.md, heading: gate:land }
          actor: board-at-terminal
          outcome: breaks
          reason: land.trace fails on "the first seven" drift classes; citation-drift is the eighth, so an ADR whose
            anchors no longer match the code lands and is promoted. "Voids acceptance" has no gate that reads
            it.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          outcome: breaks
          reason: steward.land.archive-commit must promote "accepted ADRs" but no record or field tells it which ADRs
            are accepted, and it promotes the bytes present at land, which no hash ties to what the Board read
            at contract time.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          outcome: breaks
          reason: 'keel trace can report citation-drift with the consequence "acceptance is void until re-accepted", but
            no verb re-accepts: the amendment ledger covers only the frozen block and ACC, and --doc admits
            only charter, goals and routing.'
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          outcome: breaks
          reason: Lists "approvals whose bound content has changed"; with the ADR unbound an ADR edit after contract
            approval is invisible here, although the L3 row promises the acceptance is void.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          outcome: breaks
          reason: The auditor reports unapproved, invalidated, expired and stale items; a void ADR acceptance is none of
            these because no record marks the acceptance, so audit.sweep cannot list it.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: seat
          outcome: breaks
          reason: "The pull channel renders the same compiled brief as dispatch: in-scope ADR obligations are taken from
            the proposal branch at the approved commit with no proof that the ADR is the accepted one."
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: seat
          outcome: holds
          reason: Typed arch ops land in arch.delta.yaml, which is inside contract_hash; the architecture side of the
            system-track contract is bound. Only the ADR beside it is not.
        - anchor: { file: docs/11-verification.md, heading: gate:frame }
          actor: board-at-terminal
          outcome: unchanged
          reason: Covers governance documents and the policy-path request only; it never reads a proposal ADR, before or
            after the fix.
        - anchor: { file: docs/11-verification.md, heading: gate:frame }
          actor: board-at-terminal
          outcome: unchanged
          reason: frame.schema validates the ADR frontmatter (including the status enum) against decision.schema.json
            and frame.id-unique checks that ADR ids do not collide; both read the file's shape, not its
            acceptance, and read the same after the fix (M1a, runs_in local).
        - anchor: { file: docs/11-verification.md, heading: gate:plan }
          actor: board-at-terminal
          outcome: unchanged
          reason: Compiles every task brief within its byte budget and never truncates must and must_not obligations; it
            reads the ADR's obligations at the approved commit but neither checks nor changes acceptance,
            before or after the fix (M1a, runs_in local).
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: ci-fresh-clone
          outcome: unchanged
          reason: The clone reaches trunk and archive commits, where the promoted ADR and the contract record now sit;
