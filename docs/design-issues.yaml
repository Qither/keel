      - name: red/green proof
        uses:
          - anchor: { file: docs/00-vision.md, heading: Verification }
            meaning: a cited scenario or independently fixed test fails at the base commit and passes at the change commit
            demands: an independently fixed test as one of two sources
          - anchor: { file: docs/11-verification.md, heading: 3. Test independence and red/green proof }
            meaning: "verify.red-green on policy lands: the runner executes the cited acceptance at base and at the change
