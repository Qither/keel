    terms:
      - name: archive commit
        uses:
          - anchor: { file: docs/11-verification.md, heading: gate:land }
            meaning: a commit that exists while gate:land runs, i.e. before the receipt draft and before the land approval
            demands: existence before the gate on both land runs; the definition provides a commit written only after the
