          - anchor: { file: docs/02-alignment.md, heading: "Precedence order, decision boundaries and rulings" }
            meaning: "\"Seat rulings\": a seat's recorded decision inside its decision boundaries, keel api rule {clause,
              what, why, cost_if_wrong, reversible}, an RL-<sha12> record and a ruling.made event, flagged
