            - land.approval on the policy path (11 gate:land)
            - quick-patch requires.red_green_proof
            - schemas/policy.schema.json#/$defs/requirements/properties/red_green_proof (description)
            - "schemas/evidence.schema.json#/$defs/redGreen (description and `cited`: scenarios, or tests
              fixed first by a different-family test task)"
            - 15-roadmap M3 exit 'A policy land without red/green proof is refused'
            - 11 section 8 negative control 'A policy land whose cited scenario already passed at base'
