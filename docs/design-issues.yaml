          provides: what every explanation of a move needs; no change
      - name: supervising Steward process
        uses:
          - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
            meaning: the keel run process that spawned the seat (keel run --wave supervises every run of a wave); it alone
              appends while the seat runs
            demands: existence during the run; provided
          - anchor: { file: docs/05-vcs.md, heading: Detection (the guarantee) }
            meaning: the process whose own appends explain an anchor move, at ingest and at land
            demands: existence at land; not provided, the process ended at steward.run.end
        kept:
          meaning: "unchanged: the keel run process that holds the supervisor lock while its seat runs"
          provides: the ingest-time explanation; the land clause's subject becomes "the diffing process", which at land
