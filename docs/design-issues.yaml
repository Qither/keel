          provides: one row that covers both places, so the land record's commit needs no new term and land.trace's 'one
            of the three Steward commit kinds' admits it by the text
    options:
      - "Option 1: keel approve --stage land commits the land record itself in a governance-style commit on
        keel/<P>/main, exactly as contract, plan and request records and rulings are committed, and the
        archive commit renders the Land approval section of receipt.md from that committed record and names it
        in Keel-Approval."
      - "Option 2: keep the land record in the archive commit and let the second keel land accept it from the
        uncommitted .keel/approvals/ file together with its approval.recorded event, as a stated exception to
        'the record exists in git at the expected place'."
      - "Option 3: move the archive commit into keel approve --stage land, so the confirming process writes
        the record and the archive commit together and keel land's second run only checks ancestry and
        advances trunk."
      - "Option 4: let the second keel land write the archive commit containing the record first, verify the
        record from that commit, and CAS the proposal branch back on failure."
    recommendation: "Option 1. It is the only option that restores both halves of the recording sentence at once:
      the keel approve process commits the record as soon as it is written (it already does so for the other
      proposal-scoped kinds through a temporary index and commit-tree with a CAS ref update, no checkout
      needed), and the record then exists in git at its expected place before the second keel land, keel check
      --gate land, doctor, audit and a re-run after a crash read it. The archive commit keeps every duty the
      glossary gives it and still carries the record (its parent chain includes the record commit) with the
      Keel-Approval trailer, so CI, a second machine and the trace read exactly what they read today, and the
      record commit touches only .keel/approvals/**, which the source tree hash excludes, so no evidence is
      invalidated. The closing commit changes, together with their zh-CN mirrors: 02 Recording and Checking at
      the gates (expected place: trunk or keel/<P>/main; the land record listed with the other proposal-scoped
      kinds); 04 Declared plane write rule (the land record on keel/<P>/main with the contract, plan and
      request records and rulings, reaching trunk with the archive commit); 04 Land projection (the archive
      commit renders the Land approval section from the committed record); 04 Steward commits and trailers,
      Governance commit row (Where: trunk for a document, policy or receipt record, keel/<P>/main for a
      proposal's approval records, made by keel approve), so the term's home and the widened glossary row
      agree and land.trace's 'one of the three Steward commit kinds' admits the record commit by the text; 12
      land and approve --stage land; 03 Phase 5 Land; 13 Target project layout row;
      templates/project/approvals/README.md What lands here; 00 Glossary (governance commit widened, receipt
      draft added, home 03); 17 an adopted-by-recommendation row (where a land approval record is committed);
      test/README.md Negative controls (a land record present only in the working tree with its event but no
      commit is missing-approval; the committed one is found before the archive commit). Order map, exactly as
      scripts/validate.mjs --only issues resolves it: artifacts.land-approval-record produced_by
      steward.land.archive-commit -> board.approve.land, where archive-commit -> proposal-branch, DI-02 tag
      removed; required_by drops ci.check-approval (it reads the record through the already-required
      archive-commit at trunk-commit, the map's convention for contract-approval-record) and drops gate.land,
      because the check builds the edge producer -> each required_by step and the map already has gate.land ->
      steward.land.draft-receipt -> board.approve.land, so keeping gate.land would create a new untagged cycle
      gate.land -> steward.land.draft-receipt -> board.approve.land -> gate.land (reproduced on a scratch
      copy); the first-run aggregate gate never reads the land record, and the second run's read is
      gate.land.approval, already after board.approve.land. With both drops the check passes (19/19
      consistent). steward.land.archive-commit keeps board.approve.land and steward.land.check-approval in its
      after list and now produces only archive-commit, receipt and series-point; no step, lock or edge is
      added; the red edge disappears because the producer already precedes steward.land.check-approval and
      gate.land.approval; the DI-03, DI-19 and DI-16 tags stay. It creates no deadlock (no lock is added or
      re-scoped), no unreachable place (every reader of the record before land runs local; ci.check-approval
      reads it through the archive commit at the trunk tip, which it already requires), no dead field (every
      landBinding field keeps its readers, land.families now with 11 section 5 and the type-only src comments
      listed) and no mandate conflict (clause 6, D6 and KP-03 name no commit and records stay committed,
      earlier than before). Closure evidence per 5.3 step 8: the issues check passing with the DI-02 tag
      removed (M0) and, from M1b, the negative control above; regression cells {patch, feature, system} x
      {board-at-terminal, crashed-supervisor} x second-land, and {feature, ci-fresh-clone, ci-check-at-tip}.
      Option 2 breaks the uniform 'exists in git' rule and the seat-proof argument's shape; Option 3 makes the
      projection gate refuse inside the approve verb after the Board has confirmed and rewrites the land
      verb's counted modes; Option 4 writes before it verifies, against fail-closed."
    decision:
      by: recommendation
      date: 2026-09-27
      option: "Option 1: keel approve --stage land commits the land record in a governance-style commit on
        keel/<P>/main; the archive commit carries it"
      recorded_in: [ docs/02-alignment.md, docs/12-cli-api-mcp.md ]

  - id: DI-03
    title: The recommended CI approval check needs a ledger event that a fresh clone never has
    statement: >-
      The branch-protection recommendation has CI run the land gate's approval check at the trunk tip. That
      gate accepts an approval only together with an approval.recorded event on the verified ledger chain. The
      ledger lives in the git common dir and refs/keel is never pushed, so a fresh CI clone cannot satisfy the
      condition; the CI check and the local gate need to be two different checks.
    status: decided
    found_by: external-review
    found_on: 2026-09-26
    root_cause: rule-tightened
    anchors:
      - { file: docs/14-trust-security.md, heading: "Server-side branch protection recommendations" }
      - file: docs/02-alignment.md
        heading: "Board approvals (explicit confirmation, hash binding, invalidation)"
      - { file: docs/04-trace-and-state.md, heading: "Single writer" }
    class: cycle
    blocks: M1b
    walk:
      producers:
        - precondition: the land approval record exists in git at the expected place (the archive commit) and validates
            against the schema
          producer: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
          position: before
          sufficient: true
          reason: steward.land.archive-commit runs before steward.land.advance-trunk and board.push, and
            ci.check-approval is after board.push; the archive commit is the new trunk tip, which a clone
            fetches. The record's place on the local side is DI-02's cycle; for the clone the record is
            reachable once it is on trunk, whichever way DI-02 puts it there.
        - precondition: the record's approval.recorded event is on the verified ledger chain
          producer:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
          position: absent
          sufficient: false
          reason: "ledger.append writes <git-common-dir>/keel/ledger/<yyyy-mm>.jsonl on the owner's clone; nothing
            pushes it (pushing is a reserved action, 05 'Three land cases'; 04: the ledger is local to one
            machine in v1). In the clone the producer has no output at all: the precondition is not late, it
            is unsatisfiable."
        - precondition: the verified ledger chain itself, and the record's ledger_chain_head on it
          producer: { file: docs/04-trace-and-state.md, heading: Single writer }
          position: absent
          sufficient: false
          reason: ledger.verify-chain needs ledger-event (git-common-dir) and ledger-anchor (refs-keel); the matrix
            actor ci-fresh-clone is defined as having neither, and 14 recommendation 4 tells the forge to
            reject pushes of refs/keel/*. 'Verified' is bounded to the machine holding the anchor.
        - precondition: "every bound artifact's current normalized hash equals the recorded one (for the land kind:
            land.receipt_draft over the receipt draft)"
          producer: { file: docs/04-trace-and-state.md, heading: Land projection and the projection gate }
          position: before
          sufficient: false
          reason: "The draft the record hashes lives in the git common dir (receipt-draft, where: git-common-dir),
            unreachable from a clone; what the clone can hash is the projected receipt.md at the archive
            commit. The template header, 13 'Templates' and 'Examples' rows and test/README.md already fix the
            convention that the hashed draft is everything above the '## Land approval' section, which the
            archive commit renders from the land record; 02 (bound artifacts, kind land) and 04 do not yet say
            that land.receipt_draft covers exactly that region, so as written the content check has no stated
            byte range to re-hash from a clone. The fix states the range; it does not move the section."
        - precondition: kind, stage and subject match what the gate requires
          producer:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
          position: before
          sufficient: true
          reason: board.approve.land writes the fields into the record; they travel with it to the archive commit and
            are readable at any commit with --at.
        - precondition: no amendment has superseded the record, and an override or policy it depends on has not expired
            (the fifth condition of 02 'Checking at the gates')
          producer: { file: docs/02-alignment.md, heading: Amendment ledger }
          position: before
          sufficient: false
          reason: "Locally every record is reachable and the condition is checkable. From a clone the amendment-record
            and override-record live on keel/<P>/main (where: proposal-branch, not reachable from clone) and
            their copies under .keel/archive/ are projections that 04 and 14 forbid as input; only
            policy-approval-record (trunk-commit) is reachable. The content check therefore cannot evaluate
            supersession or override expiry at a tip; the fix must say so explicitly (the check names the
            condition as not evaluated on a clone, never as pass) instead of silently dropping it."
        - precondition: "on a policy land: an approved land policy plus an approved request plus the red/green proof
            (the land.approval alternative)"
          producer: { file: docs/11-verification.md, heading: 2. Source-state binding and land re-execution }
          position: before
          sufficient: false
          reason: "The policy record (trunk-commit) is reachable from a clone; the request record is on keel/<P>/main
            (request-approval-record, where: proposal-branch, not reachable from clone) and the red/green
            proof is evidence in the git common dir whose projection under .keel/archive/ is history that 04
            and 14 forbid using as input. A clone can check the records the tip commit itself adds against
            content, never the request record or the proof; the order map must not gain an edge from
            ci.check-approval to request-approval-record, which would be a new unreachable place."
      consumers:
        - anchor: { file: docs/14-trust-security.md, heading: Server-side branch protection recommendations }
          actor: ci-fresh-clone
          waits_for: approval.recorded on a verified chain in a git common dir the clone does not have
          released_by: "nothing in the clone: the ledger is never pushed and recommendation 4 rejects refs/keel/* on the
            forge"
          outcome: breaks
          reason: The verb-and-mode table lists check as report-only and 11 says --at evaluates against a past commit,
            but the check the item names (land.approval) requires the approval.recorded event on the verified
            chain; the clone has no ledger and no refs/keel, so the check can only fail by name (event absent)
            at every trunk tip, and a required status check that always fails is no check. This is the
            register's tagged red edge; the bare id 'approval' also resolves to no check (ids are
            <gate>.<name>).
        - anchor: { file: docs/design-issues.yaml, pointer: "#/matrix/sequences/11" }
          actor: ci-fresh-clone
          waits_for: the same event as item 5
          released_by: nothing in the clone
          outcome: changed
          reason: The sequence ci-check-at-tip lists the verb 'check --gate land --check approval --at <sha>'; the
            correcting commit renames it to --check land.approval-content, otherwise every regression cell of
            the sequence (all four tracks, seven actors) names a check that no longer exists.
        - anchor: { file: docs/11-verification.md, heading: gate:land }
          actor: board-at-terminal
          waits_for: approval.recorded appended by the keel approve process
          released_by: ledger.append in that process, then ledger.anchor-update
          outcome: holds
          reason: keel check --gate land on the owner's clone reads the record from git, the event from the ledger and
            the anchor from refs/keel; every condition is checkable and the failing one is reported by name.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: the land approval record and its approval.recorded event
          released_by: board.approve.land (record) and its ledger.append (event)
          outcome: holds
          reason: steward.land.check-approval runs locally with the ledger and anchor reachable; the place of the land
            record it reads is DI-02's cycle, not this one.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          outcome: holds
          reason: --preview stops before the approval check; it consumes nothing the rule requires.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: approval.recorded in the local ledger
          released_by: ledger.append in the keel approve process
          outcome: holds
          reason: keel status derives land_pending -> landed from approval and land events in the local ledger
            (board.status requires ledger-event); it reads the event only where the chain is, and on a second
            machine it has no ledger and reports so (KP-12). The fix touches nothing it reads.
        - anchor:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
          actor: board-at-terminal
          waits_for: the supervisor lock while a seat runs
          released_by: steward.run.end (DI-04 covers the hold and abandon cases)
          outcome: holds
          reason: approve --stage land is the producer of both the record and the event on the owner's clone; the rule
            as stated there is internally consistent and is the wording the fix keeps, adding only which
            conditions the content check runs alone.
        - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
          actor: board-during-wave
          waits_for: lock.supervisor
          released_by: steward.run.end
          outcome: holds
          reason: The approval is recorded once the window ends and its event is then on the verified chain locally; the
            wait itself is DI-04's subject, not DI-03's.
        - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
          actor: supervisor
          waits_for: the end of the seat's process tree
          released_by: steward.run.end
          outcome: holds
          reason: "steward.run.ingest is in approval-recorded-event.required_by: it reads the event only to reject one
            appended by a seat during the window. It runs on the owner's clone with the ledger reachable; the
            CI check never runs in a window."
        - anchor: { file: docs/11-verification.md, heading: gate:frame }
          actor: supervisor
          outcome: holds
          reason: run (dispatch) and run --dry-run resolve approved routing and document approvals on the owner's clone
            where the ledger is reachable; the negative control 'record dropped without an event is ignored'
            stays pinned.
        - anchor: { file: docs/03-lifecycle.md, heading: Phase 2 Plan }
          actor: board-at-terminal
          outcome: holds
          reason: gate.plan runs_in local after board.approve.contract and run.plan; it reads the contract approval's
            event from the local ledger, never from a clone. Listed because the order map names it as a reader
            of the event.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          outcome: holds
          reason: audit reads the whole local chain and the recorded chain heads; it is the reader of ledger_chain_head
            and runs only where the chain is.
        - anchor: { file: docs/14-trust-security.md, heading: Approvals and the single writer }
          actor: second-machine
          outcome: holds
          reason: On a clone every committed record is 'without event' because there is no ledger; the report is honest
            (KP-16) but only meaningful on the recording machine. The fix leaves it unchanged; the CI check is
            a different check, not doctor.
        - anchor: { file: docs/08-dashboard.md, heading: "One model, many renderers" }
          actor: dashboard
          outcome: holds
          reason: The dashboard is built on the owner's clone (dashboard.build requires ledger-event, runs_in local); it
            shows approval state from the ledger, and on another machine 14 'Untrusted data' limits
            projections and slices to display.
        - anchor: { file: docs/11-verification.md, heading: gate:land }
          actor: board-at-terminal
          outcome: holds
          reason: The trace check walks back to approved requirements using local records and events; it never runs in
            the clone under the recommendation (the invocation filters to one check).
        - anchor: { file: docs/adr/ADR-0005-explicit-confirmation-approvals.md, heading: What keel does not claim }
          actor: ci-fresh-clone
          outcome: holds
          reason: The ADR already states what a clone can and cannot do; it is 14 item 5 that asks the clone for more.
            The fix restates the ADR's limit next to the CI check rather than flipping it.
        - anchor: { file: docs/17-open-decisions.md, heading: Multi-machine collaboration }
          actor: second-machine
          outcome: holds
          reason: "The open decision stays open: a content-only CI check reads committed records and projections,
            exactly what the entry says other machines see, and settles nothing about a shared ledger."
        - anchor: { file: docs/15-roadmap.md, heading: "M1b Approvals, policies and trace" }
          actor: board-at-terminal
          outcome: holds
          reason: The criterion is proven on the owner's clone; the fix adds a clone-side criterion beside it rather
            than weakening it.
        - anchor: { file: docs/05-vcs.md, heading: Three land cases }
          actor: board-at-terminal
          outcome: holds
          reason: The Board pushes after keel land regardless of what CI checks; the link to 14 points at the
            recommendation list as a whole.
        - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
          actor: crashed-supervisor
          waits_for: the approval.recorded event, and lock.ledger-writer if held
          released_by: undefined for the lock (DI-05); a fresh keel approve for the record
          outcome: pending
          reason: A keel approve process that dies after committing the record and before appending the event leaves a
            record without an event and, if it held ledger.lock, a lock nothing releases (DI-05). Locally the
            gate refuses the record by name and doctor lists it, so the Board approves again; in a clone the
            same record is indistinguishable from a backed one, which is why the CI check must claim
            consistency, never authority.
      places:
        - artifact: approval-recorded-event
          where: git-common-dir
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: ledger-event
          where: git-common-dir
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: ledger-anchor
          where: refs-keel
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: receipt-draft
          where: git-common-dir
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: evidence-file
          where: git-common-dir
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: land-approval-record
          where: archive-commit
          reachable_from: [ local, supervisor, agent-api, clone ]
        - artifact: receipt
          where: archive-commit
          reachable_from: [ local, supervisor, agent-api, clone ]
        - artifact: archive-commit
          where: trunk-commit
          reachable_from: [ local, supervisor, agent-api, clone ]
        - artifact: trunk-tip
          where: trunk-commit
          reachable_from: [ local, supervisor, agent-api, clone ]
        - artifact: policy-approval-record
          where: trunk-commit
          reachable_from: [ local, supervisor, agent-api, clone ]
        - artifact: document-approval-record
          where: trunk-commit
          reachable_from: [ local, supervisor, agent-api, clone ]
        - artifact: receipt-ack-record
          where: trunk-commit
          reachable_from: [ local, supervisor, agent-api, clone ]
        - artifact: request-approval-record
          where: proposal-branch
          reachable_from: [ local, supervisor, seat, agent-api ]
        - artifact: amendment-record
          where: proposal-branch
          reachable_from: [ local, supervisor, seat, agent-api ]
        - artifact: override-record
          where: proposal-branch
          reachable_from: [ local, supervisor, seat, agent-api ]
      readers:
        - field: ledger event type approval.recorded
