    terms:
      - name: declared model
        uses:
          - anchor: { file: docs/07-architecture-intelligence.md, heading: Declared model }
            meaning: "the committed L4 architecture contract at the trunk commit: model.yaml, rules.yaml, baseline.json"
            demands: a single hash-anchored base that deltas are written against and that CI, a second machine and the
              dashboard read
          - anchor: { file: docs/07-architecture-intelligence.md, heading: Drift and the unknown policy }
            meaning: the model a round of an in-flight proposal is judged against
            demands: a model that already contains what the contract approval of that proposal declared, otherwise a
              correct implementation is 'new drift'
          - anchor: { file: docs/02-alignment.md, heading: Alignment chain L0–L11 }
            meaning: the contract the architect changes and the gate enforces, in one row
            demands: "both meanings at once: the base written only at land and the target the gate enforces during the
              proposal"
          - anchor: { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
            meaning: the model the preview drift uses on the combined tips
            demands: the target model of the proposal being integrated, since the archive commit that applies the delta
              comes after the preview and the sparse verify checkout carries no proposal files
          - anchor: { file: docs/04-trace-and-state.md, heading: RTM and drift classes }
            meaning: the model whose path mapping decides which elements the covering commits touch
            demands: a model that holds the elements the approved delta adds, otherwise every add-element proposal fails
              land.trace
          - anchor: { file: docs/07-architecture-intelligence.md, heading: Search }
            meaning: the model hits, impact and the element page are mapped on inside a proposal
            demands: the target model when the caller is inside a proposal, the trunk model otherwise, and a label saying
              which
          - anchor: { file: docs/08-dashboard.md, heading: Architecture }
            meaning: the committed model rendered
            demands: the trunk meaning only for the base picture; the drift overlay of an in-flight proposal needs the
              target model and a label
        kept:
          meaning: the committed .keel/arch/ (model.yaml, rules.yaml, baseline.json) at a trunk commit, changed only by
            the land archive commit
          provides: a base every delta names by sha256, the model CI and a fresh clone see, and the model the dashboard
            renders as its base picture; it does not provide the relations or elements an in-flight proposal
            was approved to add
        renamed:
          - meaning: "the declared model of a trunk commit with one proposal's arch.delta.yaml applied in memory by the
              Steward: at frame computed from the delta as written on the proposal branch, from contract
              approval onward recomputed from the approved blob that contract_hash binds; refused
              (fail-closed, never pass) when the delta's base hashes no longer match trunk, which an amendment
              and a fresh contract approval repair; equal to the trunk model for a proposal without a delta;
              never committed"
            new_name: target model
      - name: to-be model
        uses:
          - anchor: { file: docs/11-verification.md, heading: gate:frame }
            meaning: the model that results from applying the proposal's delta, checked at frame
            demands: a producer that computes it deterministically from the written delta; none is named
          - anchor: { file: skills/keel-design/SKILL.md, heading: "keel-design: architect seat procedure" }
            meaning: the same resulting model, checked by the architect seat by hand
            demands: a read-only way for the seat to see it (keel arch plan or keel_arch)
        kept:
          meaning: "none: the term is folded into 'target model'"
          provides: the frame-stage use and the verify-stage use name one computation, so one glossary row and one
            producer (steward.arch.target) serve both; the check id frame.arch-to-be stays, its Verifies text
            names the target model computed from the delta as written
        renamed:
          - { meaning: the resulting model checked at frame, new_name: target model }
      - name: arch delta
        uses:
          - anchor: { file: docs/07-architecture-intelligence.md, heading: Declared model }
            meaning: the typed ops file of a system proposal, applied at land
            demands: a deterministic application with base-hash refusal
          - anchor: { file: docs/02-alignment.md, heading: Alignment chain L0–L11 }
            meaning: a Board-bound blob of the contract
            demands: that the bytes the Board approved are the bytes applied, at land and, after the fix, at every
              in-proposal judgement
          - anchor: { file: schemas/arch-delta.schema.json, pointer: "#/properties/base" }
            meaning: ops against a named base (model_sha256, rules_sha256, baseline_sha256)
            demands: a reader that refuses when trunk moved; today only the archive commit reads it
          - anchor: { file: docs/04-trace-and-state.md, heading: Declared plane }
            meaning: a file that no seat worktree and no verify checkout carries
            demands: that whoever computes the target model reads the delta from the proposal branch, not from a checkout;
              the Steward (local or supervisor) does, and agent-api processes read the cached result
        kept:
          meaning: "the per-proposal arch.delta.yaml on the proposal branch: typed ops against base hashes, bound into
            contract_hash on the system track"
          provides: the deterministic function from the trunk model to the target model; the fix adds readers
            (steward.arch.target at frame, plan, submit, verify, preview, land.trace and brief compilation)
            without changing the artifact
      - name: new error (new violation)
        uses:
          - anchor: { file: docs/11-verification.md, heading: gate:verify }
            meaning: an error-severity drift not in the baseline
            demands: "'new' relative to what the Board approved for this proposal, not relative to the previous land"
          - anchor: { file: docs/07-architecture-intelligence.md, heading: Drift and the unknown policy }
            meaning: the same, defined against the declared model plus baseline
            demands: the target model as the reference
        kept:
          meaning: an error-severity drift class present in the drift report of the judged commit against the proposal's
            target model and absent from the baseline; when the target model is refused the report has no
            reference and verify.arch, frame.arch-to-be and the preview return a fail-closed status (fail, or
            unknown under the unknown policy), never pass
          provides: one definition for verify.arch, the preview and keel arch drift; the baseline keeps its meaning
            (known violations) and is not used to carry approved-pending relations
      - name: baseline
        uses:
          - anchor: { file: docs/07-architecture-intelligence.md, heading: Declared model }
            meaning: known violations frozen when a rule is introduced
            demands: that it lists violations, never approved intent
          - anchor: { file: docs/00-vision.md, heading: Glossary }
            meaning: the same
            demands: the same
        kept:
          meaning: frozen known violations of rules.yaml, part of the target model when a baseline-grow or
            baseline-shrink op is in the delta
          provides: a reason to reject option 3 (parking approved relations in the baseline would give the term a second
            meaning)
      - name: at land
        uses:
          - anchor: { file: docs/04-trace-and-state.md, heading: Declared plane }
            meaning: the archive commit is the single writer of the committed model
            demands: that no fix moves the write earlier
          - anchor: { file: docs/adr/ADR-0007-declared-vs-derived-architecture.md, heading: Decision }
            meaning: the same decision, adopted by recommendation
            demands: the same; kept true by the recommended option
        kept:
          meaning: the committed model changes only in the land archive commit
          provides: the reason the fix introduces a derived, uncommitted target model instead of an early write;
            ADR-0007 is amended in place, not flipped
      - name: realizing element (realized_in)
        uses:
          - anchor: { file: docs/11-verification.md, heading: gate:frame }
            meaning: element refs on a requirement that the frame gate resolves (the map places gate.frame.ears in
              arch-model.required_by)
            demands: a model that holds the elements the same proposal's delta adds, since the requirement and the delta
              are written by the same run.frame
          - anchor: { file: docs/04-trace-and-state.md, heading: RTM and drift classes }
            meaning: the elements the covering commits' paths map to, compared with the declared refs
            demands: path mapping through the target model, otherwise an approved add-element always mismatches
        kept:
          meaning: the element ids a requirement declares it is realized in; resolved and compared against the target
            model of the requirement's own proposal, the trunk model for a requirement already on trunk
          provides: frame.ears and land.trace agree with the contract on add-element; the trace drift class keeps its
            name and its 'shared with architecture drift' consequence
    options:
      - "Option 1, target model: define the target model as the trunk declared model with the proposal's
        arch.delta.yaml applied in memory by the Steward (at frame from the delta as written on the proposal
        branch, from contract approval onward from the approved blob; equal to the trunk model when the
        proposal has no delta; refused fail-closed when the delta's base hashes no longer match trunk, which
        an amendment and a fresh contract approval repair), and make it the model that frame.ears,
        frame.arch-to-be, plan routing and impact, submit.ratchet, verify.arch, keel arch find, impact, drift
        and render inside a proposal, the preview drift on the combined tips, land.trace's
        realization-mismatch, the element brief, the element page and the dashboard's in-flight drift overlay
        use, while the committed model still changes only in the land archive commit."
      - "Option 2, apply early: write the approved arch delta to trunk in a Steward governance-style commit at
        contract approval so that the committed model already contains it at verify; this flips ADR-0007
        decision 1 and the 04 write rule, leaves relations on trunk for code that may never land, and needs a
        reverse delta on abandonment."
      - "Option 3, baseline at frame: have the frame gate convert every approved add-relation and add-element
        into proposal-scoped baseline entries so that verify.arch sees no new error; this gives 'baseline' a
        second meaning (approved intent next to known violations), grows the baseline on every system change,
        hides the rule proof KP-12 asks the report to show, and does nothing for land.trace's
        realization-mismatch or for path mapping of an added element."
      - "Option 4, keep as written: require keel approve <P> --rule override on verify.arch, the preview and
        land.trace for every system change that adds a trusted-edge dependency or a new element; this is a
        fourth Board confirmation on system against the measure of 3, records the rules as waived instead of
        proven, and leaves the seat, the brief, the impact record and the RTM looking at a model that
        contradicts the contract."
    recommendation: "Option 1. It removes the backward edge at its source: the consumers that today require the
      artifact produced by steward.land.apply-arch-delta (gate.frame.ears, gate.frame.arch-to-be,
      steward.plan.route and gate.plan, gate.submit.ratchet, gate.verify.arch, arch.find, arch.drift and the
      impact and render modes inside a proposal, steward.land.preview, gate.land.trace,
      steward.run.compile-brief, seat.arch-query, dashboard.build for the in-flight drift overlay) instead
      require a target model produced by a new step steward.arch.target that runs after run.frame (the delta
      exists on the proposal branch) and whose inputs, the trunk model and the delta, both precede every
      consumer; the committed model keeps its single writer, so ADR-0007 and the 04 write rule stay true and
      no recorded decision flips. The Steward reads the delta from the proposal branch keel/<P>/main, never
      from a task or verify checkout, because those are sparse and exclude /.keel/proposals/; at frame the
      target model is computed from the delta as written, from contract approval onward it is recomputed from
      the approved blob that contract_hash binds, so the glossary row says 'the proposal's arch delta
      (contract-bound once approved)' rather than 'contract-bound' alone. Refusal is fail-closed: when the
      delta's base hashes no longer match trunk, frame.arch-to-be, verify.arch and the preview return fail (or
      unknown under the unknown policy), never pass, and the release is the existing path
      steward.derive-amendment then board.approve.contract. It creates no new cycle (the new step has no edge
      back to land), no deadlock (no lock or wait is introduced; the base-hash refusal is the land refusal
      moved earlier, released by an existing path), no unreachable place (the target model is computed by
      local and supervisor processes from the trunk commit and the proposal branch and cached under the git
      common dir, which agent-api processes reach for keel_arch and keel api context; seats reach it only
      through those processes, as they reach the element brief today), no dead field (frame.arch-to-be's
      'to-be model' gains its producer; arch-delta.base.* gains readers; the drift, impact and trace reports
      gain a judged_against stamp { model_sha256, rules_sha256, proposal } that verify.arch, land.trace, the
      receipt and the dashboard overlay read) and no mandate conflict (KP-12 is strengthened: every report
      says which model it proved the rules against, and the lens and the deterministic check now agree, which
      KP-04 and KP-10 require). It restores the system-track count to 3 confirmations. Documents in the
      correction commit: 07 'Declared model' (target model defined, refusal fail-closed), 07 'Drift and the
      unknown policy' (drift and new error judged against the target model, judged_against stamp), 07 'Impact
      and the ratchet' (the phase table names the target model in the Frame, Design, Plan, Build, Submit,
      Verify and Land rows; Submit: actual impact and the ratchet computed on the target model), 07 'Search'
      (keel arch find and keel_arch inside a proposal map hits on the target model and label it), 11
      'gate:frame' (frame.ears resolves realized_in refs and frame.arch-to-be checks rules against the target
      model computed from the written delta), 11 'gate:verify' (verify.arch against the proposal's target
      model; refused target model fails closed), 11 'gate:land' (land.trace's realization-mismatch maps
      covering commits through the target model), 04 'RTM and drift classes' (the realization-mismatch row
      names the proposal's target model), 03 'Track signals and the upward-only ratchet (including the
      no-index fallback)' (actual impact and predicted-vs-actual on the target model), 03 'Phase 4 Verify', 06
      'Integration queue and land re-run' (preview drift against the target model, delta read from the
      proposal branch), 02 'Alignment chain L0–L11' L4 row, 00 'Glossary' (row target model | 目标模型, home 07;
      'to-be model' not added), ADR-0007 'Decision' item 1 amended in place, skills/keel-design/SKILL.md step
      6, schemas/arch-report.schema.json judged_against, and every zh-CN mirror in the same commit (D5). Order
      map: add step steward.arch.target (doc 07 'Declared model', after [run.frame], runs_in local) and
      artifact arch-target-model (doc 07 'Declared model', produced_by steward.arch.target, where
      git-common-dir, required_by [gate.frame.ears, gate.frame.arch-to-be, gate.frame, gate.plan,
      steward.plan.route, gate.submit, gate.submit.ratchet, gate.verify, gate.verify.arch, arch.find,
      arch.drift, steward.land.preview, gate.land, gate.land.trace, steward.run.compile-brief,
      seat.arch-query, dashboard.build]); re-point instead of prune: every one of those steps leaves
      arch-model.required_by and arch-baseline.required_by for arch-target-model.required_by, and only the
      reads that are genuinely of the previous land's committed model (board.new, steward.land.draft-receipt,
      board.approve.contract as the base the delta names, steward.land.archive-commit) stay cross-instance or
      on arch-model, so that arch-model.required_by is [steward.land.archive-commit] plus those base reads and
      arch-baseline.required_by is [steward.land.archive-commit, board.approve.contract]; add
      steward.arch.target to arch-delta.required_by and to spec-delta.required_by (realized_in refs). Red
      before green: the DI-07 tags on order.artifacts arch-model and arch-baseline stay in place, reproducing
      the edge, until that one correction commit adds the step and the artifact, re-points the consumers and
      removes both tags; the issues check must then pass with no tag, and from M4 the closure evidence in
      test/ is the three-way negative control: a seeded add-relation in an approved delta implemented with
      tree-sitter edges passes verify.arch and the preview; the same edge without the delta fails with
      tree-sitter provenance; a seeded add-element with a requirement realized_in it passes frame.ears and
      land.trace, and the same requirement without the delta fails realization-mismatch. Regression cells:
      system x supervisor x system-happy, system x board-at-terminal x system-happy, system x seat x
      system-happy, system x board-at-terminal x second-land."
    decision:
      by: recommendation
      date: 2026-09-27
      option: "Option 1: a target model, the trunk model with the contract-bound arch delta applied in memory, is
        what verification and preview judge against; the committed model changes only at land"
      recorded_in: [ docs/07-architecture-intelligence.md, docs/11-verification.md ]

  - id: DI-08
    title: Goal progress is requirement coverage, and nothing reads success_signal when a goal closes
    statement: >-
      The alignment chain, the RTM, the dashboard overview and the measures table define goal progress as
      requirements verified at head over the total. A goal's success_signal is a required string that no verb,
      gate, record or view reads, and nothing is needed to set a goal's status to done. A goal whose
      requirements are all verified reports full progress whether or not its success signal was observed.
    status: decided
    found_by: external-review
    found_on: 2026-09-26
    root_cause: unread-field
    anchors:
      - { file: docs/02-alignment.md, heading: "Alignment chain L0–L11" }
      - { file: docs/04-trace-and-state.md, heading: "RTM and drift classes" }
      - { file: docs/08-dashboard.md, heading: "Overview" }
      - { file: docs/15-roadmap.md, heading: "Measures" }
      - { file: schemas/goals.schema.json, pointer: "#/$defs/goal/properties/success_signal" }
    class: term-collision
    blocks: M1a
    walk:
      producers:
        - precondition: "numerator: requirements verified at head (per goal)"
          producer: { file: docs/11-verification.md, heading: gate:verify }
          position: before
          sufficient: true
          reason: Runner evidence bound to source state exists before keel trace --matrix, the measure or the dashboard
            read it; it is complete over the requirements in scope and re-executed (KP-06), so it is
            sufficient for the property 'requirement coverage'.
        - precondition: the same numerator, read as 'progress toward the goal's objective'
          producer: { file: docs/04-trace-and-state.md, heading: RTM and drift classes }
          position: before
          sufficient: false
          reason: "The RTM is bounded to requirements keel can verify; a goal's objective is said to be met by its
            success_signal, which may name an observation outside the repository (example G-03: a
            user-adoption percentage 30 days after release). A bounded count under the unbounded name 'goal
            progress' is the collision."
        - precondition: "denominator: total requirements that cite the goal"
          producer: { file: docs/02-alignment.md, heading: Alignment chain L0–L11 }
          position: before
          sufficient: true
          reason: "Every requirement carries at least one goal ref by schema, and the living spec at the trunk commit is
            complete, so the denominator is computable and always shown. Readers that run inside a proposal
            (compile-brief, approve --doc) read the living spec of the previous land: a cross-instance read by
            the baseline convention, stated here and not drawn as a required_by edge."
        - precondition: success_signal is present on every goal
          producer: { file: docs/04-trace-and-state.md, heading: Declared plane }
          position: before
          sufficient: false
          reason: "The Board writes the string and approves the document (board.approve.doc), so it exists before every
            consumer; it is sufficient as why-chain context, but insufficient for anything that would decide a
            goal's outcome: it has no evidence mode, no command and no reader that compares it with anything,
            and in general it is not observable by keel."
        - precondition: goal status becomes done
          producer: { file: docs/04-trace-and-state.md, heading: Declared plane }
          position: absent
          sufficient: false
          reason: No phase, verb mode or gate sets a goal's status; it is a Board edit outside every sequence of the
            matrix. Nothing states when the Board sets it, nothing requires coverage or the signal first, and
            no reader distinguishes done from paused or dropped (frame.goal-active reads only 'active or
            not').
        - precondition: the cited goal is active (frame.goal-active at keel new and gate:frame)
          producer:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
          position: before
          sufficient: true
          reason: The approved goals.yaml at trunk holds status; the doc approval binds its hash, so a status edit
            invalidates the approval until the Board confirms again (frame.approvals). This part of the rule
            holds as written.
      consumers:
        - anchor: { file: docs/11-verification.md, heading: gate:frame }
          actor: board-at-terminal
          outcome: holds
          reason: keel new and check --gate frame read status == active only; they never read success_signal and cannot
            tell done from paused or dropped. Unchanged by the fix.
        - anchor: { file: docs/11-verification.md, heading: gate:frame }
          actor: board-at-terminal
          outcome: holds
          reason: "frame.schema validates goals.yaml against schemas/goals.schema.json: required success_signal, the
            status enum and additionalProperties false. The fix rewrites the schema's description strings
            only; no property, requirement or enum value changes, so the check's verdict on every existing
            goals.yaml is the same before and after. Unchanged."
        - anchor: { file: docs/11-verification.md, heading: gate:frame }
          actor: board-at-terminal
          outcome: holds
          reason: Reads goal.budget only (proposal budget fits the goal budget; warnings roll up per goal). Unchanged.
        - anchor: { file: docs/11-verification.md, heading: gate:plan }
          actor: board-at-terminal
          outcome: holds
          reason: plan.budgets compares the plan budget with the proposal budget, which frame.budgets already fitted to
            goal.budget; it reads no progress, status or signal. Unchanged.
        - anchor:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
          actor: board-at-terminal
          outcome: holds
          reason: Any edit of goals.yaml, a status change to done included, changes the bound blob hash and invalidates
            the doc approval; dispatch refuses until the Board views the diff and confirms again. This is the
            closure mechanism the design already has and the fix builds on it.
        - anchor: { file: org/checkpoints.yaml, pointer: "#/other_approvals/1" }
          actor: board-at-terminal
          outcome: changed
          reason: The kind doc reading list says only 'the diff of the charter, goals or routing'. After the fix it also
            names, for each goal whose status the diff changes, that goal's success signal and its requirement
            coverage at head (which keel approve prints beside the diff), and do_not_approve_when gains 'the
            diff sets a goal to done and you have not observed its success signal'. This gives success_signal
            and done their Board reader without adding a gate.
        - anchor:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
          actor: board-at-terminal
          outcome: changed
          reason: "Once keel approve --doc prints requirement coverage beside the goals diff, board.approve.doc becomes
            a machine reader of the living spec and the EV records of the previous land. That read is
            cross-instance (the previous land's trunk commit and its evidence in the git common dir, both
            reachable by a local step) and is stated in the entry, not drawn as a required_by edge:
            living-spec and evidence-file are produced by steward.land.archive-commit and
            steward.verify.runner, and board.approve.doc precedes gate.frame, so a mapped edge would close 19
            cycles through archive-commit -> board.approve.doc -> gate.frame. The baseline map already leaves
            this class of read (the previous land's living spec) unmapped, so the convention is followed, not
            invented."
        - anchor: { file: docs/02-alignment.md, heading: Brief compiler and normalized hashing }
