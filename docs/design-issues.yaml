      places:
        - artifact: goals
          where: trunk-commit
          reachable_from: [ local, supervisor, seat, agent-api, clone ]
        - artifact: document-approval-record
          where: trunk-commit
          reachable_from: [ local, supervisor, seat, agent-api, clone ]
        - artifact: living-spec
          where: trunk-commit
          reachable_from: [ local, supervisor, seat, agent-api, clone ]
        - artifact: evidence-file
          where: git-common-dir
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: brief
          where: git-common-dir
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: run-dir
          where: workspace-root
          reachable_from: [ local, supervisor, seat, agent-api ]
        - artifact: receipt
          where: archive-commit
          reachable_from: [ local, supervisor, seat, agent-api, clone ]
      readers:
        - field: goals[].success_signal (required string)
          readers:
            - "steward.run.compile-brief / keel brief: why-chain via templates/prompts/brief.md.tmpl
              {{signal}} (context only)"
            - seats through the brief, keel_context and keel brief (context only)
            - the Board at keel approve --doc, as part of the goals diff (org/checkpoints.yaml other_approvals
              kind doc)
        - field: goals[].status = active
          readers: [ frame.goal-active at keel new and gate:frame ]
        - field: goals[].status = done
          readers: []
        - field: goals[].status = paused
          readers: []
        - field: goals[].status = dropped
          readers: []
        - field: goals[].status (any value, as a schema-typed field)
          readers: [ frame.schema (enum membership only; tells no value from another) ]
        - field: "formula: requirements verified at head / total, per goal (named 'goal progress')"
          readers:
            - keel trace --matrix (RTM, docs/04)
            - dashboard overview meter (docs/08 Overview; src/dashboard/model.ts overview.goals.progress)
            - Measures row 'Requirement coverage' (docs/15)
        - field: name 'requirement coverage' (docs/15 Measures)
          readers: [ the Measures row itself; the RTM it is computed from ]
        - field: goals[].objective
          readers: [ brief why-chain, the Board at keel approve --doc ]
        - field: goals[].non_goals
          readers: [ brief why-chain ]
        - field: goals[].budget
          readers: [ frame.budgets, plan.budgets, budget.warned events shown by keel status and the dashboard ]
        - field: goals[].id
          readers:
            - frame.goal-active
            - spec requirement goals refs (denominator)
            - RTM goals column
            - result goal_echo
            - ACK id sets of product and architect
            - keel trace G-nn
            - land.trace
        - field: goals file charter_version
          readers: [ frame.charter-current ]
        - field: receipt.rtm {requirements, covered, verified}
          readers: [ the Board at the land approval reading list, dashboard evidence and receipts view ]
      tally: []
    terms:
      - name: goal progress
        uses:
          - anchor: { file: docs/02-alignment.md, heading: Alignment chain L0–L11 }
            meaning: verified requirements at head over total, per goal
            demands: a measure of the goal (the L1 artifact whose objective is met by a success signal)
          - anchor: { file: docs/04-trace-and-state.md, heading: RTM and drift classes }
            meaning: the same formula, denominator always shown
            demands: an RTM aggregate over requirements citing the goal
          - anchor: { file: docs/08-dashboard.md, heading: Overview }
            meaning: the same formula as a meter per goal
            demands: what a Board member reads as 'how far the goal is'; a full meter reads as the goal being met
          - anchor: { file: docs/15-roadmap.md, heading: Measures }
            meaning: a second name written into the Requirement coverage cell
            demands: nothing beyond requirement coverage
          - anchor: { file: schemas/goals.schema.json, pointer: "#/description" }
            meaning: the same formula, restated in the artifact's own description (also src/core/governance.ts Goal
              comment and src/dashboard/model.ts overview.goals.progress, which are not anchorable)
            demands: nothing beyond requirement coverage
          - anchor: { file: templates/project/goals.yaml, pointer: "#/goals/0" }
            meaning: "header comment: Goal progress = requirements verified at head / total"
            demands: nothing beyond requirement coverage
          - anchor: { file: examples/acme-notes/.keel/goals.yaml, pointer: "#/goals/0" }
            meaning: "header comment: Goal progress is computed, never stored (examples/dashboard/sample.html carries the
              same heading and is not anchorable)"
            demands: nothing beyond requirement coverage
        renamed:
          - meaning: verified requirements at head over total requirements citing the goal
            new_name: requirement coverage
          - meaning: how far the goal's objective is met, as told by its success signal; observable by the Board, not
              computable by keel, recorded only as the goal's Board-set status under a --doc approval
            new_name: success signal
      - name: requirement coverage
        uses:
          - anchor: { file: docs/15-roadmap.md, heading: Measures }
            meaning: the measure's name, computed from the RTM at M3
            demands: one name for the formula, with the denominator always shown
          - anchor: { file: docs/04-trace-and-state.md, heading: RTM and drift classes }
            meaning: the formula the RTM computes per goal (today under the other name)
            demands: an RTM aggregate over requirements citing the goal
        kept:
          meaning: requirements verified at head over the total citing the goal, per goal, denominator always shown; the
            single name for the formula after the fix, with its own glossary row (home 04-trace-and-state.md)
          provides: a count keel can re-execute (KP-06) named for what it shows (KP-12), which is all the formula
            provides
      - name: success signal
        uses:
          - anchor: { file: schemas/goals.schema.json, pointer: "#/$defs/goal/properties/success_signal" }
            meaning: "'An observable signal that says the objective is met' (required)"
            demands: observability, by an unstated observer, and a reader that acts on it
          - anchor: { file: docs/02-alignment.md, heading: Brief compiler and normalized hashing }
            meaning: context text in the why-chain
            demands: nothing; read by seats
          - anchor: { file: docs/00-vision.md, heading: Glossary }
            meaning: a field of the goal
            demands: nothing
          - anchor: { file: examples/acme-notes/.keel/goals.yaml, pointer: "#/goals/2/success_signal" }
            meaning: a user-adoption percentage 30 days after release
            demands: an observation outside the repository, which keel cannot make
        kept:
          meaning: a statement, observable by the Board, that says the goal's objective is met; keel shows it
            (why-chain, dashboard, the --doc reading list) and never computes it; gains its own glossary row
            (home 02-alignment.md)
          provides: "exactly what the field provides today, plus named readers; the example signals (G-01: acceptance
            scenarios at head; G-03: adoption) both fit"
      - name: done
        uses:
          - anchor: { file: schemas/goals.schema.json, pointer: "#/$defs/goal/properties/status" }
            meaning: a goal status the Board sets (enum active, paused, done, dropped; 'Only active goals may be cited by
              new proposals')
            demands: a reader that tells it from paused and dropped, and a statement of when the Board sets it
          - anchor: { file: docs/00-vision.md, heading: KP-06 Done means evidence that keel re-executed }
            meaning: a task or check is done only with re-executed evidence
            demands: evidence bound to source state (tasks, checks); says nothing about goals
          - anchor: { file: docs/14-trust-security.md, heading: Assets }
            meaning: the KP-06 sense
            demands: the same
      - name: signal
        uses:
          - anchor: { file: schemas/intent.schema.json, pointer: "#/$defs/frozenBlock/properties/signal" }
            meaning: the frozen intent's outcome signal (L5, per proposal; 'Outcome and signal' section;
              templates/proposal/intent.md token outcome_signal)
            demands: nothing from the goal's signal
          - anchor:
              file: docs/03-lifecycle.md
              heading: Track signals and the upward-only ratchet (including the no-index fallback)
            meaning: intake signals recorded in proposal.yaml
            demands: nothing from the goal's signal
    options:
      - "Option 1: rename the formula to 'requirement coverage' everywhere it is called goal progress (02 L1
        row, 04 RTM, 08 Overview and its meter row, 15 Measures, goals schema description,
        templates/project/goals.yaml, examples/acme-notes/.keel/goals.yaml, examples/dashboard/sample.html,
        src/core/governance.ts, src/dashboard/model.ts) and give success_signal and status their readers: the
        dashboard overview shows each goal's status and success signal beside its coverage meter, the RTM
        lists them beside the fraction, and the --doc reading list makes the Board read a goal's success
        signal beside its coverage at head (printed by keel approve --doc) when the diff changes that goal's
        status. Order map: reader edges goals -> {board.trace, dashboard.build}, living-spec -> board.trace,
        evidence-file -> {board.trace, dashboard.build} only; compile-brief's and approve --doc's reads of the
        previous land's living spec and EV records are stated as cross-instance reads, not mapped. Glossary
        gains 'success signal' and 'requirement coverage'; 'goal progress' is retired with no row."
      - "Option 2: keep 'goal progress' as the name and drop success_signal from schemas/goals.schema.json and
        the brief's why-chain, so the name and the formula coincide and no unread field remains (changes a
        goals.yaml field: owner-routed)."
      - "Option 3: put a precondition on done: keel approve --doc refuses a diff that sets a goal to done
        while its requirement coverage at head is below total, and records the Board's observation of the
        success signal in the approval note (changes what status: done means: owner-routed)."
      - "Option 4: give success_signal an evidence mode like an ACC item (test, command, manual, unobservable)
        and let the RTM compute a goal outcome for the checkable modes, with done derived and never stored
        (changes a goals.yaml field and adds a goal-level evidence artifact: owner-routed, M3 at the
        earliest)."
    recommendation: "Option 1. It removes both halves of the defect: the collision ends because the only name left
      is the one that says what the formula counts (KP-12: an aggregate named for what it shows), and the gap
      ends because success_signal gains a view reader and a Board reader that puts it beside the coverage at
      the moment the Board changes a goal's status, and done, paused and dropped gain a reader that shows them
      (the dashboard goal row, the RTM row) and a reading list that names them. It keeps KP-06's line: keel
      counts only what it re-executed, and the Board observes what keel cannot; the example G-03 signal (an
      adoption percentage) shows that a computed goal outcome is not the general case, which rules out Option
      4 as the design and makes Option 3 a gate on a condition keel cannot check. Option 2 deletes the
      why-chain context seats already read and the only statement of what a goal being met would mean. Order
      map, corrected: the added reader edges are goals.required_by += [board.trace, dashboard.build],
      living-spec.required_by += [board.trace] and evidence-file.required_by += [board.trace,
      dashboard.build]; all three artifacts are produced before those local steps, both steps reach
      trunk-commit and git-common-dir, and replaying the check's edge rules with exactly this set gives 0
      cycles. steward.run.compile-brief is not added to living-spec.required_by (it would close 12 cycles
      through steward.land.archive-commit -> compile-brief -> gate.submit) and board.approve.doc is not added
      to living-spec or evidence-file (19 cycles through archive-commit -> approve.doc -> gate.frame): both
      read the previous land's living spec and EV records, a cross-instance read the baseline map already
      leaves unmapped, and the entry states this in its producers and consumers instead of tagging a red edge.
      With that set the issues check stays green: acyclic, every place reachable by its machine, no new step,
      lock or tag (DI-08 tags no edge, so nothing is reproduced red first). Closure glossary:
      docs/00-vision.md gains exactly one row each for 'success signal' and 'requirement coverage' (the kept
      terms and the renamed new_names); 'goal progress' carries no kept block and is retired without a row,
      and 'done' and 'signal' carry no kept block, so the closure check passes without duplicating KP-06 or
      the three qualified signal terms. The retired phrase is removed from every home, the two examples
      included (examples/acme-notes/.keel/goals.yaml header comment; examples/dashboard/sample.html heading).
      It changes no field of a Board-approved artifact (success_signal keeps its meaning and gains readers;
      status keeps its enum and rule; the new do_not_approve_when line is reading-list guidance, not a gate),
      so it is decidable by recommendation and flips no recorded decision. If a maintainer splits the
      unread-field gap into its own entry with the same fix commit, the collision half alone blocks M1b."
    decision:
      by: recommendation
      date: 2026-09-27
      option: "Option 1: the measure is named requirement coverage everywhere; the success signal and the goal
        status gain their readers in the dashboard and in the Board's reading list at a goal status change"
      recorded_in: [ docs/02-alignment.md, docs/04-trace-and-state.md, docs/08-dashboard.md ]

  - id: DI-09
    title: The patch track derives exactly one work order and also allows a test fixed first by a test task
    statement: >-
      The patch track says the Steward derives exactly one work order, and in the same sentence lets its
      acceptance come from a test fixed first by a test task on a different declared family. A test task is a
      work order of kind test, so the patch has two work orders, or it has one and the test task cannot exist.
      The rule does not say whether a patch that needs a test is raised to feature or is allowed two work
      orders.
    status: proposed
    found_by: external-review
    found_on: 2026-09-26
    root_cause: cardinality
    anchors:
      - { file: docs/03-lifecycle.md, heading: "Patch track and policy path" }
      - { file: docs/11-verification.md, heading: "3. Test independence and red/green proof" }
    class: gap
    blocks: M2
    walk:
      producers:
        - precondition: a work order of kind test exists on the patch track (the 'test fixed first by a test task'
            branch of the acceptance sentence)
          producer: { file: docs/03-lifecycle.md, heading: Patch track and policy path }
          position: absent
          sufficient: false
          reason: the sentence that would produce it says the Steward derives exactly one work order and names the test
            task only as a source of acceptance; the producer of test tasks elsewhere is run.plan in Phase 2
            ('workorders/T<n>.yaml, including test tasks and frozen_tests'), which 'Patch always skips'; the
            order map's `work-orders` artifact lists run.plan as its only producer and
            `steward.derive-work-order` produces no artifact
        - precondition: a work order of kind resolution exists on a patch when restack or the integration preview hits a
            replay conflict ('A replay conflict becomes a resolution task'; 'the listed paths become a
            resolution task')
          producer: { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
          position: absent
          sufficient: false
          reason: "every proposal, a patch included, is restacked onto the moving trunk tip, so a patch can acquire a
            third work-order kind at land; the sentence names the outcome but no step derives the order on a
            track where run.plan never runs: steward.land.restack produces only `integrated-commit`,
            steward.land.bisect produces nothing, and the map's only producer of `work-orders` is run.plan; on
            patch the resolution task therefore has no producer, and it also breaks any 'exactly one' or 'at
            most two' cardinality stated for the patch"
        - precondition: "the test task lands first: its tests become the build task's frozen_tests and the build task
            waits in queued until its `after` edge is verified"
          producer: { file: docs/11-verification.md, heading: 3. Test independence and red/green proof }
          position: before
          sufficient: false
          reason: "step 5 (verify.test-red, the test_task lens set, land on keel/<P>/main, tests become frozen_tests)
            and the map's test-task.land -> frozen-tests -> gate.verify.red-green chain come before the build
            task's verify, and 03 'Task states' already lets a patch task wait on `after` edges; but the
            `after` edge itself is declared by the planner (06 Waves: 'it only declares after') and no
            sentence says the Steward derives one, so on patch the wait has no producer"
        - precondition: the test task runs on a declared family different from the engineer's
          producer: { file: docs/10-providers.md, heading: 2. routing.yaml and declared families }
          position: before
          sufficient: false
          reason: the Board-approved routing declares seats.engineer.test_route before any dispatch, which is enough for
            the declaration when the route is set; the row says the difference is enforced by
            plan.test-independence, and 11 gate:plan 'Runs on feature and system before the plan checkpoint.
            Patch skips phase 2', so on patch the property is declared but never checked; and when test_route
            is omitted or null the schema says test tasks use the engineer route and 'plan.test-independence
            then needs fixed tests or a routing deviation', where a routing deviation is accepted only by a
            plan approval that 01 Checkpoint stages and org/checkpoints.yaml set to never on patch, so on
            patch the null case has neither an independent route nor an approval path
        - precondition: "under the recommended fix, the derivation condition of the test order is decidable at
            derivation time, before any dispatch: a test-mode ACC, or a cited R-...#S<n> scenario, whose tag
            no test in the base tree carries"
          producer: { file: docs/03-lifecycle.md, heading: Phase 0 Intake }
          position: before
          sufficient: true
          reason: "`keel new` creates keel/<P>/main from the trunk tip, so the base tree is present after board.new and
            before gate.frame.intake; the condition is a tag scan over that tree (JUnit-tagged tests carry
            [R-<area>-<5>#S<n>], and test-mode ACC name their scenarios in the frozen intent), which needs no
            runner execution and no evidence file; stated this way the condition has a producer already
            upstream of steward.derive-work-order, which is why the fix does not phrase it as 'no cited
            scenario fails at the base commit', a predicate only a runner execution at base could decide"
        - precondition: on a policy land, at least one cited scenario, or a test fixed first by a different-family test
            task, fails at the base commit and passes at the change commit
          producer: { file: docs/11-verification.md, heading: gate:verify }
          position: after
          sufficient: true
          reason: verify.red-green runs the runner at base and at the change commit after the build round, the correct
            position; it is sufficient for the scenario branch, and for the test-task branch only when
            precondition 1 holds; 'Scenarios that already pass certify no change' means a policy land whose
            cited scenarios pass at base has only the test-task branch left
        - precondition: the test task's cited rows are red at its commit and nothing else changed
          producer: { file: docs/11-verification.md, heading: gate:verify }
          position: before
          sufficient: true
          reason: verify.test-red is track-agnostic ('Work orders of kind test only') and runs before test-task.land;
            complete for the rows it cites
        - precondition: a patch is a change of at most one session
          producer:
            file: docs/03-lifecycle.md
            heading: Track signals and the upward-only ratchet (including the no-index fallback)
          position: before
          sufficient: false
          reason: the classifier picks the track from intake signals (anchors, predicted impact, protected globs,
            obligations, public API), none of which is a session count, and the ratchet recomputes from the
            diff and impact; the bound is stated in the track table, the patch definition, config
            tracks.patch.max_sessions and the quick-patch predicate, and a test task is a second engineer
            session that no sentence counts or excludes
        - precondition: acceptance from the cited R-...#S<n> scenarios (the other branch)
          producer: { file: docs/03-lifecycle.md, heading: Phase 1 Frame (and design on system) }
          position: before
          sufficient: true
          reason: the scenarios are Board-approved living-spec content bound by the contract approval, or named by the
