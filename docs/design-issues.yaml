    terms:
      - name: ref snapshot
        uses:
          - anchor: { file: docs/00-vision.md, heading: "State, trace and VCS" }
            meaning: Pre-spawn copy of refs, worktree HEADs and reflog tails, diffed at ingest and land to detect reserved
              operations
            demands: a baseline for a diff at land; the row itself names one moment of taking (pre-spawn) and two moments
              of diffing
          - anchor: { file: docs/05-vcs.md, heading: Detection (the guarantee) }
            meaning: recorded before each spawn; its ref, HEAD and reflog parts are diffed at ingest and at land
            demands: at land, a baseline current as of the land's start and exclusive until its diff; the definition
              provides a copy that predates the run's ingest and everything after it
          - anchor: { file: docs/11-verification.md, heading: gate:land }
            meaning: '"The ref snapshot diff is clean"'
            demands: every change in the diffed interval be explained; with the pre-spawn baseline none of the post-window
              appends can be
          - anchor: { file: docs/03-lifecycle.md, heading: Blocked reasons }
            meaning: '"The ref-snapshot or ls-remote diff shows a change keel did not make"'
            demands: an explanation set covering every keel process, wider than the supervisor's own appends
          - anchor: { file: docs/06-parallelism.md, heading: The lease }
            meaning: the snapshot includes claim refs, so a claim ref changed outside keel is detectable
            demands: coverage of refs/keel; provided
          - anchor: { file: docs/09-runtimes.md, heading: "5. Permissions, trust and deny-read rules" }
            meaning: the mechanism named, specification deferred to 05
            demands: nothing beyond 05
          - anchor: { file: org/reserved-actions.yaml, pointer: "#/actions" }
            meaning: "header comment: ref snapshots (git for-each-ref), worktree HEADs, reflog tails and ls-remote before
              and after each run; a change keel did not make sets blocked(reserved_op) at ingest"
            demands: the ingest diff only as written; the land diff is added by the fix
          - anchor: { file: docs/adr/ADR-0001-git-primary-jj-optional.md, heading: Decision }
            meaning: reserved-operation detection through ref snapshots, reflog tails and git ls-remote before and after
            demands: git primitives only; provided, and a land-start snapshot is the same primitive
        kept:
          meaning: "A copy of refs, worktree HEADs and reflog tails that a Steward process records as the baseline of
