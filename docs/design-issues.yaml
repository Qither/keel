            meaning: as 04, written by the second land after the draft-hash check
            demands: consistent
          - anchor: { file: docs/00-vision.md, heading: "State, trace and VCS" }
            meaning: The land commit that applies deltas to living specs and the arch model, promotes ADRs and writes
              projections; home 04
            demands: the home definition
        kept:
          meaning: "the glossary meaning, home 04: the single commit the second `keel land` writes on keel/<P>/main
            after the land gate and the land approval, a descendant of the integrated commit that touches only
            .keel/**, which the trunk update then makes the trunk tip"
          provides: a commit that exists only after gate.land, board.approve.land and steward.land.check-approval,
            reachable from trunk by every machine after the update; it never provides an operand to a gate
            check
        renamed:
          - meaning: "the commit whose ancestry from trunk the land gate can test: the tip of keel/<P>/main after the
              restack, which the receipt draft names, re-execution runs on and the archive commit descends
              from"
            new_name: integrated commit (an existing noun in 03, 05, 11, the approval and receipt schemas; it gains a
              glossary row and becomes the operand of land.ancestry)
      - name: trunk tip / expected trunk tip
        uses:
          - anchor: { file: docs/11-verification.md, heading: gate:land }
            meaning: the current commit of refs/heads/<trunk> at check time
            demands: a value read in place; provided
          - anchor: { file: docs/05-vcs.md, heading: Integration preview and restack }
            meaning: the trunk commit the restack used as base
            demands: provided at restack time
          - anchor:
              file: docs/02-alignment.md
              heading: Board approvals (explicit confirmation, hash binding, invalidation)
            meaning: the restack base as recorded in the draft and bound as expected_trunk_tip by the land approval
            demands: a stable recorded value the Board reads; provided; today no machine reader compares it to trunk
          - anchor: { file: docs/05-vcs.md, heading: Three land cases }
            meaning: the expected old value of the CAS, unnamed
            demands: a named source for expected-old; not stated, the fix names it as the expected trunk tip of the
              approved draft
        kept:
          meaning: "trunk tip: the commit refs/heads/<trunk> points at, at the moment named; expected trunk tip: the
            trunk tip the restack replayed onto, named by the receipt draft, bound by the land approval and
            used as the expected old value of the trunk update; home 05"
          provides: one value per land that the gate check compares against the current trunk (through ancestry of the
            integrated commit) and that the CAS compares at the update
      - name: ancestor (git merge-base --is-ancestor <trunk> <X>)
        uses:
          - anchor: { file: docs/11-verification.md, heading: gate:land }
            meaning: X = the archive commit
            demands: an existing X at gate time; not provided
          - anchor: { file: docs/05-vcs.md, heading: Three land cases }
            meaning: X = the archive commit, after it is written
            demands: provided
          - anchor: { file: docs/12-cli-api-mcp.md, heading: 3. Exit codes }
            meaning: "the refusal outcome of the same test at the update: trunk is not an ancestor, exit 5, restack (the
              LandResult outcome trunk-moved of src/vcs/vcs.ts carries the same meaning)"
            demands: provided
        kept:
          meaning: "git's definition: trunk is reachable from X through parent edges; because the restack put trunk at
            the base of the integrated commit and the archive commit descends from it, the test on the
            integrated commit and the test on the archive commit answer the same question (has trunk moved
            since the restack base?) at two moments"
          provides: a complete, non-heuristic, fresh-at-read-time fact
      - name: land gate (gate:land) and the land process
        uses:
          - anchor: { file: docs/11-verification.md, heading: gate:land }
            meaning: one run, after the restack
            demands: a moment after integration; provided, but the row inside it demands the archive commit, which that
              moment does not provide
          - anchor: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
            meaning: the gate of phase 5, evaluated on the integrated commit
            demands: consistent with the fix
          - anchor: { file: docs/00-vision.md, heading: "End-to-end example: from G-03 to one line of code" }
            meaning: "two runs: before the draft and again after the approval, both before the archive commit"
            demands: both runs precede the archive commit; consistent with 04's projection check
          - anchor: { file: docs/04-trace-and-state.md, heading: Land projection and the projection gate }
            meaning: the projection check of this gate runs before the archive commit
            demands: consistent
        kept:
          meaning: gate:land runs in the land process after the restack and re-execution, before the receipt draft, and
            again on the land after the land approval, before the archive commit is written; every check of it
            evaluates the integrated commit, the draft, the records and the projections-to-be, never the
            archive commit
          provides: a fixed moment at which the archive commit does not exist, which every row of the gate must respect
      - name: clean worktree with trunk checked out
        uses:
          - anchor: { file: docs/11-verification.md, heading: gate:land }
            meaning: git worktree list shows a worktree on trunk and its status --porcelain --untracked-files=no is empty
            demands: a working-tree fact on the local machine; provided
          - anchor: { file: docs/05-vcs.md, heading: Three land cases }
            meaning: the same fact deciding ff-only (A) versus refusal exit 5 (B)
            demands: provided
        kept:
          meaning: as 05 cases A and B
          provides: the half of the row that is sound today, with its negative control and M3 exit criterion; unchanged
            by the fix
    options:
      - "Option 1: redefine the catalogue row land.ancestry on the integrated commit (trunk is an ancestor of
        the tip of keel/<P>/main after the restack, i.e. trunk has not moved from the base the restack
        replayed onto, which the receipt draft names as the expected trunk tip; plus the unchanged
        clean-worktree clause), and keep 05's is-ancestor on the archive commit as the repeat immediately
        before the ff-only or CAS update, whose expected-old value is named as the draft's expected trunk
        tip."
      - "Option 2: strip ancestry from the gate: land.ancestry keeps only the clean-worktree clause, and a
        moved trunk is caught solely by 05 step 1 and the CAS at the trunk update, after the Board has already
        confirmed a draft whose expected trunk tip is stale."
      - "Option 3: add a third gate run after the archive commit is written and before the trunk update, so
        the row is evaluated on an existing archive commit; the projection and approval checks (04: before the
        archive commit; DI-02) would then need pre-archive and post-archive halves and a wasted archive commit
        on every stale trunk."
      - "Option 4: reorder the second land as archive commit first, gate second, then trunk update, which
        contradicts 04's rule that the projection check runs before the archive commit is written and pulls
        against DI-02's correction on the same mechanism."
    recommendation: "Option 1. The property the row exists for, that trunk has not moved since the restack, is
      fully decidable on the integrated commit: the restack put trunk at its base, the archive commit is
      written on keel/<P>/main as its descendant and touches only .keel/**, so is-ancestor on the integrated
      commit and is-ancestor on the archive commit answer the same question at two moments. Choosing the
      earlier moment keeps early detection (the Board is not asked to confirm a receipt draft whose expected
      trunk tip can no longer land as approved, which option 2 loses), adds no gate run and no new order edge
      (options 3 and 4 create a new before/after conflict with the projection check and with DI-02), gives
      `expected_trunk_tip` its first machine reader as the CAS expected-old value instead of leaving it a
      field only the Board's eyes read, and weakens nothing because the ff-only merge and the CAS remain the
      last-instant guarantee, now stated as a repeat of the gate's check; the M7 JjBackend parity row
      (\"Bookmark set after the same checks\") inherits both without a jj-specific change. The register's red
      edge, order.artifacts[34] (archive-commit) required_by gate.land.ancestry tagged DI-19, is already
      reproduced in the map and stays red and tagged while the issue is open; the closing commit moves the
      requirement to integrated-commit (produced by steward.land.restack, which gate.land.ancestry already
      follows), drops the tag, and the issues check turns the edge green in the same commit. No new cycle:
      gate.land.ancestry requires only integrated-commit (proposal-branch, reachable by the local land
      process) and reads trunk in place; it must not require the receipt draft or trunk-tip, both produced
      downstream of gate.land. No deadlock, no unreachable place, no dead field (expected_trunk_tip gains a
      reader), no mandate conflict (clause 4 / R4 / D4 keep git primary; D6 untouched). Closure with blocks M3
      needs a non-empty closure.tests: the seeded fault \"a foreign commit advances trunk after the restack
      and before the gate\" with pinned failure exit 5 (trunk moved) is added to 11 §8 Negative controls and
      test/README.md next to the existing dirty-worktree row. Ordering: DI-02 (cycle, M1b, same mechanism) is
      corrected first; DI-19's closing commit follows DI-16's classification because DI-16 decides whether the
      second land restacks, which fixes the row's inputs on that run."
    decision:
      by: recommendation
      date: 2026-09-27
      option: "Option 1: land.ancestry is decided on the integrated commit, the tip of keel/<P>/main after the
        restack"
      recorded_in: [ docs/11-verification.md ]

