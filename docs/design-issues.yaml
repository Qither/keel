            meaning: the same
            demands: same
          - anchor: { file: docs/00-mandate.md, heading: 5.2 The design-issue register }
            meaning: a liveness notion for the supervisor process itself
            demands: a signal that distinguishes a hung or dead supervisor from a silent seat; the claim lease cannot
        kept:
          meaning: the claim lease of 06 (glossary row claim), unchanged
          provides: seat liveness through parsed stream events; nothing about the supervisor, hence the second
