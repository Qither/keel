            demands: readable by the gate's process at the moment of the check
          - anchor: { file: docs/04-trace-and-state.md, heading: Declared plane }
            meaning: keel/<P>/main for contract, plan, request and rulings; trunk for document, policy and receipt
              records; the archive commit for the land record
            demands: the same
          - anchor: { file: docs/13-artifacts-schemas.md, heading: 1. Target project layout }
            meaning: trunk (documents, policies, receipts), keel/<P>/main (contract, plan, request, rulings), the archive
              commit (land)
            demands: the same
          - anchor: { file: templates/project/approvals/README.md, heading: What lands here }
            meaning: the same three places
            demands: the same
        kept:
          meaning: trunk for document, policy and receipt records; keel/<P>/main for every record of a proposal
            (contract, plan, request, rule, land), which reaches trunk with the archive commit
          provides: one place per kind, committed by the keel approve process itself, readable by the local gate before
