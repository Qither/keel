  - id: DI-14
    title: The land-time ref diff cannot explain the ledger anchor moves made after the run window
    statement: "The ref, HEAD and reflog parts of the snapshot taken before each spawn are diffed at ingest and at
      land, and a move of the ledger anchor is explained only when it matches the appends the supervising
      Steward process made itself. At land no supervising process exists, and between the last pre-spawn
      snapshot and the land the anchor has moved by appends the supervisor did not make: the land approval's
      approval.recorded event, the restack's old and new commit ids, land.started. Read as written, every land
      sees an unexplained anchor move, sets blocked(reserved_op) and needs an override; no sentence names a
      land-time baseline snapshot."
    status: decided
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: no-order-check
    anchors:
      - { file: docs/05-vcs.md, heading: Detection (the guarantee) }
      - { file: docs/04-trace-and-state.md, heading: Single writer }
    class: gap
    blocks: M2
    walk:
      producers:
        - precondition: a baseline snapshot for the diff made at land
          producer: { file: docs/05-vcs.md, heading: Detection (the guarantee) }
          position: before
          sufficient: false
          reason: "fresh against cached: the only producer is steward.run.snapshot-refs, taken before a spawn; the land
            comes after that run's ingest (round.committed, result.submitted, verdict.recorded,
            evidence.recorded, claim.released, run.finished), after keel check --gate verify (gate.checked),
            after the land approval (approval.recorded) and, at the land gate, after the restack (vcs.op).
            Every one of those moves the anchor after the baseline. The register has no land-time producer:
            artifact ref-snapshot is produced only by steward.run.snapshot-refs."
        - precondition: the set of appends an anchor move must match ("the appends the supervising Steward process made
            itself")
          producer: { file: docs/04-trace-and-state.md, heading: Single writer }
          position: absent
          sufficient: false
          reason: the set lives in the memory of the keel run process, which ends at steward.run.end (it released the
            supervisor lock before land can start); nothing persists it, and the same section says a new keel
            land process has written nothing yet and never trusts its own memory of the tail alone. At land no
            producer of the matching set exists, and the appends that moved the anchor were made by keel
            check, keel approve and the land process, none of them a supervising process.
        - precondition: exclusivity over the interval the land diffs (no other keel process appends or moves a ref
            between the land's baseline and its diff)
          producer: { file: docs/04-trace-and-state.md, heading: Single writer }
          position: absent
          sufficient: false
          reason: the supervisor lock is held only by steward.run.spawn and released by steward.run.end; nothing waits
            for a land, and the per-trunk integration lock is per trunk and held only from
            steward.land.restack. So while a land re-executes the acceptance matrix, a keel approve for
            another proposal, a keel new, a keel audit stale-lock removal or another proposal's run ingest can
            append and move the anchor; those appends are legitimate under 14 T1 (outside any run window) yet
            no land baseline, however fresh, can explain them by the land's own appends. The corrected fix
            makes each land process a holder of the supervisor lock for its diffed interval and adds
            steward.run.spawn to its waiters.
        - precondition: the land baseline is taken inside the per-trunk integration lock, after any earlier land of the
            same trunk has advanced trunk and written its archive commit
          producer: { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
          position: after
          sufficient: false
          reason: "the per-trunk lock is taken by the restack (register: lock.integration-queue held_by
            steward.land.restack). A snapshot step placed before the restack, as the first sketch had it,
            snapshots before the wait and then sees the other land's trunk advance and archive commit as
            unexplained. The snapshot step must be the acquirer of lock.integration-queue (and then of the
            supervisor lock), so the baseline postdates every other land's writes; DI-16 decides whether the
            per-trunk lock is held across the approval pause."
        - precondition: a vcs.op event for every ref change the Steward made in the diffed interval
          producer: { file: docs/05-vcs.md, heading: Integration preview and restack }
          position: before
          sufficient: false
          reason: "for the restack the land process records old and new ids before its gate, which is enough for its own
