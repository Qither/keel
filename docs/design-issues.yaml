    options:
      - "Option 1 (Steward check at ingest): home the citation check in the Steward's auditor module with one
        home, ingest: steward.run.ingest resolves each citation of a triage record (an EV or VD id of the same
        proposal present in `records/` and bound to the same commit or contract hash; a commit in
        `merge-base(trunk, keel/<P>/main)..tip`; a path:line inside the reviewed commit's tree), stores the
        record only when every citation resolves, and otherwise answers the drop like `submit.ack` with
        success-shaped guidance so the planner resubmits; a new gate:verify row `verify.triage-citations`
        (runs_in local like its siblings) reports the resolved set over the round's records with a denominator
        and `not_run` when the round has no record; `verify.review`, the fix loop and
        steward.land.draft-receipt read the action and post-triage severity of the stored records; the planner
        run that produces the records gets its step (`run.triage`, runs_in supervisor, after run.review) in
        the map and in the feature-happy and system-happy sequences, and the brief compiler gains a
        findings-and-verdicts section for that subject; the Board's `--rule dismiss` reads a
        proposed-dismissal record when one exists and never waits on one; the audit lens keeps plan, rulings
        and diff; \"intent auditor\" is reworded as the intent-alignment lens on the frontier tier in docs/11,
        docs/01, docs/09 and org/seats/reviewer.yaml; the field `evidence` is renamed `citations` in the
        schema, in src/core/evidence.ts (TriageRecord, TriageEvidence → TriageCitation) and
        src/api/contract.ts, and the section 8 negative control and the M3 exit criterion are reworded to the
        schema-expressible fault."
      - "Option 2 (audit lens): keep the audit lens as the checker by adding the round's triage records to the
        review packet (passed by path or inline like the diff, produced by steward.run.compile-brief into the
        run inputs under the workspace root), adding the audit lens to the `quick`, `patch` and `policy` sets
        so every track with a planner runs it at verify, and letting the lens verdict carry an
        unresolved-citation finding; the planner dispatch step and the brief section are still needed."
      - "Option 3 (split): the Steward resolves citations deterministically at ingest (as in option 1) and, on
        the system track only, the audit lens additionally judges whether the cited material supports the
        rationale, with the triage records handed to it through the review packet; two homes for one rule, a
        second name for the same property."
      - "Option 4 (presence only): delete \"the auditor checks the citation\" and let the schema's `minItems:
        1` at ingest be the whole check, so a citation is any non-empty string; the planner dispatch gap
        remains."
    recommendation: "Option 1. It follows the rule's own principle (\\\"Synthesis is code, not a model\\\",
      docs/11-verification.md section 6; \\\"deterministic checks first, LLM judgement second\\\", section 1)
      and KP-04, it puts the checker where the record already lives and where the term \\\"auditor\\\" already
      has its home (the Steward module of docs/01-org-model.md), and it needs no seat to reach the git common
      dir, no new lens launch, no new Board confirmation and no change to a recorded decision. Option 2 turns
      a resolvable property into an LLM judgement, adds a lens to three sets (a `cost`), makes an unavailable
      review lane block triage, and still needs a new artifact edge to the seat; option 3 keeps option 2's
      cost and creates two names for one check; option 4 weakens \\\"cites evidence\\\" to \\\"has a
      string\\\", a producer too weak for the claim (a `gap`). Shape of the fix, one home per rule: the check
      is the ingest refusal (records stored only when every citation resolves; an unresolved one is answered
      with success-shaped guidance like `submit.ack`), and `verify.triage-citations` is a report over stored
      records (resolved / records of the round, `not_run` when none), so the gate row has no fail condition of
      its own and the two sentences cannot disagree. Section 6 says \\\"the Steward's auditor module resolves
      every citation at ingest\\\" and \\\"the ruling reads a proposed-dismissal record when one exists\\\";
      the Board dismisses today with no planner record and keeps doing so, so no edge from triage-record to
      board.approve.rule.dismiss is added. Documents in the closing commit: docs/11 sections 6, 4 (thorough
      line), gate:verify (new row; `verify.review` wording) and 8 (the `verify.review` control becomes \\\"a
      `propose-dismissal` record on a critical finding → finding still open\\\", plus a control for the new
      check); docs/01 \\\"Steward modules (not employees)\\\", \\\"Seat by seat\\\", \\\"Staffing per
      track\\\"; docs/03 \\\"Phase 4 Verify\\\" (Who line; `run (triage)` in the Board and Produces text);
      docs/02 \\\"Brief compiler and normalized hashing\\\" (a findings-and-verdicts section rendered for the
      planner's triage subject only, with its own header hash); docs/04 \\\"Local control plane\\\" (reader
      clause); docs/09 \\\"direct\\\" (\\\"lenses, including the intent-alignment lens on the frontier
      tier\\\"); docs/00-vision \\\"Organization\\\" (row `auditor`), \\\"Verification\\\" (row `citation`;
      `triage record` reworded); docs/13 \\\"Schemas\\\" (triage row); docs/15 \\\"M3 Verify, review and
      land\\\" (exit criterion gains the ingest refusal); schemas/triage.schema.json (`evidence` →
      `citations`, the four ref kinds enumerated with a pattern, `required` updated); src/core/evidence.ts
      (`TriageEvidence` → `TriageCitation`, `TriageRecord.evidence` → `citations`) and src/api/contract.ts
      (the `triage` payload of `OutboxDropPayloads`), the type-only code 5.3 step 7 requires;
      org/seats/reviewer.yaml (`thorough` comment); skills/keel-plan/SKILL.md \\\"Procedure (triage)\\\" (the
      four citation kinds, resubmission on refusal); the zh-CN mirrors under identical headings.
      schemas/ledger-event.schema.json is unchanged and `triage.recorded` keeps no reader; the check reads
      `records/`. Order map in the closing commit: add `run.triage` (doc docs/03 \\\"Phase 4 Verify\\\"; after
      [run.review]; runs_in supervisor) and `gate.verify.triage-citations` (doc docs/11 \\\"gate:verify\\\";
      after [steward.run.ingest, run.triage]; runs_in local like every sibling gate.verify.* step);
      `gate.verify.review.after` and `gate.verify.after` include it; `triage-record.required_by` becomes
      [gate.verify.triage-citations, gate.verify.review, gate.verify, steward.land.draft-receipt,
      steward.land.archive-commit, gate.land.projection] (seat.review removed, no board.approve.rule.dismiss),
      `where` stays git-common-dir and the `issue: DI-18` tag is dropped; `verdict.required_by` and
      `evidence-file.required_by` gain gate.verify.triage-citations; the feature-happy and system-happy
      sequences gain `run (triage)` between `run (review)` and `check --gate verify`; no lock changes. The red
      edge triage-record → seat.review stays tagged DI-18 until that commit; afterwards the `issues` check
      proves reachability (local and supervisor reach git-common-dir) and acyclicity (ingest → run.triage →
      ingest of the triage drop → triage-citations → verify.review → gate.verify; the record cites the
      verdict, never the reverse). Effects on the four hazards: no new cycle, no deadlock (a refused record
      leaves the finding open under findings authority and the planner resubmits; the Board waits on nothing),
      no unreachable place, no dead field (`citations`, `action` and post-triage `severity` each have a named
      reader). Tally unchanged on every track, route and topology (a `--rule dismiss` is an approval event
      only on the dismissal path, zero in every happy chain). Filed as their own entries per 5.3 step 1, not
      folded here: the \\\"auditor\\\" term-collision (Steward module vs. \\\"intent auditor\\\"), the
      untagged edge evidence-file (git-common-dir) read by seat.review through the review packet
      (org/seats/reviewer.yaml \\\"read ... the evidence\\\"), the `result.submitted` vs `triage.recorded`
      naming mismatch in docs/12 \\\"4. keel api\\\", the after-land audit-lens run of docs/03 \\\"Phase 6
      Close\\\" with no set and no reader, and how several TR drops travel on a one-message final-message
      channel. Regression cells at closure: feature and system × {seat, supervisor, board-at-terminal,
      dashboard} × {feature-happy or system-happy with `run (triage)`, abandon (dismissal path),
      crash-resume}."
    decision:
      by: recommendation
      date: 2026-09-27
      option: "Option 1: the citation of every triage record is resolved by a deterministic Steward check in
        gate:verify"
      recorded_in: [ docs/11-verification.md ]
  - id: DI-19
    title: The land gate's ancestry check needs the archive commit that is written after the gate
    statement: The land gate runs in the land process after integration and before the archive commit is written,
      and its ancestry check verifies that trunk is an ancestor of the archive commit. The archive commit is
      produced by the second land after the land approval, so the check reads a commit that does not yet
      exist; the check may intend the integrated commit about to be archived, which no sentence says. The
      shape is DI-02's on a different artifact, so DI-02's correction does not close it.
    status: decided
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: no-order-check
    anchors:
      - { file: docs/11-verification.md, heading: gate:land }
      - { file: docs/03-lifecycle.md, heading: Phase 5 Land }
    class: cycle
    blocks: M3
    walk:
      producers:
        - precondition: the archive commit exists, so that `git merge-base --is-ancestor <trunk> <archive>` has an operand
          producer: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
          position: after
          sufficient: false
          reason: The archive commit is produced by steward.land.archive-commit, which 03 lists after the receipt draft,
            12 places in the second `keel land` after the draft-hash check, 04 places after the projection
            check of this same gate ("before the archive commit is written"), and the order map places after
            gate.land, which is after gate.land.ancestry. On both gate runs (before the draft, and again after
            the land approval per 00-vision step 9) the operand does not exist; a fail-closed check reports
            `fail` (required input missing) on every land. This is the red edge tagged DI-19 at
            order.artifacts[34].required_by.
        - precondition: "the integrated commit: `keel/<P>/main` restacked onto the current trunk tip, then the task
            rounds replayed in wave order"
          producer: { file: docs/05-vcs.md, heading: Integration preview and restack }
          position: before
          sufficient: true
          reason: steward.land.restack runs first in the land process (06 Integration queue step 1) and replays
            `keel/<P>/main` onto the current trunk tip, so at restack time trunk is an ancestor of the
            integrated commit by construction. The archive commit is later written on `keel/<P>/main` as a
            descendant of the integrated commit and touches only `.keel/**` (04 Land projection), so "trunk is
            an ancestor of the archive commit" holds exactly when "trunk is still an ancestor of the
            integrated commit" holds. The property the row wants is therefore fully decidable on the
            integrated commit, before the gate; this producer is complete (a git ancestry fact, not a
            heuristic) and fresh at read time.
        - precondition: the current trunk ref (`refs/heads/<trunk>`) to test ancestry against
          producer: { file: docs/05-vcs.md, heading: Three land cases }
          position: before
          sufficient: true
          reason: "Trunk is read in place; it was last moved by an earlier steward.land.advance-trunk or by the Board's
            own commits. Sufficient for the check's claim at read time only: trunk may move between the check
            and the update, which is why 05 keeps `merge --ff-only` (case A) and the CAS `update-ref
            <expected-old>` (case C) as the last-instant guard. The check is early detection; the CAS is the
            guarantee."
        - precondition: the expected trunk tip the receipt draft names (the base the restack replayed onto), bound by
            the land approval as `expected_trunk_tip`
          producer: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
          position: after
          sufficient: true
          reason: "steward.land.draft-receipt writes the draft after gate.land (register: draft-receipt after
            gate.land), so on the first gate run the draft does not exist and the check cannot read it; on the
            second run it exists and its value equals the restack base by construction. The check must
            therefore not require the draft (that would open a new cycle gate.land.ancestry → receipt-draft →
            steward.land.draft-receipt → gate.land → gate.land.ancestry); the draft's value is instead the
            natural expected-old value of the CAS at steward.land.advance-trunk, which already runs after
            check-approval."
        - precondition: a worktree with trunk checked out is clean (`git worktree list --porcelain`, then `git -C <wt>
            status --porcelain --untracked-files=no` empty)
          producer: { file: docs/05-vcs.md, heading: Three land cases }
          position: before
          sufficient: true
          reason: Working-tree state read in place by the land process on the local machine; no ordering dependency on
            the archive commit. This half of the row is sound as written, has its negative control ("A dirty
            worktree with trunk checked out → exit 5") and its M3 exit criterion, and the fix keeps it.
      consumers:
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
