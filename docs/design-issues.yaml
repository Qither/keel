        - field: "workorder kind enum value `resolution` (schemas/workorder.schema.json#/$defs/taskKind: 'resolve an
            integration conflict')"
          readers:
            - "steward.land.restack (06 Integration queue step 1: a replay conflict becomes a resolution task)"
            - steward.land.bisect (06 Integration queue steps 4 and 5)
            - 05 previewIntegration (exit 1 -> the listed paths become a resolution task)
            - 05 JjBackend parity table (conflicts() & mutable() become resolution tasks)
        - field: workorder `after` (schemas/workorder.schema.json#/properties/after)
          readers:
            - steward.run.compute-waves (06 Waves, topological order)
            - 03 Task states (queued until `after` edges are verified)
            - steward.land.bisect (dropping a tip drops its `after` dependents)
            - gate.plan (a cycle fails the plan gate; feature and system only)
        - field: workorder `frozen_tests`
