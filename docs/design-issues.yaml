              carries the land policy's id and a null approval; the archived receipt.md's Land approval
              section and the Keel-Approval trailer name the land policy's approval record
            new_name: policy-governed land
      - name: land policy
        uses:
          - anchor: { file: docs/03-lifecycle.md, heading: Standing policy limits }
            meaning: the bullet title names the rule about when a land approval is required; the same sentence's 'an
              approved land policy' names a standing policy file of kind land
            demands: "a rule the gate can evaluate (it cannot: no producer sets the topology) and a file the gate can
