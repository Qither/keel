    terms:
      - name: supervisor lock
        uses:
          - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
            meaning: the file <git-common-dir>/keel/locks/supervisor.lock held by the keel run process that spawned a seat
              (a --wave run supervises every run of the wave); every other mutating verb waits for it, no
