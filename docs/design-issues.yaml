    terms:
      - name: work order
        uses:
          - anchor: { file: docs/00-vision.md, heading: Intent and work }
            meaning: "`workorders/T<n>.yaml`: covers, after, write_set, frozen_tests, interfaces, ACC to command table,
              global constraints, review focus, stop classes, route hint, budget, derived_from"
            demands: one file per task; nothing about how many a proposal has
          - anchor: { file: docs/03-lifecycle.md, heading: Patch track and policy path }
            meaning: the one Steward-derived task of a patch
            demands: exactly one per patch, while its acceptance may come from a test task, which is another work order
          - anchor: { file: docs/11-verification.md, heading: 3. Test independence and red/green proof }
            meaning: a test task is 'a work order of kind test'
            demands: the test task counts as a work order
          - anchor: { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
            meaning: a resolution task, the work order of kind resolution that a replay conflict at restack or a preview
              conflict becomes, on any track
            demands: a producer on patch, where the planner never runs, and a count the patch section admits
          - anchor: { file: schemas/workorder.schema.json, pointer: "#/$defs/taskKind" }
            meaning: kind build, test or resolution
            demands: the kind enum, with test 'landing first' and resolution 'resolve an integration conflict'
        kept:
          meaning: "the glossary meaning: one `workorders/T<n>.yaml` per task, of kind build, test or resolution,
            written by the planner or derived by the Steward on patch"
          provides: a file with after, frozen_tests and an ACC to command table for every task, whatever its count; the
            'exactly one' bound belongs to the patch section and is what the fix restates as one build order,
            at most one derived test order, plus any resolution order the integrator derives
      - name: test task
        uses:
          - anchor: { file: docs/11-verification.md, heading: 3. Test independence and red/green proof }
            meaning: a work order of kind test on a different declared family that lands first, taking
              seats.engineer.test_route, verified by verify.test-red and the test_task lens set
            demands: existence as a planner-written work order on feature and system
          - anchor: { file: docs/03-lifecycle.md, heading: Patch track and policy path }
            meaning: the same object as the source of a patch's acceptance and of a policy land's red/green proof
            demands: existence on patch, where no planner runs and the Steward derives exactly one order
          - anchor: { file: docs/03-lifecycle.md, heading: Phase 4 Verify }
            meaning: "'A test task (work order kind test) is verified differently'"
            demands: track-agnostic verification; nothing about who produced it
          - anchor: { file: docs/10-providers.md, heading: 2. routing.yaml and declared families }
            meaning: a test-first task routed through seats.engineer.test_route
            demands: a family difference enforced by plan.test-independence
          - anchor: { file: schemas/routing.schema.json, pointer: "#/$defs/seatRoute/properties/test_route" }
            meaning: with test_route omitted or null, a test task that 'uses the engineer route' and then needs fixed
              tests or a routing deviation
            demands: a plan-gate remedy (routing deviation under plan approval) that the patch track never has
        kept:
          meaning: "one meaning: a work order of kind test on the engineer's test route (a different declared family)
            that lands before the build task, its tests becoming the build task's frozen_tests"
          provides: existence only where run.plan writes it; the patch use demands the same object without a producer,
            without the plan-gate family check and without the null-route remedy, which is the gap; the term
            has no glossary row and gets one
      - name: patch
        uses:
          - anchor: { file: docs/00-vision.md, heading: Lifecycle }
            meaning: small change (at most 5 files and about 100 LOC, one element); phase 2 skipped
            demands: size and element bounds; no task or session count
          - anchor:
              file: docs/03-lifecycle.md
              heading: Track signals and the upward-only ratchet (including the no-index fallback)
            meaning: at most 1 session, 5 files, about 100 LOC, one element, no arch rules, contracts or public API; one
              Steward-derived work order
            demands: one session and one work order
          - anchor: { file: docs/03-lifecycle.md, heading: Patch track and policy path }
            meaning: a change of at most one session, five files and about 100 LOC, confined to one element
            demands: one session, while the same section admits a test task, a second engineer session
          - anchor: { file: docs/17-open-decisions.md, heading: "Adopted by recommendation (reversible, with ADR)" }
            meaning: "row 2: at most 5 files and about 100 LOC; one element or unmapped paths; no protected globs, INV or
              obligations; an approved request; red/green proof; the policy lens set"
            demands: the predicates the owner confirms; no session or work-order count
        kept:
          meaning: "the glossary meaning: a change bounded by files, LOC and element, with phase 2 skipped"
          provides: bounds on the change, not on the number of tasks; the session and work-order counts are the track
            table's and the patch section's own sentences, restated by the fix as one build session and one
            build order plus at most one derived test order plus any resolution order the integrator derives
            on a replay conflict
      - name: session
        uses:
          - anchor:
              file: docs/03-lifecycle.md
              heading: Track signals and the upward-only ratchet (including the no-index fallback)
            meaning: the unit the patch bound counts ('At most 1 session')
            demands: a count the classifier or the ratchet can compute; neither has a session signal
          - anchor: { file: docs/11-verification.md, heading: 7. Fix loop }
            meaning: a runtime conversation ('resume the same engineer session')
            demands: a resumable runtime session
          - anchor: { file: config/keel.defaults.yaml, pointer: "#/tracks/patch/max_sessions" }
            meaning: "'one session keeps a patch small enough that skipping the plan phase is safe; anything that needs a
              second session has a plan worth checking'"
            demands: that a second session raise the track, which a derived test task would trigger
        kept:
          meaning: "a runtime session of one seat run (09-runtimes: session id, resume, fork)"
          provides: one meaning if the patch bound is read as sessions of the build task; the fix says 'one build
            session' so the test task's and a resolution task's sessions are outside the bound and the config
