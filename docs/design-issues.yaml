          provides: a stable bound artifact; the term has no glossary row today and gains one (home 03)
      - name: commits the record as soon as it is written
        uses:
          - anchor:
              file: docs/02-alignment.md
              heading: Board approvals (explicit confirmation, hash binding, invalidation)
            meaning: the keel approve process makes a governance or governance-style commit of the record immediately, so
