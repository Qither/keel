        - field: proposal states integrating and land_pending
          readers: [ board.status, dashboard.build (Board queue), "audit.sweep (liveness: pending approval)" ]
        - field: exit codes 3 (needs a human) and 5 (stale trunk)
          readers: [ board.land (both invocations), docs/05-vcs.md Three land cases ]
      tally:
        - track: patch
