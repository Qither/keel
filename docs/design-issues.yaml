    - id: gate.submit
      doc: { file: docs/03-lifecycle.md, heading: Phase 3 Build }
      after:
        - steward.run.commit-round
        - seat.submit
        - steward.run.ingest
        - gate.submit.brief
        - gate.submit.ack
        - gate.submit.result
        - gate.submit.freshness
        - gate.submit.scope
        - gate.submit.frozen-paths
        - gate.submit.fake-completion
        - gate.submit.ratchet
        - gate.submit.reserved-op
        - gate.submit.provider-path-events
        - gate.submit.subagent-events
        - gate.submit.obligations-cheap
        - gate.submit.commands
