          - anchor: { file: docs/04-trace-and-state.md, heading: Declared plane }
            meaning: the write rule 'Approval records are committed as soon as they are written', naming the archive
              commit for the land record
            demands: the same; it repeats the contradiction for the land kind
          - anchor: { file: docs/01-org-model.md, heading: Single-writer ownership }
            meaning: approval records are written by the Board through keel approve and committed by the Steward
            demands: the Steward commits every record
        kept:
          meaning: "keel approve commits every record it writes, immediately and itself: on trunk for document, policy
            and receipt records, on keel/<P>/main for a proposal's records including the land record"
          provides: a producer that precedes every consumer of the record, for every kind
      - name: governance commit
        uses:
          - anchor: { file: docs/04-trace-and-state.md, heading: Steward commits and trailers }
            meaning: "the term's home row: Governance commit | trunk, made by keel approve --doc <path> | Keel-Doc,
              Keel-Approval; one of the three Steward commit kinds land.trace admits in its range"
            demands: that a record commit on keel/<P>/main be one of the three kinds; by the row's Where column today it
