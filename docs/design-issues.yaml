    terms:
      - name: impact
        uses:
          - anchor: { file: docs/00-vision.md, heading: Glossary }
            meaning: "the glossary home (Architecture table, row impact: 'IM-<sha12>: changed files → symbols → dependents
              → elements, boundaries, owners, affected tests', home 07): a reach from changed files to
              dependents and elements, no depth stated"
            demands: nothing beyond a bounded reach; the row must state the bound so it cannot be read as a closure
          - anchor: { file: docs/07-architecture-intelligence.md, heading: Impact and the ratchet }
            meaning: "the formula: 'Impact follows one path: changed files, then the symbols in them, then dependents at
              depth 2, then the elements those belong to', over the available index"
            demands: a bounded, freshness-stamped report for the ratchet, owners, affected tests and collisions
          - anchor:
              file: docs/03-lifecycle.md
              heading: Track signals and the upward-only ratchet (including the no-index fallback)
            meaning: "predicted impact at intake and actual impact at submit: elements reached, boundaries crossed"
            demands: a bound that can only raise the track; the path fallback without an index
          - anchor: { file: docs/06-parallelism.md, heading: Waves }
            meaning: the same depth-2 set, called 'reverse closure at depth 2'
            demands: disjointness of two tasks' reach at depth 2; the word closure adds nothing
          - anchor: { file: docs/06-parallelism.md, heading: Collision prediction }
            meaning: the same depth-2 set, called 'the closure from changed files through symbols to dependents at depth
              2'
            demands: collision(A,B) = impact(actual diff of A) ∩ write_set(B) at depth 2
          - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
            meaning: "the verb mode keel arch impact (and MCP keel_arch op impact): the same report printed for a diff"
            demands: the same bound and freshness stamp
          - anchor: { file: docs/13-artifacts-schemas.md, heading: Type-only TypeScript }
            meaning: "the type ImpactReport in src/arch/analysis.ts: 'changed files to symbols to dependents at depth 2 to
              elements', with freshness, kind and unknown"
            demands: the same bound; a kind value per producer
        kept:
          meaning: the set reached from the changed files through their symbols to their dependents at depth 2 and the
            elements those belong to, computed by the lifter over the available index, stamped with freshness,
            every edge carrying provenance, and unknown when the overlay fails; recorded as an IM record whose
            kind says which diff it covers (predicted, actual or, from the fix, restack)
          provides: a bounded, freshness-stamped, provenance-labelled reach over one diff; never a transitive closure
            and never a proof about dependents beyond depth 2
      - name: impact closure (and 'closure' alone)
        uses:
          - anchor: { file: docs/07-architecture-intelligence.md, heading: Impact and the ratchet }
            meaning: "'Scope-limited evidence reuse relies on the same impact closure: from M4, evidence may be reused for
              a scope when the closure proves that no dependency of that scope changed': the same depth-2
              computation, named as a closure and claimed to prove an unbounded property"
            demands: the transitive dependency set of the scope (all depths) and a proof over it
          - anchor: { file: docs/11-verification.md, heading: 2. Source-state binding and land re-execution }
            meaning: "the reuse precondition: 'Scope-limited reuse is allowed only once the M4 impact closure proves that
              no dependency changed'"
            demands: the same unbounded, proven set
          - anchor: { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
            meaning: the reuse precondition restated in step 2
            demands: the same unbounded, proven set
          - anchor: { file: docs/15-roadmap.md, heading: M0–M8 scope and exit criteria }
            meaning: "the mechanism as an M4 deliverable: 'scope-limited evidence reuse through the impact closure'"
            demands: that the mechanism exist and be buildable in M4
        renamed:
          - new_name: restack impact
            meaning: "the impact (kept meaning: dependents at depth 2, freshness-stamped, provenance-labelled) of the
              restack delta, the files changed between the commit an evidence record was taken on and the
              restacked commit of the same work order, computed at land by steward.land.restack-impact on a
              fresh index and recorded as an IM record of kind restack (a third value beside predicted and
              actual in impactRecorded.kind, ImpactReport.kind and the IM row of the id table) in the git
              common dir; home 07. No use of 'impact closure' survives, and the word 'closure' is dropped from
              06 Waves and 06 Collision prediction as well, where it was a second name for the kept 'impact'."
      - name: proves / proven
        uses:
          - anchor: { file: docs/07-architecture-intelligence.md, heading: Drift and the unknown policy }
            meaning: "the home definition: 'the report says whether it is proven (evaluated on trusted edges from a fresh
              index covering the affected files) or unproven', a per-rule verdict on trusted scip or
              tree-sitter edges from a fresh index; this meaning is kept unchanged and needs no glossary row
              of its own (provenance and unknown carry it)"
            demands: trusted provenance and a fresh index over the affected files; nothing beyond them
          - anchor: { file: docs/11-verification.md, heading: 2. Source-state binding and land re-execution }
            meaning: the reuse claim 'the M4 impact closure proves that no dependency changed' (also in 07 Impact and the
              ratchet and 06 Integration queue); the rewritten rule stops saying 'proves' and says 'reaches
              none of ... on trusted edges from a fresh index; anything else, including unknown, re-runs'
            demands: the home standard (trusted edges, fresh index) applied to an unbounded set, which no fresh index
              covering the affected files at depth 2 can provide
      - name: dependency / dependents
        uses:
          - anchor: { file: docs/07-architecture-intelligence.md, heading: IndexProvider port and backends }
            meaning: "the port operation 'dependents(files, depth): files and symbols that depend on the given files, to
              the given depth' (also ADR-0007 Decision, item 2): the downstream set of the given files to a
              given depth; kept as the port defines it, under the existing IndexProvider glossary row"
            demands: a depth argument; no fixpoint is offered
          - anchor: { file: docs/11-verification.md, heading: 2. Source-state binding and land re-execution }
            meaning: "'no dependency changed' (also 07 'no dependency of that scope changed'): the converse relation, what
              the scope depends on, read transitively; the rewritten rule answers the converse question at the
              same depth by asking whether the work order's path set lies in dependents(restack delta, 2)"
            demands: every upstream file at every depth
      - name: scope
        uses:
          - anchor: { file: docs/11-verification.md, heading: 2. Source-state binding and land re-execution }
            meaning: "'Scope-limited reuse ... for a scope' and 'a scope matching zero paths fails its negative control':
              undefined for reuse; in the first bullet a glob scope of a hash. The rewritten rule names the
              work order (existing glossary row) as the reuse unit, whose EV record is already bound by
              workorder_hash and whose path set for the dependency question is write_set ∪ frozen_tests ∪
              affected tests; no new noun is introduced"
            demands: a named unit with a hash and a dependency set to ask about
          - anchor: { file: docs/11-verification.md, heading: gate:submit }
            meaning: "submit.scope: the diff is a subset of write_set plus allowed globs; a path set matched by keel's own
              glob matcher"
            demands: a glob set and the matcher
          - anchor: { file: docs/05-vcs.md, heading: Detection (the guarantee) }
            meaning: "'Any glob-scoped hash (for example over a work order's write_set) uses keel's own glob matcher': a
              hash over a glob-matched path set, which the rewritten rule uses per work order"
            demands: the matcher and a non-empty match
      - name: evidence
        uses:
          - anchor: { file: docs/11-verification.md, heading: 2. Source-state binding and land re-execution }
            meaning: "'Evidence is reused across restacks only when all match fields are equal': identity reuse, citing an
              existing EV record for a restacked commit instead of re-running"
            demands: all five match fields equal
          - anchor: { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
            meaning: "step 2 and the flowchart node 'source state identical?': the queue's cache decision before the
              preview"
            demands: identity, then the scope-limited relaxation
          - anchor: { file: docs/14-trust-security.md, heading: Hash chain and re-execution }
            meaning: "row 'An EV file': EV files are a cache; reuse before land needs equal source-state match fields"
            demands: that reuse never be an input to land
          - anchor: { file: docs/15-roadmap.md, heading: M0–M8 scope and exit criteria }
            meaning: M3 exit 'Evidence is reused only on an identical source state'; M4 scope 'scope-limited evidence
              reuse'
            demands: that the M3 criterion stay true and the M4 form be defined
        kept:
          meaning: "EV-<sha12>: a runner record of commands, exit codes, output digests and JUnit rows, bound to source
            state (the existing glossary row, home 11); reused across restacks by citing the existing record
            for a restacked commit instead of re-running the runner, decided in step 2 of the land queue,
            never an input to land.re-execution"
          provides: a cost saving at the restack and preview stage only; the safety property lives in land re-execution
        renamed:
          - new_name: restack reuse
            meaning: "the bounded M4 form of evidence reuse: a work order's evidence is reused when its match fields other
              than source_tree are equal, its write_set-scoped hash is equal between the recorded and the
              restacked commit, and the restack impact, on trusted edges from a fresh index, reaches none of
              its write_set, frozen_tests and affected tests; anything else, including an unknown restack
              impact, re-runs; home 11"
      - name: actual (impact kind)
        uses:
          - anchor: { file: docs/07-architecture-intelligence.md, heading: Impact and the ratchet }
            meaning: "'actual impact is computed from the diff at submit': the submit-time impact of the task's own diff,
              feeding the ratchet"
            demands: one producer (submit) and one diff (the task's own)
          - anchor: { file: docs/06-parallelism.md, heading: Collision prediction }
            meaning: "'the predicted impact from plan time and the actual impact at submit are both kept, so the planner's
              estimates can be compared with reality'"
            demands: that 'actual' mean the submit-time impact and nothing else, or the comparison is corrupted
          - anchor: { file: docs/04-trace-and-state.md, heading: Id table }
            meaning: "row IM: 'Predicted or actual impact'"
            demands: one row naming every kind an IM record can carry
          - anchor: { file: schemas/ledger-event.schema.json, pointer: "#/$defs/impactRecorded/properties/kind" }
            meaning: the enum {predicted, actual} of the impact.recorded event, read by the ledger, the dashboard
              collision overlay and the receipt's collision list
            demands: one meaning per value; a restack-delta impact filed under 'actual' would be a second meaning for one
              value (5.3 step 4), so the fix adds the value 'restack' here, in ImpactReport.kind and in the IM
              row instead
          - anchor: { file: docs/13-artifacts-schemas.md, heading: Type-only TypeScript }
            meaning: "ImpactReport.kind: 'predicted' | 'actual' in src/arch/analysis.ts"
            demands: the same enum as the ledger event
    options:
      - "Option 1, bounded restack reuse: give the second meaning its own identifier 'restack impact' (the
        impact, dependents at depth 2, of the files changed between the evidence's recorded commit and the
        restacked commit, computed at land on a fresh index and recorded as an IM record of a new kind
        'restack', added to impactRecorded.kind in schemas/ledger-event.schema.json, to ImpactReport.kind in
        src/arch/analysis.ts and to the IM row of the id table of 04, so that 'actual' keeps its single
        meaning), restate the rule as 'a work order's evidence is reused when its match fields other than
        source_tree are equal, its write_set-scoped hash is equal, and the restack impact on trusted edges
        from a fresh index reaches none of its write_set, frozen_tests and affected tests; anything else,
        including unknown, re-runs', drop 'closure' and 'proves' everywhere, state impact in 07 and the
        glossary as a bounded reach (dependents at depth 2) stamped with freshness without naming what it
        replaced, give 'restack impact' (home 07) and 'restack reuse' (home 11) one glossary row each, and
        state that land re-execution is the authority."
      - "Option 2, a true closure: add a fixpoint traversal (dependents to saturation) to the lifter beside
        the depth-2 impact, keep the name 'impact closure' with its own glossary row and home, and qualify the
        claim to 'no dependency changed on trusted edges from a fresh index; unknown or any heuristic edge on
        the path re-runs'."
      - "Option 3, identity-only reuse: delete scope-limited reuse from 07, 11, 06 and the M4 scope; evidence
        is reused only when every match field is equal, and everything else is re-run at restack and again at
        land."
    recommendation: "Option 1. It removes both halves of the collision: one formula keeps one name ('impact', with
      its bound stated in the glossary as a bounded reach at depth 2 stamped with freshness, and the word
      'closure' dropped from 06 Waves and Collision prediction), and the second meaning gets its own English
      identifier ('restack impact') with one home and one glossary row, while the kept use is rewritten so the
      claim demands exactly what dependents at depth 2 on trusted edges from a fresh index provides, which 5.3
      step 4 requires before a rename may close the issue. The restack impact is filed under a third kind
      'restack' rather than under 'actual': 07, 06 Collision prediction, the 04 id table, impactRecorded.kind
      and ImpactReport.kind all define 'actual' as the submit-time impact of the task's own diff, and the
      readers of that value (the dashboard collision overlay, the receipt's collision list, the
      predicted-versus-actual comparison, the Track ratchet rate measure) stay unchanged because they read
      kind actual only; the new value gains evidence.reuse and the ledger as readers, so no enum value carries
      two meanings and no field is dead. It satisfies step 7 for the precondition: the rewritten sentence
      names what produces the restack impact (steward.land.restack-impact, after steward.land.restack and
      arch.index) and where it lives (an IM record of kind restack in the git common dir, with its
      impact.recorded event in the ledger), and it names what happens on the honest answer (unknown re-runs).
      The unit of reuse is the work order, an existing glossary row, so no new noun is introduced for 'scope'.
      It creates no new cycle (the new step follows steward.land.restack and arch.index and precedes
      evidence.reuse; no step needs a later artifact), no deadlock (the rule is a precondition with no wait or
      lock), no unreachable place (IM records, the index cache, ledger events and EV files in the git common
      dir and the work orders on the proposal branch are all reachable from the local land process) and no
      mandate conflict (sections 1 and 2 are silent on evidence). The order map edits are additive: step
      steward.land.restack-impact (doc 06 'Integration queue and land re-run', after [steward.land.restack,
      arch.index], runs_in local), artifact restack-impact (doc 11 section 2, produced_by
      steward.land.restack-impact, required_by [evidence.reuse], where git-common-dir), evidence.reuse.after
      gains steward.land.restack-impact, index.required_by gains steward.land.restack-impact,
      work-orders.required_by gains evidence.reuse; the map carries no edge tagged DI-06 today, so there is
      nothing to reproduce red first and nothing to untag, and the issues check stays green before and after.
      The walk is stated against the map as it stands (impact-record is produced by steward.plan.route; the
      submit-time actual impact of gate.submit.ratchet has no producer edge on impact-record), and adding that
      submit producer is left to its own entry rather than folded into this commit. The safety property stays
      where it already is: land.re-execution never reads an EV file, so a bounded reuse heuristic can never
      land untested code, and the M3 exit criterion remains true. The closing terms are shaped for the
      glossary check of validate.mjs: 'kept' appears only on 'impact' and 'evidence', both existing rows, and
      the two renamed names 'restack impact' and 'restack reuse' each get exactly one new row; the home
      paragraphs of 07 and 11 and the glossary rows state the current design only and name nothing they
      replaced (5.5). Option 2 buys a whole-graph traversal per land whose claim still cannot exceed trusted
      provenance and whose saturation on a real repository reaches most files, so reuse would rarely fire:
      cost without gain. Option 3 is sound but doubles the runner cost on every restacked wave and shrinks the
      M4 scope for no safety benefit. A rename-only fix (keep 'closure', define it as depth 2) is excluded by
      step 4 because the kept use would still demand more than the definition provides, and filing the restack
      impact under kind 'actual' is excluded by the same step because it would give one enum value two
      meanings."
    decision:
      by: recommendation
      date: 2026-09-27
      option: "Option 1: impact keeps its depth-2 bound under one name; restack reuse rests on a restack impact
        computed at land, never called a closure"
      recorded_in: [ docs/07-architecture-intelligence.md, docs/11-verification.md ]

  - id: DI-07
    title: The architecture model changes only at land, so an approved new dependency fails verify.arch before land
    statement: >-
      The declared model changes only through an arch delta applied by the land archive commit, and the
      verify.arch check judges new violations against the declared model. A contract approval on the system
      track binds an arch delta that adds a dependency; a correct implementation of that dependency is judged
      against the trunk model, which does not yet contain it. No target model (trunk model plus the approved
      delta) is defined for verification and preview.
    status: decided
    found_by: external-review
    found_on: 2026-09-26
    root_cause: no-order-check
    anchors:
      - { file: docs/07-architecture-intelligence.md, heading: "Declared model" }
      - { file: docs/07-architecture-intelligence.md, heading: "Drift and the unknown policy" }
      - { file: docs/11-verification.md, heading: "gate:verify" }
    class: cycle
    blocks: M4
    walk:
      producers:
        - precondition: "verify.arch and the preview drift need a declared model that contains every relation, element
            and rule the contract-approved arch delta adds (07 Drift: 'compares the derived element graph with
            the declared model and rules'; 11 verify.arch: 'no new errors backed by trusted-provenance
            edges')"
          producer: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
          position: after
          sufficient: true
          reason: steward.land.apply-arch-delta produces exactly the model the check needs, but it runs after gate.land,
            which runs after gate.verify; the consumer precedes its producer, which is the red edge (the order
            map records arch-model produced_by steward.land.apply-arch-delta and required_by gate.verify,
            gate.verify.arch, steward.land.preview, gate.land and gate.submit)
        - precondition: the declared model that exists when the round is judged
          producer: { file: docs/07-architecture-intelligence.md, heading: Declared model }
          position: before
          sufficient: false
          reason: the previous land's model at the trunk commit exists and is fresh, but it lacks the approved relation
            and, on add-element, the element itself, so a derived scip or tree-sitter edge that realizes the
            approved add-relation is classified undeclared-dependency (error) and fails the check on the
            system track; the trunk model is complete against the wrong target
        - precondition: the approved arch delta (typed ops with base hashes) bound by the contract approval
          producer: { file: docs/03-lifecycle.md, heading: Phase 1 Frame (and design on system) }
          position: before
          sufficient: true
          reason: run.frame writes the ops on the proposal branch and board.approve.contract binds the blob into
            contract_hash, so trunk model plus this delta determines the judged-against model
            deterministically; the defect is that no sentence in 07, 11, 06, 04 or 03 names the delta as an
            input of verify.arch, arch.drift, the preview, land.trace, submit.ratchet or arch find, so a
            sufficient producer is unread (the map lists arch-delta.required_by as gate.frame,
            board.approve.contract, steward.land.apply-arch-delta, steward.land.archive-commit and
            gate.frame.arch-to-be only)
        - precondition: frame.arch-to-be needs 'the to-be model' that 'passes rules.yaml'
          producer: { file: docs/11-verification.md, heading: gate:frame }
          position: absent
          sufficient: false
          reason: no document, schema or verb produces a to-be model; the term appears only in this check row and in
            skills/keel-design/SKILL.md step 6 (the architect checks it by hand); the check therefore has a
            consumer without a producer, the same missing artifact as the verify defect seen from the frame
            side
        - precondition: the integration preview runs drift on the combined tips (06 step 3)
          producer: { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
          position: before
          sufficient: false
          reason: "the detached verify worktree is sparse and excludes /.keel/proposals/ (04 Declared plane; 05
            sparse-checkout set --no-cone '/*' '!/.keel/proposals/'), so the checkout carries neither
            arch.delta.yaml nor a post-delta model: it holds the trunk .keel/arch/model.yaml, and the Steward
            would have to read the delta from the proposal branch keel/<P>/main, which no sentence tells it to
            do; the delta is applied only by the archive commit that follows the preview, so the preview drift
            judges against the trunk model and turns red on the approved relation"
        - precondition: a fresh per-commit index of the round commit (derived graph)
          producer: { file: docs/07-architecture-intelligence.md, heading: Per-commit index and diff overlay }
          position: before
          sufficient: true
          reason: arch.index runs before drift; a stale or failed overlay honestly answers unknown, so the derived half
            is not part of the defect
        - precondition: land.trace's realization-mismatch and frame.ears need the elements named in a requirement's
            realized_in to exist in the model that the covering commits' paths map through
          producer: { file: docs/03-lifecycle.md, heading: Phase 1 Frame (and design on system) }
          position: before
          sufficient: false
          reason: run.frame writes realized_in element refs on the proposal branch, and on an approved add-element those
            refs name the element the delta adds; the only model available to resolve them and to map the
            covering commits' paths is the trunk model, which lacks that element, so the refs resolve to
            nothing and the paths map to the parent element or to unmapped
      consumers:
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: a declared model that contains the approved relation
          released_by: steward.land.apply-arch-delta, which cannot run until this gate passes
          outcome: breaks
          reason: keel check <P> --gate verify runs verify.arch against the trunk model; on a system proposal whose
            delta adds a relation, a correct implementation with tree-sitter edges is reported as a new
            undeclared-dependency error and the gate fails
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-during-wave
          outcome: breaks
          reason: the same report-only check during a wave reads the same trunk model and prints the same failure; the
            report cannot tell an approved-pending relation from an undeclared one
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: second-steward-process
          outcome: breaks
          reason: check does not wait for the supervisor lock (report-only, no ledger writes), so a second Steward
            process sees the same wrong verdict
        - anchor: { file: docs/03-lifecycle.md, heading: Phase 4 Verify }
          actor: supervisor
          waits_for: steward.land.apply-arch-delta of this proposal
          released_by: nothing before land; the only bypass is a Board override that waives verify.arch
          outcome: breaks
          reason: run (build) ingests the round, gate:submit passes and gate.verify.arch runs on the round commit
            against the trunk model; the task enters fixing on a finding the engineer cannot fix without
            deleting the approved dependency, and after round 5 it is blocked(non_convergence)
        - anchor: { file: docs/11-verification.md, heading: 4. Review lenses and lens sets }
          actor: seat
          outcome: holds
          reason: run (review) with the thorough set launches the architecture lens, whose prompt already counts this
            proposal's arch delta as declared; the LLM judgement is consistent with the contract while the
            deterministic check is not, which is the inversion KP-10 and KP-04 forbid (control is code)
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: the archive commit's applied delta
          released_by: steward.land.archive-commit, which runs after the preview and gate.land
          outcome: breaks
          reason: keel land <P> (first run) and keel land <P> --preview run drift on the combined tips in the detached
            verify checkout, which is sparse, excludes /.keel/proposals/ and holds the trunk model; the
            preview is red, bisect drops tips in wave order and assigns a fix round to the tip that introduced
            the approved dependency, which has nothing to fix
        - anchor: { file: docs/11-verification.md, heading: gate:land }
          actor: board-at-terminal
          outcome: breaks
          reason: gate.land requires a green preview; with the preview red on the approved relation, the land gate
            cannot pass and the receipt draft is never written
        - anchor: { file: docs/04-trace-and-state.md, heading: RTM and drift classes }
          actor: board-at-terminal
          waits_for: a model in which the added element exists and its paths map
          released_by: steward.land.apply-arch-delta, which runs after gate.land
          outcome: breaks
          reason: keel land <P> (first run) runs gate.land, whose land.trace (after steward.land.restack, before
            steward.land.apply-arch-delta in the map) fails on any failing drift class of 04; on an approved
            add-element the covering commits' paths map through the trunk model to the parent element or to
            unmapped while realized_in names the element the approved delta adds, so realization-mismatch
            fires and gate.land fails on the same missing artifact before the step that would add the element
            ever runs
        - anchor:
            file: docs/03-lifecycle.md
            heading: Track signals and the upward-only ratchet (including the no-index fallback)
          actor: supervisor
          outcome: breaks
          reason: "gate.submit.ratchet computes actual impact and predicted-versus-actual for a round of this same
            proposal on the trunk model (the map lists gate.submit in arch-model.required_by): an approved
            add-relation counts as a boundary crossed that the trunk model does not declare, and paths of an
            approved add-element are unmapped, so actual impact and the predicted-vs-actual record are
            computed on the wrong model; weaker than the verify failure because the track can only rise and a
            system proposal is already at the top, but a feature proposal is not on this path and the impact
            record itself is wrong"
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: seat
          outcome: breaks
          reason: "keel arch find and keel arch impact are print-only and allowed under KEEL_RUN, so an architect or
            engineer seat runs them inside a system proposal; hits and boundaries are mapped on the trunk
            model (07 Search: every hit mapped to its element and owner; arch.find is in
            arch-model.required_by), so paths of an approved add-element show as (unmapped) with no owner and
            an approved add-relation is reported as a crossed undeclared boundary, contradicting the brief the
            seat was given"
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          outcome: breaks
          reason: keel arch impact, keel arch find and keel arch render run by a Board member during a system proposal
            map hits and draw boundaries on the trunk model; the render and impact output carry no label that
            says the proposal's approved delta is not applied, so the Board reads a picture that contradicts
            the contract it approved
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          outcome: holds
          reason: keel trace --matrix prints the realizing elements column from realized_in as written and labels every
            gap cell with text; it is display only and makes no verdict, so an element the delta adds appears
            by id even though the trunk model does not hold it; the mismatch it shows is the land.trace
            failure, not a failure of its own
        - anchor: { file: docs/11-verification.md, heading: gate:frame }
          actor: board-at-terminal
          outcome: breaks
          reason: the map places gate.frame.ears in arch-model.required_by, so it resolves realized_in element refs
            against the trunk model (an unresolvable ref is 'ref missing'); on an approved add-element the
            requirement's realized_in names the element the delta adds, which the trunk model lacks, so the
            frame gate fails at keel check <P> --gate frame before the contract can be approved; it is a
            same-instance consumer and the earliest point where the missing artifact bites, since the delta
            that adds the element is written by the same run.frame that writes the requirement
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: nothing
          released_by: the Board's override record
          outcome: holds
          reason: "keel approve <P> --rule override naming verify.arch (and the preview, and land.trace) is the only
            release the design offers: verify.arch and land.trace are waivable (only frame.approvals,
            land.approval and land.projection are not); this turns every dependency-adding or element-adding
            system change into a fourth Board action and records the rule as waived, not proven, so the
            release exists but is the cost the mandate does not need"
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          outcome: holds
          reason: the contract approval binds the delta blob into contract_hash and frame.arch-to-be flags baseline
            growth and loosening for it; the Board's decision over the target is recorded correctly, it is
            simply never consumed downstream
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: seat
          outcome: breaks
          reason: an architect or engineer seat running keel arch drift inside its run sees the dependency its brief
            tells it to build reported as an undeclared-dependency error, with no label that says the relation
            is approved and pending
        - anchor: { file: docs/12-cli-api-mcp.md, heading: "5. MCP (two read tools, one write tool)" }
          actor: seat
          outcome: breaks
          reason: seat.arch-query (agent-api) returns hits, impact and the element page with open drift computed against
            the trunk model; the same misreport as keel arch find, impact and drift reaches the seat through
            MCP
        - anchor: { file: docs/02-alignment.md, heading: Brief compiler and normalized hashing }
          actor: supervisor
          outcome: breaks
          reason: "steward.run.compile-brief compiles the element brief (07: purpose, owner, relations, rules with proof
            status) from the trunk model, so the engineer of a system task is briefed on elements whose
            approved relation and, for add-element, whose very element is absent; the brief and the frozen
            intent disagree about the architecture the seat must realize"
        - anchor: { file: docs/03-lifecycle.md, heading: Phase 2 Plan }
          actor: board-at-terminal
          outcome: breaks
          reason: steward.plan.route computes per-task impact and reviewer routing by element owner from the trunk
            model; paths of an element the delta adds are unmapped and have no owner, so owner routing and the
            element-level impact of those work orders are computed on the wrong model (weaker than the verify
            failure, same missing artifact)
        - anchor: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
          actor: board-at-terminal
          outcome: breaks
          reason: approve --stage land is reachable only through the override path; the receipt then says 'arch delta
            applied' next to a drift report that lists the approved relation as an error, a trace report that
            lists realization-mismatch, and an override that waived them, so the Board reads a receipt that
            contradicts itself
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          outcome: holds
          reason: steward.land.apply-arch-delta and steward.land.archive-commit apply the delta with the base-hash
            refusal and append the series point; the writer of the committed model is correct and stays the
            only writer
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 6. keel hook }
          actor: hook
          outcome: holds
          reason: no hook guard reads the architecture model; hooks warn, gates decide, and the rule has no hook
            consumer
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: ci-fresh-clone
          outcome: holds
          reason: the CI check at the trunk tip reads the archive commit, where the delta is already applied; a clone
            reaches trunk and archive commits, and verify.arch is not part of the CI check
        - anchor: { file: docs/04-trace-and-state.md, heading: Land projection and the projection gate }
          actor: second-machine
          outcome: holds
          reason: another machine sees only the committed model and the archived delta, both consistent after land;
            nothing in flight is visible to it
        - anchor: { file: docs/08-dashboard.md, heading: Architecture }
          actor: dashboard
          outcome: holds
          reason: dashboard.build renders the committed model and labels every overlay with provenance and freshness; it
            makes no verdict; the drift overlay of an in-flight proposal today reproduces the trunk-model
            misreport as a labelled picture, and under the fix dashboard.build is added to
            arch-target-model.required_by so that overlay is computed against the proposal's target model and
            carries the judged_against stamp, which is a data change, not a rule change
        - anchor: { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
          actor: crashed-supervisor
          waits_for: steward.land.apply-arch-delta
          released_by: none (the releasing step is after the waiting gate)
          outcome: breaks
          reason: "the wait in verify.arch, in the preview and in land.trace is released only by
            steward.land.apply-arch-delta, and that step is downstream of the waiting gates: the release is
            the very outcome the land exists to cause, which is the deadlock shape of 5.3; a crashed or hung
            land process changes nothing, because the releasing step is never reached even when nothing
            crashes"
      places:
        - artifact: arch-model
          where: trunk-commit
          reachable_from: [ local, supervisor, clone ]
        - artifact: arch-baseline
          where: trunk-commit
          reachable_from: [ local, supervisor, clone ]
        - artifact: arch-delta
          where: proposal-branch
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: spec-delta
          where: proposal-branch
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: contract-approval-record
          where: proposal-branch
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: round-commit
          where: task-branch
          reachable_from: [ local, supervisor, seat, agent-api ]
        - artifact: verify-checkout
          where: workspace-root
          reachable_from: [ local, supervisor ]
        - artifact: preview-commit
          where: git-common-dir
          reachable_from: [ local, supervisor ]
        - artifact: index
          where: git-common-dir
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: archive-commit
          where: trunk-commit
          reachable_from: [ local, supervisor, clone ]
      readers:
        - field: arch-delta.schema.json ops[] (required, minItems 1)
          readers:
            - steward.land.apply-arch-delta
            - gate.frame.arch-to-be (loosen-rule and baseline-grow flagging)
