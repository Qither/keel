          actor: dashboard
          outcome: unchanged
          reason: the Board queue lists the alerts the ledger records; a reader of the false positive today, it shows
            fewer items under the fix and its wording stays.
        - anchor: { file: org/reserved-actions.yaml, pointer: "#/actions" }
          actor: board-at-terminal
          outcome: changed
          reason: the file's header comment above the actions node says "A change keel did not make sets
            blocked(reserved_op) at ingest and becomes a Board item (docs/05-vcs.md)"; a land's diff sets the
            same reason, so the comment gains "at ingest or at land"; the actions themselves and their detect
            lists (ref-snapshot, ls-remote) are unchanged.
        - anchor: { file: schemas/reserved-actions.schema.json, pointer: "#/description" }
          actor: board-at-terminal
          outcome: changed
          reason: '"A reserved-operation diff at ingest sets blocked(reserved_op) and becomes a Board item" restates the
            rule for ingest only; the description gains "at ingest or at land" (a description-only change of a
            stable schema, no field changes).'
        - anchor: { file: docs/adr/ADR-0001-git-primary-jj-optional.md, heading: Decision }
          actor: board-at-terminal
          outcome: holds
          reason: a land-start snapshot is the same git primitive; the decision is not flipped.
        - anchor: { file: docs/adr/ADR-0003-control-plane-in-git-common-dir.md, heading: Decision }
          actor: board-at-terminal
          outcome: holds
          reason: ingest-time statement; unchanged, and the land snapshot lives in the same git common dir.
        - anchor: { file: docs/adr/ADR-0005-explicit-confirmation-approvals.md, heading: Decision }
          actor: board-at-terminal
          outcome: holds
          reason: it is precisely the outside-window append the land diff must not flag; the fix makes the land diff
            span only the land's own exclusive interval, and the land approval is recorded between the two
            land processes, outside both.
        - anchor: { file: docs/04-trace-and-state.md, heading: Land projection and the projection gate }
          actor: second-machine
          outcome: holds
          reason: another machine sees committed records and archive projections only; no snapshot, no diff; not a
            consumer.
        - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
          actor: crashed-supervisor
          waits_for: the crash-recovery rule of DI-05 (who closes the run and its window, and who recovers a lock a
            crashed holder left)
          released_by: undefined as written (DI-05)
          outcome: breaks
          reason: "the holder crashes or never releases: a supervisor that dies after its ingest appends and before its
            window check leaves an unverified window; its anchor moves are explained by no surviving process,
            and the land diff as written lumps them with every legitimate append into blocked(reserved_op).
            Under the fix they lie before the land's baseline and are out of the land diff's scope; whether
            and how an unverified window is closed, and how a supervisor lock left by a crashed land process
            is recovered, is DI-05's rule, which is corrected first."
