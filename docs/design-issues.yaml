    terms:
      - name: verified ledger chain
        uses:
          - anchor:
              file: docs/02-alignment.md
              heading: Board approvals (explicit confirmation, hash binding, invalidation)
            meaning: the chain in <git-common-dir>/keel/ledger/ verified by a Steward process against the anchor
              refs/keel/ledger/head
            demands: a local process with the git common dir and refs/keel; what the definition provides
          - anchor: { file: docs/14-trust-security.md, heading: Server-side branch protection recommendations }
            meaning: a chain a CI job could verify from the pushed trunk
            demands: "a chain and an anchor reachable from a clone; the definition provides none (04: the ledger is local
              to one machine in v1; 14 item 4 rejects refs/keel on the forge)"
          - anchor: { file: docs/11-verification.md, heading: gate:land }
            meaning: as in 02
            demands: the local chain; provided
        kept:
          meaning: "the local chain verified against the anchor of the machine that recorded the events (home: 04
            'Single writer' and 'What the chain proves')"
          provides: detection of edits and foreign appends on that machine; nothing on another clone
      - name: approval / approval record
        uses:
          - anchor: { file: docs/14-trust-security.md, heading: Approvals and the single writer }
            meaning: approval = record + event on the verified chain; record alone = data
            demands: the event; provided locally
          - anchor: { file: docs/14-trust-security.md, heading: Server-side branch protection recommendations }
            meaning: a record whose hashes match the content at the commit, i.e. consistency, not authority
            demands: only the record, the schema and the bound artifacts at the record's commit; a clone provides these
              for the records a tip commit adds, but the check the item names (land.approval) demands the
              event, the chain head and the amendment/expiry condition too
          - anchor: { file: docs/00-vision.md, heading: Alignment mechanics }
            meaning: AP-<sha12>, the JSON record keel approve writes after an explicit confirmation
            demands: nothing beyond the record's fields; provided
        kept:
          meaning: approval record as the glossary defines it, and approval (authority) as record plus its event on the
            verified chain (14 'Approvals and the single writer', ADR-0005 decision 4)
          provides: the authority rule the local gates apply; on a clone, process history whose hashes can be compared
            (ADR-0005 'What keel does not claim')
        renamed:
          - meaning: "the record-and-content conditions alone, run over the records the checked commit itself adds under
              .keel/approvals/: the record validates against the schema, kind/stage/subject match the commit's
              subject, and every bound artifact re-hashes to the recorded value (land record: receipt.md above
              the '## Land approval' heading at the archive commit; doc, policy and receipt-ack records: the
              listed paths at the record's own commit field, an ancestor of the tip); reads no ledger, reports
              the event, chain-head and amendment/expiry conditions as not evaluated on a clone, proves
              consistency and confers no authority"
            new_name: approval content check (check id land.approval-content)
      - name: governance commit
        uses:
          - anchor: { file: docs/00-vision.md, heading: "State, trace and VCS" }
            meaning: the commit of a document, policy or receipt record on trunk
            demands: nothing; the home
          - anchor: { file: docs/14-trust-security.md, heading: Server-side branch protection recommendations }
            meaning: every trunk commit that carries a record under .keel/approvals/, the archive commit (land record) and
              the governance-style commits on keel/<P>/main (contract, plan, request, rulings) included
            demands: a class wider than the definition; the archive commit is its own glossary term and 02 calls the
              proposal-branch commits 'governance-style'
        kept: { meaning: the glossary meaning, provides: "document, policy and receipt commits on trunk" }
        renamed:
          - meaning: any commit at the checked tip that adds a record under .keel/approvals/ (governance commits and the
              archive commit)
            new_name: approval-carrying commit (plain wording in 14 item 5; no glossary row needed)
      - name: check id (--check <id>)
        uses:
          - anchor: { file: docs/11-verification.md, heading: 1. Five phase gates and the check catalogue }
            meaning: land.approval
            demands: the namespaced id; provided
          - anchor: { file: docs/14-trust-security.md, heading: Server-side branch protection recommendations }
            meaning: a bare name without its gate
            demands: an id keel check resolves; no reader resolves 'approval' (readers list empty)
          - anchor: { file: docs/design-issues.yaml, pointer: "#/matrix/sequences/11" }
            meaning: the same bare name in the ci-check-at-tip sequence verb
            demands: the id the regression cells will run; the correcting commit renames it to land.approval-content
        kept:
          meaning: <gate>.<name> ids from the catalogue
          provides: one resolvable id per check; the CI invocation and the ci-check-at-tip sequence name
            land.approval-content
      - name: process history
        uses:
          - anchor: { file: docs/14-trust-security.md, heading: Known limits }
            meaning: what committed records and projections are on a machine other than the recording one
            demands: nothing; consistent with 04, 17 and ADR-0005
          - anchor: { file: docs/14-trust-security.md, heading: Server-side branch protection recommendations }
            meaning: as above
            demands: that item 5 of the same section ask a clone for no more than history consistency; item 5 as written
              asks for the local authority check
        kept: { meaning: the limit-10 meaning, provides: the exact scope of what the CI check may claim }
      - name: receipt draft / receipt.md
        uses:
          - anchor:
              file: docs/02-alignment.md
              heading: Board approvals (explicit confirmation, hash binding, invalidation)
            meaning: the draft the Board read, hashed into the land record
            demands: the draft bytes at check time
          - anchor: { file: docs/04-trace-and-state.md, heading: Land projection and the projection gate }
            meaning: the projected receipt equals the approved draft
            demands: byte identity under normalization over a stated region, which a clone content check relies on
          - anchor: { file: docs/13-artifacts-schemas.md, heading: Templates }
            meaning: receipt.md carries a section rendered from the land record below the hashed draft; the hashed draft
              is everything above that section (the same convention in 13 'Examples', the example receipt.md
              and test/README.md's golden test)
            demands: "that 02 (bound artifacts, kind land) and 04 name the region: land.receipt_draft covers the
              normalized bytes of receipt.md above the '## Land approval' heading"
        kept:
          meaning: "receipt draft: the normalized bytes of receipt.md above the '## Land approval' heading, which the
            land record hashes as land.receipt_draft; receipt.md: that draft plus the Land approval section
            the archive commit renders from the land record, never edited afterwards (existing template
            convention)"
          provides: a re-hashable region at the archive commit for the content check; 02 and 04 state the region, and
            the template, the example, the 13 rows and test/README.md stay as they are
    options:
      - "Split the check: keep `land.approval` as the local authority check (record, `approval.recorded` on
        the verified chain, chain head, content hashes, amendment/expiry) and add `land.approval-content`,
        which runs over the records the checked commit itself adds under `.keel/approvals/`: schema,
        kind/stage/subject against the commit's subject, and every bound artifact re-hashed per kind (land
        record: `receipt.md` above the `## Land approval` heading at the archive commit; doc, policy and
        receipt-ack records: the listed paths at the record's own `commit` field); reads no ledger, reports
        the event, chain-head and amendment/expiry conditions as not evaluated on a clone (never as pass),
        confers no authority, denominator counts only the conditions it runs. 14 item 5 names `keel check
        --gate land --check land.approval-content --at <sha>`, says it proves consistency, never authority,
        and the ci-check-at-tip sequence verb is renamed to the same id."
      - "Drop recommendation 5 entirely: CI runs no keel check; trunk protection rests on Board-only push
        identities and forge code-owner review of `.keel/approvals/` (items 2 and 6), and `ci.check-approval`
        leaves the order map."
      - "Make the ledger reach the clone: either have CI verify the event from the projected
        `ledger.slice.jsonl` in the archive commit, or push the ledger and `refs/keel/ledger/head` to the
        remote; the first contradicts 'projections are never trusted as input' (04, 14) and verifies a chain
        without its anchor, the second contradicts recommendation 4, '04: the ledger is local to one machine
        in v1' and reopens the multi-machine decision."
      - Keep `land.approval` in CI as written and accept that it reports `fail` (`approval.recorded` absent)
        at every trunk tip; a required status check that never passes is equivalent to option 2 with a
        permanently red badge.
    recommendation: "Option 1. It removes the unreachable place by pointing the clone consumer only at artifacts a
      clone reaches (the land record and the projected receipt at the archive commit; doc, policy and
      receipt-ack records at the governance commits on trunk), while the authority rule (record plus event on
      the verified chain) stays exactly as 02, 04, 14 and ADR-0005 state it. It adds no verb mode (`--check
      <id>` and `--at` are filters, so the KP-14 budget of 40 stays full and untouched), takes no lock (check
      is report-only, so no deadlock), leaves every required field with its readers (`ledger_chain_head` and
      `approval.recorded` keep their local readers; the bare id `approval`, which had none, is replaced by a
      resolvable id), and creates no mandate conflict (D6 and KP-03 hold; KP-16 is satisfied because the check
      names what it proves and what it does not evaluate). Five conditions the correcting commits must state,
      each answering a gap the first sketch left: (a) scope: `land.approval-content` at a tip covers only the
      records the tip commit itself adds, which is what the rewritten item 5 already says ('every record ... a
      trunk commit adds'); it never reads the request record, the amendment or override records (all on
      `keel/<P>/main`, `where: proposal-branch`) or the red/green proof (evidence in the git common dir, its
      projection never input), and the order map adds no edge from `ci.check-approval` to
      `request-approval-record`, `amendment-record` or `override-record`, so no new unreachable place appears;
      the amendment/expiry condition of 02 'Checking at the gates' is reported by the content check as not
      evaluated on a clone, never dropped silently and never shown as pass; (b) bytes: 02 (bound artifacts,
      kind land) and 04 'Land projection and the projection gate' state that `land.receipt_draft` covers the
      normalized bytes of `receipt.md` above the `## Land approval` heading, the convention
      `templates/proposal/receipt.md`, both 13 rows, the example receipt and test/README.md already follow, so
      the template, the example, the 13 rows and the test README do not change and the Land approval section
      stays in `receipt.md`; (c) which commit: per kind, the land record re-hashes that region at the archive
      commit (the tip commit that adds it), and doc, policy and receipt-ack records re-hash their listed paths
      at the record's own `commit` field (14 'What a record binds': the gate reads the artifacts at that
      commit), an ancestor of the tip in a clone, so the check never fails by construction on a tip that is
      not the record's commit; (d) order map: the new step `gate.land.approval-content` (doc 11 gate:land,
      `runs_in: local`) is ordered after whichever step commits the land record once DI-02 is corrected (today
      `steward.land.archive-commit`), never after `board.approve.land` alone, so it does not reproduce DI-02's
      red edge on an untagged step; in the same commit `ci.check-approval.after` becomes
      [gate.land.approval-content, steward.land.archive-commit, board.push] with `ledger.verify-chain`
      dropped, `approval-recorded-event.required_by` drops `ci.check-approval` and the entry loses `issue:
      DI-03`, `land-approval-record.required_by` and `receipt.required_by` add `gate.land.approval-content`
      (`receipt.required_by` also adds `ci.check-approval`), `archive-commit` and `trunk-tip` keep
      `ci.check-approval`, locks none; (e) register data: the matrix sequence `ci-check-at-tip` verb is
      renamed to `check --gate land --check land.approval-content --at <sha>` so the 28 regression cells name
      a check that exists. Documents: 14 item 5 rewritten as above with the ADR-0005 limit beside it; 11
      gate:land gains the `land.approval-content` row (M1b logic, M3 gate) and `land.approval` the phrase 'on
      the recording machine only'; 11 section 8 and test/README.md gain the two negative controls (edited
      bound artifact fails the content check in a fresh clone with the hash difference named; `land.approval`
      in a fresh clone fails with `approval.recorded` absent and is never shown as pass); 02 'Checking at the
      gates' says which conditions the content check runs alone and which need the ledger; 04 'What the chain
      proves' says other clones can run `land.approval-content` and cannot verify an event or a chain head; 15
      M1b scope and exit criteria add the clone-side criterion; 00-vision 'Verification' gains the glossary
      row 'approval content check'; 17 keeps 'Multi-machine collaboration' open with no new text; the zh-CN
      mirrors change in the same commit (D5); org/checkpoints.yaml, the approval schema and the ledger-event
      schema are unchanged. Red before green: the tagged edge stays reproduced in the order map until the
      correcting commit removes the edge and the DI-03 tag together, after which the `issues` check proves
      reachability for `clone` with no tolerated edge. DI-02's correction must keep the land record reaching
      trunk in or before the archive commit, so DI-03 is corrected with DI-02 or after it. Options 2 and 4
      remove the edge but give up the one consistency property a clone can prove; option 3 trades one cycle
      for a mandate-level contradiction with 04 and 14 and a reopened open decision."
    decision:
      by: recommendation
      date: 2026-09-27
      option: "Option 1: land.approval stays the local authority check; a clone-side land.approval-content check
        validates the committed record and the bound hashes at a commit"
      recorded_in: [ docs/14-trust-security.md, docs/11-verification.md ]

  - id: DI-04
    title: Every mutating verb waits for the supervisor lock without exception, so a hold or an abandon cannot
      reach the holder
    statement: >-
      The single-writer rule makes every other mutating verb, keel approve included, wait for the supervisor
      lock while a seat runs, with no exception. Cancellation says that a Board hold and an abandon ruling
      cancel the running task. The hold mode and the abandon ruling are mutating verbs, so they wait for the
      lock that only the run they are meant to stop releases.
    status: decided
    found_by: external-review
    found_on: 2026-09-26
    root_cause: rule-tightened
    anchors:
      - { file: docs/04-trace-and-state.md, heading: "Single writer" }
      - { file: docs/06-parallelism.md, heading: "Cancellation" }
      - { file: docs/12-cli-api-mcp.md, heading: "1. 16 verbs and at most 40 modes" }
      - { file: docs/03-lifecycle.md, heading: "Proposal states" }
    class: cycle
    blocks: M1a
    walk:
      producers:
        - precondition: The supervisor lock is released so a waiting mutating verb (run --hold on, approve --rule
            abandon) can proceed
          producer:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
          position: after
          sufficient: false
          reason: steward.run.end is after steward.run.cancel, which is after board.run.hold-on and
            board.approve.rule.abandon in the hold and abandon sequences; the release is produced by the very
            outcome the waiting mode exists to cause, so the wait never ends. This is the tagged red edge
            (lock.supervisor, issue DI-04).
        - precondition: "The cancellation is appended to the ledger before the process is signalled (06 Cancellation:
            'keel appends the cancellation to the ledger before it signals the process')"
          producer: { file: docs/06-parallelism.md, heading: Cancellation }
          position: absent
          sufficient: false
          reason: "No sentence names which process appends it. The window check (04 Single writer) accepts only the
            supervising process's own appends during the run window, so the appender must be the supervisor;
            but the Board verb that triggers the hold or the abandon is the one that holds the intent and it
            cannot append without the lock. The ledger event enum (schemas/ledger-event.schema.json
            #/$defs/eventType) has no cancellation type: the nearest are hold.changed (Board-appended),
            claim.released{reason: cancelled} and run.finished{outcome: killed} (supervisor-appended at
            ingest, after the kill)."
        - precondition: "A Board hold overlays a non-terminal state: running runs are cancelled and nothing is
            dispatched until --hold off (03 Proposal states)"
          producer: { file: docs/03-lifecycle.md, heading: Proposal states }
          position: after
          sufficient: false
          reason: For future dispatch the hold.changed event is sufficient (steward.run.resolve-route reads it, position
            before). For the running run it comes after the run's own end, because the verb that appends it
            waits for the lock; the sentence 'running runs are cancelled' has no producer that can reach a
            running supervisor.
        - precondition: The abandon ruling is an approval record with its approval.recorded event, recorded outside any
            run window (ADR-0005 point 4; 01 Board rulings)
          producer: { file: docs/adr/ADR-0005-explicit-confirmation-approvals.md, heading: Decision }
          position: after
          sufficient: true
          reason: Sufficient for the terminal state `abandoned` once recorded; the diagram orders the wait before the
            confirmation, so an abandon of a running proposal never reaches the confirmation. Recording after
            the window is right and must be kept; the run must end by another path first. The re-hash after
            the wait must exclude what the cancelled run's ingest changes (the Steward commit on keel/<P>/main
            and the run events), otherwise the record refuses with changed-during-confirmation and the abandon
            costs a second confirmation.
        - precondition: The ruling record of an abandon is on keel/<P>/main and steward.run.cancel requires it (order
            map ruling-record.required_by includes steward.run.cancel; 03 Blocked reasons)
          producer: { file: docs/03-lifecycle.md, heading: Blocked reasons }
          position: after
          sufficient: false
          reason: "A second instance of the same shape through the artifact instead of the lock: board.approve.rule is a
            waiter of lock.supervisor (released by steward.run.end), steward.run.cancel requires its record,
            and steward.run.end is after steward.run.cancel: steward.run.end -> board.approve.rule ->
            steward.run.cancel -> steward.run.end. The recommended fix must remove steward.run.cancel from
            ruling-record.required_by, because under it the supervisor cancels on the cancel request and reads
            the cause from that file, not from the ruling record."
        - precondition: "The holder crashes or never releases: a lock left behind is recovered"
          producer: { file: docs/04-trace-and-state.md, heading: Single writer }
          position: absent
          sufficient: false
          reason: Owned by DI-05. DI-04's fix must bound the Board verb's wait so a dead holder yields a refusal naming
            the run, never a hang, and must not depend on DI-05's recovery.
      consumers:
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-during-wave
          waits_for: lock.supervisor held by steward.run.spawn of the running run of <P> (or of the wave)
          released_by: steward.run.end, after steward.run.cancel, after board.run.hold-on (cycle)
          outcome: breaks
          reason: "Deadlock: the mode must append hold.changed, so it waits for lock.supervisor; the lock is released by
            steward.run.end, which follows the cancellation this hold is meant to cause. Under the fix:
            changed (writes a cancel request first when a run of the same proposal holds the lock, waits
            within caps.cancel_wait_seconds, then appends); a hold of P while Q's wave holds the lock keeps
            the ordinary 'told which run holds the lock' wait, which is not capped."
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-during-wave
          waits_for: lock.supervisor
          released_by: steward.run.end, after steward.run.cancel, after board.approve.rule.abandon (cycle)
          outcome: breaks
          reason: "Deadlock of the same shape: the ruling's record and approval.recorded must be written outside the run
            window, so the verb waits for the lock; the run ends only on the abandon it is waiting to record;
            the ruling-record -> steward.run.cancel artifact edge repeats it. Under the fix: changed (confirm,
            cancel request, bounded wait, re-hash over a bound set that excludes the cancelled run's ingest
            changes, record)."
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: lock.supervisor, only when another proposal's run holds it
          released_by: steward.run.end of that run
          outcome: holds
          reason: No run of a held proposal is in flight; the wait is only for a run of another proposal and ends with
            that run. Unchanged by the fix. In the order map board.run.hold-off is already upstream of
            steward.run.spawn (spawn.after contains hold-off), which is why an explicit steward.run.end edge
            on board.run.hold-on would close a new cycle through this row.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-during-wave
          waits_for: lock.supervisor
          released_by: steward.run.end
          outcome: holds
          reason: "By design: the Board is told which run holds the lock and the approval is recorded once the window
            ends; a checkpoint never needs the run it waits behind to stop. Unchanged."
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-during-wave
          waits_for: lock.supervisor
          released_by: steward.run.end
          outcome: holds
          reason: Governance commit on trunk plus approval.recorded after the window; a waiting document approval does
            not affect the running seat. Unchanged.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-during-wave
          waits_for: lock.supervisor
          released_by: steward.run.end
          outcome: holds
          reason: Intake of a new proposal waits behind the wave; a cost, not a defect. Unchanged.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-during-wave
          waits_for: lock.supervisor
          released_by: steward.run.end
          outcome: holds
          reason: "The subject run is not in flight: an ask parks the task and ends the run (03 Task states: running ->
            parked), a finding is ruled on after verify, degraded/unverified are ruled before dispatch, track
            after submit. The wait is for another run and ends with it. Unchanged."
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-during-wave
          waits_for: lock.supervisor
          released_by: steward.run.end
          outcome: holds
          reason: "blocked(budget) cancels the run from inside the supervisor (06: at 100% of its budget) and
            blocked(reserved_op) is set at ingest, so the run has ended before the ruling is sought.
            Unchanged, provided the fix names the supervisor as the appender of the budget and lease
            cancellations."
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-during-wave
          waits_for: lock.supervisor
          released_by: steward.run.end
          outcome: holds
          reason: proposal.created is appended after the window; intake of another proposal is delayed, not blocked.
            Unchanged (the first M1a consumer of the wait). In the order map board.new is a waiter of
            lock.supervisor and upstream of steward.run.spawn, the plainest of the 43 instance-conflated
            cycles (steward.run.end -> board.new -> steward.run.resolve-route -> steward.run.claim ->
            steward.run.spawn -> steward.run.ingest -> steward.run.end) that the DI-04 tag silently tolerates
            today.
        - anchor: { file: docs/02-alignment.md, heading: Amendment ledger }
          actor: second-steward-process
          waits_for: lock.supervisor
          released_by: steward.run.end
          outcome: holds
          reason: The amendment is derived from a commit on keel/<P>/main that the Steward sees outside a window; its
            ledger append waits for the lock like every other and is delayed, not blocked, by a running wave.
            Unchanged.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: second-steward-process
          waits_for: lock.supervisor
          released_by: steward.run.end of the current supervisor
          outcome: holds
          reason: "Supervisors are serialized by the lock: one supervising process at a time (04). Under the fix a run
            also refuses to dispatch a proposal with a pending cancel request. Changed by one sentence."
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: second-steward-process
          waits_for: nothing
          released_by: n/a
          outcome: holds
          reason: Stops before the claim and the spawn and prints only; no append, no wait. Unchanged.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: second-steward-process
          waits_for: lock.supervisor
          released_by: steward.run.end
          outcome: holds
          reason: Every task of the landing proposal is verified, so its own runs have ended; the wait is for another
            proposal's run. Unchanged here (the per-trunk queue is DI-16).
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: lock.supervisor
          released_by: steward.run.end
          outcome: holds
          reason: Audit appends (stale claim removal, lease re-queue, chain results) after the window. Its re-queue of
            an expired lease whose supervisor still holds the lock is the crashed-holder row below (DI-05).
            Under the fix audit also lists cancel requests that no Board event followed.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: unstated
          released_by: unstated
          outcome: pending
          reason: Outside a run `keel check` appends gate.checked events, yet it is not in the mutating list of 02 and
            no sentence says it waits for the supervisor lock; a gate.checked appended by the Board during a
            wave would be foreign at the window check and set blocked(reserved_op). Not DI-04's defect; a
            candidate gap for the parent to file.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: lock.supervisor (02 lists sync among the mutating verbs)
          released_by: steward.run.end
          outcome: holds
          reason: init runs before any run exists (vacuous wait); sync writes keel-owned surfaces in the working tree
            and no ledger event, so its wait is harmless. Unchanged.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: lock.supervisor at most (no ledger append)
          released_by: steward.run.end
          outcome: holds
          reason: Refused under KEEL_RUN because they write the control plane cache or conformance results, but they
            append nothing to the ledger; whether they wait is immaterial to the window check. Unchanged.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: nothing
          released_by: n/a
          outcome: holds
          reason: No write, no wait; status computes the hold overlay and the abandoned state from events. Unchanged.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 4. keel api }
          actor: seat
          waits_for: nothing
          released_by: n/a
          outcome: holds
          reason: "Seats never take a lock: keel api writes one outbox drop under the workspace root and the supervisor
            ingests it under its own lock. Unchanged."
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 6. keel hook }
          actor: hook
          waits_for: nothing
          released_by: n/a
          outcome: holds
          reason: Hooks journal into the run directory and fail open; no ledger append. Unchanged.
        - anchor: { file: docs/06-parallelism.md, heading: Cancellation }
          actor: supervisor
          waits_for: nothing (holds lock.supervisor)
          released_by: steward.run.end (its own)
          outcome: holds
          reason: "The supervisor is the holder: it appends its own cancellation, signals the tree, ingests and ends the
            run. The fix makes this explicit and routes the hold and the abandon through the same step via the
            cancel request, which the supervisor polls between stream events; a seat that emits no stream
            events (rung D, or a stalled seat) is never polled and is cancelled only by lease expiry, so
            caps.cancel_wait_seconds must exceed caps.lease_seconds plus caps.cancel_grace_seconds. Changed by
            naming the appender and the event."
        - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
          actor: crashed-supervisor
          waits_for: lock.supervisor
          released_by: nothing (undefined; DI-05)
          outcome: breaks
          reason: "The holder crashes or never releases: every waiter above, and the cancel request of the fix, wait on
            a lock nothing releases; a hung supervisor also never polls the request. DI-05 owns the recovery;
            DI-04's fix bounds the Board verb's wait for a run of the same proposal (caps.cancel_wait_seconds)
            and exits 3 naming the holder run and `keel audit`. This row is the M1a negative control: a stale
            supervisor.lock with a recorded holder run id needs no real run."
        - anchor: { file: docs/14-trust-security.md, heading: Server-side branch protection recommendations }
          actor: ci-fresh-clone
          waits_for: nothing
          released_by: n/a
          outcome: holds
          reason: A clone has no git common dir state, no locks and no runs; it neither waits nor cancels. Unchanged.
        - anchor: { file: docs/17-open-decisions.md, heading: Multi-machine collaboration }
          actor: second-machine
          waits_for: nothing
          released_by: n/a
          outcome: holds
          reason: Sees committed records and archive projections only; the lock and the cancel request are local to the
            supervising clone. Unchanged.
        - anchor: { file: docs/08-dashboard.md, heading: Overview }
          actor: dashboard
          waits_for: nothing
          released_by: n/a
          outcome: holds
          reason: Reads hold.changed and run.finished events from the ledger; read-only, no wait. Under the fix the
            queue also shows a pending cancel request as a Board item (one row, unchanged mechanism).
      places:
        - artifact: cancellation-event
          where: git-common-dir
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: ledger-event
          where: git-common-dir
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: approval-recorded-event
          where: git-common-dir
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: ruling-record
          where: proposal-branch
          reachable_from: [ local, supervisor, seat, agent-api ]
        - artifact: claim-ref
          where: refs-keel
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: run-dir
          where: workspace-root
          reachable_from: [ local, supervisor, seat, agent-api ]
      readers:
        - field: "hold.changed.on (schemas/ledger-event.schema.json #/$defs/holdChanged/properties/on)"
          readers:
            - "board.status (03 Proposal states: the hold overlay)"
            - steward.run.resolve-route (nothing is dispatched until --hold off)
            - "audit.sweep (03 Liveness invariant: the hold counts as a pending Board item)"
            - dashboard.build (08 Board queue)
        - field: "ruleKind value abandon (schemas/common.schema.json #/$defs/ruleKind), read through ruling-record"
          readers:
            - "board.status (03 Proposal states: abandoned, terminal)"
            - audit.sweep (liveness after abandonment)
            - gate.frame.intake via ruling-record (03 Blocked reasons)
        - field: cancel request cause (hold | abandon), the field of the new control-plane file
            <git-common-dir>/keel/locks/cancel/<P> that the fix adds; steward.run.cancel reads its cause from
            here, not from ruleKind, so the order-map edge ruling-record -> steward.run.cancel is removed
          readers:
            - steward.run.cancel (06 Cancellation, under the fix)
            - steward.run.resolve-route (dispatch refusal while a request is pending)
            - board.run.hold-on and board.approve.rule.abandon (the writers, which remove the file after their
              event)
            - audit.sweep (requests no Board event followed)
        - field: "claim.released.reason value cancelled (schemas/ledger-event.schema.json #/$defs/claimReleased)"
          readers:
            - "audit.sweep (06 The lease: claim state derived and cross-checked)"
            - board.status (03 Task states)
            - dashboard.build
        - field: "run.finished.outcome value killed (schemas/run.schema.json #/$defs/outcome)"
          readers:
            - steward.run.end (writes it from the cancellation journal, 09 exit-code map)
            - board.status
            - dashboard.build
        - field: the cancellation journal entry named by 06 ('keel appends the cancellation to the ledger before it
            signals the process') as a ledger event type
          readers: []
        - field: the holder identity carried by supervisor.lock ('a Board member ... is told which run holds the lock',
            04 Single writer)
          readers: [ "keel approve wait message (04 Single writer, 12 approve bullet)" ]
      tally:
        - track: feature
          route: per-change-contract
          topology: shared-trunk
          confirmations: 1
          work_orders: 0
          bound:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
    terms:
      - name: supervisor lock
        uses:
          - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
            meaning: <git-common-dir>/keel/locks/supervisor.lock, held by the keel run process that spawned a seat (per
              wave); every other mutating verb waits for it, no exception
            demands: exclusion of every foreign ledger append during the run window
          - anchor:
              file: docs/02-alignment.md
              heading: Board approvals (explicit confirmation, hash binding, invalidation)
            meaning: the same lock; an approval is recorded once the window ends
            demands: that the run ends on its own
          - anchor: { file: docs/03-lifecycle.md, heading: Proposal states }
            meaning: not named, but the hold and the abandon are mutating verbs and so wait for it
            demands: "that the holder be interruptible by a verb that must itself wait for the holder: more than the
              definition provides"
          - anchor: { file: docs/00-mandate.md, heading: 5.2 The design-issue register }
            meaning: the same lock as an actor condition
            demands: nothing beyond exclusion
          - anchor: { file: docs/design-issues.yaml, pointer: "#/order/locks" }
            meaning: the same lock as an order-map edge; the validator turns every waited_by entry into
              before(released_by, waiter)
            demands: "that a wait for another run's lock be distinguishable from a step before this run's spawn, which the
              map does not provide: untagged, 43 cycles unrelated to hold or abandon appear"
        kept:
          meaning: The file lock <git-common-dir>/keel/locks/supervisor.lock, taken by the supervising keel run process
            before the first spawn and released at run end; while it is held only its holder appends to the
            ledger, and every other mutating verb waits for it before appending
          provides: exclusion of foreign ledger appends during the run window, and the holder's run id for the waiting
            verb's message; it does not provide a way to reach the holder, which the new term cancel request
            provides, and its order-map edges need a separately filed issue on the waiter-edge modelling
            before DI-04's tag can go
      - name: cancellation
        uses:
          - anchor: { file: docs/06-parallelism.md, heading: Cancellation }
            meaning: both the trigger (a hold, 100% budget, an expired lease, an abandon ruling) and the act (append,
              close stdin, grace, kill the tree)
            demands: that the process appending the cancellation holds the supervisor lock, and that a Board trigger reach
              a running supervisor
          - anchor: { file: docs/03-lifecycle.md, heading: Liveness invariant }
            meaning: the act, as seen from the claim
            demands: a claim release at the act
          - anchor: { file: docs/09-runtimes.md, heading: 3. Windows spawn contract }
            meaning: the ledger record of the act
            demands: a named ledger event to read the outcome from
          - anchor: { file: docs/03-lifecycle.md, heading: Proposal states }
            meaning: the act, caused by the Board's hold
            demands: a path from the Board verb to the supervisor
        kept:
          meaning: "The supervising process's act on its own run: it appends run.cancelled with its cause (hold,
            abandon, budget, lease) under the supervisor lock, closes stdin, waits the grace period, kills the
            process tree, ingests, and ends the run with outcome killed"
          provides: the journal entry the outcome killed is read from, the claim release, and the release of the
            supervisor lock
        renamed:
          - meaning: "The Board-side trigger of a cancellation: a file <git-common-dir>/keel/locks/cancel/<P> written by
              keel run --hold on or, after the confirmation, by keel approve --rule abandon, only when a run
              of that same proposal holds the supervisor lock; not a ledger append, carries no authority,
              polled by the supervisor between stream events (a seat without stream events is reached only by
              lease expiry), and removed by the verb that wrote it once its hold.changed or approval.recorded
              event is appended"
            new_name: cancel request
      - name: mutating verb
        uses:
          - anchor: { file: docs/02-alignment.md, heading: Requests and seat-proof verbs }
            meaning: the six seat-proof verbs
            demands: refusal under a run
          - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
            meaning: every process that would append to the ledger while a seat runs
            demands: that no ledger append is made outside the supervisor's own during a window; it does not demand that
              non-append writes (a request file) wait
          - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
            meaning: every refused mode of the table
            demands: refusal under a run
        kept:
          meaning: A verb mode that writes the declared plane, the control plane or refs; it refuses under KEEL_RUN or a
            keel-run ancestor, and before any ledger append it waits for the supervisor lock
          provides: the refusal set and the wait set; a cancel request is a control-plane write that is not a ledger
            append, so the verb that writes it is still a mutating verb whose appends wait
      - name: run window
        uses:
          - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
            meaning: the interval from spawn to ingest during which only the supervising process appends
            demands: that its end (the ingest) be reachable
          - anchor: { file: docs/adr/ADR-0005-explicit-confirmation-approvals.md, heading: Decision }
            meaning: the same interval
            demands: that the abandon ruling be recorded after the window, which the fix orders
          - anchor: { file: docs/14-trust-security.md, heading: Known limits }
            meaning: the same interval
            demands: nothing more
        kept:
          meaning: The interval between the supervisor's spawn of a seat and its ingest of that run, during which every
            ledger append must be the supervisor's own
          provides: the domain of the window check; no glossary row exists yet and one is added
      - name: Board hold
        uses:
          - anchor: { file: docs/03-lifecycle.md, heading: Proposal states }
            meaning: "an overlay on any non-terminal state: running runs cancelled, nothing dispatched until --hold off,
              counted as a pending Board item"
            demands: reaching a running run
          - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
            meaning: the verb mode that holds or releases a proposal
            demands: a hold.changed event
        kept:
          meaning: "The state overlay recorded by hold.changed{on: true} and lifted by hold.changed{on: false}; keel run
            --hold on writes a cancel request when a run of the same proposal is in flight, waits for it to
            end within caps.cancel_wait_seconds, then records the hold; when another proposal's run holds the
            lock it keeps the ordinary uncapped wait"
          provides: the overlay for status, dispatch refusal and liveness; the reach into a running run comes from the
            cancel request
      - name: abandon ruling
        uses:
          - anchor: { file: docs/01-org-model.md, heading: Board rulings }
            meaning: a Board ruling (approval record RL-, kind rule) that abandons a proposal
            demands: an approval record and its event
          - anchor: { file: docs/03-lifecycle.md, heading: Proposal states }
            meaning: the terminal state from any non-terminal state
            demands: a recorded ruling
          - anchor: { file: docs/06-parallelism.md, heading: Cancellation }
            meaning: a cancellation trigger
            demands: reaching a running supervisor before the ruling can be recorded
          - anchor: { file: docs/design-issues.yaml, pointer: "#/order/artifacts" }
            meaning: the record as the supervisor's cancellation input
            demands: "that the record exist before the cancel, which the lock forbids: the second instance of the cycle"
        kept:
          meaning: "The Board's ruling of kind abandon: shown and confirmed first; when a run of the proposal is in
            flight the verb writes a cancel request, waits for the run to end, re-hashes a bound set that
            excludes what the cancelled run's ingest changes (the Steward commit on keel/<P>/main and the run
            events) and records; the record and its approval.recorded event are written outside any run
            window, and the supervisor no longer requires the record to cancel"
          provides: the terminal state and the ledger proof at exactly one confirmation; the word ruling itself stays
            under DI-17's collision (Board ruling vs seat ruling), which this fix does not touch
      - name: single writer
        uses:
          - anchor: { file: docs/00-vision.md, heading: Glossary }
            meaning: "ownership: one writer per artifact and field"
            demands: nothing about processes
          - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
            meaning: one Steward process appends to the ledger at a time, under the writer lock and, while a seat runs,
              the supervisor lock
            demands: process-level mutual exclusion, which the glossary row does not provide
        kept:
          meaning: One writer per artifact and field (01 org model; the glossary row as it stands)
          provides: ownership of each artifact; nothing about concurrent processes
        renamed:
          - meaning: "One Steward process appends to the ledger at a time: the writer lock for every append, the
              supervisor lock while a seat runs; home 04 Single writer (the heading keeps its text in this fix
              so the anchors of DI-03, DI-05 and DI-14 stay valid; the glossary row carries the identifier)"
            new_name: single appender
    options:
      - "Option 1 (cancel request): keel run --hold on and, after its confirmation, keel approve --rule
        abandon write a cancel request file <git-common-dir>/keel/locks/cancel/<P> that is not a ledger
        append, only when a run of that same proposal holds the supervisor lock; the supervisor polls it
        between stream events, appends run.cancelled with its cause as its own event, kills the process tree,
        ingests, ends the run and releases the supervisor lock; the Board verb then takes the lock and appends
        hold.changed or the ruling's approval.recorded, with the same-proposal wait bounded by
        caps.cancel_wait_seconds (greater than caps.lease_seconds plus caps.cancel_grace_seconds, since a seat
        without stream events is reached only by lease expiry) and a refusal (exit 3) naming the holder run
        and keel audit when it never ends; a hold of P while Q's wave holds the lock keeps the ordinary
        uncapped wait; the abandon's bound set excludes what the cancelled run's ingest changes so the re-hash
        costs no second confirmation; the supervisor no longer requires the ruling record to cancel
        (ruling-record.required_by loses steward.run.cancel); the negative control ships in test/ in M1a
        without a real run."
      - "Option 2 (exempt the two modes): let run --hold on and approve --rule abandon append under the writer
        lock without waiting for the supervisor lock, and whitelist hold.changed and approval.recorded{rule:
        abandon} at the window check; this flips ADR-0005 point 4 (approvals recorded outside any run window)
        and weakens the window check, so it is owner-routed."
      - "Option 3 (refuse while running): run --hold on and approve --rule abandon refuse with exit 3 while a
        run of the proposal holds the supervisor lock and take effect only after the run ends on its own; the
        sentences 'running runs are cancelled' (03) and 'a run is cancelled on keel run --hold on ... or on an
        abandon ruling' (06) are removed, leaving the Board no way to stop a running seat except its budget."
      - "Option 4 (direct signal): the Board verb signals the supervisor process directly (a Windows named
        pipe or POSIX signal to the pid recorded in supervisor.lock) instead of a request file; the same
        ordering as option 1 but with a platform-specific transport that is verify by probe on Windows and
        adds a resident listener to the supervisor."
    recommendation: "Option 1, with the corrections below applied before it lands. As a design it removes the
      defect without a new cycle, deadlock, unreachable place, dead field or mandate conflict: the wait of the
      hold and the abandon is released by a step the Board verb itself triggers through a channel that needs
      no lock (the cancel request, a control-plane file under <git-common-dir>/keel/locks/cancel/<P>,
      reachable from local and supervisor), every ledger append still happens under the supervisor's own
      window or after it, so 04 Single writer's no-exception rule for appends, the window check, ADR-0005
      point 4 and the adopted channel decisions (17 rows 4, 10, 11) all stand; the new artifact has five
      readers (steward.run.cancel, steward.run.resolve-route, board.run.hold-on, board.approve.rule.abandon,
      audit.sweep) and the new event run.cancelled has readers (steward.run.end for the outcome killed,
      board.status, audit.sweep), closing the naming gap of the cancellation journal on the way; the
      crashed-holder row does not get worse because the same-proposal wait is bounded and ends in a refusal
      that names the holder run and keel audit (DI-05 keeps the recovery). Four corrections from running
      scripts/validate.mjs --only issues against the sketch. (1) Order map: add step board.cancel-request (doc
      06 Cancellation, after [board.new], runs_in local) and artifact cancel-request (doc 06 Cancellation,
      produced_by board.cancel-request, required_by [steward.run.cancel, steward.run.resolve-route,
      board.run.hold-on, board.approve.rule.abandon, audit.sweep], where git-common-dir; it enters this
      issue's places list with that commit, reachable from local and supervisor); steward.run.cancel.after
      becomes [board.cancel-request, ledger.append]; board.run.hold-on.after and
      board.approve.rule.abandon.after gain board.cancel-request and nothing else: no explicit steward.run.end
      edge, because steward.run.spawn.after already contains board.run.hold-off and board.run.hold-off.after
      contains board.run.hold-on, so an explicit edge closes a new cycle steward.run.spawn -> ... ->
      steward.run.end -> board.run.hold-on -> board.run.hold-off -> steward.run.spawn; the lock's released_by
      edge already orders both waiters after steward.run.end. (2) ruling-record.required_by loses
      steward.run.cancel, otherwise steward.run.end -> board.approve.rule -> steward.run.cancel ->
      steward.run.end keeps DI-04's shape through the artifact; the supervisor reads the cause from the cancel
      request. (3) The DI-04 tag on lock.supervisor cannot simply be removed: untagged, the validator's
      before(released_by, waiter) edges expose 45 cycles, 43 of them unrelated to hold or abandon
      (steward.run.end placed before board.new, board.new-policy, board.approve.contract, board.approve.plan
      and board.run.hold-off, all upstream of steward.run.spawn), which the DI-04 tag has been silently
      tolerating. The parent files a separate issue on lock.supervisor for the waiter-edge modelling (a wait
      for another run's lock is not a step before this run's spawn; either the map or the validator must
      distinguish them) and the closing commit swaps the tag from DI-04 to that issue; green for DI-04 means
      the issues check passes with the hold and abandon cycles absent and DI-04 tagged nowhere. (4) Closure:
      validate.mjs refuses a closed cycle with blocks other than M0 and no closure.tests, so the negative
      control is not deferred to M2; it ships in test/ in M1a without a real run: a stale supervisor.lock
      carrying a holder run id, the Board verb's bounded wait, exit 3 within caps.cancel_wait_seconds, and a
      fake cancel-request consumer that ends the fake window, after which hold.changed follows run.finished on
      the chain. Text of the fix, tightened: caps.cancel_wait_seconds bounds only the wait for a run of the
      same proposal (a hold of P while Q's wave holds the lock keeps the ordinary
      told-which-run-holds-the-lock wait, else a valid hold is refused); the cap exceeds caps.lease_seconds
      plus caps.cancel_grace_seconds, because a seat with no stream events (rung D, or a stalled seat) is
      never polled between events and is cancelled only by lease expiry; the abandon's bound artifacts exclude
      anything the cancelled run's ingest changes (the Steward commit on keel/<P>/main, the run events),
      otherwise the re-hash after the wait refuses with changed-during-confirmation and the abandon costs a
      second confirmation; the tally row records that the abandon stays at exactly one confirmation and the
      hold at none. Documents touched: 04 Single writer and Local control plane (locks/ line gains
      supervisor.lock and cancel/<P>; the holder's run id is the lock's content), 06 Cancellation, 03 Proposal
      states, 12 verb table (approve and run bullets, mode count stays 40), 02 Board approvals, 14 Approvals
      and the single writer and Known limits (a seat with control-plane write access can write a cancel
      request; detected at audit, never prevented), ADR-0005 Decision (diagram note only, point 4 unchanged,
      no flip), 00-vision Glossary (rows supervisor lock, run window, cancel request, single appender; single
      writer keeps home 01), 13 layout and schemas (run.cancelled with data {run, cause:
      hold|abandon|budget|lease}; caps.cancel_wait_seconds beside cancel_grace_seconds), 15 M1a exit criteria
      (the negative control), and every zh-CN mirror. Option 2 is owner-routed and weakens the guarantee;
      option 3 deletes a Board capability the lifecycle relies on; option 4 buys nothing over the file and
      adds a probe."
    decision:
      by: recommendation
      date: 2026-09-27
      option: "Option 1: a hold or an abandon writes a cancel request the supervisor honours; the appends stay the
        supervisor's own"
      recorded_in: [ docs/04-trace-and-state.md, docs/06-parallelism.md ]

  - id: DI-05
    title: Recovery of the supervisor lock and the run after a supervisor crash is undefined
    statement: >-
      The single-writer rule defers the recovery of a lock left behind by a crashed process to an
      implementation detail, and the lease rules cover claims, not the supervisor lock. No document says how a
      crashed or hung supervisor is detected, who takes over its lock, and how its run and its window of
      ledger events are closed.
    status: decided
    found_by: external-review
    found_on: 2026-09-26
    root_cause: other
    anchors:
      - { file: docs/04-trace-and-state.md, heading: "Single writer" }
      - { file: docs/06-parallelism.md, heading: "The lease" }
    class: cycle
    blocks: M1a
    walk:
      producers:
        - precondition: "the supervisor lock is released (04 Single writer: every other mutating verb waits for
            supervisor.lock; a Board member is told the approval is recorded once the window ends)"
          producer: { file: docs/04-trace-and-state.md, heading: Single writer }
          position: after
          sufficient: false
          reason: "the release is the end of the holder's own run window, produced by the holder process at ingest; when
            the holder died no step produces it and the section defers recovery to 'an M1a implementation
            detail'. A waiter whose only release is the crashed holder's own step: cycle"
        - precondition: the tail equals the chain hash held by the ledger anchor before any append (04 Single writer
            steps 2 and 4)
          producer: { file: docs/04-trace-and-state.md, heading: Single writer }
          position: before
          sufficient: false
          reason: "sufficient for the append discipline (every option keeps it), insufficient for closing a crashed
            window: the anchor proves the chain is intact, not which process appended, so it cannot replace
            the window check"
        - precondition: the supervisor's own list of append ids and hashes, walked at ingest so that every event in the
            run window is its own (04 Single writer)
          producer: { file: docs/04-trace-and-state.md, heading: Single writer }
          position: absent
          sufficient: false
          reason: kept only in the memory of the process that died; nothing durable and seat-proof records it
            (runs/<RUN>/events.jsonl is seat-writable on exposed control planes, threat T4), so a crashed
            window can never be verified by any later process; the trust sentence ('a verified window or while
            no seat ran') leaves those events with no trust state
        - precondition: an expired lease is re-queued by keel audit, which releases the claim lock and records the
            re-queue (06 The lease)
          producer: { file: docs/06-parallelism.md, heading: The lease }
          position: after
          sufficient: false
          reason: "three shortfalls: audit.sweep waits for lock.supervisor (order map waited_by) so it never runs while
            the dead holder's lock stands; the lease rules cover refs/keel/claims only, never supervisor.lock
            or ledger.lock; heartbeats are parsed from the child's stream by the supervisor, so a dead
            supervisor with a live child expires the lease while the seat still edits the worktree, and no
            step names who ends that orphaned process tree before the task is re-queued to a second seat"
        - precondition: "the pids of the seat's process tree, so that a process other than the supervisor can end it (06
            Cancellation step 3 and 09 spawn contract item 8: taskkill /PID <pid> /T /F, SIGKILL)"
          producer: { file: schemas/run.schema.json, pointer: "#/properties" }
          position: absent
          sufficient: false
          reason: the run record has no child pid and no process start time, events.jsonl lines carry none, and the
            cancellation table addresses the pid the supervisor holds in its own memory; once the supervisor
            is dead the parent-child relation is gone (on Windows the tree relation dies with the parent), so
            no later process can end the orphaned seat, which keeps editing the worktree with the user's file
            rights while its task is re-queued
        - precondition: "a liveness signal of the supervisor process itself, so that a stale supervisor lock can be told
            from a live holder whose seat is silent (matrix actor crashed-supervisor: 'died or hung while
            holding a lock or a claim')"
          producer: { file: docs/06-parallelism.md, heading: The lease }
          position: absent
          sufficient: false
          reason: the only liveness channel is the claim heartbeat derived from the seat's stream; an absent heartbeat
            is ambiguous between a silent seat (a long test, or a rung-D task with no stream) and a dead
            supervisor, so no process can decide holder liveness from the ledger, and a lease keyed to stream
            events would declare a live supervisor stale during a silent stretch
        - precondition: "the ledger writer lock ledger.lock is released (04 Single writer step 1: if the lock exists,
            wait or fail, never append)"
          producer: { file: docs/04-trace-and-state.md, heading: Single writer }
          position: absent
          sufficient: false
          reason: a process that dies between step 1 and step 4 (keel new in M1a is enough) leaves an O_EXCL file that
            every later taker waits on or fails on forever; the section names no holder identity and no
            breaking rule, and a bare pid test would not be decidable either, because a reused pid (fast on
            Windows) makes a dead holder's lock look live
        - precondition: "a run outcome for the run (03 Task states, 06 Cancellation: killed comes from keel's own
            cancellation journal; run.schema.json #/$defs/outcome)"
          producer: { file: docs/06-parallelism.md, heading: Cancellation }
          position: absent
          sufficient: false
          reason: a run whose supervisor died has no cancellation event, so killed is not available, and the outcome
            enum has no value for it; run.finished is never appended and the run record's outcome stays null,
            so status and the dashboard show an active run forever
      consumers:
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: lock.supervisor
          released_by: steward.run.end of the crashed run (never)
          outcome: breaks
          reason: "waiter criterion, applied to every row below: a mode waits for the supervisor lock exactly when the
            table refuses it under KEEL_RUN, because 02 Requests and seat-proof verbs defines a mutating verb
            as one that refuses under KEEL_RUN (new, run, land, sync, audit, approve) and 12 says the other
            refused modes follow the same rule, and 04 makes every other mutating verb wait with no exception;
            allowed and report-only modes do not wait. init is refused (it scaffolds the control plane and
            runs sync), so it waits for a release no step produces; the order map's lock.supervisor.waited_by
            lacks board.init"
