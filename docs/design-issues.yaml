            event id, once fixStarted.findings admits it) as the finding
          provides: the cap, the tier step at round 4 and blocked(non_convergence) after round 5, on every failed,
            refused or cancelled-on-a-hit submit attempt, with an emittable event for each
    options:
      - "Option 1, refused submit (with the skeptic's corrections): a listing hit at submit ingest refuses the
        submit before anything is staged; the Steward records submit.provider-path-events as failed with the
        path name (never its content), unlinks each listed path by name in the task worktree (opens nothing,
        and the removal is named in the same gate.checked reason), leaves the round's other unstaged edits in
        the worktree, ends the run with outcome failed, releases the claim with reason submitted, consumes no
        round id and moves no ref; the commit-bound submit checks (scope, frozen-paths, fake-completion,
        ratchet, obligations-cheap, commands, result) are not_run with the refusal as their reason while
        brief, ack, freshness, reserved-op and subagent-events run and record at ingest; the task returns to
        fixing with the path as its finding, fix.started is emitted with that gate.checked record as its
        finding (fixStarted.findings widened to accept a gate check id or gate.checked event id, grouped with
        neighbouring finding a), and the refusal counts toward the round cap; the next run's pre-spawn base
        records the worktree tree as it stands (unchanged tip plus carried edits), so its listing is clean and
        the ACK-ordering comparison reads that tree; submit.provider-path-events joins the unwaivable list; a
        hit at a snapshot listing (pre-spawn base, stream boundary, ACK ingest) is the fifth cancellation
        cause of 06 with outcome killed from the journal, the same unlink and the same return to fixing, and a
        pre-spawn hit refuses that dispatch; the catalogue row and intro, the negative controls (three rows,
        mirrored in test/README.md), the task-state diagram and round-cap sentence, the Phase 3 entry and
        Produces bullets, the liveness sentence (unchanged, reason submitted), the id table, the trailer kinds
        table, ADR-0004, 06 Cancellation, 02 ACK ordering and the glossary say so in one vocabulary; the
        deadlock on the pre-spawn and ACK-ingest listing is filed as its own cycle entry and fixed first or in
        the same grouped commit."
      - "Option 2, commit anyway under the excludes: the listing hit no longer stops the commit; the exclude
        pathspecs on add -A keep the matched paths out of the tree, the round commit is made with its trailers
        and then fails the submit gate on submit.provider-path-events, so every ingested submit has a commit
        and the fix round builds on it; the matched path still sits in the worktree, so the pre-spawn and
        ACK-ingest listings of the next run hit unless the listing is also dropped there."
      - "Option 3, empty round commit: on a listing hit the Steward makes the round commit from the tip's own
        tree (commit-tree <tip-tree> -p <tip> with the round trailers, nothing staged, no file opened), so the
        round exists for the trace, the fix loop and the restack and the check fails on it; the worktree and
        the next run's listings are left as in Option 2."
      - "Option 4, Board item: a listing hit sets the task blocked with a new blocked reason (provider_path)
        and unblock_owner board until a clean listing, like reserved_op, so the seat never retries on its own;
        the pre-spawn listing after the Board removes the path is the release, which also closes the deadlock
        but adds a Board touch and an enum value with readers for a defect the seat could fix itself."
      - "Option 5, reset at refusal: as Option 1, but the Steward resets the task worktree to the unchanged
        tip instead of carrying the round's edits, so the Phase 3 entry sentence stays as written; the round's
        work is lost and the untracked matched path survives a reset anyway, so the unlink by name is still
        needed."
    recommendation: "Option 1, as corrected. It keeps the P1 defence exactly as designed: no staging when a name
      matches, with the exclude pathspecs staying a backstop rather than the only barrier (Option 2 makes
      verify-by-probe pathspec magic the single thing between a seat-created .env and a blob, which would put
      the DI-01 restatement of clause 11 at risk and is the reason the design stops before staging). It adds
      no artifact git must carry (Option 3's empty commit must survive the restack's cherry-pick fallback,
      which refuses empty commits without a flag, and places a commit with no diff in the land range for every
      refusal). It needs no new enum value (Option 4 adds a blocked reason that needs readers, an unblock
      owner and a Board touch for a defect the seat can fix itself). It loses no work (Option 5 discards the
      round's edits and still needs the unlink). The skeptic's seven corrections are applied as follows. (1)
      Deadlock: the matched path is cleared by the Steward, not the seat: at refusal, and at a snapshot or
      pre-spawn hit, it unlinks each listed path by name in the task worktree (nothing opened, hashed or
      persisted, so clause 11 / P1 holds), records the removal next to the path name in the gate.checked
      reason, and the next run's pre-spawn listing (steward.run.provider-path-check) is the release; the
      pre-spawn and ACK-ingest listing after a refusal is filed as a separate cycle entry (compound finding),
      and DI-15 waits for it or lands with it in one grouped commit. (2) Worktree: the round's other unstaged
      edits are carried, the pre-spawn base records the worktree tree as it stands (tip plus carried edits),
      the ACK-ordering check compares against that snapshot's tree, and the 03 Phase 3 entry sentence and the
      02 ACK sentence say so. (3) Checks: only the commit-bound checks (scope, frozen-paths, fake-completion,
      ratchet, obligations-cheap, commands, result) are not_run with the refusal as their reason; brief, ack,
      freshness, reserved-op and subagent-events run and record at ingest, so the detection guarantee of 05
      and the T-rows of 14 keep their denominators and steward.run.end stays after steward.run.ref-diff and
      steward.run.remote-diff. (4) Round cap: fixStarted.findings is widened, in the same grouped commit as
      neighbouring finding (a), to accept a gate check id or the gate.checked event id, and fix.started is
      emitted with the refusal's gate.checked record; the refusal counts toward the cap and consumes no round
      id. (5) Snapshot hit: it is the fifth cancellation cause of 06, ended through the three cancellation
      steps with outcome killed from keel's own journal, claim released with reason cancelled, the same unlink
      and the same return to fixing; the 03 task-state diagram gains that edge next to the refused submit, and
      fails the run is kept only for the ingest point (outcome failed). (6) Waiver:
      submit.provider-path-events joins the unwaivable list of 11 section 1, so keel approve --rule override
      refuses it and the checkStatus waived never applies to a refusal. (7) Claim: the claim is released with
      reason submitted at ingest of a refused submit, so the 03 liveness sentence and the 06 lease diagram
      stand unchanged and reason failed is not used on either path. The existing shapes fit: result.submitted
      carries refs.commit null, run.finished has outcome failed and killed, claim.released has submitted and
      cancelled, gate.checked has a nullable commit and a reason, round.committed is simply not emitted; the
      only schema change is the widened fixStarted.findings shared with finding (a). No
      adopted-by-recommendation row flips (rows 4 and 5 keep their options, ADR-0004's item 1 is restated in
      place with the unlink, no superseding ADR), no Resolved-by-owner row moves (the DI-01 resolution's never
      opens, persists or hashes a value is preserved by the name-only listing, the refusal before staging and
      the unlink by name), and no Board-approved artifact field changes meaning, so the route is
      recommendation and the change lands as a design-iteration commit with this walk in the register. Order
      map: DI-15 tags no red edge (an absent producer on one path is invisible to the acyclicity and
      reachability checks); one green edge is added, steward.run.end gains gate.submit.provider-path-events
      (the map's step for the at-ingest listing, not steward.run.provider-path-check, which is the pre-spawn
      step) in its after list, so the chain seat.submit -> steward.run.ingest ->
      gate.submit.provider-path-events -> steward.run.end is walkable without steward.run.commit-round;
      round-commit keeps produced_by steward.run.commit-round and where task-branch;
      gate.submit.provider-path-events keeps its requirements worktree-diff and trace-db; no lock changes; the
      new cycle entry adds its own edges for the pre-spawn and ACK-ingest listing. Closure is proven by the
      rewritten sentences (validate checks examples, issues, i18n and the glossary in M0) and, from M2, by
      three negative controls: a replayed stream that reads a provider path after a 401 ends the run failed; a
      seat-created .env in the task worktree is a refused submit before staging, no blob or ref holds the
      file, the path is unlinked, the task branch tip is unchanged; and keel run of the same task after that
      refusal spawns on a clean pre-spawn listing with the round's other edits carried and a fix.started event
      that the schema accepts."
    decision:
      by: recommendation
      date: 2026-09-27
      option: "Option 1: a provider-path hit refuses the submit before staging; the run ends failed with the path
        name recorded and no round commit, and the rule about rounds says so"
      recorded_in: [ docs/05-vcs.md ]
  - id: DI-16
    title: The per-trunk integration lock names no release and no behaviour across the land approval pause
    statement: "One proposal integrates at a time per trunk, under a per-trunk lock in the locks directory, in the
      order keel land requests arrive. The sentence introduces a wait without naming what ends it, and the
      land is a two-step verb that stops for the land approval between the receipt draft and the archive
      commit: if the lock is held across the pause, every other proposal on the trunk waits on a Board action;
      if it is released, the second land re-enters the queue behind lands that arrived meanwhile and its
      restacked base may be stale. Neither reading is stated."
    status: decided
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: other
    anchors:
      - { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
      - { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
    class: cycle
    blocks: M3
    walk:
      producers:
        - precondition: the per-trunk lock in <git-common-dir>/keel/locks/ is taken before integration
          producer: { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
          position: before
          sufficient: false
          reason: "steward.land.restack takes it before restacking, but the sentence names the directory only: no file
            name, no holder identity, no lifetime. docs/04-trace-and-state.md Local control plane enumerates
            the lock files as ledger writer and worktree creation, so the land lock has no stated home. An
            O_EXCL file is held by a living process and the first keel land exits 3 at the receipt draft, so
            what the lock protects across the pause is not producible as written."
        - precondition: the lock file's name for trunk <trunk> (a trunk ref name may contain '/', for example release/2.x)
          producer: { file: docs/04-trace-and-state.md, heading: Local control plane }
          position: absent
          sufficient: false
          reason: No sentence names the file or the encoding of the trunk name into it; the locks/ line lists ledger
            writer and worktree creation only, and src/core/ledger.ts (LedgerLockPath, SupervisorLockPath) and
            src/vcs/git.ts (WorktreeLockPath) carry a type per lock path with none for the land lock. The fix
            must state the encoding and add the type.
        - precondition: the holder's identity (pid and proposal id) is in the lock file so that a waiting keel land can
            name the holder and keel audit can tell a dead holder from a living one
          producer: { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
          position: absent
          sufficient: false
          reason: No sentence says the land process writes anything into the lock file at take time; the two readers the
            fix introduces (the waiting land, audit's sweep) would read a field nothing produces.
        - precondition: the lock lifetime on the policy path, where one keel land process goes draft, policy check,
            archive commit, trunk with no Board pause
          producer: { file: docs/03-lifecycle.md, heading: Patch track and policy path }
          position: absent
          sufficient: false
          reason: The verb table says the first invocation stops at the draft only without a land approval or an
            approved land policy, so on a solo trunk one process runs from restack to land.completed; neither
            the policy-path section nor the queue sentence says whether that process keeps the lock throughout
            or releases at the draft and retakes it. The fix must state it.
        - precondition: in the order keel land requests arrive (an arrival order)
          producer: { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
          position: absent
          sufficient: false
          reason: "No step or event records a land request: schemas/ledger-event.schema.json holds land.completed and
            vcs.op only, and an O_EXCL create has no queue. Nothing produces the order the sentence promises."
        - precondition: the lock is released so the next land on the trunk can proceed
          producer: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
          position: after
          sufficient: false
          reason: The register's only candidate, steward.land.advance-trunk, runs in the second keel land process after
            board.approve.land; the process that created the file has exited at exit 3 and cannot release
            later. No sentence names a release at the draft, after --preview, at a red gate, at exit 5, on
            abandon, on hold or after a crash.
        - precondition: at the second keel land the draft still hashes to what the record binds and trunk still stands
            at the expected trunk tip
          producer:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
          position: before
          sufficient: false
          reason: board.approve.land proves what the Board read. Nothing holds trunk at the expected tip between the
            draft and the second land; the only guard is the ancestry step of docs/05-vcs.md Three land cases
            (exit 5, restack, land again), which produces a new draft, invalidates the approval, and sends the
            proposal behind lands that arrived later, contrary to the arrival-order sentence.
        - precondition: Restack keel/<P>/main onto the trunk tip
          producer: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
          position: before
          sufficient: true
          reason: The trunk tip is produced by the previous land's steward.land.advance-trunk (a cross-instance read,
            not an order edge), lives in a trunk commit and is reachable by the local land process.
      consumers:
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: the per-trunk lock held by another keel land on the same trunk
          released_by: unstated; the register assumes the holder's steward.land.advance-trunk
          outcome: breaks
          reason: keel land <P> takes the per-trunk lock before restacking; when another land process holds it the verb
            waits for a release that no sentence names, and it does not say whether it waits or exits.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: the per-trunk lock (unstated whether --preview takes it)
          released_by: unstated
          outcome: breaks
          reason: --preview restacks keel/<P>/main and runs the preview alone; whether it takes the lock, and whether a
            preview left running blocks every land on the trunk, is unstated.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: the per-trunk lock, or nothing (the reading is unstated)
          released_by: unstated
          outcome: breaks
          reason: The second keel land checks the draft hash, writes the archive commit and advances trunk. If the lock
            spans the pause the file has no living holder; if it does not, a foreign land may have moved
            trunk, the ancestry step exits 5, the restack writes a new draft and the approval is invalidated;
            the proposal re-enters behind later arrivals.
        - anchor: { file: docs/03-lifecycle.md, heading: Patch track and policy path }
          actor: board-at-terminal
          waits_for: the per-trunk lock held by another keel land on the same trunk
          released_by: the holder process ending (stated by the fix; unstated today)
          outcome: changed
          reason: "keel land <P> under an approved land policy (patch, solo trunk): one process restacks, previews,
            re-executes, drafts, checks the policy and the request, writes the archive commit and advances
            trunk with no Board pause. Today no sentence says whether that process holds the lock from restack
            through land.completed or releases at the draft and retakes it; the fix states that a policy-path
            land keeps the lock for the whole process, since the same process just restacked under it, and
            releases it when the process ends."
        - anchor: { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
          actor: second-steward-process
          waits_for: P's per-trunk lock
          released_by: P's steward.land.advance-trunk after board.approve.land (one reading) or nothing named (the other)
          outcome: breaks
          reason: "keel land <Q> on the same trunk while P is land_pending: under the held-across-the-pause reading it
            waits on a Board act with no bound (approve --stage land P, then P's second land); under the other
            reading nothing names what it waits for."
        - anchor:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
          actor: board-at-terminal
          waits_for: lock.supervisor while a seat runs
          released_by: steward.run.end
          outcome: holds
          reason: keel approve <P> --stage land waits for the supervisor lock only and never touches the per-trunk lock;
            it records the approval and exits.
        - anchor: { file: docs/03-lifecycle.md, heading: Proposal states }
          actor: board-at-terminal
          waits_for: nothing
          released_by: nothing named for the abandoned holder's lock
          outcome: breaks
          reason: keel approve <P> --rule abandon ends P from integrating or land_pending; if P's land process took the
            lock and exited, nobody releases it for the trunk, and no sentence names the abandon as a release.
        - anchor: { file: docs/03-lifecycle.md, heading: Proposal states }
          actor: board-at-terminal
          waits_for: nothing
          released_by: nothing named
          outcome: breaks
          reason: keel run --hold on <P> cancels running runs and stops dispatch; a land process is not a run and the
            hold says nothing about it or its lock.
        - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
          actor: board-during-wave
          waits_for: lock.supervisor
          released_by: steward.run.end
          outcome: holds
          reason: keel land while a wave is in flight waits for the supervisor lock and takes the per-trunk lock only
            afterwards; no step holds the two in the reverse order, so no inversion; the fix states the order
            explicitly. (That keel land waits for the supervisor lock without holding it, so a keel run
            spawned during a first-invocation land makes the land's later appends foreign to that run window,
            is a separate finding filed apart from DI-16.)
        - anchor: { file: docs/11-verification.md, heading: gate:land }
          actor: board-at-terminal
          outcome: holds
          reason: "keel check --gate land is report-only: it reads the integrated commit and the records and needs no
            lock."
        - anchor: { file: docs/11-verification.md, heading: gate:land }
          actor: board-at-terminal
          outcome: holds
          reason: The ancestry check is what catches a trunk moved between the draft and the second land (exit 5); it is
            the only guard and its subject (archive versus integrated commit) is DI-19's.
        - anchor: { file: docs/11-verification.md, heading: gate:land }
          actor: board-at-terminal
          outcome: holds
          reason: A restacked draft no longer hashes to the record and the Board confirms again; invalidation on changed
            content is the owner's D6 and stays; its cost per foreign land is in the tally.
        - anchor: { file: docs/06-parallelism.md, heading: The lease }
          actor: board-at-terminal
          waits_for: nothing
          released_by: nothing named
          outcome: breaks
          reason: keel audit removes stale claim refs by CAS delete and re-queues expired leases; no sweep names the
            O_EXCL files in locks/, so a land lock without a holder is never removed.
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          outcome: holds
          reason: "status computes state from the ledger and --next lists the legal next actions from that state
            (integrating: wait for the land process; land_pending: approve --stage land, then land). The lock
            is not a ledger fact (KP-12), so status neither shows nor needs it, exactly as the dashboard row
            below; under the fix the waiting keel land itself names the holder's proposal, so status is
            unchanged."
        - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
          actor: crashed-supervisor
          waits_for: removal of the lock file in locks/
          released_by: nothing named
          outcome: breaks
          reason: "The holder crashes or never releases: lock recovery is deferred to an M1a implementation detail
            (DI-05), and on the text as written the first keel land exits at the draft, so a lock file without
            a living holder is the happy path, not the exception."
        - anchor: { file: docs/14-trust-security.md, heading: Server-side branch protection recommendations }
          actor: ci-fresh-clone
          outcome: holds
          reason: A fresh clone has no locks/ directory; the CI check reads trunk tips only (its own defect is DI-03).
        - anchor: { file: docs/17-open-decisions.md, heading: Multi-machine collaboration }
          actor: second-machine
          outcome: holds
          reason: The lock is per clone; another machine sees committed records and archive projections only, and
            landing the same trunk from two machines is outside v1.
        - anchor: { file: docs/02-alignment.md, heading: Requests and seat-proof verbs }
          actor: seat
          outcome: holds
          reason: land refuses under KEEL_RUN or a keel-run ancestor (exit 6); a seat never reaches the lock.
        - anchor: { file: docs/08-dashboard.md, heading: Proposals }
          actor: dashboard
          outcome: holds
          reason: "The dashboard reads the ledger and committed files: it shows integrating and land_pending from events
            and cannot show the lock, which is not a ledger fact; honest by KP-12, the same reasoning as the
            status row, and it inherits the missing land-request event."
      places:
        - artifact: integrated-commit
          where: proposal-branch
          reachable_from: [ local, supervisor, seat, agent-api ]
        - artifact: receipt-draft
