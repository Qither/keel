      readers:
        - field: "routing.yaml profiles.<alias>.env (envNames: base_url, api_key, model.<tier>)"
          readers:
            - steward.run.spawn (env-policy allowlist, mapped to native names)
            - board.doctor --section providers (SET/UNSET)
            - routing-snapshot at steward.plan.route and board.approve.plan
            - "dashboard.build (Runtime health view: names with SET/UNSET)"
        - field: routing.yaml profiles.<alias>.auth (env | runtime-login | runtime-profile)
          readers:
            - steward.run.spawn (which native names are filled)
            - "board.doctor 'auth ... (effective: env; no credential file read)'"
            - the exposure rule of 10-providers.md section 4 (doctor.exposure)
        - field: runtime descriptor provider_path_set (names only)
          readers:
            - steward.run.provider-path-check (name-only listing before staging)
            - gate.submit.provider-path-events
            - board.doctor (PRESENT/ABSENT by stat)
            - deny-read rule generation in the per-run config (09-runtimes.md section 5)
        - field: argv.redacted.json ${ENV:NAME} placeholders
          readers: [ steward.land.archive-commit, gate.land.projection, board.trace ]
        - field: routing.yaml policy.record_model_names (default false)
          readers:
            - steward.run.ingest typed-field whitelist (drops the runtime-reported model field)
            - receipt (alias, tier, declared family, revision only)
        - field: runtime-reported model id (stream init event, in memory at steward.run.ingest)
          readers:
            - the optional same/different check of two lanes (persists only 'same' or 'different')
            - steward.run.ingest typed-field whitelist (dropped unless policy.record_model_names)
        - field: doctor states SET/UNSET and PRESENT/ABSENT
          readers:
            - board-at-terminal (diagnosis rule of 10-providers.md section 1)
            - M2 exit criterion 'doctor shows SET/UNSET and PRESENT/ABSENT only'
            - dashboard Runtime health view
        - field: scripts/validate.mjs NEVER_OPEN basenames
          readers:
            - the audit check (a present never-open file is flagged by name)
            - readBuf refusal
            - the issues check anchorOk (an anchor in a never-open file is an error)
      tally: []
    terms:
      - name: provider value
        uses:
          - anchor: { file: docs/00-mandate.md, heading: 1. The owner's statement }
            meaning: an endpoint, key or model name the user owns; keel never opens a file or record that holds one and
              dereferences it only in process memory at spawn and at direct-lane call time
            demands: no value in any file, record, log, hash or argv keel writes
          - anchor: { file: docs/10-providers.md, heading: 1. The exact invariant }
            meaning: the same value as handled by env-policy at spawn and by the direct-lane client at call time (I2),
              never persisted (I3)
          - anchor: { file: docs/adr/ADR-0006-provider-values-by-reference.md, heading: Decision }
            meaning: the value behind a routed environment variable name, dereferenced in exactly two modules
        kept:
          meaning: an endpoint URL, an API key or token, or a concrete model name the user sets in their own
            environment; keel handles it only in process memory, as the value of a named environment variable,
            at spawn and at direct-lane call time, and never persists, prints, logs or hashes it
          provides: the in-memory places (env-policy at spawn, the direct-lane child at call time) and the
            never-persisted rule, checkable by the I4 lint, the argv placeholders and the typed-field
            whitelist
      - name: runtime credential
        uses:
          - anchor: { file: docs/10-providers.md, heading: 1. The exact invariant }
            meaning: a file that a runtime keeps its login or token in; a member of the provider path set, which keel
              passes only to stat (I1)
          - anchor: { file: docs/10-providers.md, heading: 4. Exposure rule (env and file) }
            meaning: a file whose readability by a seat decides the file exposure of a route
        kept:
          meaning: a file under a runtime's well-known credential path that keel never opens in any mode; its presence
            is reported by stat only and its readability by seats is the file exposure of the route
          provides: "names-only handling: PRESENT or ABSENT from the doctor, a refusal at dispatch when a code-executing
            seat could read it"
      - name: direct-lane call time
        uses:
          - anchor: { file: docs/00-mandate.md, heading: 1. The owner's statement }
            meaning: the second of the two points at which keel dereferences a named environment variable
          - anchor: { file: docs/09-runtimes.md, heading: direct }
            meaning: the moment the direct-lane child sends a provider request
        kept:
          meaning: the point inside the direct lane, a tool-less child that steward.run.spawn starts like any runtime,
            at which the direct-lane client unwraps the opaque handle from env-policy to send one provider
            request
          provides: a named point in the sequence after spawn, so the clause names where the second dereference happens
            and the order map needs no extra step
    options:
      - "Option 1 (decided): restate clause 11 and the P1 row so that 'never reads a provider value' means
        keel never opens a file or record that holds a provider value or a credential and never persists,
        prints, logs or hashes a value, while dereferencing a named environment variable in process memory at
        spawn and at direct-lane call time is permitted; the providers invariant (I1 to I5), KP-13 and
        ADR-0006 are the verifiable form."
      - "Option 2: keep the literal clause ('keel never reads a provider value') and drop the profile mapping
        (env-policy) and the direct lane: keel passes the parent environment through unchanged, never maps
        KEEL_PROFILE_* names to native names and never calls a provider itself; declined by the owner."
      - "Option 3: a user-owned launcher: the user's own wrapper script builds the child environment and
        performs any direct provider call, and keel spawns runtimes only through it, so keel itself never
        dereferences a value; declined by the owner."
      - "Option 4: defer DI-01 to M2, when the env-policy constants and the I4 lint exist, and decide with the
        code in hand; declined by the owner."
    recommendation: "Option 1, as decided by the owner on 2026-09-27 and recorded in docs/17-open-decisions.md
      \"Resolved by the owner\": the clause and the P1 row carry the verifiable form (never opens a file or
      record; never persists, prints, logs or hashes; dereferences a named environment variable in process
      memory only at spawn and at direct-lane call time), and no recorded decision flips, so ADR-0006 stands
      without a superseding ADR. The maintainers close DI-01 in one commit that (1) fills the register entry
      in the schema's shapes: decision {by: owner, date: 2026-09-27, option: 'Option 1 ...', recorded_in:
      [docs/17-open-decisions.md, docs/00-mandate.md, docs/10-providers.md,
      docs/adr/ADR-0006-provider-values-by-reference.md]}, closure {date, checks: [i18n, audit, examples,
      issues], tests: [], anchors: every section rewritten}, regression cells
      patch/supervisor/patch-per-change, patch/seat/patch-per-change,
      patch/board-at-terminal/patch-per-change, spike/dashboard/spike-happy and feature/hook/feature-happy,
      and a walkthroughs[] entry with trigger 'owner', scope 'owner decision DI-01, option 1' and issues
      [DI-01]; (2) rewrites every consumer marked changed, including the ones outside docs/:
      templates/project/routing.yaml, examples/acme-notes/.keel/routing.yaml, examples/providers.env.example
      (header comments) and src/runtime/spawn.ts (ProfileEnvMapping doc comment), all to 'dereferenced in
      process memory only at spawn and at direct-lane call time; never persisted, printed, logged or hashed';
      (3) adds the two glossary rows, with the provider-value row naming the third in-memory place (a
      runtime-reported model id parsed at ingest and dropped by the typed-field whitelist) so that ADR-0006
      Decision item 5 and 14-trust-security.md demand no more than the row provides; (4) qualifies the
      docs/01-org-model.md Board-powers sentence so that a value reaches keel only as a named environment
      variable in the Board member's own environment while a host runtime's own login file under auth
      runtime-login or runtime-profile stays governed by the exposure rule; and (5) proves closure with npm
      run check (i18n, audit, examples, issues under exit_review: M0) plus a repository search for the
      replaced verb over docs/, schemas/, README*.md, AGENTS.md, src/, templates/, examples/, runtimes/,
      test/, conformance/, skills/ and org/ that returns only file-access uses. Sections 1 and 2 of the
      mandate and their mirror are confirmed byte for byte, never edited, since they already carry the owner's
      words."
    decision:
      by: owner
      date: 2026-09-27
      option: "Option 1: clause 11 and the P1 row restated; keel never opens a file or record that holds a provider
        value or a credential, never persists, prints, logs or hashes a value, and dereferences a named
        environment variable in process memory only at spawn and at direct-lane call time"
      recorded_in: [ docs/00-mandate.md, docs/17-open-decisions.md ]
    closure:
      date: 2026-09-27
