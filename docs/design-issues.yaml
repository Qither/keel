              land policy)
            - board.approve.receipt (reads the archived receipt.md it binds)
            - board.approve.land (reads the draft's 'Not yet approved' branch)
            - dashboard.build (Evidence and receipts)
        - field: archive commit trailer Keel-Approval (docs/04 Steward commits and trailers; src/vcs/git.ts)
          readers: [ ci.check-approval (DI-03), audit.sweep, ledger.verify-chain (trailer-to-record cross-check) ]
        - field: proposal.created origin, policy, request_approval (schemas/ledger-event.schema.json)
