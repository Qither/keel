issues:
  - id: DI-01
    title: Clause 11 and P1 say keel never reads a provider value; invariant I2 reads env values in memory
    statement: >-
      Clause 11 of the owner's statement and the P1 row say that keel never reads a provider value or a
      credential file. The exact invariant of the providers document, its I2 clause, ADR-0006 and KP-13 say
      that keel reads env values in memory in exactly two modules, at spawn and at direct-lane call time, and
      the P1 mapping row restates that reading. The lower documents add qualifiers the clause does not have
      (in memory, in exactly two modules, never persists); the two texts cannot both hold.
    status: open
    found_by: external-review
    found_on: 2026-09-26
    root_cause: silent-reconciliation
    anchors:
      - { file: docs/00-mandate.md, heading: "1. The owner's statement" }
      - { file: docs/00-mandate.md, heading: "2. Binding requirements" }
      - { file: docs/10-providers.md, heading: "1. The exact invariant" }
      - { file: docs/adr/ADR-0006-provider-values-by-reference.md, heading: "Decision" }
      - { file: docs/00-vision.md, heading: "KP-13 Provider values belong to the user" }
    class: mandate-conflict
    blocks: M0
    higher: { file: docs/00-mandate.md, heading: 1. The owner's statement }
    lower: { file: docs/10-providers.md, heading: 1. The exact invariant }

  - id: DI-02
    title: The land approval record is committed only in the archive commit that the land gate must pass first
    statement: >-
      The recording rule places the land approval record in the archive commit itself, and the gate accepts an
      approval only when the record already exists in git at its expected place. The land verb checks the land
      approval on its second run and only then writes the archive commit. The record cannot exist in a commit
      that is written after the check that requires it.
    status: open
    found_by: external-review
    found_on: 2026-09-26
    root_cause: rule-tightened
    anchors:
      - file: docs/02-alignment.md
        heading: "Board approvals (explicit confirmation, hash binding, invalidation)"
      - { file: docs/12-cli-api-mcp.md, heading: "1. 16 verbs and at most 40 modes" }
      - { file: docs/04-trace-and-state.md, heading: "Land projection and the projection gate" }
    class: cycle
    blocks: M1b

  - id: DI-03
    title: The recommended CI approval check needs a ledger event that a fresh clone never has
    statement: >-
      The branch-protection recommendation has CI run the land gate's approval check at the trunk tip. That
      gate accepts an approval only together with an approval.recorded event on the verified ledger chain. The
      ledger lives in the git common dir and refs/keel is never pushed, so a fresh CI clone cannot satisfy the
      condition; the CI check and the local gate need to be two different checks.
    status: open
    found_by: external-review
    found_on: 2026-09-26
    root_cause: rule-tightened
    anchors:
      - { file: docs/14-trust-security.md, heading: "Server-side branch protection recommendations" }
      - file: docs/02-alignment.md
        heading: "Board approvals (explicit confirmation, hash binding, invalidation)"
      - { file: docs/04-trace-and-state.md, heading: "Single writer" }
    class: cycle
    blocks: M1b

  - id: DI-04
    title: Every mutating verb waits for the supervisor lock without exception, so a hold or an abandon cannot
      reach the holder
    statement: >-
      The single-writer rule makes every other mutating verb, keel approve included, wait for the supervisor
      lock while a seat runs, with no exception. Cancellation says that a Board hold and an abandon ruling
      cancel the running task. The hold mode and the abandon ruling are mutating verbs, so they wait for the
      lock that only the run they are meant to stop releases.
    status: open
    found_by: external-review
    found_on: 2026-09-26
    root_cause: rule-tightened
    anchors:
      - { file: docs/04-trace-and-state.md, heading: "Single writer" }
      - { file: docs/06-parallelism.md, heading: "Cancellation" }
      - { file: docs/12-cli-api-mcp.md, heading: "1. 16 verbs and at most 40 modes" }
      - { file: docs/03-lifecycle.md, heading: "Proposal states" }
    class: cycle
    blocks: M1a

  - id: DI-05
    title: Recovery of the supervisor lock and the run after a supervisor crash is undefined
    statement: >-
      The single-writer rule defers the recovery of a lock left behind by a crashed process to an
      implementation detail, and the lease rules cover claims, not the supervisor lock. No document says how a
      crashed or hung supervisor is detected, who takes over its lock, and how its run and its window of
      ledger events are closed.
    status: open
    found_by: external-review
    found_on: 2026-09-26
    root_cause: other
    anchors:
      - { file: docs/04-trace-and-state.md, heading: "Single writer" }
      - { file: docs/06-parallelism.md, heading: "The lease" }
    class: cycle
    blocks: M1a

  - id: DI-06
    title: Dependents at depth 2 are called the impact closure and used to prove that no dependency changed
    statement: >-
      Impact follows dependents at depth 2. The same section calls that computation the impact closure and
      lets evidence be reused for a scope once the closure proves that no dependency of the scope changed; the
      verification and integration documents rely on that proof. A depth-bounded set cannot prove an unbounded
      claim; dependents at depth 3 and beyond are outside it.
    status: open
    found_by: external-review
    found_on: 2026-09-26
    root_cause: term-overloaded
    anchors:
      - { file: docs/07-architecture-intelligence.md, heading: "Impact and the ratchet" }
      - { file: docs/11-verification.md, heading: "2. Source-state binding and land re-execution" }
      - { file: docs/06-parallelism.md, heading: "Integration queue and land re-run" }
    class: term-collision
    blocks: M4

  - id: DI-07
    title: The architecture model changes only at land, so an approved new dependency fails verify.arch before land
    statement: >-
      The declared model changes only through an arch delta applied by the land archive commit, and the
      verify.arch check judges new violations against the declared model. A contract approval on the system
      track binds an arch delta that adds a dependency; a correct implementation of that dependency is judged
      against the trunk model, which does not yet contain it. No target model (trunk model plus the approved
      delta) is defined for verification and preview.
    status: open
    found_by: external-review
    found_on: 2026-09-26
    root_cause: no-order-check
    anchors:
      - { file: docs/07-architecture-intelligence.md, heading: "Declared model" }
      - { file: docs/07-architecture-intelligence.md, heading: "Drift and the unknown policy" }
      - { file: docs/11-verification.md, heading: "gate:verify" }
    class: cycle
    blocks: M4

  - id: DI-08
    title: Goal progress is requirement coverage, and nothing reads success_signal when a goal closes
    statement: >-
      The alignment chain, the RTM, the dashboard overview and the measures table define goal progress as
      requirements verified at head over the total. A goal's success_signal is a required string that no verb,
      gate, record or view reads, and nothing is needed to set a goal's status to done. A goal whose
      requirements are all verified reports full progress whether or not its success signal was observed.
    status: open
    found_by: external-review
    found_on: 2026-09-26
    root_cause: unread-field
    anchors:
      - { file: docs/02-alignment.md, heading: "Alignment chain L0–L11" }
      - { file: docs/04-trace-and-state.md, heading: "RTM and drift classes" }
      - { file: docs/08-dashboard.md, heading: "Overview" }
      - { file: docs/15-roadmap.md, heading: "Measures" }
      - { file: schemas/goals.schema.json, pointer: "#/$defs/goal/properties/success_signal" }
    class: term-collision
    blocks: M1a

  - id: DI-09
    title: The patch track derives exactly one work order and also allows a test fixed first by a test task
    statement: >-
      The patch track says the Steward derives exactly one work order, and in the same sentence lets its
      acceptance come from a test fixed first by a test task on a different declared family. A test task is a
      work order of kind test, so the patch has two work orders, or it has one and the test task cannot exist.
      The rule does not say whether a patch that needs a test is raised to feature or is allowed two work
      orders.
    status: open
    found_by: external-review
    found_on: 2026-09-26
    root_cause: cardinality
    anchors:
      - { file: docs/03-lifecycle.md, heading: "Patch track and policy path" }
      - { file: docs/11-verification.md, heading: "3. Test independence and red/green proof" }
    class: gap
    blocks: M2

  - id: DI-10
    title: A quick-patch on a shared trunk needs a request approval, a land approval and a receipt acknowledgement
    statement: >-
      The standing policy limits require a land approval for patches on shared trunks and a receipt
      acknowledgement after every policy land. On a shared trunk a quick-patch therefore costs three Board
      touches (request, land, receipt), more than the per-change contract route it is meant to lighten and
      more than the staffing table's typical count. Policy land (a land on the policy path) and land policy (a
      standing policy that replaces the per-land approval) are two meanings under one wording.
    status: open
    found_by: external-review
    found_on: 2026-09-26
    root_cause: term-overloaded
    anchors:
      - { file: docs/03-lifecycle.md, heading: "Standing policy limits" }
      - { file: docs/03-lifecycle.md, heading: "Patch track and policy path" }
      - { file: docs/01-org-model.md, heading: "Staffing per track" }
      - { file: docs/17-open-decisions.md, heading: "Adopted by recommendation (reversible, with ADR)" }
    class: term-collision
    blocks: M0
  - id: DI-11
    title: The register's place and machine vocabulary lacks the workspace root and keel's own agent-side processes
    statement: The order map's vocabulary placed every run input, outbox drop and worktree in the git common dir
      and let a seat reach only its worktree and the proposal branch, so every brief a seat ACKs, every outbox
      drop and every read by keel api, keel hook or the MCP server was flagged as a place the seat cannot
      reach. The design puts run inputs, outboxes and worktrees under the workspace root outside the
      repository, round commits on the task branch, and keel's own api, hook and MCP processes in the seat's
      process tree with the control plane readable; the vocabulary of section 5.2, not the design, was what
      could not hold.
    status: closed
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: other
    anchors:
      - { file: docs/00-mandate.md, heading: 5.2 The design-issue register }
      - { file: docs/04-trace-and-state.md, heading: Local control plane }
      - { file: docs/05-vcs.md, heading: Creating worktrees }
      - { file: docs/12-cli-api-mcp.md, heading: "5. MCP (two read tools, one write tool)" }
      - { file: schemas/design-issues.schema.json, pointer: "#/$defs/place" }
    class: gap
    blocks: M0
    walk:
      producers:
        - precondition: a seat reads its brief and writes its outbox drops
          producer: { file: docs/04-trace-and-state.md, heading: Local control plane }
          position: before
          sufficient: true
          reason: run inputs and outboxes live under the workspace root, which the runtime is started in; the compiled
            brief itself stays in the git common dir and reaches the seat through the run inputs
      consumers:
        - anchor: { file: docs/00-mandate.md, heading: 5.2 The design-issue register }
          actor: seat
          outcome: changed
          reason: the reachability sentence gains the workspace root, the task branch and the agent-api machine
        - anchor: { file: docs/13-artifacts-schemas.md, heading: 6. validate coverage and the D1 tooling exception }
          actor: board-at-terminal
          outcome: unchanged
          reason: the issues row names the reachability check, not the place list
        - anchor: { file: docs/04-trace-and-state.md, heading: Local control plane }
          actor: seat
          outcome: unchanged
          reason: the design already states that the control plane is readable by keel's own processes and, on exposed
            runtimes, by seats
      places:
        - artifact: run-dir
          where: workspace-root
          reachable_from: [ local, supervisor, seat, agent-api ]
        - artifact: brief
          where: git-common-dir
          reachable_from: [ local, supervisor, agent-api ]
        - artifact: round-commit
          where: task-branch
          reachable_from: [ local, supervisor, seat, agent-api ]
      readers:
        - field: "place: workspace-root, task-branch"
          readers: [ "order.artifacts[].where", the reachability table of the issues check ]
        - field: "runs_in: agent-api"
          readers: [ "order.steps[].runs_in", the reachability table of the issues check ]
      tally: []
    options:
      - "Extend the vocabulary: places workspace-root and task-branch, machine agent-api (keel's own api, hook
        and MCP processes in the seat's process tree), with the reachability table stated in section 5.2 and
        enforced by the issues check."
      - Keep the vocabulary and exempt supervisor-handed inputs from the reachability check by tagging every
        affected edge with an open issue.
    recommendation: "Option 1: the places exist in the design (workspace root, task branch) and the exemption
      would hide real unreachable places behind tags."
    decision:
      by: recommendation
      date: 2026-09-27
      option: Option 1
      recorded_in: [ docs/00-mandate.md, schemas/design-issues.schema.json, scripts/validate.mjs ]
    closure:
      date: 2026-09-27
      checks: [ schemas, examples, issues, i18n ]
      tests: []
      anchors:
        - { file: docs/00-mandate.md, heading: 5.2 The design-issue register }
        - { file: schemas/design-issues.schema.json, pointer: "#/$defs/place" }
        - { file: schemas/design-issues.schema.json, pointer: "#/$defs/runsIn" }
    regression:
      - { track: feature, actor: seat, sequence: feature-happy }
      - { track: feature, actor: hook, sequence: feature-happy }
  - id: DI-12
    title: The close check blocks on the receipt acknowledgement that the same phase calls non-blocking
    statement: Phase 6 produces a receipt acknowledgement item when the change landed under a policy, and its
      gate, the close check, requires no unacknowledged receipt on the touched elements or paths. The same
      phase and the standing policy limits say the acknowledgement does not block and only blocks the next
      change that touches the same elements. At close, a proposal that landed under a policy has exactly one
      unacknowledged receipt on exactly the elements it touched, its own; as written the close check blocks on
      it unless the check excludes the proposal's own receipt, which no sentence says.
    status: open
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: other
    anchors:
      - { file: docs/03-lifecycle.md, heading: Phase 6 Close }
      - { file: docs/03-lifecycle.md, heading: Standing policy limits }
  - id: DI-13
    title: A proposal ADR is accepted by the contract approval but not bound by its hashes
    statement: The L3 row says an ADR is accepted by the contract approval on the system track and that anchor or
      body drift voids the acceptance. The bound-artifacts table binds the contract kind to exactly the frozen
      block, the spec delta and the arch delta, summarized as contract_hash, and the hash rules say the hashes
      cover exactly the listed artifacts. contract_hash never covers the ADR, so the gate check that compares
      every bound artifact's hash cannot see ADR drift, and the acceptance the row promises has no producer.
    status: open
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: other
    anchors:
      - { file: docs/02-alignment.md, heading: Alignment chain L0–L11 }
      - file: docs/02-alignment.md
        heading: Board approvals (explicit confirmation, hash binding, invalidation)
  - id: DI-14
    title: The land-time ref diff cannot explain the ledger anchor moves made after the run window
    statement: "The ref, HEAD and reflog parts of the snapshot taken before each spawn are diffed at ingest and at
      land, and a move of the ledger anchor is explained only when it matches the appends the supervising
      Steward process made itself. At land no supervising process exists, and between the last pre-spawn
      snapshot and the land the anchor has moved by appends the supervisor did not make: the land approval's
      approval.recorded event, the restack's old and new commit ids, land.started. Read as written, every land
      sees an unexplained anchor move, sets blocked(reserved_op) and needs an override; no sentence names a
      land-time baseline snapshot."
    status: open
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: no-order-check
    anchors:
      - { file: docs/05-vcs.md, heading: Detection (the guarantee) }
      - { file: docs/04-trace-and-state.md, heading: Single writer }
  - id: DI-15
    title: Every submitted round has a commit, except the round that fails the provider path listing
    statement: The Steward commit at submit says every submitted round therefore has a commit, whether its submit
      gate passes or not, and in the next sentence that the name-only provider path listing runs before the
      commit and that a hit fails the round with submit.provider-path-events and nothing is staged or
      committed. A round that fails the listing is a submitted round with no commit; the fix round that builds
      on the failed round's commit, and the trace that expects a Keel-Round trailer per round, have nothing to
      build on, and the failing check carries a submit-gate id although the submit gate is said to run on the
      round commit.
    status: open
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: cardinality
    anchors:
      - { file: docs/05-vcs.md, heading: The Steward commit at submit }
      - { file: docs/11-verification.md, heading: gate:submit }
  - id: DI-16
    title: The per-trunk integration lock names no release and no behaviour across the land approval pause
    statement: "One proposal integrates at a time per trunk, under a per-trunk lock in the locks directory, in the
      order keel land requests arrive. The sentence introduces a wait without naming what ends it, and the
      land is a two-step verb that stops for the land approval between the receipt draft and the archive
      commit: if the lock is held across the pause, every other proposal on the trunk waits on a Board action;
      if it is released, the second land re-enters the queue behind lands that arrived meanwhile and its
      restacked base may be stale. Neither reading is stated."
    status: open
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: other
    anchors:
      - { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
      - { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
  - id: DI-17
    title: Ruling names two records with two authors
    statement: A ruling is the Board's approval of kind rule (abandon, override, budget, track, unverified,
      dismiss), written by keel approve --rule as an approval record, and it is also the planner's or a seat's
      record written through keel api rule into the run outbox, which produces a ruling.made event and gates
      integration after a collision. The glossary, the id table and the register's vocabulary carry one term
      for both, and the seat contracts, the collision rule and the approval rules read the word with different
      authors and different authority.
    status: open
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: term-overloaded
    anchors:
      - { file: docs/02-alignment.md, heading: "Precedence order, decision boundaries and rulings" }
      - { file: docs/06-parallelism.md, heading: Collision prediction }
      - { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
      - { file: docs/12-cli-api-mcp.md, heading: 4. keel api }
  - id: DI-18
    title: No sentence says how a triage record reaches the audit lens that checks its citation
    statement: Triage records are planner-owned records in the git common dir, projected only at land, and every
      triage record cites evidence that the auditor checks. The audit lens runs in a reviewer seat, and the
      lens rules say verdicts and the diff are passed inline or by path; nothing says how a triage record
      reaches the auditing seat, whether the auditor is the audit lens at all, or which process reads the
      record on the seat's behalf.
    status: open
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: other
    anchors:
      - { file: docs/11-verification.md, heading: 6. Findings authority and triage records }
      - { file: docs/11-verification.md, heading: 4. Review lenses and lens sets }
      - { file: docs/04-trace-and-state.md, heading: Local control plane }
  - id: DI-19
    title: The land gate's ancestry check needs the archive commit that is written after the gate
    statement: The land gate runs in the land process after integration and before the archive commit is written,
      and its ancestry check verifies that trunk is an ancestor of the archive commit. The archive commit is
      produced by the second land after the land approval, so the check reads a commit that does not yet
      exist; the check may intend the integrated commit about to be archived, which no sentence says. The
      shape is DI-02's on a different artifact, so DI-02's correction does not close it.
    status: open
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: no-order-check
    anchors:
      - { file: docs/11-verification.md, heading: gate:land }
      - { file: docs/03-lifecycle.md, heading: Phase 5 Land }

