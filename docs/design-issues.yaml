          - anchor:
              file: docs/00-vision.md
              heading: KP-08 Independence comes from a declared model family, and findings have authority
            meaning: A critical finding closes only through a fix plus re-review by the same lane, or through a Board
              ruling
            demands: the same; a KP, so the fix may not weaken it
          - anchor: { file: skills/keel-review/SKILL.md, heading: How findings are used }
            meaning: "The reviewer's restatement: planner triage can confirm, upgrade or propose a dismissal; it cannot
              dismiss; minors are deferred into the receipt"
            demands: the same two paths and the receipt deferral; already in the verifiable form
          - anchor: { file: docs/15-roadmap.md, heading: "M3 Verify, review and land" }
            meaning: Exit criterion "A planner cannot dismiss a critical finding"
            demands: an exercised check with a negative control; provided once the section 8 row is schema-expressible
        kept:
          meaning: A critical or important finding closes only through a fix plus scoped re-review by the same lane, or
            a Board `--rule dismiss`; a triage record can confirm or upgrade it, or propose the dismissal,
            never close it
          provides: the synthesis rules of section 6, reading the action and post-triage severity of stored triage
            records (all of which resolved their citations at ingest), and the receipt's deferred_minors and
            open_findings taken after that synthesis
      - name: planner-owned
        uses:
          - anchor: { file: docs/11-verification.md, heading: 6. Findings authority and triage records }
            meaning: Triage records are written by the planner seat
            demands: 'single writer: planner content, validated and stored by the Steward (docs/01-org-model.md
              "Single-writer ownership"); provided'
        kept:
