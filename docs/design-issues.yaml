      - name: reserved operation / reserved action
        uses:
          - anchor: { file: docs/00-vision.md, heading: Organization }
            meaning: an action only the Board may authorize, listed in org/reserved-actions.yaml
            demands: one identifier
          - anchor: { file: docs/05-vcs.md, heading: "Reserved operations: ref snapshots, ls-remote, env hardening" }
            meaning: the same actions, called operations; the blocked reason is reserved_op and 14 says reserved-operation
              prevention
            demands: the same thing under a second name
        kept:
          meaning: the glossary's reserved action, unchanged here
          provides: two names for one thing exist already; a term-collision candidate outside DI-14's rule, to be filed
            on its own (5.3 step 1 splits compound findings), not renamed by this fix
    options:
      - "Option 1, land-time baseline under an exclusive interval: each keel land process (the first and the
        second) takes the per-trunk integration lock, then the supervisor lock, records its own ref snapshot
        before it writes any ref, records every ref change it makes as a vcs.op event (op worktree-add for its
        verify and temporary cherry-pick worktrees, the restack's update-refs, the archive commit, the trunk
        update), and diffs against its own snapshot with its own appends and vcs.op events by the process that
        took the baseline: the supervisor at ingest, the first land process at the land gate, the second land
        process after the archive commit and before the trunk update. keel run (spawn) joins the waiters of
        the supervisor lock, so no run window overlaps a land's diffed interval; the first land releases the
        supervisor lock at exit 3 and the second at the trunk update; the pre-spawn snapshot is no longer read
        at land, and keel check re-reports the recorded gate.checked results instead of re-diffing. Ordered
        behind DI-04, DI-05 and DI-16."
      - "Option 2, chain-segment explanation: keep the pre-spawn snapshot as the land baseline and redefine an
        explained anchor move for any process as a verified chain segment from the snapshot's blob hash to the
        current one whose every event lies inside a run window whose submit.reserved-op result is pass, or was
        appended under the writer lock by a keel process outside every run window; explain every other Steward
        ref move since the snapshot (round commits, claim releases, snapshot refs, governance commits,
        worktree adds) by its own event type, and take no new lock."
      - "Option 3, drop the land-time diff: the ref snapshot is diffed at ingest only; land relies on
        land.ancestry, the restack's CAS update-ref and the land approval's hash binding; land.ref-snapshot
        leaves gate:land and the glossary row loses \"and land\"."
      - "Option 4, persist the supervisor's own-append set: at ingest the supervisor writes the ids and hashes
        of its appends into the run record so a later land process can replay every verified window since the
        last snapshot; the sentence stays and the land trusts a control-plane file, which a seat can write on
        native Windows and which the anchor design exists to distrust."
    recommendation: "Option 1, as corrected. It removes both halves of the gap with one principle the design
      already states for ingest: a process explains only what it did, against a baseline it took, over an
      interval it holds exclusively. The first sketch lacked the third clause: no lock gave a land process
      exclusivity (lock.supervisor is held only by steward.run.spawn and nothing waits for a land;
      lock.integration-queue is per trunk and taken only at the restack), so a keel approve for another
      proposal, a keel new, a keel audit stale-lock removal or another proposal's run ingest could append
      while the land re-executed the acceptance matrix and the land's diff would set blocked(reserved_op) on a
      legitimate outside-window append (14 T1): the same false positive the fix claims to remove. The
      corrected option makes each land process a holder of the supervisor lock from its snapshot to its
      release (exit 3 for the first land, the trunk update for the second) and adds keel run's spawn to the
      waiters, which is the exclusivity 04 already grants a run and costs one more kind of wait (a run or an
      approve waits for a land in flight, and is told which land holds the lock), ordered behind DI-04 (hold
      and abandon reaching the holder), DI-05 (a crashed holder's recovery, which now covers a crashed land)
      and DI-16 (the per-trunk lock across the approval pause). Three further corrections: the snapshot step
      is the acquirer of the per-trunk lock, so a land that waited for another land of the same trunk
      baselines after that land's trunk advance and archive commit; the second land has its own snapshot and
      diff steps, so the precondition before the trunk update names its producer; and every worktree add or
      remove a land process makes (the _verify/<sha7> checkout of 05 \"Creating worktrees\" and the restack's
      temporary cherry-pick worktree) is recorded as a vcs.op with op worktree-add before the diff, otherwise
      the heads and reflog parts flag the land's own checkout. With these, the land diff is meaningful (it
      covers the land's own worktree adds, restack, gate appends and archive writes, the only interval no
      other diff covers), it adds no new trust (nothing reads another process's memory or a persisted append
      list), no new event type, field or schema (vcs.op and op worktree-add exist), and it flips no decision
      (ADR-0001's ref snapshots before and after, ADR-0003's refs/keel in the pre-spawn snapshot and
      ADR-0005's outside-window approval.recorded stay true; the land approval is recorded between the two
      land processes, outside both diffed intervals). Option 2 avoids the lock but widens the vcs.op clause
      the walk already found too narrow and makes the land re-verify windows ingest verified; option 3 loses
      the only diff over the land's own writes and removes an M3 check; option 4 reintroduces a file a seat
      can forge. Order-map change: add steward.land.snapshot-refs (doc 05 Detection (the guarantee), after
      [board.land, steward.run.end], runs_in local; acquirer of lock.integration-queue and holder of the
      supervisor lock) and steward.land.snapshot-refs-second (after [board.approve.land], before
      steward.land.check-approval); add steward.land.ref-diff-second (after
      [steward.land.snapshot-refs-second, steward.land.archive-commit]) and put it in
      steward.land.advance-trunk's after; steward.land.ref-diff: after becomes [steward.land.snapshot-refs,
      steward.land.restack, steward.verify.checkout, steward.land.reexecute] and its issue: DI-14 tag is
      removed in the same commit; gate.land.ref-snapshot: after becomes [steward.land.ref-diff];
      steward.land.restack: after gains steward.land.snapshot-refs; add artifacts land-ref-snapshot and
