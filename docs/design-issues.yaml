      - name: decision
        uses:
          - anchor: { file: docs/02-alignment.md, heading: Alignment chain L0–L11 }
            meaning: 'L3 "Decision and obligations": the ADR record ADR-<5> with its obligations, promoted from
              .keel/decisions/ at land'
            demands: "The existing fixed vocabulary: a decision is an ADR"
          - anchor: { file: docs/04-trace-and-state.md, heading: Id table }
            meaning: Row "Decision | ADR-<5 base32>" and "Obligation | ADR-<5>.O<n>"
            demands: That the bare noun decision keep one id shape (ADR)
          - anchor: { file: schemas/decision.schema.json, pointer: "#/title" }
            meaning: '"keel decision (ADR)": the schema of the ADR record'
            demands: That no other schema, event or trailer named decision appear beside it
          - anchor: { file: docs/16-sources-credits.md, heading: Reference projects with a local clone }
            meaning: '"Decision trailers | Keel-* commit trailers, Keel-Ruling | oh-my-claudecode": the borrowed idea
              behind the round trailer'
            demands: A trailer name that says which decision it carries
          - anchor: { file: docs/02-alignment.md, heading: "Precedence order, decision boundaries and rulings" }
            meaning: "\"decision boundaries\" (charter may_decide / must_ask) and \"a seat decides and records the
              decision\": the seat's act inside the boundaries"
            demands: A name for the seat's recorded act that matches the boundaries it is bounded by without joining the
              ADR vocabulary
        kept:
          meaning: decision = the ADR record (ADR-<5>, schemas/decision.schema.json, L3, .keel/decisions/), and
            "decision boundaries" = the charter field; the bare noun and every bare identifier decision.* stay
            with the ADR
          provides: The L3 row, the id table row, the schema title and the land promotion unchanged; step 4's one-term
            rule is honoured because the seat's record never appears as a bare decision
        renamed:
          - meaning: "The seat's recorded act inside the boundaries is always the two-word identifier, and every machine
              identifier is qualified so that no decision.made event, Keel-Decision trailer or
              #/$defs/decision sits beside the ADR vocabulary"
            new_name: seat decision (SD-<sha12>, seat_decision.made, Keel-Seat-Decision, $defs seatDecision /
              seatDecisionId / seatDecisionMade / seatDecisionRow, result field seat_decisions); the glossary
              row states "not an ADR"
    options:
      - "Option 1: keep \"ruling\" for the Board alone (kind rule, AP- record, precedence item 1, charter
        board_ruling unchanged) and rename the seat's record to \"seat decision\" with every identifier
        qualified: keel api decide, keel_submit kind decide, org/seats api_ops decide, result field
        seat_decisions (#/$defs/seatDecision), SD-<sha12> (seatDecisionId), governance record seat-decision,
        event seat_decision.made (seatDecisionMade), trailer Keel-Seat-Decision, receipt seat_decisions
        (seatDecisionRow), receipt rows \"seat decisions by cost if wrong\"; the RL- prefix retired; the 01
        Record column corrected to AP- (plus the OV- and lane-acknowledgement projections); the brief,
        handbook, lens-audit and charter templates, the seat contracts, the approvals README,
        src/api/contract.ts and src/core/governance.ts, the acme-notes examples and the golden brief fixture
        renamed in the same commit; the kind-table row rule left as it is (no flagged-seat-decision subject),
        with \"how the Board settles a flagged seat decision\" filed as its own gap."
      - "Option 2: keep \"ruling\" and RL- for the seat record, as the schemas already do, and rename the
        Board's act to a \"Board order\" (keel approve --order, charter precedence item board_order), which
        flips the charter's precedence field and is therefore owner-routed."
      - 'Option 3: keep one word with two mandatory qualifiers, "Board ruling" (AP-) and "seat ruling" (RL-),
        correct the 01 Record column and the 04 id-table row, and forbid the bare word in every home document
        by a validate lint; two glossary rows share the noun and the identifiers rule, ruling.made and
        Keel-Ruling stay on the seat side.'
      - 'Option 4: remove seat rulings altogether so that every decision outside the work order becomes an ask
        and every answer a Board ruling; one term, one author, at the cost of the "rulings, not stalls"
        mechanism and a Board touch per seat decision.'
    recommendation: "Option 1, with the four corrections the skeptic required. Class: term-collision (no anchor in
      00-mandate section 1 or 2 or a KP; D6 holds under every reading because seat drops are data \\\"never
      executed\\\" and taskUnblocked.by and trackDecided.ruling take approvalId; no step needs a later
      artifact; one word, two authors, three identifiers: the noun, the RL- prefix and the subcommand word
      rule). Blocks: M1a, by the written rule (00-mandate step 2, blocks = the earliest milestone whose scope
      builds a producer or consumer): M1a builds ids (RL-/AP- of 04, common.schema rulingId), the ledger and
      parsers (ledger-event.schema and api-envelope.schema are x-keel-milestone M1a and carry ruling.made,
      rulingMade.ruling: rulingId, apiOp rule and ruleDrop), the brief compiler with a golden hash
      (templates/prompts/brief.md.tmpl says \\\"record a ruling for each decision\\\", \\\"never settled by a
      ruling\\\", \\\"asks and rulings go in its fields\\\", \\\"keel api rule\\\" and ends with \\\"Board
      ruling\\\"), keel init which runs sync (AGENTS block \\\"keel api ask|rule|submit\\\", \\\"record
      rulings\\\") and keel status (--next lists flagged rulings; exit 3 lists \\\"ruling\\\"); M1b builds
      only the Board side. Route: recommendation. The four owner conditions of step 5 fail: not
      mandate-conflict; no \\\"Resolved by the owner\\\" row of 17-open-decisions flips (the \\\"Human
      approval mechanism\\\" row, D6 and ADR-0005, keeps keel approve --rule, AP-, the event and the gate
      checks; the other rows do not touch rulings); no field of a Board-approved artifact changes meaning (the
      charter's precedence const keeps board_ruling and may_decide keeps its items, only the description noun
      changes; goals.yaml and routing.yaml have no ruling field; the charter template's body sentence changes
      text, which re-approval in a target project handles); no adopted-by-recommendation row concerns rulings
      (rows 4 and 5, submit channels and Steward commits, are unchanged by renaming an op). Option 2 would
      rename board_ruling and be owner-routed. Why Option 1: the mandate's guardrail is one term, one meaning,
      one glossary row, one home, and only Option 1 satisfies it without an owner route: the Board keeps the
      word that the charter field, the precedence order, KP-08 and the 01 table already give it, and the seat
      side takes an identifier that matches what the charter calls the thing it is bounded by (decision
      boundaries, may_decide: \\\"items a seat may decide\\\"). Correction (a), completeness: the issue closes
      only in the commit that changes every consumer on its walk, so the fix also renames result.schema's
      required rulings array to seat_decisions with #/$defs/seatDecision (the second producer path, carried by
      the final-message and mcp channels), the keel_submit kind to decide, api-envelope apiOp and ruleDrop,
      the org/seats api_ops value and contract prose (engineer outputs and may, planner \\\"plan
      decisions\\\", product may, reviewer duty), the brief, AGENTS block, claude-agent, opencode-agent,
      lens-audit and charter templates, the approvals README (unchanged in meaning, Board kind),
      org/checkpoints.yaml's land read list, src/api/contract.ts (ApiOp decide, DecideDrop,
      SeatDecisionPayload, seat_decisions) and src/core/governance.ts (SeatDecision), the 13 manifest rows,
      the glossary and id-prefix rows, and the acme-notes examples (brief.md, receipt.json, receipt.md,
      ledger.sample.json, commit-message.txt, outbox result). Correction (b), no producer-less precondition:
      the kind-table row rule in 02 \\\"Board approvals\\\" is not extended with \\\"or a flagged seat
      decision\\\", because none of the eight --rule kinds settles one (answer takes Q-, dismiss a finding,
      budget and track a record; approval.rule.clause is \\\"clause, finding or question\\\") and no reader
      unblocks on it; instead \\\"how the Board settles a flagged seat decision\\\" is filed as its own gap
      beside the two already listed (the collision wait with no release when the planner never decides, and
      the unstated home of the seat record after ingest, since L10 lists EV, VD, TR and IM under
      .git/keel/records/ and not the seat record). Correction (c), no second meaning of \\\"decision\\\": the
      bare identifiers decision.made, Keel-Decision and #/$defs/decision are not used, because decision
      already means the ADR (L3 \\\"Decision and obligations\\\", .keel/decisions/ADR-* promoted at land,
      schemas/decision.schema.json \\\"keel decision (ADR)\\\", templates/proposal/decision.md, the 04 id
      table row Decision | ADR-<5>, 16's \\\"Decision trailers\\\" row); the noun stays the two-word \\\"seat
      decision\\\" with SD-, and every machine identifier is qualified: event seat_decision.made
      (seatDecisionMade), trailer Keel-Seat-Decision, $defs seatDecision / seatDecisionId / seatDecisionRow,
      result field seat_decisions; keel api decide is acceptable as the op word; the glossary row states the
      distinction from an ADR. Correction (d), timing: with blocks M1a the correction commit lands before the
      golden brief hash is pinned, or re-pins the golden fixture and the acme-notes brief.md example in the
      same commit; the negative controls (a fixture with record ruling must fail governance-record validation;
      a Board-authored SD- or a seat-authored AP- must fail; the issues check must see no artifact named
      ruling produced by a seat step) belong to M1a's test set; regression cells: feature x seat x
      feature-happy, feature x board-at-terminal x abandon, patch x supervisor x crash-resume, system x
      dashboard x system-happy. What the fix does not do: it creates no new cycle or deadlock (no step,
      artifact or lock edge is added; seat.rule becomes seat.decide with after and runs_in unchanged;
      ruling-record becomes board-ruling-record with seat.review removed from its required_by; seat-ruling
      becomes seat-decision required by steward.run.ingest, steward.land.draft-receipt and seat.review;
      collision-ruling-record becomes collision-decision or folds into seat-decision; the register tags no
      edge with DI-17, so nothing turns red or green, and the collision wait on steward.land.restack is tagged
      with the new gap's id before the correction), no unreachable place (the seat decision stays in the
      workspace root on both channels and its projection in the archive commit; the Board ruling stays on the
      proposal branch), no dead field (every reader of rulingId moves to seatDecisionId; the seat fields
      clause, what, why, cost_if_wrong, reversible keep the audit lens and the receipt; result.seat_decisions
      keeps ingest and gate.submit.result; the retired Board-side RL- claim had no reader to lose) and no
      mandate conflict (D6 and P3 untouched; the verb budget stays at 16 and 40 because decide replaces rule
      as one api mode; the charter field board_ruling is unchanged). Option 2 is declined because it rewrites
      a Board-approved charter field and the 01 table for a gain the schemas do not need; Option 3 keeps the
      bare word alive in the identifiers and needs a lint to police prose; Option 4 costs the Board a
      confirmation per seat decision, which the mandate's \\\"typically two per feature\\\" measure does not
      allow. Consumers are marked holds/breaks for the design as written; at correction each row becomes
      changed or unchanged with the same reason. The tally is empty because the rule concerns neither Board
      checkpoints nor work orders; a Board ruling is an approval but not a checkpoint stage (a separate cost
      note: 15-roadmap \\\"Measures\\\" counts Board confirmations from approval events per proposal, so
      rulings inflate the \\\"typically 2 on feature\\\" count unless the measure counts stage kinds only)."
    decision:
      by: recommendation
      date: 2026-09-27
      option: "Option 1: ruling stays the Board's; the seat's record is a seat decision with its own identifier"
      recorded_in: [ docs/02-alignment.md, docs/12-cli-api-mcp.md ]
  - id: DI-18
    title: No sentence says how a triage record reaches the audit lens that checks its citation
    statement: Triage records are planner-owned records in the git common dir, projected only at land, and every
      triage record cites evidence that the auditor checks. The audit lens runs in a reviewer seat, and the
      lens rules say verdicts and the diff are passed inline or by path; nothing says how a triage record
      reaches the auditing seat, whether the auditor is the audit lens at all, or which process reads the
      record on the seat's behalf.
    status: decided
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: other
    anchors:
      - { file: docs/11-verification.md, heading: 6. Findings authority and triage records }
      - { file: docs/11-verification.md, heading: 4. Review lenses and lens sets }
      - { file: docs/04-trace-and-state.md, heading: Local control plane }
    class: cycle
    blocks: M3
    walk:
      producers:
        - precondition: 'A triage record exists for the finding (docs/11-verification.md "6. Findings authority and
            triage records": "Every triage record cites evidence")'
          producer: { file: docs/03-lifecycle.md, heading: Phase 4 Verify }
          position: before
          sufficient: true
          reason: The planner submits the record through `keel api submit` (docs/12-cli-api-mcp.md "4. keel api",
            payload `schemas/triage.schema.json`) or MCP `keel_submit` kind `triage`; the Steward validates it
            at ingest (step steward.run.ingest), stores it under `<git-common-dir>/keel/records/` and appends
            `triage.recorded` (schemas/ledger-event.schema.json `#/$defs/triageRecorded`). Ingest precedes
            every check that could read the record. The channel is sufficient for a record once a planner run
            exists in Phase 4; that the run itself has no step is the third producer's gap.
        - precondition: 'The record cites evidence: `evidence[]` with `minItems: 1`, each item a `ref` that is "an
            evidence or verdict id, a commit, or path:line" (schemas/triage.schema.json
            `#/properties/evidence`)'
          producer: { file: schemas/triage.schema.json, pointer: "#/properties/evidence" }
          position: before
          sufficient: false
          reason: "Schema validation at ingest (docs/14-trust-security.md \"Untrusted data\": seat drops are
            schema-validated) proves that a non-empty string is present, not that it resolves to an EV or VD
            record of the same proposal, a commit in the proposal's range or a path:line in the reviewed
            commit. The claim \"the auditor checks the citation\" leans on resolution; the producer proves
            presence only (a heuristic producer under a proven claim). skills/keel-plan/SKILL.md \"Procedure
            (triage)\" lists a third set of kinds (`file:line`, \"a command and its output\", a verdict id),
            so the planner is told to cite something the schema's description does not name."
        - precondition: The findings the planner triages reach the planner seat, and a planner run exists in Phase 4 to
            triage them
          producer: { file: docs/02-alignment.md, heading: Brief compiler and normalized hashing }
          position: absent
          sufficient: false
          reason: org/seats/planner.yaml lists "findings and verdicts (for triage)" among the planner's inputs and
            skills/keel-plan/SKILL.md "Procedure (triage)" says "For each review finding in the brief", but
            the brief compiler's body has nine numbered sections (why-chain, obligations, element brief and
            impact, write_set, gates, precedence, boundaries, channel, output contract) and none carries
            findings or verdicts; the reviewer's packet is the only compiled input that names verdicts. No
            step of the order map dispatches the planner after run.review (run.plan comes after
            board.approve.contract only) and the feature-happy and system-happy sequences go `run (review)` →
            `check --gate verify` with no planner run between, so the producer of a triage record has no step
            and no cell exercises one. The claim's producer is absent; the fix adds it (step `run.triage`, a
            findings-and-verdicts section for the planner's triage subject).
        - precondition: An actor named "the auditor" runs the citation check with read access to `records/`
          producer: { file: docs/01-org-model.md, heading: Steward modules (not employees) }
          position: absent
          sufficient: false
          reason: 'The home of "auditor" defines a Steward module (ledger, chain, liveness, sweeps, trace check, stale
            items) and docs/01-org-model.md "Seat by seat" promises "an auditor check that every triage record
            cites evidence", but no check id in the gate catalogue (docs/11-verification.md "gate:verify":
            `verify.review` says "findings authority satisfied" and names no citation check), no ingest rule,
            no verb mode and no step of the order map resolves a citation. The check has no home, so nothing
            produces the property the sentence in section 6 leans on.'
        - precondition: "Under the audit-lens reading: the triage record reaches the audit lens in the reviewer seat"
          producer: { file: docs/11-verification.md, heading: 4. Review lenses and lens sets }
          position: absent
          sufficient: false
          reason: The lens table gives the audit lens the inputs "Plan, recorded rulings, diff",
            templates/prompts/lens-audit.md "What you receive" lists the work order, the decision boundaries,
            the rulings, the asks and the diff, and the launch rules pass only the diff inline or by path. No
            sentence hands a triage record to any lens; the reviewer seat runs in a sparse detached verify
            checkout under the workspace root (docs/05-vcs.md "Creating worktrees") and cannot read
            `<git-common-dir>/keel/records/`; the audit lens is only in the `thorough` set (system build
            stage), so on the feature track no lens could see the record at all. The lens reading has textual
            footing (docs/16-sources-credits.md maps "Citation-or-discard" to "Audit lens citations", and the
            register tags triage-record → seat.review with DI-18), which is why the class stays `cycle`.
      consumers:
        - anchor: { file: docs/11-verification.md, heading: gate:verify }
          actor: supervisor
          outcome: breaks
          reason: "`keel run` (verb `run`, mode dispatch, phase \"frame to verify\") runs gate:verify per round; the row
            `verify.review` requires \"findings authority satisfied\" and (through section 6 and the section 8
