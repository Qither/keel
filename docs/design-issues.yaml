            demands: the test-task branch to have a producer on patch
          - anchor: { file: templates/project/policies/quick-patch.yaml, pointer: "#/requires/red_green_proof" }
            meaning: the same requirement as a policy predicate
            demands: the same
          - anchor: { file: schemas/evidence.schema.json, pointer: "#/$defs/redGreen" }
            meaning: "the recorded proof: base, change, `cited` (scenarios, or tests fixed first by a different-family
              test task), red_at_base, green_at_change"
            demands: a cited test path that a test task produced
        kept:
          meaning: the glossary meaning
          provides: the formula; its independently-fixed-test branch provides nothing on patch until a test order exists
      - name: frozen_tests
        uses:
          - anchor: { file: schemas/workorder.schema.json, pointer: "#/properties/frozen_tests" }
            meaning: test paths the builder may not touch; outside write_set by construction
            demands: paths
          - anchor: { file: docs/11-verification.md, heading: 3. Test independence and red/green proof }
            meaning: the landed test task's tests become the build task's frozen_tests
            demands: a test task that lands first
        kept:
          meaning: the schema meaning
          provides: the paths; produced on patch only once a derived test task lands
    options:
      - "Option 1: the Steward derives the work orders of a patch: one build order (write_set from the
        anchors, acceptance from the cited scenarios) and, only when a test-mode ACC, or a cited R-...#S<n>
        scenario, has a tag that no test in the base tree carries (decidable from the tree at derivation,
        before any dispatch), one test order of kind test on seats.engineer.test_route named in the build
        order's `after`, which lands first exactly as on feature and system; a replay conflict at restack
        still becomes a resolution order, derived on patch by the Steward's integrator module as on every
        track, so the patch's orders are one build order, at most one derived test order, plus any resolution
        order; the patch bound becomes one build session; plan.test-independence also runs over the
        Steward-derived orders before the first dispatch on patch, and when it fails (test_route omitted, null
        or same family) the build task is blocked(track_raised) and the proposal re-routes to feature, where a
        routing deviation under plan approval or fixed tests are available."
      - "Option 2: keep exactly one Steward-derived order on patch plus any resolution order the integrator
        derives, and drop the test-task branch: a patch's acceptance comes only from cited scenarios; a change
        that needs a test fixed first is classified feature at intake (a test-mode ACC without a frozen test
        becomes a track signal), and a policy land whose cited scenarios already pass at base falls back to
        the per-change contract as the section already says."
      - "Option 3: keep one work order and let the patch engineer write the test in its own round, with the
        runner's base-and-change execution as the red/green proof and the policy lens set plus a
        verification-gap lens standing in for independence; declined, because the same seat would define done,
        build it and prove it, the path KP-07 exists to close."
      - "Option 4: keep one work order per proposal and make the fixed-first test its own patch proposal that
        lands before the fixing patch; declined, because the test-only proposal lands red rows on trunk and
        doubles the Board confirmations of the change it serves."
    recommendation: "Option 1. The design already presumes it in four places the walk found: 03 Task states lets a
      patch task wait in queued on `after` edges, the land approval reading list names the build and test
      routes on every track, verify.test-red and the test_task lens set are track-agnostic, and the golden
      example's shape (T1 test on the test route, T2 build) is exactly the derived pair. Option 2 sends a
      five-file fix through framing, planning, the plan gate and a planner seat only to obtain an independent
      test (RK-10), and it narrows the policy path to changes with a scenario that already fails at base;
      Option 3 conflicts with KP-07's stated rationale; Option 4 lands red rows. Three points the walk adds to
      the fix. Cardinality: 03 Patch track and policy path must not say 'a patch never has more than these two
      orders', because 06 Integration queue and 05 restack turn a replay conflict into a resolution order on
      every track; the section states 'one build order, at most one derived test order, plus any resolution
      order the Steward's integrator derives on a replay conflict', and names the Steward as the deriver of
      resolution orders on patch (04 Id table already lets it mint <P>.T<n> there). Derivation condition: it
      is stated statically, 'a test-mode ACC, or a cited scenario, whose tag no test in the base tree
      carries', a tree read available after board.new, so steward.derive-work-order keeps depending only on
      gate.frame.intake and no runner execution at base and no evidence artifact is needed before derivation;
      the runner's base-and-change execution stays where it is, in verify.red-green. Release of the patch-side
      plan.test-independence refusal: on feature the releases are fixed tests or a routing deviation under
      plan approval, and neither exists on patch, so the row and 03 Blocked reasons add
      'plan.test-independence fails over the Steward-derived orders of a patch (test_route omitted, null or
      same family)' as a second set-when of `track_raised`, whose existing release (re-routing with the added
      checkpoints, or --rule track) sends the proposal to feature; no new blocked reason is minted and
      routing.yaml's test_route keeps its meaning. Option 1 so stated removes the defect without a new cycle
      (steward.derive-work-order sits after gate.frame.intake and before claim, waves and test-task.land, all
      already downstream; the resolution order is derived at restack, downstream of everything it needs),
      without a deadlock (the build task's wait is released by test-task.land, a crashed test run is re-queued
      by the lease, and the refusal on patch has a named release), without an unreachable place (all derived
      orders live on the proposal branch, reachable by local and supervisor), without a dead field (`after`,
      kind test, kind resolution and test_route gain patch readers, the session bound gains the definition
      'one build session' it can be checked against) and without a mandate conflict (KP-07 is extended, no
      section 1 clause is touched). Order map: as a gap, no red state is recorded first and no DI-09 tag is
      added and removed in one commit; the end state stands on its own: artifact `patch-work-orders` (doc 03
      Patch track and policy path, produced_by steward.derive-work-order, where proposal-branch, required_by
      steward.run.claim, steward.run.compile-brief, steward.run.compute-waves, gate.plan.test-independence,
      gate.submit.scope, gate.submit.frozen-paths, gate.verify.test-red, gate.verify.evidence,
      gate.verify.red-green, test-task.land, steward.land.restack, steward.land.draft-receipt,
      dashboard.build), steward.derive-work-order added to the `after` lists of steward.run.compute-waves and
      gate.plan.test-independence, the resolution order's patch producer recorded on steward.land.restack, and
      the `issues` check green (acyclic, reachable) at the commit. Closure evidence at M2: the validate checks
      examples, issues and i18n, plus the plan.test-independence negative control on a Steward-derived pair
      whose test route shares the build route's family (pinned failure 'self-certifying task', outcome
      blocked(track_raised)) in test/; regression cells: patch x supervisor x patch-per-change, patch x
      supervisor x patch-policy, patch x crashed-supervisor x crash-resume, patch x board-at-terminal x
      patch-policy, patch x supervisor x second-land (replay conflict, resolution order). The same-commit
      sequencing after DI-10 stands, since both rewrite the 03 heading."

  - id: DI-10
    title: A quick-patch on a shared trunk needs a request approval, a land approval and a receipt acknowledgement
    statement: >-
      The standing policy limits require a land approval for patches on shared trunks and a receipt
      acknowledgement after every policy land. On a shared trunk a quick-patch therefore costs three Board
      touches (request, land, receipt), more than the per-change contract route it is meant to lighten and
      more than the staffing table's typical count. Policy land (a land on the policy path) and land policy (a
      standing policy that replaces the per-land approval) are two meanings under one wording.
    status: proposed
    found_by: external-review
    found_on: 2026-09-26
    root_cause: term-overloaded
    anchors:
      - { file: docs/03-lifecycle.md, heading: "Standing policy limits" }
      - { file: docs/03-lifecycle.md, heading: "Patch track and policy path" }
      - { file: docs/01-org-model.md, heading: "Staffing per track" }
      - { file: docs/17-open-decisions.md, heading: "Adopted by recommendation (reversible, with ADR)" }
    class: term-collision
    blocks: M0
    walk:
      producers:
        - precondition: a receipt draft the land approval binds (the land approval on shared trunks)
          producer: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
          position: before
          sufficient: true
          reason: steward.land.draft-receipt runs on the first keel land, before board.approve.land; the draft binds the
            integrated commit and the expected trunk tip and is re-hashed by the second land
        - precondition: the topology 'shared trunk' or 'solo repository' that decides whether a land approval or a land
            policy applies
          producer: { file: docs/03-lifecycle.md, heading: Standing policy limits }
          position: absent
          sufficient: false
          reason: "no step, record or config field produces the topology; the only mechanism is land.policy in
            .keel/config.yaml (null: a land approval per change; a name: that standing policy), whose template
            comment calls the null setting 'recommended on shared trunks'; the rule leans on a word no
            producer sets, so the gate cannot read it. Candidate split entry: before classing it as gap, weigh
            KP-11 'One ceremony axis' (the track is the one right-sizing axis; 01 'Staffing per track' says
            the same) against adopted row 3's 'shared trunk / solo repository' condition; if the row makes
            topology a second ceremony axis that decides a Board checkpoint, that entry has a KP anchor and is
            mandate-conflict by construction, which changes its route and blocks; under the recommendation the
            topology becomes guidance for choosing land.policy and the question dissolves"
        - precondition: an approved land policy (a standing policy of kind land named by land.policy)
          producer:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
          position: before
          sufficient: true
          reason: board.approve.policy writes policy-approval-record on trunk before any land; the record binds the
            policy blob, expiry and revocation are checked at the gate; the artifact is policy-approval-record
            for both policy kinds, which is one artifact with a kind field, not two meanings
        - precondition: "an approved request (the land.approval alternative: 'an approved land policy plus an approved
            request plus the red/green proof')"
          producer: { file: docs/02-alignment.md, heading: Requests and seat-proof verbs }
          position: before
          sufficient: false
          reason: board.new-policy produces request-approval-record only on the policy path; for the per-change-contract
            patch that 00a lets land under a land policy on a solo repository the producer is absent, so the
            alternative can never hold there; the demand belongs to the policy path (frame.approvals,
            dispatch, T9), not to the land authority
        - precondition: the red/green proof (the land.approval alternative and verify.red-green 'on policy lands')
          producer: { file: docs/11-verification.md, heading: 3. Test independence and red/green proof }
          position: before
          sufficient: true
          reason: gate.verify.red-green is runner-executed evidence at the base and change commits and precedes
            gate.land; it is a policy-path requirement ('no human looked at the change before it was built'),
            and its wording 'policy lands' (repeated in 00 KP-07, 00 item 5, 02, 03 Phase 4, 15 M3,
            schemas/evidence.schema.json redGreen and src/core/evidence.ts) cannot say whether a
            per-change-contract patch landing under a land policy needs it
        - precondition: a receipt to acknowledge, and the fact that the land was a 'policy land'
          producer: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
          position: before
          sufficient: false
          reason: steward.land.archive-commit writes receipt.json (with policies[] used) and receipt.md before
            board.approve.receipt, and land.completed carries approval (id or null) and policy (slug or null);
            nothing says whether landCompleted.policy names the contract policy or the land policy, so the
            consumer that raises the acknowledgement item cannot decide from the record which lands owe one
        - precondition: the rendered 'Land approval' section of the archived receipt.md that the acknowledgement binds
          producer: { file: templates/proposal/receipt.md, heading: Land approval }
          position: before
          sufficient: false
          reason: "steward.land.archive-commit fills the section from the land approval record (13 'Examples' row for
            receipt.md; schemas/receipt.schema.json #/properties/approvals); on a land that an approved land
            policy stood in for there is no land record, so the template's inverted branch prints 'Not yet
            approved' into the archived receipt.md that board.approve.receipt then binds; the template has no
            branch naming the land policy and its approval record"
        - precondition: the acknowledgement blocks the next change touching the same elements or path globs
          producer: { file: docs/03-lifecycle.md, heading: Standing policy limits }
          position: before
          sufficient: false
          reason: board.approve.receipt produces receipt-ack-record on trunk, but the order map lists no intake step
            (board.new, gate.frame.intake) that requires it; the only readers are steward.close, audit.sweep
            and board.doctor, and the 04 drift table says only the first seven classes fail the trace check,
            so unacknowledged-receipt has no gate reader; this is DI-12's rule and is left to DI-12
      consumers:
        - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
          actor: board-at-terminal
          waits_for: lock.supervisor while a seat runs
