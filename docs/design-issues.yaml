    terms:
      - name: integrating
        uses:
          - anchor: { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
            meaning: the whole of keel land through the archive commit and trunk update (the mermaid node says one at a
              time per trunk up to the trunk update)
            demands: exclusion across both land invocations and the Board pause between them
          - anchor: { file: docs/03-lifecycle.md, heading: Proposal states }
            meaning: "the state integrating: restack, preview and re-execution on the integrated commit, ended by the
              receipt draft; land_pending is a separate state"
            demands: a critical section that ends in the process that started it
          - anchor: { file: docs/01-org-model.md, heading: Steward modules (not employees) }
            meaning: the integrator restacks, previews, writes the archive commit and updates trunk
            demands: one role across both invocations
          - anchor: { file: docs/06-parallelism.md, heading: Collision prediction }
            meaning: a task integrates (its rounds enter keel/<P>/main) after a collision ruling
            demands: task-level ordering inside one proposal
        kept:
          meaning: "the proposal state integrating of docs/03-lifecycle.md: restack, preview, re-execution and receipt
            draft in one keel land process, under the land lock; on the policy path the same process continues
            to the archive commit and the trunk update"
          provides: a bounded critical section whose end (the draft with exit 3, or land.completed on the policy path)
            the same process reaches; the second invocation after the pause is described under land, not as
            integrating; a glossary row 'integrating' is added in the closing commit
      - name: integration queue
        uses:
          - anchor: { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
            meaning: one serialized queue per trunk in the order keel land requests arrive
            demands: a recorded arrival order and a waiter that proceeds in that order
          - anchor: { file: docs/05-vcs.md, heading: Integration preview and restack }
            meaning: the two primitives previewIntegration and restack
            demands: nothing about order
          - anchor: { file: docs/06-parallelism.md, heading: Collision prediction }
            meaning: where cross-proposal collisions surface (merge-tree conflicts, red preview)
            demands: nothing about order
        kept:
          meaning: the per-trunk serialization of keel land processes under the land lock; arrival at the lock decides
            who runs next, and no order is recorded or promised
          provides: mutual exclusion among living land processes, which an O_EXCL file provides; a glossary row
            'integration queue' is added in the closing commit
      - name: land lock
        uses:
          - anchor: { file: docs/04-trace-and-state.md, heading: Local control plane }
            meaning: "O_EXCL lock files: ledger writer, worktree creation"
            demands: a living holder; the enumeration is closed and omits the supervisor and land locks
          - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
            meaning: ledger.lock and supervisor.lock, O_EXCL, wait or fail, recovery deferred (DI-05)
            demands: a living holder and a recovery rule
          - anchor: { file: docs/06-parallelism.md, heading: The lock }
            meaning: "a claim: a create-only CAS ref holding a token, released by CAS delete, stale ones swept by keel
              audit"
            demands: survives its holder's exit and is recoverable by ledger cross-check
          - anchor: { file: docs/06-parallelism.md, heading: Integration queue and land re-run }
            meaning: a per-trunk lock in locks/
            demands: as written, to span a Board pause in which its holder process has exited
        kept:
          meaning: <git-common-dir>/keel/locks/land-<trunk>.lock, an O_EXCL file that one living keel land process holds
            and that ends with that process; <trunk> is the trunk ref name with every character outside
            [A-Za-z0-9._-] percent-encoded (release/2.x becomes release%2F2.x); the file holds the holder's
            pid and proposal id, written at take time; typed as LandLockPath next to LedgerLockPath,
            SupervisorLockPath and WorktreeLockPath
          provides: exclusion among living land processes on one clone, never a wait that outlives its holder; a waiting
            land names the holder and keel audit sweeps a dead holder's file; listed with the other lock files
            in 04 Local control plane; a glossary row 'land lock' is added in the closing commit
        renamed:
          - { meaning: a lock that outlives its holder and is cross-checked against the ledger, new_name: claim }
      - name: land
        uses:
          - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
            meaning: "one verb, two invocations: integrate, preview, re-execute, draft and exit 3; after approval, check
              the draft, archive, advance trunk; on the policy path one invocation does all of it"
            demands: the rule one proposal integrates at a time treats the two as one unit
          - anchor: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
            meaning: the phase from restack to land.completed
            demands: nothing about locking
          - anchor: { file: docs/03-lifecycle.md, heading: Patch track and policy path }
            meaning: "a policy land: land follows the land policy in one process with no Board pause, a receipt
              acknowledgement follows"
            demands: one process from restack to land.completed
          - anchor: { file: docs/05-vcs.md, heading: Three land cases }
            meaning: "the trunk update after the gate and the approval: ancestry, ff-only or CAS, exit 5 on a moved trunk"
            demands: trunk still at the expected tip, otherwise restack and land again
        kept:
          meaning: "the verb of docs/12-cli-api-mcp.md: two separate processes with a Board pause between them, each
            holding the land lock only while it runs, or one process without a pause on the policy path,
            holding the lock from restack to land.completed"
          provides: a defined stop (exit 3) and a defined stale path (exit 5) that the fix makes the lock boundaries; a
            glossary row 'land' is added in the closing commit
      - name: expected trunk tip
        uses:
          - anchor: { file: docs/03-lifecycle.md, heading: Phase 5 Land }
            meaning: the trunk tip the receipt draft names
            demands: the tip the archive commit will be applied on
          - anchor:
              file: docs/02-alignment.md
              heading: Board approvals (explicit confirmation, hash binding, invalidation)
            meaning: part of what the land approval binds through the draft
            demands: a changed tip invalidates the approval
          - anchor: { file: schemas/approval.schema.json, pointer: "#/$defs/landBinding/properties/expected_trunk_tip" }
            meaning: required gitOid of the land binding
            demands: a reader that compares it with trunk at the second land
        kept:
          meaning: the trunk tip at draft time that the second keel land must find unchanged
          provides: "an expectation, not a hold: the second land compares it with trunk first and exits 5 when it moved;
            a glossary row 'expected trunk tip' is added in the closing commit"
    options:
      - "Option 1, process-scoped land lock: <git-common-dir>/keel/locks/land-<trunk>.lock (the trunk ref name
        percent-encoded outside [A-Za-z0-9._-], so release/2.x becomes release%2F2.x; typed LandLockPath next
        to LedgerLockPath, SupervisorLockPath and WorktreeLockPath) is an O_EXCL file held only by a living
        keel land process, which writes its pid and the proposal id into it at take time; it is taken at
        restack and released when that process ends (receipt draft with exit 3, --preview done, red gate,
        conflict, exit 5, land.completed); a policy-path land is one process and keeps the lock from restack
        through land.completed; the second keel land after a land approval takes it again and first checks
        that trunk still stands at the draft's expected trunk tip (otherwise exit 5: restack, new draft, new
        approval), a keel land that finds it held waits and names the holder's proposal from the file, and
        keel audit removes a lock file whose holder pid is not alive and records the removal, under the
        recovery rule for locks/ that DI-05 settles."
      - "Option 2, hold across the pause: the per-trunk lock becomes a ledger-recorded claim (a create-only
        CAS ref refs/keel/land/<trunk> with a token) taken by the first keel land and released by the trunk
        update, by --rule abandon of the holder, or by an expiry that keel audit sweeps, so every other land
        on the trunk waits behind one Board decision with no bound."
      - "Option 3, ledger queue: add a land.requested event and give a land_pending proposal's second keel
        land the head of the per-trunk queue, so a foreign land cannot slip between draft and archive; this
        still needs Option 1's lock lifetime and adds an event type and a scheduler that nothing else reads."
      - Option 4, drop expected_trunk_tip from the land binding so a moved trunk does not invalidate the
        approval and the second land restacks silently; this changes what a Board-approved artifact field
        means and lets the Board approve a receipt naming an integrated commit that is then replaced, so it is
        owner-routed and declined.
    recommendation: "Option 1. It makes every file in locks/ the same thing, an O_EXCL file with a living holder
      (ADR-0002 and ADR-0003 fix the O_EXCL choice and the locks/ home; the living-holder rule is what this
      fix states), never turns the Board's reading time into a lock on the trunk, gives the crashed-holder row
      a named release (keel audit's sweep of a lock file whose recorded pid is not alive, under the recovery
      rule DI-05 settles for locks/), keeps the land binding and the invalidation rule of D6 unchanged, and
      turns the stale-base case into the already defined exit 5 path of docs/05-vcs.md Three land cases, so it
      creates no new cycle, deadlock, unreachable place or dead field and no mandate conflict. Every
      precondition it introduces names its producer: the file name and its trunk encoding and the LandLockPath
      type are stated in 04 Local control plane; the holder's pid and proposal id are written by the land
      process at take time and read by a waiting land (which names the holder) and by audit's sweep, stated in
      06 Integration queue and land re-run; the policy-path lifetime (one process, lock kept from restack
      through land.completed) is stated in 03 Patch track and policy path and in the 12 land bullet; status is
      unchanged, since the lock is not a ledger fact and the waiting land itself names the holder, matching
      the dashboard row. The cost it accepts is that on a busy shared trunk a foreign land between the draft
      and the second keel land costs the proposal one more land confirmation; on a solo trunk only the owner's
      own lands can do that. The arrival-order sentence is dropped: nothing records arrival and Option 3's
      event would be a field nothing reads. Documents: 06 Integration queue and land re-run (the lock, its
      file, its lifetime per path, the waiter, the sweep); 12 the land bullet (take, release at the draft,
      retake, tip check before the approval is read, --preview, policy path in one process); 03 Phase 5 Land
      (Produces names the land lock; a moved trunk means a new draft and approval), Proposal states
      (land_pending holds no land lock; abandoned holds none), Patch track and policy path (lock held for the
      whole policy land); 04 Local control plane (locks/ enumerates ledger writer, supervisor, worktree
      creation and land-<trunk>.lock with the encoding, each held by one living keel process); 05 Three land
      cases (the second land runs under the land lock and step 1 compares trunk with the expected trunk tip
      before any approval is read; the ancestry subject stays DI-19's); 06 The lease (the stale-lock row gains
      the O_EXCL files of locks/). Code in the same commit: a LandLockPath type beside the three existing
      lock-path types. Glossary rows added under State, trace and VCS in docs/00-vision.md, spelled exactly as
      the register's term names: 'integrating', 'integration queue', 'land lock', 'land', 'expected trunk
      tip'; 'claim' already has its row and is the only renamed new_name. Red before green: the register's
      tagged lock entry lock.integration-queue (held by steward.land.restack, released by
      steward.land.advance-trunk across board.approve.land, tagged DI-16) stays as the reproduction until the
      closing commit; that commit replaces it with two untagged process-scoped locks,
      lock.land-trunk.integrate (held_by steward.land.restack, released_by steward.land.draft-receipt) and
      lock.land-trunk.complete (held_by steward.land.check-approval, released_by steward.land.advance-trunk),
      both with waited_by [] under the register's convention that cross-instance waits are not order edges,
      adds gate.land.ancestry to the after list of steward.land.check-approval, and the issues check passes
      with no tag on DI-16 and every kept and renamed term resolving to exactly one glossary row; from M1a a
      negative control in closure.tests is required because the class is cycle: a lock file whose recorded pid
      is not alive must be swept by keel audit, a second keel land on a moved trunk must exit 5 before it
      reads the approval, and a policy-path land must hold the lock until land.completed. The
      supervisor-window finding (a keel run spawned during a first-invocation land makes the land's later
      appends foreign to the run window) is not DI-16 and is filed separately."
    decision:
      by: recommendation
      date: 2026-09-27
      option: "Option 1: the per-trunk land lock is held only by a living keel land process, taken at restack and
        released when that process ends; the second land takes it again"
      recorded_in: [ docs/06-parallelism.md, docs/12-cli-api-mcp.md ]
  - id: DI-17
    title: Ruling names two records with two authors
    statement: A ruling is the Board's approval of kind rule (abandon, override, budget, track, unverified,
      dismiss), written by keel approve --rule as an approval record, and it is also the planner's or a seat's
      record written through keel api rule into the run outbox, which produces a ruling.made event and gates
      integration after a collision. The glossary, the id table and the register's vocabulary carry one term
      for both, and the seat contracts, the collision rule and the approval rules read the word with different
      authors and different authority.
    status: decided
    found_by: walkthrough
    found_on: 2026-09-27
    root_cause: term-overloaded
    anchors:
      - { file: docs/02-alignment.md, heading: "Precedence order, decision boundaries and rulings" }
      - { file: docs/06-parallelism.md, heading: Collision prediction }
      - { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
      - { file: docs/12-cli-api-mcp.md, heading: 4. keel api }
    class: term-collision
    blocks: M1a
    walk:
      producers:
        - precondition: "A Board ruling exists: an approval of kind rule with one of answer, budget, track, override,
            dismiss, degraded, unverified, abandon, recorded with its approval.recorded event and committed on
            keel/<P>/main"
          producer:
            file: docs/02-alignment.md
            heading: Board approvals (explicit confirmation, hash binding, invalidation)
          position: before
          sufficient: true
          reason: keel approve --rule (board.approve.rule, local) shows the item, takes the confirmation word, writes
            .keel/approvals/<sha256>.rule.json (AP-<sha12>, schemas/approval.schema.json kind rule with the
            rule object), commits it and appends approval.recorded; the gate checks of the same section,
            gate:verify verify.review, the blocked-reason unblocks and steward.run.cancel all consume it
            afterwards, and the record carries the authority the precedence order gives it
        - precondition: A Board ruling exists as an RL-<sha12> record, as the Record column of the Board rulings table
            and the id table row RL ("A seat or Board ruling") state
          producer: { file: docs/01-org-model.md, heading: Board rulings }
          position: absent
          sufficient: false
          reason: "No verb or schema writes an RL- record with a Board author:
            schemas/common.schema.json#/$defs/rulingId is referenced only by governance-record#/$defs/ruling
            (seat is the five-seat enum, run and within_boundaries required), ledger-event#/$defs/rulingMade
            and receipt#/$defs/rulingRow; the Board's ruling is AP- (approval.schema) and its Board-side
            readers (trackDecided.ruling, taskUnblocked.by, laneAck.approval, override.approval) all take
            approvalId; the RL- claim for the Board has neither a producer nor a reader"
        - precondition: "A seat ruling exists through the outbox: a seat's recorded decision inside its boundaries,
            written by keel api rule {clause, what, why, cost_if_wrong, reversible} into the run outbox as a
            <seq>-rule.json drop (api-envelope ruleDrop), ingested as an RL-<sha12> governance record and a
            ruling.made event, flagged when outside the boundaries or on a stop class"
          producer: { file: docs/12-cli-api-mcp.md, heading: 4. keel api }
          position: before
          sufficient: true
          reason: seat.rule (agent-api) drops <workspace_root>/_runs/<RUN>/outbox/<seq>-rule.json, or keel_submit kind
            rule writes the same drop for a seat whose channel is mcp; steward.run.ingest validates it against
            result.schema#/$defs/ruling, derives the governance record and appends ruling.made; it is
            sufficient for what a seat ruling is claimed to be (data, listed in the receipt, checked by the
            audit lens, flagged to the Board) and insufficient for anything the precedence order or the
            unblock sentences attribute to a ruling, which is exactly why the shared word is a collision
        - precondition: 'A seat ruling exists through the result payload: schemas/result.schema.json requires a
            top-level array rulings ("Rulings made inside the decision boundaries", items #/$defs/ruling),
            carried by the final-message and mcp submit channels of read-only seats that cannot write the
            outbox (02 "ACK and submit channels": "asks and rulings go in its fields")'
          producer: { file: schemas/result.schema.json, pointer: "#/properties/rulings" }
          position: before
          sufficient: true
          reason: "seat.submit (agent-api or final-message) carries result.rulings; steward.run.ingest validates the
            result against the seat's output_schema (org/seats *.yaml output_schema:
            schemas/result.schema.json) and derives the same RL- governance record and ruling.made event per
            item; this second producer path was missing from the first analysis; it is sufficient as data and,
            like the outbox path, never authority; the fix renames the field, its $defs and the mcp kind
            together with the op"
        - precondition: The precedence order that puts the Board ruling first is held by the charter and ends every brief
          producer: { file: docs/02-alignment.md, heading: "Precedence order, decision boundaries and rulings" }
          position: before
          sufficient: true
          reason: schemas/charter.schema.json#/$defs/precedence is the const list starting with board_ruling, the
            charter is Board-approved through keel approve --doc (board.approve.doc) before any dispatch, and
            steward.run.compile-brief copies it into every brief (templates/prompts/brief.md.tmpl Precedence
            section); the name it carries is the one the fix keeps
        - precondition: When a collision crosses a declared element boundary, a planner ruling exists before either task
            integrates
          producer: { file: docs/06-parallelism.md, heading: Collision prediction }
          position: before
          sufficient: false
          reason: "The producer is the planner's keel api rule drop (seat.rule, agent-api) and the consumer is
            steward.land.restack (local), so the order is right and the place is reachable; but the drop is a
            seat record the Steward treats as data, no sentence says how the Steward matches a drop to the
            impact record it settles (no clause id for a collision), and no sentence names what releases the
            wait when the planner run never rules: no --rule kind names a collision, and an override waives a
            check id, which a collision is not. That release gap is a separate finding to file (a gap on the
            integration queue), not part of DI-17; DI-17 records only that the word the sentence uses cannot
            tell the reader whether the required record has authority or is data"
