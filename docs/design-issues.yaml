    terms:
      - name: ruling
        uses:
          - anchor: { file: docs/02-alignment.md, heading: "Precedence order, decision boundaries and rulings" }
            meaning: "Precedence order item 1, \"Board ruling\": the Board's approval of kind rule; held by the charter
              (schemas/charter.schema.json#/$defs/precedence, board_ruling) and ending every brief"
            demands: Authority above INV, ADR obligations and the frozen intent; the power to unblock a task, settle a
