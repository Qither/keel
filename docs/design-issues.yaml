          outcome: breaks
          reason: cancellation is the supervisor's act on the pid it holds in memory, and killed comes from its journal;
            a run whose supervisor died is neither cancelled nor finished, has no outcome, and its seat tree
            cannot be reached by taskkill /PID <pid> /T /F from any other process because no pid was recorded
        - anchor: { file: docs/09-runtimes.md, heading: 3. Windows spawn contract }
          actor: crashed-supervisor
