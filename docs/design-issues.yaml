        - anchor: { file: docs/11-verification.md, heading: 6. Findings authority and triage records }
          actor: board-at-terminal
          waits_for: the Board's explicit confirmation of the dismissal
          released_by: "`keel approve <P> --rule dismiss` writing the approval record and its `approval.recorded` event
            (board.approve.rule.dismiss)"
          outcome: holds
          reason: "`keel approve <P> --rule dismiss` (verb `approve`, mode `--rule`, refused under `KEEL_RUN`) is the
