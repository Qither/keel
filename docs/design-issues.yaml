          - anchor: { file: docs/13-artifacts-schemas.md, heading: Examples }
            meaning: "'the land record' the archived receipt.md's Land approval section is rendered from"
            demands: the same record as the rendering source
        kept:
          meaning: the approval record (AP-<sha12>, glossary row 'approval record') of kind stage and stage land,
