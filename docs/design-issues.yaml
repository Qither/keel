        uses:
          - anchor: { file: docs/04-trace-and-state.md, heading: Event shape }
            meaning: a ref or commit change the Steward made
            demands: a type for Steward ref changes; provided
          - anchor: { file: schemas/ledger-event.schema.json, pointer: "#/$defs/vcsOp/properties/op" }
            meaning: the operation name, for example worktree-add, update-ref or sparse-checkout
            demands: that the land's verify worktree add be recorded under it; the op exists, the sentence recording it
