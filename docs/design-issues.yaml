              matches, makes the lock stale
            new_name: supervisor lease
      - name: heartbeat
        uses:
          - anchor: { file: docs/06-parallelism.md, heading: The lease }
            meaning: a claim.heartbeat event the supervisor appends when it parses a stream event from the child
            demands: a live supervisor; an absent heartbeat is ambiguous between a silent seat and a dead supervisor
          - anchor: { file: docs/08-dashboard.md, heading: Org }
            meaning: the same, shown
            demands: a label for the ambiguous case
        kept:
          meaning: "unchanged: the claim heartbeat derived from parsed stream events, one ledger channel"
          provides: seat liveness; the supervisor lease, kept in the lock file and not on the chain, resolves the
            ambiguity without a second ledger channel
      - name: process tree
        uses:
          - anchor: { file: docs/06-parallelism.md, heading: Cancellation }
            meaning: the tree rooted at the child pid the supervisor spawned, ended by taskkill /PID <pid> /T /F or
              SIGKILL
            demands: the root pid, held by the process that spawned it
          - anchor: { file: docs/14-trust-security.md, heading: Known limits }
            meaning: the same tree, ended before ingest so that no seat process outlives its window
            demands: that some keel process can end it in every case, including after a supervisor crash
        kept:
          meaning: the tree rooted at each child pid the supervisor spawned, with the pid and process start time
            recorded in the supervisor lock's holder record at spawn
          provides: "after the fix: a root pid that survives the supervisor, so that keel audit ends the tree before it
            releases the claim; before the fix: a pid that exists only in the supervisor's memory"
      - name: keel audit (the sweep)
        uses:
          - anchor: { file: docs/12-cli-api-mcp.md, heading: 1. 16 verbs and at most 40 modes }
            meaning: the verb that verifies the chain, checks liveness, re-queues expired leases and removes stale claim
              refs
            demands: "in the crash-resume sequence of the matrix: that it recovers a crashed run"
          - anchor: { file: docs/06-parallelism.md, heading: The lease }
            meaning: the claim recovery
            demands: that it can run while the dead holder's supervisor lock stands, and that it ends the orphaned seat
              tree before re-queuing
          - anchor: { file: docs/01-org-model.md, heading: Steward modules (not employees) }
            meaning: checks liveness; sweeps leases and overrides
            demands: same
        kept:
          meaning: "the sweep, extended with the recovery pass: it breaks a stale supervisor or writer lock, ends the
            process trees whose pids the holder record names, closes the run as crashed with an unverified
            window, releases the run's claims and re-queues its tasks"
          provides: one writer of the recovery events (single home), no new verb mode
      - name: single writer
        uses:
          - anchor: { file: docs/00-vision.md, heading: Organization }
            meaning: per-artifact ownership
            demands: nothing about processes
          - anchor: { file: docs/04-trace-and-state.md, heading: Single writer }
            meaning: only the Steward appends to the ledger, and only one Steward process at a time (the writer lock and
              the supervisor lock)
            demands: process-level mutual exclusion with a decidable holder
        kept:
          meaning: the glossary meaning (per-artifact ownership) stays; 04's heading names the process-level rule that
            this issue corrects
          provides: two related meanings under one wording; outside DI-05's rule and left as an observation to be filed
            separately (this task is read-only), not renamed here
    options:
      - "Option 1: the supervisor lock and the writer lock hold a holder record (verb, run id, pid and process
        start time, taken_at; the supervisor lock also a lease_until that the supervisor process refreshes on
        a timer independent of the seat's stream, and the pid and start time of every child it spawned,
        written at spawn; the writer lock a short lease as well); a taker that finds a writer lock whose
        pid-plus-start-time matches no live process, or whose lease expired, breaks it and appends after the
        usual tail check; a taker that finds a stale supervisor lock (dead holder by pid plus start time, or
        expired supervisor lease) refuses with exit 3 naming keel audit; keel audit's default pass, which
        waits only for the writer lock when the supervisor lock is stale, ends the recorded child process
        trees (taskkill /PID <pid> /T /F, SIGKILL) before anything else, appends run.finished with the new
        outcome crashed and window_verified false, releases the run's claims with reason failed and re-queues
        its tasks, flags every event in the unverified window that is not the supervisor's own as
        reserved_op.detected, then removes the lock; a live holder's lock, writer or supervisor, is never
        broken; keel doctor --section approvals and the dashboard Board queue list stale locks and crashed
        runs."
      - "Option 2: make the supervisor's liveness a ledger lease (supervisor.heartbeat events) and let any
        mutating verb that finds an expired supervisor lease take the lock over, kill the orphaned seat tree
        and close the run itself, so that approve, new or land never wait on a dead holder."
      - "Option 3: no automatic recovery: a stale supervisor lock is a Board item; the Board removes the lock
        file by hand and runs keel audit, which re-queues expired leases; the events of the crashed window
        keep the trust the tail check gives them."
      - "Option 4: make the window durable instead of closing it unverified: the supervisor also journals its
        own append ids in runs/<RUN>/events.jsonl so that keel audit can re-walk a crashed window as the
        ingest would have and verify it, with the rest as in option 1."
    recommendation: "Option 1, with the four corrections folded in. It removes the deadlock because the recovery
      step no longer waits for the lock it recovers: audit.recover-run waits for lock.ledger-writer only, and
      the writer lock can never be held by a dead process because a stale writer lock is broken by its taker
      after the pid-plus-start-time test or its short lease, so the wait ends in every case (no new deadlock).
      Staleness is decidable: a bare pid test is not, because a reused pid (fast on Windows) makes a dead
      holder's lock look live forever, so both holder records carry pid plus process start time, and the
      supervisor lock also a lease; the supervisor refreshes that lease on a timer in its own process, never
      on parsed stream events, so a live supervisor whose seat is silent (a long test, a rung-D task with no
      stream) is never declared stale, never has its seat killed and never ingests into a window audit already
      closed; the negative control \"a live holder's lock is never broken\" covers the supervisor lock as well
      as the writer lock. The orphaned seat tree has a producer: steward.run.spawn writes the pid and start
      time of every child into the holder record at spawn (in the git common dir, seat-proof on sandboxed
      control planes and cross-checked against the run record elsewhere), audit.recover-run ends those pids
      with taskkill /PID <pid> /T /F or SIGKILL before it releases the claim, and the negative control \"a
      seat orphaned by a supervisor crash is ended before its task is re-queued\" fails when a second seat is
      started while the first still edits the worktree; a process that escaped the tree remains limit 11. It
      creates no cycle: in the order map audit.recover-run comes after ledger.verify-chain, steward.run.end
      comes after audit.recover-run in the crash path, and lock.supervisor is still released by
      steward.run.end and waited by audit.sweep, so the edges are recover-run to run.end to sweep, acyclic. No
      unreachable place: the recovery runs in local and reads the holder record and the ledger
      (git-common-dir), the run record (workspace-root) and the claim refs (refs-keel), all of which local
      reaches, and it ends processes on the same machine (v1 is single-machine, 17 Multi-machine
      collaboration). No dead field: the holder record is read by every lock taker, by audit and by doctor;
      the child pids by audit.recover-run and steward.run.cancel; outcome crashed by status, the dashboard and
      the receipt; window_verified by land.approval, frame.approvals and the dispatch check that accepts an
      approval.recorded event only from a verified window or from outside any window; claim.released reason
      failed gains its first reader. No mandate conflict: D6 is stricter, not weaker (recovery writes no
      approval and an approval inside an unverified window counts for nothing until the Board approves again
      outside a window; the ADR-0005 edit is limited to defining \"outside any run window\" as after the
      run.finished event of every run or before any run.started, since D6 is owner-decided); P1 is untouched
      (no provider value is read; taskkill needs the pid only); KP-04 holds (control is code, no manual file
      deletion); KP-12 holds (the dashboard labels crashed runs and stale locks). The waiter criterion is
      stated once in 04 (a mode waits when 12 refuses it under KEEL_RUN, the definition of a mutating verb in
      02) and the order map's lock.supervisor.waited_by is aligned to it in the same commit: board.init,
      board.sync, board.doctor for --conformance (or a new step doctor.conformance), steward.run.dry-run,
      steward.run.resolve-route, arch.index, steward.arch.index and dashboard.build are added; the DI-04 tag
      on that lock tolerates the resulting edges until DI-04 decides which of them keep waiting. Option 2 is
      rejected because it gives the recovery many writers (any verb) and puts heartbeats on the chain; option
      3 is rejected because it violates KP-04, gives no answer for the writer lock in M1a and leaves the
      window's trust undefined; option 4 is rejected on its own because on an exposed control plane the run
      journal is seat-writable, so a re-walk from it would trust a file a seat can forge, which is the T4
      threat; it can be added later only as a consistency check. Red before green, corrected: lock.supervisor
      is tagged DI-04 and validate.mjs tolerated() drops every edge of a tagged entry, so the wait
      steward.run.end -> audit.sweep through that lock is not in the graph while DI-04 is open, and adding
      audit.recover-run after [audit.sweep] and to steward.run.end.after would turn the check red only through
      the existing path steward.run.end -> steward.land.ref-diff -> steward.land.advance-trunk -> audit.sweep
      (trunk-tip), a land-chain cycle that is not this deadlock; a lock entry carries one tag. The filing
      commit therefore reproduces the wait on an entry DI-05 can tag alone: a lock entry lock.supervisor-stale
      (doc 04 Single writer, held_by steward.run.spawn, waited_by [audit.sweep], released_by steward.run.end,
      issue DI-05), plus the untagged step audit.recover-run (doc 04 Single writer, runs_in local, after
      [audit.sweep]) and audit.recover-run added to steward.run.end.after, so that the loop steward.run.end ->
      audit.sweep -> audit.recover-run -> steward.run.end is the DI-05 shape and removing the DI-05 tag alone
      reveals it; the alternative, if the maintainers prefer, is to make \"DI-04 first\" mandatory rather than
      optional so that lock.supervisor is untagged when DI-05 files. The closing commit then moves
      audit.recover-run.after to [ledger.verify-chain] (waiting on lock.ledger-writer, which gains it in
      waited_by), keeps steward.run.end after it, removes lock.supervisor-stale or folds it into
      lock.supervisor, adds the artifacts lock-holder (doc 04 Single writer, produced_by steward.run.spawn,
      required_by [audit.recover-run, board.doctor, doctor.approvals, board.new, board.approve.rule,
      board.land, steward.run.cancel], where git-common-dir) and run-finished-event (doc 03 Task states,
      produced_by ledger.append, required_by [audit.recover-run, board.status, dashboard.build,
      steward.land.draft-receipt, gate.land.approval, gate.frame.approvals], where git-common-dir), moves the
      steward.run.end doc anchor to 04 Single writer, changes every consumer marked breaks or changed above,
      and adds the negative controls (a supervisor killed mid-run is recovered by keel audit; a writer lock
      left by a dead pid is broken and the next append re-verifies the tail; a live holder's lock, writer or
      supervisor, is never broken; a seat orphaned by a supervisor crash is ended before its task is
      re-queued; an approval.recorded event inside an unverified window is refused by land.approval). DI-04
      shares the sentence and the mechanism; the holder record gives DI-04 a place for a hold or abandon
      request the live supervisor polls, but DI-05 does not decide DI-04. Two observations for separate
      filings, outside DI-05's rule: the per-trunk integration lock in locks/ (DI-16) is a third O_EXCL file
      lock, so the generalized stale-lock row names it and DI-16's fix must adopt the holder record or its
      crash recovery stays undefined; and the glossary row single writer (per-artifact ownership) and the 04
      heading Single writer (one Steward process at a time) are two meanings under one wording."
    decision:
      by: recommendation
      date: 2026-09-27
      option: "Option 1: lock holder records with pid and lease; keel audit recovers a dead holder's lock and closes
        its run window"
      recorded_in: [ docs/04-trace-and-state.md, docs/06-parallelism.md ]

  - id: DI-06
    title: Dependents at depth 2 are called the impact closure and used to prove that no dependency changed
    statement: >-
      Impact follows dependents at depth 2. The same section calls that computation the impact closure and
      lets evidence be reused for a scope once the closure proves that no dependency of the scope changed; the
      verification and integration documents rely on that proof. A depth-bounded set cannot prove an unbounded
      claim; dependents at depth 3 and beyond are outside it.
    status: decided
    found_by: external-review
    found_on: 2026-09-26
    root_cause: term-overloaded
    anchors:
      - { file: docs/07-architecture-intelligence.md, heading: "Impact and the ratchet" }
      - { file: docs/11-verification.md, heading: "2. Source-state binding and land re-execution" }
      - { file: docs/06-parallelism.md, heading: "Integration queue and land re-run" }
    class: term-collision
    blocks: M4
    walk:
      producers:
        - precondition: the impact closure proves that no dependency of the scope changed (the precondition of
            scope-limited reuse)
          producer: { file: docs/07-architecture-intelligence.md, heading: Impact and the ratchet }
          position: before
          sufficient: false
          reason: "The producer is the lifter over dependents(files, depth) of 'IndexProvider port and backends':
            changed files, symbols, dependents at depth 2, elements. Stated against the order map as it
            stands: predicted impact is produced at intake (board.new; index.required_by lists board.new) and
            at plan (steward.plan.route, the only produced_by of the impact-record artifact), and the actual
            impact is computed at submit by gate.submit.ratchet (07 'actual impact is computed from the diff
            at submit'; 06 says a non-empty collision 'is recorded as an impact record'), for which the map
            records no producer edge on impact-record; all three precede evidence.reuse, which runs after
            steward.land.restack. Insufficient on every axis of 5.3 step 3: depth-bounded (depth 2; dependents
            at depth 3 and beyond are outside it) under an unbounded claim; heuristic against proven (edges
            may be heuristic or llm, and 07 Drift defines 'proven' as evaluated on trusted scip or tree-sitter
            edges from a fresh index covering the affected files); cached against fresh (a stale or failed
            overlay answers unknown and the reuse rule says nothing about unknown). It is also computed over
            the wrong diff: intake, plan and submit impacts all cover the task's own diff, while reuse across
            a restack needs the impact of the restack delta (the evidence's recorded commit to the restacked
            commit), which no step in the order map computes."
