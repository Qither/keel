# .keel/proposals/<P>-<slug>/arch.delta.yaml (schemas/arch-delta.schema.json), written by the architect
# seat on the system track. keel fills proposal_id, charter_version and the base hashes at `keel new`;
# `keel arch plan --suggest` can draft the ops. Replace every other {{token}} before submitting.
#
# The land archive commit applies the ops to .keel/arch/model.yaml, rules.yaml and baseline.json, and
# refuses when a base hash no longer matches. This file is part of the contract hash on the system track.
# loosen-rule and baseline-grow need this contract approval to include them; the frame gate flags both.
proposal: "{{proposal_id}}"
charter_version: "{{charter_version}}"

base:
  # sha256 of the normalized model.yaml and rules.yaml blobs on trunk that this delta was written
  # against; baseline_sha256 as well when the delta grows or shrinks the baseline.
  model_sha256: "{{model_sha256}}"
  rules_sha256: "{{rules_sha256}}"

# ADRs in this proposal's decisions/ folder that justify the ops.
adrs:
  - "ADR-{{adr_id}}"

# Typed ops: add-element, remove-element, add-relation, remove-relation, move-paths, add-rule,
# tighten-rule, loosen-rule, baseline-grow, baseline-shrink.
ops:
  - op: add-element
    element:
      id: "el:{{parent_slug}}.{{element_slug}}"
      kind: component            # system | container | component
      parent: "el:{{parent_slug}}"
      title: "{{element_title}}"
      paths:
        - "{{element_glob}}"
      owner: "{{owner_label}}"
      tags: []

  - op: add-relation
    from: "el:{{from_element}}"
    to: "el:{{to_element}}"
    kind: uses

  # - op: move-paths
  #   paths: ["{{glob}}"]
  #   from: "el:{{from_element}}"
  #   to: "el:{{to_element}}"
  #
  # - op: tighten-rule
  #   rule:
  #     id: "AR-{{rule_id}}"
  #     kind: forbidden
  #     from: {element: "el:{{from_element}}"}
  #     to: {element: "el:{{to_element}}"}
  #     severity: error
  #     adr: "ADR-{{adr_id}}"
  #     rationale: "{{rationale}}"
  #
  # - op: loosen-rule              # needs contract approval; say why in the ADR as well
  #   rule: {id: "AR-{{rule_id}}", kind: forbidden, from: {element: "el:{{from_element}}"}, to: {element: "el:{{to_element}}"}, severity: warn, adr: "ADR-{{adr_id}}", rationale: "{{rationale}}"}
  #   reason: "{{why_loosened}}"
