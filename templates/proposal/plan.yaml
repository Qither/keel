# .keel/proposals/<P>-<slug>/plan.yaml (schemas/plan.schema.json), written by the planner seat after the
# contract approval. keel fills proposal_id, charter_version and contract_hash; replace every other
# {{token}} before submitting.
#
# The plan lists tasks. Each task's details live in its own work order (workorders/T<n>.yaml), the single
# home for covers, after, write sets and acceptance. The Steward computes waves from the work orders
# (topological order over `after`, disjoint write sets, hot files on a serial spine), and the plan gate
# returns PASS, CONCERNS or FAIL.
# Plan approval (keel approve <P> --stage plan) signs this file, the work orders and routing.snapshot.yaml:
# always on the system track; on the feature track when max_width is above 1 or routing deviates.
proposal: "{{proposal_id}}"
# standard. A campaign plan (one work order per element matched by a query) is an M8 stub.
kind: standard
charter_version: "{{charter_version}}"

# Upstream hashes this plan was derived from, keyed by input; an upstream change marks the plan stale.
derived_from:
  contract_hash: "{{contract_hash}}"

# Widest wave the planner intends. The package default cap is 3.
max_width: 1

budget:
  usd: 20

tasks:
  - id: T1
    title: "{{test_task_title}}"
    # build | test | resolution. A test task is routed to a declared family different from the
    # builder's and lands first.
    kind: test
    workorder: workorders/T1.yaml
  - id: T2
    title: "{{build_task_title}}"
    kind: build
    workorder: workorders/T2.yaml

# Risks the planner sees, for the Board's plan review.
risks:
  - "{{risk}}"
