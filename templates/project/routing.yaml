# .keel/routing.yaml (schemas/routing.schema.json). Board-approved: dispatch refuses without a valid
# document approval. Approve after every change with: keel approve --doc .keel/routing.yaml
#
# NAMES ONLY. This file holds environment variable names, never values. You set every endpoint, API key
# and model name yourself, in your own environment or secret manager, outside keel. For example, in your
# shell profile or Windows user environment:
#   KEEL_PROFILE_ANTHROPIC_MAIN_BASE_URL = https://provider.example.invalid
#   (anthropic-messages: the host root; openai-chat and openai-responses: with /v1, see docs/10 section 5)
#   KEEL_PROFILE_ANTHROPIC_MAIN_API_KEY  = <set-in-your-own-environment>
# keel dereferences these values only in process memory, at spawn and at direct-lane call time, and never
# prints, logs, hashes or persists them.
# `keel doctor --section providers` shows each name as SET or UNSET.
#
# The aliases below are placeholders: rename, add or remove them to match the providers you use.
# `family` is your declaration of the model family behind the alias. keel cannot inspect endpoints or
# model names, so receipts show it as "declared". Bump `revision` whenever you change the model behind an
# alias; conformance results are kept per alias revision.

profiles:
  anthropic-main:
    protocol: anthropic-messages   # anthropic-messages | openai-chat | openai-responses | google
    family: anthropic              # anthropic | openai | google | alibaba | moonshot | zhipu | other
    auth: env                      # env | runtime-login | runtime-profile
    env:
      base_url: KEEL_PROFILE_ANTHROPIC_MAIN_BASE_URL
      api_key: KEEL_PROFILE_ANTHROPIC_MAIN_API_KEY
      model:
        frontier: KEEL_PROFILE_ANTHROPIC_MAIN_MODEL_FRONTIER
        standard: KEEL_PROFILE_ANTHROPIC_MAIN_MODEL_STANDARD
        fast: KEEL_PROFILE_ANTHROPIC_MAIN_MODEL_FAST
    revision: 1
    tos_note: "Check your own plan terms for automated and headless use; keel asserts none."

  # For codex (openai-responses only). Codex serves an env-auth alias only once its env-only route is
  # verified by probe (runtimes/codex.yaml), so no seat uses this alias by default.
  openai-main:
    protocol: openai-responses
    family: openai
    auth: env
    env:
      base_url: KEEL_PROFILE_OPENAI_MAIN_BASE_URL
      api_key: KEEL_PROFILE_OPENAI_MAIN_API_KEY
      model:
        frontier: KEEL_PROFILE_OPENAI_MAIN_MODEL_FRONTIER
        standard: KEEL_PROFILE_OPENAI_MAIN_MODEL_STANDARD
        fast: KEEL_PROFILE_OPENAI_MAIN_MODEL_FAST
    revision: 1
    tos_note: "Check your own plan terms for automated and headless use; keel asserts none."

  glm-main:
    protocol: openai-chat
    family: zhipu
    auth: env
    env:
      base_url: KEEL_PROFILE_GLM_MAIN_BASE_URL
      api_key: KEEL_PROFILE_GLM_MAIN_API_KEY
      model:
        frontier: KEEL_PROFILE_GLM_MAIN_MODEL_FRONTIER
        standard: KEEL_PROFILE_GLM_MAIN_MODEL_STANDARD
        fast: KEEL_PROFILE_GLM_MAIN_MODEL_FAST
    revision: 1
    tos_note: "Check your own plan terms for automated and headless use; keel asserts none."

  gemini-compat:
    # A Gemini-family model behind an OpenAI-compatible endpoint that you set up yourself.
    protocol: openai-chat
    family: google
    auth: env
    env:
      base_url: KEEL_PROFILE_GEMINI_COMPAT_BASE_URL
      api_key: KEEL_PROFILE_GEMINI_COMPAT_API_KEY
      model:
        frontier: KEEL_PROFILE_GEMINI_COMPAT_MODEL_FRONTIER
        standard: KEEL_PROFILE_GEMINI_COMPAT_MODEL_STANDARD
        fast: KEEL_PROFILE_GEMINI_COMPAT_MODEL_FAST
    revision: 1
    tos_note: "Check your own plan terms for automated and headless use; keel asserts none."

  # A runtime-profile alias keeps base URL and model in a file the runtime owns, in a home directory that
  # you name through an environment variable. keel never opens that file. Such a route serves only
  # tool-less seats, or seats whose tool_file_exposure is verified as blocked.
  #
  # kimi-home:
  #   protocol: anthropic-messages
  #   family: moonshot
  #   auth: runtime-profile
  #   env:
  #     api_key: KEEL_PROFILE_KIMI_HOME_API_KEY
  #   runtime_profile:
  #     home_env: KIMI_CODE_HOME
  #     profile: "{{runtime_profile_name}}"
  #   revision: 1
  #   tos_note: "Check your own plan terms for automated and headless use; keel asserts none."

# Seat -> route. At dispatch keel resolves {runtime, profile, tier}, checks protocol compatibility and the
# exposure rule, and freezes the route into the run record. An incompatible or exposed route is refused
# with blocked(runtime_unavailable); there is no fallback.
seats:
  product:
    runtime: claude-code
    profile: anthropic-main
    tier: frontier
    independent_of: []
  architect:
    runtime: claude-code
    profile: anthropic-main
    tier: frontier
    independent_of: []
  planner:
    runtime: claude-code
    profile: anthropic-main
    tier: frontier
    independent_of: []
  # The engineer and its test route are code-executing, so dispatch refuses both with
  # blocked(runtime_unavailable) until the env-scrub capability probe passes for that runtime on your
  # machine (keel doctor --section exposure; docs/10-providers.md section 4). No M0 descriptor has passed
  # it yet, so these default routes cannot be dispatched until then.
  engineer:
    runtime: claude-code
    profile: anthropic-main
    tier: standard
    independent_of: []
    # Route of test-first tasks (work order kind test). Its declared family must differ from the engineer
    # route's, so the frozen tests and the build come from different families (plan.test-independence).
    # Without it, test tasks use the engineer route and need fixed tests or a routing deviation.
    test_route:
      runtime: opencode
      profile: glm-main
      tier: standard
  reviewer:
    # The reviewer's declared family must differ, per lens, from the seat that wrote the reviewed
    # artifact (org/seats/reviewer.yaml). A same-family pair is independence=degraded and needs
    # `keel approve <P> --rule degraded` per change.
    runtime: opencode
    profile: gemini-compat
    tier: standard
    independent_of:
      - product
      - architect
      - planner
      - engineer

policy:
  no_silent_fallback: true
  # Keep false: records carry alias, tier, declared family and revision, never model names.
  record_model_names: false
  # Allow a same-family review lane when the Board rules --rule degraded for that change.
  allow_degraded: true
