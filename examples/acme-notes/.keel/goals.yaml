# examples/acme-notes/.keel/goals.yaml (schemas/goals.schema.json). Board-owned; approved with
# `keel approve --doc .keel/goals.yaml` (approval AP-3e5a7c9b1d4f in the ledger sample).
# Goal progress is computed, never stored: requirements verified at head over the total per goal.
charter_version: "1.0.0"
goals:
  - id: G-01
    objective: "Users can create, edit and delete notes."
    success_signal: "Every note operation of the HTTP API passes its acceptance scenarios at head."
    non_goals:
      - "Offline editing."
    budget: null
    status: done

  - id: G-02
    objective: "Users find any note by its text within two seconds."
    success_signal: "The search scenarios pass on a fixture of 10,000 notes within the time limit."
    non_goals:
      - "Full-text ranking beyond simple term matches."
    budget:
      usd: 40
      runs: 30
    status: active

  - id: G-03
    objective: "Users can organize notes with tags."
    success_signal: "Tags are stored once per note regardless of how they were typed, and at least 30% of active users tag a note within 30 days of the release."
    non_goals:
      - "Shared or team-wide tag vocabularies."
      - "Tag hierarchies."
    budget:
      usd: 60
      runs: 40
    status: active
