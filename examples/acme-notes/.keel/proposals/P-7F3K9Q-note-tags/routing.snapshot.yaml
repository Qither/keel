# examples/acme-notes/.keel/proposals/P-7F3K9Q-note-tags/routing.snapshot.yaml
# (schemas/routing-snapshot.schema.json), written by the Steward after the planner's plan and committed
# with it on keel/P-7F3K9Q/main. It freezes, per route, the resolved names, the conformance status and the
# exposure profile that dispatch will use. Names only: aliases, declared families, protocols, revisions.
# Hash values are illustrative.
#
# T1 is a test-first task, so it takes the approved seats.engineer.test_route (opencode, glm-main, declared
# zhipu): plan.test-independence requires its tests to come from a declared family different from T2's
# builder. T2 takes the approved seats.engineer route and the lenses the approved seats.reviewer route. Nothing
# deviates, so the feature needs no plan approval.
#
# Assumption: the exposure profiles below show tool_env_exposure scrubbed for claude-code and opencode.
# The M0 descriptors cannot produce that yet: it needs the env-scrub capability probe to have passed on
# the example machine for these runtime versions (docs/10-providers.md section 4; for claude-code with the
# candidate CLAUDE_CODE_SUBPROCESS_ENV_SCRUB control applied). On a machine where it has not passed, T1 and
# T2 are refused with blocked(runtime_unavailable) and the doctor reason.
proposal: P-7F3K9Q
routing:
  # sha256 of the normalized .keel/routing.yaml blob at the last Board-approved trunk revision.
  blob: "ef8178a5bb4e7c66e0d2494225709b971f02eb34e851bd2c4cbd3a3f0edfc96c"
  approval: AP-4f6b8d0c2e5a
taken_at: "2026-09-21T15:10:30Z"
routes:
  - seat: engineer
    tasks:
      - T1
    route:
      runtime: opencode
      alias: glm-main
      tier: standard
      declared_family: zhipu
      protocol: openai-chat
      revision: 1
    # A new alias revision on this runtime version has no behaviour results yet. The conformance rule for
    # judge seats does not apply to an engineer; receipts show the status.
    conformance_status: unverified
    exposure:
      tool_env_exposure: scrubbed
      tool_file_exposure: none
      control_plane_exposure: exposed
      shim_coverage: partial

  - seat: engineer
    tasks:
      - T2
    route:
      runtime: claude-code
      alias: anthropic-main
      tier: standard
      declared_family: anthropic
      protocol: anthropic-messages
      revision: 1
    conformance_status: verified
    # A code-executing seat is dispatched only on scrubbed env and none or blocked files. On native Windows
    # the control plane stays reachable (exposed); integrity rests on the hash chain and re-execution.
    exposure:
      tool_env_exposure: scrubbed
      tool_file_exposure: blocked
      control_plane_exposure: exposed
      shim_coverage: partial

  - seat: reviewer
    tasks: []
    lenses:
      - verification-gap
      - blind-diff
    route:
      runtime: opencode
      alias: gemini-compat
      tier: standard
      declared_family: google
      protocol: openai-chat
      revision: 1
    conformance_status: verified
    exposure:
      tool_env_exposure: scrubbed
      tool_file_exposure: none
      control_plane_exposure: exposed
      shim_coverage: partial

deviations: []

independence:
  # Every engineer route the proposal uses: the build route (T2) and the test route (T1).
  engineer:
    - anthropic
    - zhipu
  reviewer: google
  independence: independent
