# examples/acme-notes/.keel/policies/quick-patch.yaml (schemas/policy.schema.json). A standing contract
# policy for small patches, signed with `keel approve --policy quick-patch` (approval
# AP-5a7c9e1d3f6b in the ledger sample). P-7F3K9Q is a feature and does not use it; a patch started with
# `keel new "<title>" --policy quick-patch` would, and its receipt would list it.
id: quick-patch
kind: contract
summary: "Small single-element patches with a Board-signed request, red/green proof and the policy lens set."
charter_version: "1.0.0"
track: patch

predicates:
  max_sessions: 1
  max_files: 5
  max_loc: 100
  max_elements: 1
  touches_protected_globs: false
  touches_invariants: false
  touches_obligations: false
  touches_arch_rules: false
  touches_contracts: false
  touches_public_api: false
  adds_acceptance: false

requires:
  signed_request: true
  red_green_proof: true
  # The policy lens set (its lenses are listed only in org/seats/reviewer.yaml), on a declared family
  # different from the engineer's.
  lens_set: policy

# The Board reviews the policy at the end of the year; revoke earlier by signing a removal.
expires: "2026-12-31"
