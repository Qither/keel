# examples/acme-notes/.keel/arch/rules.yaml (schemas/arch-rules.schema.json): executable architecture
# rules. Only new errors backed by scip or tree-sitter edges fail the arch check; heuristic and LLM edges
# are advisory. Both rules date from adoption (keel init); no land has changed them since, so they cite no
# ADR. ADR-7KQ2B, accepted later, restates the web-to-store boundary as its obligation ADR-7KQ2B.O2.
rules:
  - id: AR-5T1WN
    kind: layers
    from:
      element: el:notes
    to: null
    severity: error
    adr: null
    rationale: "Dependencies point down the layers web, core, store; never up."

  - id: AR-3M8QD
    kind: forbidden
    from:
      element: el:notes.web
    to:
      element: el:notes.store
    severity: error
    adr: null
    rationale: "The web layer reaches storage only through core."
