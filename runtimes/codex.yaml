# runtimes/codex.yaml: runtime descriptor for Codex CLI (schemas/runtime-descriptor.schema.json).
#
# Written against 0.154.0, installed locally. The descriptor as a whole stays unverified until keel
# doctor's probes pass on the installed version; each group of facts carries its own
# verification_status, and every unverified fact is verify by probe (capability_probes below: trust on
# linked worktrees, the OPENAI_BASE_URL env route, windows.sandbox with --ignore-user-config, among others).
# Placeholders in {braces} are filled by the dispatcher (runtimes/README.md); none ever expands to a
# provider value, and native provider variable names appear only under provider.native_env.

id: codex
display_name: Codex CLI
kind: cli
verification_status: unverified
tested_version: "0.154.0"
min_version: "0.154.0"

binary:
  name: codex
  windows_resolution: npm-shim-to-script
  shell: false
  verification_status: unverified

git_required: true

instruction_files:
  - AGENTS.md

skills:
  dirs:
    - .agents/skills
  agent_files: []
  verification_status: documented

prompt_channel:
  kind: stdin
  fixed_prompt: null
  flag: null
  verification_status: verified

structured_output:
  mechanism: native-schema
  schema_flag: --output-schema
  output_flag: -o
  verification_status: documented

schema_flag_takes: path

# Rung C applies until the hook probe (hooks-block) passes on the installed version: hooks.delivery is
# none, so no hook prevents anything in a headless run. Native schema output (--output-schema) is a
# separate capability that both modes keep. Once the probe passes, both modes move to rung A.
modes:
  - id: read-only
    execution_class: read-only
    argv:
      - -s
      - read-only
    submit_channel: final-message
    rung: C
    seats:
      - product
      - architect
      - planner
      - reviewer
    verification_status: documented
  - id: workspace-write
    execution_class: code-executing
    argv:
      - -s
      - workspace-write
      - --add-dir
      - "{run_dir}"
    submit_channel: final-message
    rung: C
    seats:
      - engineer
    verification_status: documented

# {config_argv} splices -c keys that carry names only, including
# shell_environment_policy.* excluding the provider variable names.
# {auth_argv} splices the auth_argv entry for the routed profile's auth mode (below). With
# runtime-profile, CODEX_HOME is set from the profile's user-named home_env variable.
argv_template:
  - exec
  - "-"
  - --json
  - -C
  - "{workspace}"
  - "{mode_argv}"
  - --output-schema
  - "{result_schema_path}"
  - -o
  - "{run_dir}/outbox/final.json"
  - "{config_argv}"
  - "{auth_argv}"

parser: codex-exec-json

session:
  id_flag: null
  resume:
    - exec
    - resume
    - "{session_id}"
  fork: []
  verification_status: documented

cwd: workspace

budget_flags: []

exit_codes:
  - code: 0
    outcome: completed
  - code: 1
    outcome: failed
  - code: 143
    outcome: killed
    posix_only: true

env_scrub:
  control: shell_environment_policy
  expected: unknown
  verification_status: unverified

# The env route turns off the user config so only keel's names-only -c keys apply; the runtime-profile
# route layers the user's own profile; runtime-login adds nothing.
auth_argv:
  - auth_mode: env
    argv:
      - --ignore-user-config
      - --strict-config
      - -c
      - windows.sandbox="unelevated"
    verification_status: unverified
  - auth_mode: runtime-profile
    argv:
      - -p
      - "{runtime_profile}"
    verification_status: documented

provider:
  protocols:
    - openai-responses
  auth_modes:
    - env
    - runtime-profile
    - runtime-login
  native_env:
    - protocol: openai-responses
      from: base_url
      name: OPENAI_BASE_URL
    - protocol: openai-responses
      from: api_key
      name: OPENAI_API_KEY

provider_path_set:
  home_env:
    - CODEX_HOME
  paths:
    - "{workspace_root}/_runs/*/raw/"
    - ~/.codex/auth.json
    - ~/.codex/config.toml
    - ~/.codex/
    - .codex/config.toml
  dotenv: true

permissions:
  mechanism: flags
  deny_read: false
  never_generate:
    - --dangerously-bypass-approvals-and-sandbox
    - --dangerously-bypass-hook-trust
    - danger-full-access
  verification_status: documented

bypass_equivalent: false

trust:
  project_layers: trusted-only
  override_flags: []
  verification_status: documented

hooks:
  delivery: none
  blocking_exit_code: null
  verification_status: unverified

control_plane_exposure: sandboxed

capability_probes:
  - id: stdin-prompt
    claim: codex exec - reads the brief from stdin.
    verification_status: verified
    min_version: null
  - id: hooks-block
    claim: Hook events (present in the binary) block and inject as documented, and can be delivered to a headless run without relying on project .codex/ layers.
    verification_status: unverified
    min_version: null
  - id: trust-linked-worktrees
    claim: Project trust recorded for the repository applies to linked worktrees under ../<repo>.ws/.
    verification_status: unverified
    min_version: null
  - id: env-only-provider-route
    claim: An env-only route through the built-in provider honours OPENAI_BASE_URL, and the model is selected without a value in argv.
    verification_status: unverified
    min_version: null
  - id: windows-sandbox-unelevated
    claim: -c windows.sandbox="unelevated" together with --ignore-user-config and --strict-config gives the workspace-write sandbox on native Windows.
    verification_status: unverified
    min_version: null
  - id: env-scrub
    claim: -c shell_environment_policy.* keys exclude the provider variable names from tool shells.
    verification_status: unverified
    min_version: null
  - id: force-kill-resume
    claim: A session force-killed with taskkill /T /F can be resumed with codex exec resume.
    verification_status: unverified
    min_version: null
  - id: output-schema-final
    claim: --output-schema <path> constrains the final message and -o writes it to the named file.
    verification_status: documented
    min_version: null
  - id: mcp-outside-sandbox
    claim: The keel MCP server runs outside the read-only sandbox, so keel_submit works in -s read-only.
    verification_status: unverified
    min_version: null
  - id: shim-coverage
    claim: The advisory git and jj shims placed first on PATH are reached from Codex's tool shell on Windows.
    verification_status: unverified
    min_version: null

notes:
  - Rung C until the hook probe passes, then rung A; native schema output holds at either rung. Needs a git repository as its working directory.
  - Protocol openai-responses only; wire_api = "chat" was removed.
  - The env route (OPENAI_* names mapped in memory) stays disabled until the env-only-provider-route probe passes. Until then custom endpoints use auth runtime-profile, whose home holds base_url in a file, so that route serves only seats whose file exposure is verified blocked.
  - Sandboxes restrict writes only; reads are unrestricted on every OS, so tool_file_exposure is none only when no path in the provider path set exists. control_plane_exposure is sandboxed for writes only, where the sandbox is enforced.
  - Codex -o writes the final message to a file that is ingested like any other final message; it is not the outbox protocol.
  - keel generates no .codex/agents files for builder seats, because they only define spawnable subagents; a spawned-subagent event from a builder is a submit-gate finding.
  - Codex becomes a recommended engineer host only once an env-only route is verified. GLM through the Responses protocol (declared family zhipu) is a route its vendor documents.
