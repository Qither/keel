# runtimes/opencode.yaml: runtime descriptor for opencode (schemas/runtime-descriptor.schema.json).
#
# Written against 1.18.18, installed locally. opencode is the default GLM host and a vendor-neutral host
# for Qwen-, Kimi- and Gemini-family models reached through endpoints the user sets. The descriptor as a
# whole stays unverified until keel doctor's probes pass on the installed version; every unverified fact
# is verify by probe (capability_probes below).
# Placeholders in {braces} are filled by the dispatcher (runtimes/README.md); none ever expands to a
# provider value.

id: opencode
display_name: opencode
kind: cli
verification_status: unverified
tested_version: "1.18.18"
min_version: "1.18.18"

binary:
  name: opencode
  windows_resolution: npm-shim-to-script
  shell: false
  verification_status: unverified

git_required: false

instruction_files:
  - AGENTS.md

skills:
  dirs:
    - .agents/skills
  agent_files:
    - .opencode/agents/keel-*.md
  verification_status: documented

prompt_channel:
  kind: file
  fixed_prompt: Follow the attached brief.
  flag: -f
  verification_status: unverified

structured_output:
  mechanism: outbox
  schema_flag: null
  output_flag: null
  verification_status: documented

schema_flag_takes: null

# Both modes select the keel-owned agent keel-{seat}; they differ in its permission block (edit and bash
# deny for read-only seats). Read-only seats submit through MCP keel_submit, the engineer through the
# outbox via keel api.
modes:
  - id: read-only-agent
    execution_class: read-only
    argv: []
    submit_channel: mcp
    rung: C
    seats:
      - product
      - architect
      - planner
      - reviewer
    verification_status: documented
  - id: build-agent
    execution_class: code-executing
    argv: []
    submit_channel: outbox
    rung: C
    seats:
      - engineer
    verification_status: documented

# The positional message comes before -f so that it cannot be read as a second attachment.
argv_template:
  - run
  - "{fixed_prompt}"
  - --format
  - json
  - --agent
  - keel-{seat}
  - --dir
  - "{workspace}"
  - -m
  - keel-{alias}/{alias}
  - "{session_argv}"
  - -f
  - "{brief_path}"

parser: opencode-run-json

session:
  id_flag: null
  resume:
    - -s
    - "{session_id}"
  fork:
    - -s
    - "{session_id}"
    - --fork
  verification_status: unverified

cwd: workspace

budget_flags: []

exit_codes:
  - code: 0
    outcome: completed
  - code: 1
    outcome: failed
  - code: 143
    outcome: killed
    posix_only: true

env_scrub:
  control: null
  expected: unknown
  verification_status: unverified

# Runtime toggles in the child environment; keel-owned values, never values from the user.
env_toggles:
  - name: OPENCODE_CONFIG
    value: "{run_dir}/opencode.json"
    purpose: Points opencode at the per-run config rendered from templates/runtime/opencode.json.tmpl.
    verification_status: documented
  - name: OPENCODE_DISABLE_CLAUDE_CODE
    value: "1"
    purpose: Turns off opencode's CLAUDE.md fallback.
    verification_status: unverified

# The per-run opencode.json references the routed profile's KEEL_PROFILE_* names as {env:NAME}; the
# variables pass through the allowlist unchanged, so no native name is mapped.
provider:
  protocols:
    - anthropic-messages
    - openai-chat
    - openai-responses
  auth_modes:
    - env
  native_env: []
  # The AI SDK provider package the per-run opencode.json names per protocol, and what the template appends
  # to the {env:...} base URL reference (docs/10-providers.md section 5). Package names only.
  adapters:
    - protocol: anthropic-messages
      package: "@ai-sdk/anthropic"
      base_url_suffix: "/v1"
      verification_status: unverified
    - protocol: openai-chat
      package: "@ai-sdk/openai-compatible"
      base_url_suffix: ""
      verification_status: unverified
    - protocol: openai-responses
      package: "@ai-sdk/openai"
      base_url_suffix: ""
      verification_status: unverified

provider_path_set:
  home_env: []
  paths:
    - "{workspace_root}/_runs/*/raw/"
    - ~/.config/opencode/
    - ~/.local/share/opencode/auth.json
    - opencode.json
    - .opencode/opencode.json
  dotenv: true

permissions:
  mechanism: per-run-config
  deny_read: true
  never_generate: []
  verification_status: documented

bypass_equivalent: false

trust:
  project_layers: always
  override_flags: []
  verification_status: unverified

hooks:
  delivery: none
  blocking_exit_code: null
  verification_status: documented

control_plane_exposure: exposed

capability_probes:
  - id: positional-message-with-file
    claim: opencode run with a positional message and -f <brief> delivers the brief as an attachment and the message as the prompt.
    verification_status: unverified
    min_version: null
  - id: permission-deny-provider-paths
    claim: The permission deny rules in the per-run config and the agent file block reads of the provider path set.
    verification_status: unverified
    min_version: null
  - id: env-references
    claim: "{env:NAME} references in the per-run config resolve in the child, so no value is written to the config."
    verification_status: unverified
    min_version: null
  - id: session-fork
    claim: -s <id> resumes and --fork forks a session in opencode run.
    verification_status: unverified
    min_version: null
  - id: mcp-submit
    claim: The keel MCP server registered in the per-run config serves keel_submit to read-only agents.
    verification_status: unverified
    min_version: null
  - id: env-scrub
    claim: Provider variables can be kept out of the bash tool's subprocesses, and the control that does it is identified.
    verification_status: unverified
    min_version: null
  - id: windows-resolution
    claim: The opencode launcher resolves to its node entry script or native executable without a shell; doctor records which.
    verification_status: unverified
    min_version: null
  - id: shim-coverage
    claim: The advisory git and jj shims placed first on PATH are reached from the bash tool on Windows.
    verification_status: unverified
    min_version: null

notes:
  - Rung C. The plugin API is not used in v1, so there are no hooks; every guarantee is enforced at ingest, submit and land.
  - keel writes .opencode/agents/keel-<seat>.md through keel sync (templates/runtime/opencode-agent.md.tmpl) and never merges into a project or user opencode config.
  - "-m names the per-run provider keel-{alias} and its model entry {alias}; the model id itself is an {env:NAME} reference inside the per-run config, never a value in argv."
  - No bypass flag is known for opencode run; dispatch still refuses any flag added to never_generate later.
