# runtimes/hook-events.yaml: the canonical hook-event table (schemas/hook-events.schema.json).
#
# `keel hook <canonical event> --runtime <id>` is the single hook entry point for every runtime. This
# table is the only home of the canonical event names, their native counterparts per runtime and their
# blockability; TypeScript literal types and the printed snippets are generated from it.
#
# Hooks warn; gates decide. Every hook fails open (an internal error allows) and journals a typed outcome
# (allow, block, inject, error). Every guarantee a hook helps with is re-checked by the Steward at
# ingest, submit and land (docs/11-verification.md).
#
# Delivery per runtime is in its descriptor (hooks.delivery). opencode and the direct lane have no native
# entries: opencode's plugin API is not used in v1 and the direct lane is tool-less.
#
# verification_status: documented (vendor documentation), probed (seen on a local binary, for example
# event names in the binary), verified (keel's doctor probe passed), unverified (no evidence yet; verify
# by probe). blockable states what the native event can do; keel blocks only on pre-tool-use and
# user-prompt-submit guards, and only where the runtime supports it.

events:
  - id: session-start
    description: A session starts or resumes. keel checks the bootstrap marker and points the seat at keel brief; it never injects policy text.
    native:
      - runtime: claude-code
        name: SessionStart
        matcher: startup
        blockable: false
        verification_status: documented
      - runtime: codex
        name: SessionStart
        matcher: null
        blockable: false
        verification_status: probed
        note: Name present in the 0.154.0 binary; project hooks load only in trusted projects, so they are advisory.
      - runtime: gemini-cli
        name: SessionStart
        matcher: null
        blockable: false
        verification_status: unverified
        note: Gemini CLI is not installed locally; untrusted folders skip hooks.
      - runtime: qwen-code
        name: SessionStart
        matcher: null
        blockable: false
        verification_status: documented
      - runtime: kimi-code
        name: SessionStart
        matcher: startup
        blockable: false
        verification_status: documented
        note: User-global hooks only (config.toml in KIMI_CODE_HOME); keel prints the snippet and never writes it.

  - id: user-prompt-submit
    description: A prompt is submitted. keel can warn when a run's first prompt does not carry the brief hash.
    native:
      - runtime: claude-code
        name: UserPromptSubmit
        matcher: null
        blockable: true
        verification_status: documented
      - runtime: codex
        name: UserPromptSubmit
        matcher: null
        blockable: true
        verification_status: probed
        note: Name present in the binary; whether it blocks is verify by probe.
      - runtime: gemini-cli
        name: BeforeAgent
        matcher: null
        blockable: true
        verification_status: unverified
        note: Fires after the prompt is submitted and before planning; the same native event serves post-compact.
      - runtime: qwen-code
        name: UserPromptSubmit
        matcher: null
        blockable: true
        verification_status: documented
      - runtime: kimi-code
        name: UserPromptSubmit
        matcher: null
        blockable: true
        verification_status: documented
        note: Exit 2 blocks and skips the model call for that turn.

  - id: pre-tool-use
    description: Before a tool call. Guards for ACK before the first edit, write_set and frozen paths, the provider path set and reserved actions; exit 2 blocks where supported.
    native:
      - runtime: claude-code
        name: PreToolUse
        matcher: "*"
        blockable: true
        verification_status: documented
      - runtime: codex
        name: PreToolUse
        matcher: null
        blockable: true
        verification_status: probed
        note: Name present in the binary; blocking and the payload shape are verify by probe. Rung A for codex waits for this probe.
      - runtime: gemini-cli
        name: BeforeTool
        matcher: "*"
        blockable: true
        verification_status: unverified
      - runtime: qwen-code
        name: PreToolUse
        matcher: "*"
        blockable: true
        verification_status: documented
        note: Blocking with the Claude-style name is verify by probe; rung A for qwen-code waits for it.
      - runtime: kimi-code
        name: PreToolUse
        matcher: null
        blockable: true
        verification_status: documented
        note: Runs before Kimi's own permission checks; exit 2 blocks the tool.

  - id: post-tool-use
    description: After a tool call. keel journals the tool event for ingest; nothing can be blocked here.
    native:
      - runtime: claude-code
        name: PostToolUse
        matcher: "*"
        blockable: false
        verification_status: documented
      - runtime: codex
        name: PostToolUse
        matcher: null
        blockable: false
        verification_status: probed
      - runtime: gemini-cli
        name: AfterTool
        matcher: "*"
        blockable: false
        verification_status: unverified
      - runtime: qwen-code
        name: PostToolUse
        matcher: "*"
        blockable: false
        verification_status: documented
      - runtime: kimi-code
        name: PostToolUse
        matcher: null
        blockable: false
        verification_status: documented
        note: Failed or blocked tools fire PostToolUseFailure instead.

  - id: pre-compact
    description: Context compaction is about to start. keel journals it so the post-compact digest can be checked.
    native:
      - runtime: claude-code
        name: PreCompact
        matcher: null
        blockable: true
        verification_status: documented
        note: keel never blocks compaction; it only journals.
      - runtime: codex
        name: PreCompact
        matcher: null
        blockable: false
        verification_status: probed
      - runtime: gemini-cli
        name: PreCompress
        matcher: null
        blockable: false
        verification_status: unverified
      - runtime: qwen-code
        name: PreCompact
        matcher: null
        blockable: false
        verification_status: documented
      - runtime: kimi-code
        name: PreCompact
        matcher: null
        blockable: false
        verification_status: documented
        note: Return values are ignored.

  - id: post-compact
    description: Context compaction finished. keel re-injects the brief digest (BR id, id set, write_set) through the runtime's context field.
    native:
      - runtime: claude-code
        name: SessionStart
        matcher: compact
        blockable: false
        verification_status: documented
        note: PostCompact output never reaches the model, so re-injection uses SessionStart with matcher compact.
      - runtime: codex
        name: PostCompact
        matcher: null
        blockable: false
        verification_status: probed
        note: Name present in the binary; whether hook output reaches the model after compaction is verify by probe. Until then the seat pulls with keel brief.
      - runtime: gemini-cli
        name: BeforeAgent
        matcher: null
        blockable: true
        verification_status: unverified
        note: Gemini has no post-compress event; keel injects through additionalContext on the next BeforeAgent after PreCompress, and never blocks here.
      - runtime: qwen-code
        name: PostCompact
        matcher: null
        blockable: false
        verification_status: unverified
        note: Whether PostCompact exists and its output reaches the model is verify by probe; until then the seat pulls with keel brief.
      - runtime: kimi-code
        name: PostCompact
        matcher: null
        blockable: false
        verification_status: documented
        note: Documented as an observation-only event. keel's printed snippet does not register it; re-injection stays a pull with keel brief or keel_context until a probe shows its output reaches the model.

  - id: stop
    description: The model is about to end its turn. keel can warn when no result has been submitted yet.
    native:
      - runtime: claude-code
        name: Stop
        matcher: null
        blockable: true
        verification_status: documented
      - runtime: codex
        name: Stop
        matcher: null
        blockable: true
        verification_status: probed
        note: Whether it blocks is verify by probe.
      - runtime: gemini-cli
        name: AfterAgent
        matcher: null
        blockable: true
        verification_status: unverified
      - runtime: qwen-code
        name: Stop
        matcher: null
        blockable: true
        verification_status: documented
      - runtime: kimi-code
        name: Stop
        matcher: null
        blockable: true
        verification_status: documented
        note: If blocked, a message can be appended so the model continues.

  - id: subagent-start
    description: A subagent is about to start. keel journals it; a spawn from a builder seat is a submit-gate finding (submit.subagent-events).
    native:
      - runtime: claude-code
        name: SubagentStart
        matcher: null
        blockable: false
        verification_status: documented
      - runtime: codex
        name: SubagentStart
        matcher: null
        blockable: false
        verification_status: probed
      - runtime: qwen-code
        name: SubagentStart
        matcher: null
        blockable: false
        verification_status: unverified
      - runtime: kimi-code
        name: SubagentStart
        matcher: null
        blockable: false
        verification_status: documented
