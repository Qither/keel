# runtimes/gemini-cli.yaml: runtime descriptor for Gemini CLI (schemas/runtime-descriptor.schema.json).
#
# Gemini CLI was not installed locally, so every fact here is unverified until keel doctor probes an
# installed binary (verify by probe). The --policy probe gates everything but reviewer seats.
# Placeholders in {braces} are filled by the dispatcher (runtimes/README.md); none ever expands to a
# provider value, and native provider variable names appear only under provider.native_env.

id: gemini-cli
display_name: Gemini CLI
kind: cli
verification_status: unverified
tested_version: null
min_version: null

binary:
  name: gemini
  windows_resolution: npm-shim-to-script
  shell: false
  verification_status: unverified

git_required: false

# Read through a printed snippet that sets context.fileName; keel never writes .gemini/settings.json.
instruction_files:
  - AGENTS.md
  - GEMINI.md

skills:
  dirs:
    - .agents/skills
  agent_files: []
  verification_status: unverified

prompt_channel:
  kind: stdin-with-fixed-prompt
  fixed_prompt: Follow the brief on stdin.
  flag: null
  verification_status: unverified

structured_output:
  mechanism: final-message
  schema_flag: null
  output_flag: null
  verification_status: unverified

schema_flag_takes: null

# Until the policy-file probe passes, only reviewer seats are routed here, in plan mode, returning
# results through the final message or MCP. auto-edit serves no seat before that probe passes.
modes:
  - id: plan
    execution_class: read-only
    argv:
      - --approval-mode
      - plan
    submit_channel: final-message
    rung: B
    seats:
      - reviewer
    verification_status: unverified
  - id: auto-edit
    execution_class: code-executing
    argv:
      - --approval-mode
      - auto_edit
    submit_channel: outbox
    rung: B
    seats: []
    verification_status: unverified

argv_template:
  - -p
  - "{fixed_prompt}"
  - -o
  - stream-json
  - "{mode_argv}"
  - --policy
  - "{run_dir}/gemini-policy.toml"
  - --include-directories
  - "{run_dir}"
  - "{session_argv}"

parser: gemini-stream-json

session:
  id_flag: null
  resume:
    - -r
    - "{session_id}"
  fork: []
  verification_status: unverified

cwd: workspace

budget_flags: []

exit_codes:
  - code: 0
    outcome: completed
  - code: 1
    outcome: failed
  - code: 42
    outcome: input_error
  - code: 53
    outcome: turn_limit
  - code: 143
    outcome: killed
    posix_only: true

env_scrub:
  control: null
  expected: unknown
  verification_status: unverified

provider:
  protocols:
    - google
  auth_modes:
    - env
    - runtime-login
  native_env:
    - protocol: google
      from: api_key
      name: GEMINI_API_KEY
    - protocol: google
      from: model
      name: GEMINI_MODEL

provider_path_set:
  home_env: []
  paths:
    - "{workspace_root}/_runs/*/raw/"
    - ~/.gemini/
    - .gemini/settings.json
    - .gemini/.env
  dotenv: true

permissions:
  mechanism: per-run-policy
  deny_read: true
  never_generate:
    - --yolo
    - -y
    - yolo
  verification_status: unverified

bypass_equivalent: false

trust:
  project_layers: trusted-only
  override_flags:
    - --skip-trust
  verification_status: unverified

hooks:
  delivery: printed-snippet
  blocking_exit_code: 2
  verification_status: unverified

control_plane_exposure: exposed

capability_probes:
  - id: stdin-appended
    claim: Piped stdin is appended to the -p text, so the brief reaches the model with the fixed prompt.
    verification_status: unverified
    min_version: null
  - id: policy-file
    claim: --policy <file> loads the per-run policy and enforces its deny rules; the minimum version is recorded by the probe.
    verification_status: unverified
    min_version: null
  - id: gemini-model-env
    claim: The GEMINI_MODEL variable selects the model, so no model name is ever passed with -m.
    verification_status: unverified
    min_version: null
  - id: before-agent-reinject
    claim: BeforeAgent additionalContext re-injects the brief digest on the first turn after PreCompress.
    verification_status: unverified
    min_version: null
  - id: plan-mode
    claim: --approval-mode plan keeps a headless session read-only.
    verification_status: unverified
    min_version: null
  - id: untrusted-folder
    claim: A headless run in an untrusted folder exits with FatalUntrustedWorkspaceError instead of running without its policy.
    verification_status: unverified
    min_version: null
  - id: env-scrub
    claim: Provider variables can be kept out of shell tool subprocesses, and the control that does it is identified.
    verification_status: unverified
    min_version: null
  - id: mcp-outside-sandbox
    claim: The keel MCP server runs outside the tool sandbox, so keel_submit works in plan mode.
    verification_status: unverified
    min_version: null
  - id: windows-resolution
    claim: The gemini npm shim resolves to its node entry script without a shell.
    verification_status: unverified
    min_version: null

notes:
  - Rung B once the policy-file probe passes; until then reviewer seats only, results through the final message or MCP. The outbox is reachable only in auto_edit.
  - keel never writes .gemini/policies/ because the workspace policy tier is documented as non-functional; --policy replaces the user's policy directory for the session, and doctor says so.
  - Folder trust --skip-trust and the GEMINI_CLI_TRUST_WORKSPACE variable are used only after a Board --rule override for that change.
  - The model is selected through the GEMINI_MODEL name mapped in memory, never with -m <value>.
  - The protocol is google, served with a user-owned Google credential in the environment. Gemini-family models reached through a user-set OpenAI-compatible endpoint (declared family google) run on opencode or the direct lane instead.
