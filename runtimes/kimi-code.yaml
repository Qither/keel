# runtimes/kimi-code.yaml: runtime descriptor for Kimi Code CLI (schemas/runtime-descriptor.schema.json).
#
# Kimi Code was not installed locally; the descriptor was written from its v2.1.0 documentation. Its
# headless mode (-p) always runs under the "auto" permission policy, so bypass_equivalent is true and the
# runtime stays at rung D until conformance verifies an agent-file tools allowlist plus static deny
# rules, or the ACP driver. Every unverified fact is verify by probe (capability_probes below).
# Placeholders in {braces} are filled by the dispatcher (runtimes/README.md); none ever expands to a
# provider value.

id: kimi-code
display_name: Kimi Code CLI
kind: cli
verification_status: unverified
tested_version: null
min_version: "2.1.0"

binary:
  name: kimi
  windows_resolution: npm-shim-to-script
  shell: false
  verification_status: unverified

git_required: false

instruction_files:
  - AGENTS.md
  - .kimi-code/AGENTS.md

skills:
  dirs:
    - .agents/skills
  agent_files: []
  verification_status: documented

# The brief travels in the per-run agent file (<run>/inputs/agent.md, templates/runtime/kimi-agent.md.tmpl);
# -p carries only the fixed short instruction.
prompt_channel:
  kind: file
  fixed_prompt: Follow the brief in your agent file.
  flag: --agent-file
  verification_status: unverified

structured_output:
  mechanism: final-message
  schema_flag: null
  output_flag: null
  verification_status: unverified

schema_flag_takes: null

# -p rejects --plan, --yolo and --auto and runs every regular tool call under "auto": there is no
# read-only headless mode. At rung D keel parks the task with unblock_owner board and the human runs the
# seat and `keel api ack` / `keel api submit`, which write the run outbox. The exposure rule still applies
# at dispatch: Kimi's config file holds provider values, so a code-executing seat needs
# tool_file_exposure blocked.
modes:
  - id: print
    execution_class: code-executing
    argv: []
    submit_channel: outbox
    rung: D
    seats:
      - product
      - architect
      - planner
      - engineer
      - reviewer
    verification_status: documented

argv_template:
  - -p
  - "{fixed_prompt}"
  - --agent-file
  - "{run_dir}/inputs/agent.md"
  - --output-format
  - stream-json
  - --add-dir
  - "{run_dir}"
  - -m
  - "{runtime_profile}"

parser: kimi-stream-json

# --agent-file cannot be combined with --session: a resumed session keeps the agent bound at creation.
session:
  id_flag: null
  resume:
    - --session
    - "{session_id}"
  fork: []
  verification_status: documented

cwd: workspace

budget_flags: []

exit_codes:
  - code: 0
    outcome: completed
  - code: 1
    outcome: failed
  - code: 143
    outcome: killed
    posix_only: true

env_scrub:
  control: null
  expected: unknown
  verification_status: unverified

# base_url and the model alias live in the user-owned config.toml under KIMI_CODE_HOME (auth
# runtime-profile); the user's provider entry names the key variable with api_key_env, so the routed
# profile's key variable passes through the allowlist unchanged and no native name is mapped.
provider:
  protocols:
    - anthropic-messages
    - openai-chat
    - openai-responses
    - google
  auth_modes:
    - runtime-profile
    - runtime-login
  native_env: []

provider_path_set:
  home_env:
    - KIMI_CODE_HOME
  paths:
    - "{workspace_root}/_runs/*/raw/"
    - ~/.kimi-code/
  dotenv: true

permissions:
  mechanism: agent-file
  deny_read: false
  never_generate:
    - --yolo
    - -y
    - --auto
    - --yes
    - --auto-approve
  verification_status: unverified

bypass_equivalent: true

trust:
  project_layers: none
  override_flags: []
  verification_status: unverified

hooks:
  delivery: user-global-snippet
  blocking_exit_code: 2
  verification_status: documented

control_plane_exposure: exposed

capability_probes:
  - id: argv-prompt-with-agent-file
    claim: kimi -p with a short fixed instruction plus --agent-file delivers the brief carried in the agent file byte for byte.
    verification_status: unverified
    min_version: null
  - id: agent-file-tools-allowlist
    claim: The tools allowlist in the agent file is enforced before any tool executes under -p.
    verification_status: unverified
    min_version: null
  - id: static-deny-rules
    claim: Static [[permission.rules]] deny rules in the user-owned KIMI_CODE_HOME config block the provider path set under -p.
    verification_status: unverified
    min_version: null
  - id: acp-driver
    claim: kimi acp with keel as the ACP client gives per-call permission decisions to keel.
    verification_status: unverified
    min_version: null
  - id: final-message-submit
    claim: The final assistant message of the stream-json output carries a schema-valid result, or the seat can write the run outbox.
    verification_status: unverified
    min_version: null
  - id: stdout-after-post-compact
    claim: Output of a PostCompact hook reaches the model after compaction.
    verification_status: unverified
    min_version: null
  - id: env-scrub
    claim: Provider variables can be kept out of shell tool subprocesses, and the control that does it is identified.
    verification_status: unverified
    min_version: null
  - id: windows-resolution
    claim: The kimi launcher resolves to its node entry script (npm install) or to its native executable without a shell; doctor records which.
    verification_status: unverified
    min_version: null

notes:
  - Rung D until conformance verifies the agent-file tools allowlist plus static deny rules, or the ACP driver. Every runtime can fall back to rung D.
  - Hooks are user-global only (the [[hooks]] array in the config.toml under KIMI_CODE_HOME); three events can block (PreToolUse, Stop, UserPromptSubmit). keel prints templates/runtime/kimi-hooks.snippet.tmpl and never writes or opens that file.
  - "-m takes an alias the user defined in their own config ({runtime_profile} from the approved routing), never a model name."
  - Invocation text for skills is rewritten as /skill:keel-<name>.
