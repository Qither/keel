# test/fixtures/env-strip.yaml: what the test harness removes from every child process environment before
# it injects the fake provider variables of fake-providers.yaml (docs/10-providers.md section 7).
#
# This list protects the tests from the developer's own environment: no test may see, and no child may
# inherit, a real provider value or an agent socket. It is a test fixture, not keel's runtime policy; at
# spawn keel itself builds each child environment as an allowlist (src/providers/env-policy.ts, M2).
#
# The format belongs to the M2 test harness; no product schema covers it (schemas/examples.map.json lists
# it under unmapped_ok).

version: 1

# Environment names are case-insensitive on Windows, so matching is case-insensitive on win32 and exact
# elsewhere.
match:
  win32: case-insensitive
  default: exact

strip_prefixes:
  - KEEL_PROFILE_
  - ANTHROPIC_
  - OPENAI_
  - GEMINI_
  - GOOGLE_
  - CODEX_
  - KIMI_
  - DASHSCOPE_
  - MOONSHOT_
  - ZHIPU_

strip_names:
  - SSH_AUTH_SOCK

# Strip first, then inject the fake profile's variables, then spawn. Nothing is read back from the parent
# environment after the strip.
order:
  - strip
  - inject
  - spawn

# Negative controls: the harness seeds each variable into its own process environment with a fake value,
# spawns a probe child and asserts the stated outcome. A control that passes without the strip is broken.
negative_controls:
  - id: seeded-provider-key
    seed:
      OPENAI_API_KEY: sk-fake-keel-openai-0000
    expect: "The child environment has no OPENAI_API_KEY."
  - id: seeded-profile-variable
    seed:
      KEEL_PROFILE_ANTHROPIC_MAIN_API_KEY: sk-fake-keel-anthropic-0000
    expect: "The child environment has no KEEL_PROFILE_ANTHROPIC_MAIN_API_KEY."
  - id: seeded-mixed-case-name
    platform: win32
    seed:
      Anthropic_Base_Url: "http://127.0.0.1:9"
    expect: "The child environment has no variable whose name matches ANTHROPIC_ in any letter case."
  - id: seeded-agent-socket
    seed:
      SSH_AUTH_SOCK: "<test-temp-dir>/fake-agent.sock"
    expect: "The child environment has no SSH_AUTH_SOCK."
  - id: injected-fake-survives
    seed: {}
    expect: "After inject, the child sees exactly the fake profile's KEEL_PROFILE_FAKE_* variables and no other provider prefix."
